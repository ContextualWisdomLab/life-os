apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: life-os-default-deny
  namespace: life-os
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: life-os-same-namespace
  namespace: life-os
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: life-os
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: life-os
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: life-os
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: life-os-dns-egress
  namespace: life-os
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: life-os
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: life-os-public-ingress
  namespace: life-os
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - web
          - gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              life-os.io/ingress-access: 'true'
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 4000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: life-os-external-https-egress
  namespace: life-os
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: life-os
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: life-os-data-egress
  namespace: life-os
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: life-os
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 5432
