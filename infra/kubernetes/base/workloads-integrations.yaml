apiVersion: apps/v1
kind: Deployment
metadata:
  name: life-os-ai-service
  namespace: life-os
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: life-os
    app.kubernetes.io/component: application
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-service
      app.kubernetes.io/part-of: life-os
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-service
        app.kubernetes.io/part-of: life-os
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: life-os-runtime
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ai-service
              app.kubernetes.io/part-of: life-os
      containers:
        - name: ai-service
          image: ghcr.io/contextualwisdomlab/life-os-ai-service:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: AI_SERVICE_PORT
              value: '4105'
          envFrom:
            - configMapRef:
                name: life-os-runtime-config
            - secretRef:
                name: life-os-runtime-secrets
          ports:
            - name: http
              containerPort: 4105
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 5
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: life-os-ai-service
  namespace: life-os
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: life-os
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: life-os
  ports:
    - name: http
      port: 4105
      targetPort: http
      protocol: TCP
---
