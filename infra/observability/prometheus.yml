global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s
  external_labels:
    product: life-os

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: life-os-gateway
    honor_labels: false
    scheme: http
    metrics_path: /v1/metrics
    static_configs:
      - targets:
          - gateway:4000
        labels:
          environment: reference
