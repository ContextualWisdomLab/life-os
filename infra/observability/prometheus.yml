global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s
  external_labels:
    product: life-os

rule_files:
  - alerts.yml
  - planning-alerts.yml

scrape_configs:
  - job_name: life-os-gateway
    honor_labels: false
    scheme: http
    metrics_path: /v1/metrics
    static_configs:
      - targets:
          - gateway:4000
        labels:
          environment: reference

  - job_name: life-os-planning-service
    honor_labels: false
    scheme: http
    metrics_path: /v1/metrics
    static_configs:
      - targets:
          - planning-service:4102
        labels:
          environment: reference
