groups:
  - name: life-os-planning-service-slo
    interval: 30s
    rules:
      - alert: LifeOsPlanningServiceTargetDown
        expr: |
          (up{job="life-os-planning-service"} == 0)
          or
          absent(up{job="life-os-planning-service"})
        for: 5m
        labels:
          severity: page
          service: life-os-planning-service
        annotations:
          summary: LifeOS planning-service metrics target is unavailable
          description: The planning service has been down or absent from service discovery for five minutes.

      - alert: LifeOsPlanningServiceAvailabilityFastBurn
        expr: |
          (
            sum(rate(life_os_http_requests_total{service="life-os-planning-service",route!~"/v1/(health|metrics)",status_class="5xx"}[5m]))
            /
            clamp_min(sum(rate(life_os_http_requests_total{service="life-os-planning-service",route!~"/v1/(health|metrics)"}[5m])), 0.000001)
          ) > 0.0144
          and
          (
            sum(rate(life_os_http_requests_total{service="life-os-planning-service",route!~"/v1/(health|metrics)",status_class="5xx"}[1h]))
            /
            clamp_min(sum(rate(life_os_http_requests_total{service="life-os-planning-service",route!~"/v1/(health|metrics)"}[1h])), 0.000001)
          ) > 0.0144
        for: 2m
        labels:
          severity: page
          service: life-os-planning-service
          slo: availability
        annotations:
          summary: LifeOS planning-service availability budget is burning rapidly
          description: Both the five-minute and one-hour error ratios exceed the 14.4x burn threshold for the 99.9% availability objective.

      - alert: LifeOsPlanningServiceAvailabilitySlowBurn
        expr: |
          (
            sum(rate(life_os_http_requests_total{service="life-os-planning-service",route!~"/v1/(health|metrics)",status_class="5xx"}[30m]))
            /
            clamp_min(sum(rate(life_os_http_requests_total{service="life-os-planning-service",route!~"/v1/(health|metrics)"}[30m])), 0.000001)
          ) > 0.006
          and
          (
            sum(rate(life_os_http_requests_total{service="life-os-planning-service",route!~"/v1/(health|metrics)",status_class="5xx"}[6h]))
            /
            clamp_min(sum(rate(life_os_http_requests_total{service="life-os-planning-service",route!~"/v1/(health|metrics)"}[6h])), 0.000001)
          ) > 0.006
        for: 15m
        labels:
          severity: ticket
          service: life-os-planning-service
          slo: availability
        annotations:
          summary: LifeOS planning-service availability budget is burning persistently
          description: Both the 30-minute and six-hour error ratios exceed the 6x burn threshold for the 99.9% availability objective.

      - alert: LifeOsPlanningServiceLatencyBudgetBurn
        expr: |
          (
            1 -
            (
              sum(rate(life_os_http_request_duration_seconds_bucket{service="life-os-planning-service",route!~"/v1/(health|metrics)",le="0.5"}[30m]))
              /
              clamp_min(sum(rate(life_os_http_request_duration_seconds_count{service="life-os-planning-service",route!~"/v1/(health|metrics)"}[30m])), 0.000001)
            )
          ) > 0.3
        for: 15m
        labels:
          severity: ticket
          service: life-os-planning-service
          slo: latency
        annotations:
          summary: LifeOS planning-service latency budget is burning
          description: More than 30% of user-facing requests have exceeded 500 ms for 15 minutes, consuming the 95% latency objective at greater than 6x burn.

      - alert: LifeOsPlanningServiceTailLatencyBudgetBurn
        expr: |
          (
            1 -
            (
              sum(rate(life_os_http_request_duration_seconds_bucket{service="life-os-planning-service",route!~"/v1/(health|metrics)",le="2"}[30m]))
              /
              clamp_min(sum(rate(life_os_http_request_duration_seconds_count{service="life-os-planning-service",route!~"/v1/(health|metrics)"}[30m])), 0.000001)
            )
          ) > 0.01
        for: 15m
        labels:
          severity: ticket
          service: life-os-planning-service
          slo: tail-latency
        annotations:
          summary: LifeOS planning-service tail-latency objective is violated
          description: More than 1% of user-facing requests have exceeded 2 seconds for 15 minutes, violating the 99% tail-latency objective.
