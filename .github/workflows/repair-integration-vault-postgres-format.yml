name: Repair Integration Vault PostgreSQL acceptance formatting

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: repair-integration-vault-postgres-format
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/plugin-vault-postgres-driver-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format only the acceptance test and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/integration-service/src/plugin-vault-postgres-vault.integration.test.ts
          rm .github/workflows/repair-integration-vault-postgres-format.yml

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/repair-integration-vault-postgres-format.yml \
            apps/integration-service/src/plugin-vault-postgres-vault.integration.test.ts | sort)"
          test "$actual" = "$expected"
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/repair-integration-vault-postgres-format.yml \
            apps/integration-service/src/plugin-vault-postgres-vault.integration.test.ts
          git commit -m 'style(integration): format Vault PostgreSQL acceptance'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1
