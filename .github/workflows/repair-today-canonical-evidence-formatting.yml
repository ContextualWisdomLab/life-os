name: Repair Today Canonical Evidence Formatting

on:
  push:
    branches:
      - test/web-today-canonical-evidence-v1
    paths:
      - .github/workflows/repair-today-canonical-evidence-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-today-canonical-evidence-formatting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair focused formatting and self-retire
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            apps/web/app/today-sync-client.ts \
            apps/web/app/today-sync-client-review-regression.test.ts \
            apps/web/app/today-if-match-strong-comparison-regression.test.ts \
            apps/web/app/today-workspace-sync.ts \
            apps/web/app/today-workspace-sync.test.ts \
            apps/planning-service/src/today-http.ts \
            apps/planning-service/src/today-sync.ts \
            apps/planning-service/src/today-if-match-strong-comparison-regression.test.ts \
            docs/operations/durable-today-synchronization.md
          pnpm exec prettier --single-quote --check \
            apps/web/app/today-sync-client.ts \
            apps/web/app/today-sync-client-review-regression.test.ts \
            apps/web/app/today-if-match-strong-comparison-regression.test.ts \
            apps/web/app/today-workspace-sync.ts \
            apps/web/app/today-workspace-sync.test.ts \
            apps/planning-service/src/today-http.ts \
            apps/planning-service/src/today-sync.ts \
            apps/planning-service/src/today-if-match-strong-comparison-regression.test.ts \
            docs/operations/durable-today-synchronization.md
          rm .github/workflows/repair-today-canonical-evidence-formatting.yml
          git diff --check
          allowed='^(apps/web/app/today-sync-client\.ts|apps/web/app/today-sync-client-review-regression\.test\.ts|apps/web/app/today-if-match-strong-comparison-regression\.test\.ts|apps/web/app/today-workspace-sync\.ts|apps/web/app/today-workspace-sync\.test\.ts|apps/planning-service/src/today-http\.ts|apps/planning-service/src/today-sync\.ts|apps/planning-service/src/today-if-match-strong-comparison-regression\.test\.ts|docs/operations/durable-today-synchronization\.md|\.github/workflows/repair-today-canonical-evidence-formatting\.yml)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          test -z "$unexpected" || { printf 'Unexpected formatting delta:\n%s\n' "$unexpected" >&2; exit 1; }
          git config user.name 'LifeOS Today verifier repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            apps/web/app/today-sync-client.ts \
            apps/web/app/today-sync-client-review-regression.test.ts \
            apps/web/app/today-if-match-strong-comparison-regression.test.ts \
            apps/web/app/today-workspace-sync.ts \
            apps/web/app/today-workspace-sync.test.ts \
            apps/planning-service/src/today-http.ts \
            apps/planning-service/src/today-sync.ts \
            apps/planning-service/src/today-if-match-strong-comparison-regression.test.ts \
            docs/operations/durable-today-synchronization.md \
            .github/workflows/repair-today-canonical-evidence-formatting.yml
          git commit -m 'style(today): repair canonical-evidence verifier gate'
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
