name: Verify Review Context Canonical Evidence

on:
  push:
    branches:
      - test/review-context-canonical-evidence-v1
    paths:
      - apps/review-service/src/http-boundary.ts
      - apps/review-service/src/http-boundary.test.ts
      - apps/review-service/src/review-context-canonical-evidence.test.ts
      - .github/workflows/verify-review-context-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-review-context-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact semantic publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          git merge-base --is-ancestor a4cde9f5456ef4ebf7d0abadc3871eea3259ca71 "$GITHUB_SHA"
          test ! -e .github/workflows/repair-review-context-canonical-evidence.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/review-service/src/http-boundary.ts
          apps/review-service/src/http-boundary.test.ts
          apps/review-service/src/review-context-canonical-evidence.test.ts
          .github/workflows/verify-review-context-canonical-evidence.yml

      - name: Reproduce Review canonical signed-evidence contract
        run: >-
          pnpm --filter @life-os/review-service exec vitest run
          src/review-context-canonical-evidence.test.ts
          src/http-boundary.test.ts

      - name: Typecheck Review package
        run: pnpm --filter @life-os/review-service typecheck

      - name: Run complete Review suite
        run: pnpm --filter @life-os/review-service test

      - name: Check exact diff hygiene
        run: git diff --check HEAD^
