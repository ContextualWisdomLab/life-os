name: Verify Habit Context Canonical Evidence

on:
  push:
    branches:
      - test/habit-context-canonical-evidence-v1
    paths:
      - apps/habit-service/src/http-boundary.ts
      - apps/habit-service/src/workspace-context-canonical-evidence.test.ts
      - apps/habit-service/src/habit-data-rights-http-boundary.ts
      - apps/habit-service/src/habit-data-rights-canonical-evidence.test.ts
      - .github/workflows/verify-habit-context-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-habit-context-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact semantic publication
        shell: bash
        run: |
          set -euo pipefail
          semantic_head='c2377e0d54feab7d537169352572d0c8e989c55f'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          git merge-base --is-ancestor "${semantic_head}" "$GITHUB_SHA"
          test ! -e .github/workflows/repair-habit-canonical-signed-evidence.yml
          test ! -e .github/workflows/repair-habit-context-canonical-evidence-formatting.yml
          changed_files="$(git diff --name-only "${semantic_head}" "$GITHUB_SHA")"
          test "${changed_files}" = '.github/workflows/verify-habit-context-canonical-evidence.yml'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/habit-service/src/http-boundary.ts
          apps/habit-service/src/workspace-context-canonical-evidence.test.ts
          apps/habit-service/src/habit-data-rights-http-boundary.ts
          apps/habit-service/src/habit-data-rights-canonical-evidence.test.ts
          .github/workflows/verify-habit-context-canonical-evidence.yml

      - name: Reproduce Habit canonical signed-evidence regressions
        run: >-
          pnpm --filter @life-os/habit-service exec vitest run
          src/workspace-context-canonical-evidence.test.ts
          src/habit-data-rights-canonical-evidence.test.ts

      - name: Typecheck Habit package
        run: pnpm --filter @life-os/habit-service typecheck

      - name: Run complete Habit suite
        run: pnpm --filter @life-os/habit-service test

      - name: Check verifier-only diff hygiene
        shell: bash
        run: git diff --check c2377e0d54feab7d537169352572d0c8e989c55f "$GITHUB_SHA" -- .github/workflows/verify-habit-context-canonical-evidence.yml
