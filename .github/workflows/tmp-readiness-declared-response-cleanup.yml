name: Temporary Commercial Readiness Declared Response Cleanup

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - packages/commercial-readiness/src/github-client.mjs
      - packages/commercial-readiness/src/github-client-stream-boundary.test.mjs
      - .github/workflows/tmp-readiness-declared-response-cleanup.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Run declared response cleanup regression
        run: node --test packages/commercial-readiness/src/github-client-stream-boundary.test.mjs