name: Repair product gap currentness qs scope

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: repair-product-gap-currentness-qs-scope-${{ github.repository }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/product-gap-baseline-2026-08-20
          fetch-depth: 1

      - name: Replace bounded currentness override
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/product-technical-gap-baseline.md';
          const source = fs.readFileSync(path, 'utf8');
          const marker = '> **Currentness override — 2026-09-08 package graph and Integration acceptance.**';
          const start = source.indexOf(marker);
          const endMarker = '\n\n## Canonical architecture and evidence rules';
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) {
            throw new Error('expected bounded currentness override was not found');
          }
          if (source.indexOf(marker, start + 1) >= 0) {
            throw new Error('currentness override marker is not unique');
          }
          const replacement = `> **Currentness override — 2026-09-08 package graph, AppGuardrail trigger scope, and Integration acceptance.** Integration successor #245 is exact \`c94caf3f6e468a59ab1ab3b7b7ffd51b6e9a8f7e\`, open Draft/mergeable on #244. Real composed Vault KV v2 + migrated PostgreSQL lifecycle acceptance reached terminal GREEN on ancestor \`21b5c206decf1ca6a9b337811a56bddce39ff730\` through hosted run \`34166380591\`; the purpose-complete proof workflow was then removed by normal descendant \`430a19b08d512d0b9ea1eb1aaf78268da1f9e9d7\`, and current #245 documents that evidence boundary without promoting it to protected-main truth. The next #130 network slice still requires released owner authority rather than copied mutable sibling source. Separately, root package-graph owner #249 is exact \`15eb89ca7a3c4585109440914490e78044d66386\`, open Draft/mergeable on protected \`main@193a87ef54c3fe6dcda4755bce4d6bc81e3a0297\`. Its retained package-manager repair replaces shared \`qs@6.15.3\` with \`qs@6.16.0\`; purpose-writer run \`34169947462\`, job \`101888207216\`, completed exact \`pnpm@10.15.0\` lock regeneration, frozen install, typecheck, vulnerable-resolution absence, and temporary-workflow retirement. A fresh review of the inherited AppGuardrail prerequisite then found that a purported formatting delta had semantically widened root-only Markdown trigger exclusion from \`*.md\` to \`**.md\`. Regression commit \`30303f294f674c37faf03c60710e2b0c5c2e66f4\` preserves \`docs/**\` while requiring root-only quoted \`*.md\` and rejecting quoted \`**.md\`; the focused test is RED against the predecessor source. Minimal descendant \`15eb89ca7a3c4585109440914490e78044d66386\` restores only the two AppGuardrail Markdown path-ignore patterns to \`*.md\`, and the same focused test is GREEN. Exact-head CI, AppGuardrail, Commercial Readiness, SAST, Security Scan, CodeQL, and required review workflows were reacquired on \`15eb89...\` and were still non-terminal at this evidence point; predecessor GREEN does not transfer. Both active stacks remain unshipped until unchanged-head policy/review evidence integrates normally.`;
          fs.writeFileSync(path, source.slice(0, start) + replacement + source.slice(end), 'utf8');
          NODE
          git diff --check
          grep -Fq 'root package-graph owner #249 is exact `15eb89ca7a3c4585109440914490e78044d66386`' docs/product-technical-gap-baseline.md
          grep -Fq 'rejecting quoted `**.md`' docs/product-technical-gap-baseline.md
          grep -Fq 'Integration successor #245 is exact `c94caf3f6e468a59ab1ab3b7b7ffd51b6e9a8f7e`' docs/product-technical-gap-baseline.md

      - name: Publish currentness patch and retire writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/repair-product-gap-currentness-qs-scope.yml
          git add docs/product-technical-gap-baseline.md .github/workflows/repair-product-gap-currentness-qs-scope.yml
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::currentness repair produced no retained delta'; exit 1; }
          git commit -m 'docs: refresh qs and AppGuardrail currentness'
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
