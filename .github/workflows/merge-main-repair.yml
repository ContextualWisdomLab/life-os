name: Merge main repair

on:
  push:
    branches:
      - feat/ai-authenticated-gateway-context

permissions: {}

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ai-authenticated-gateway-context
          fetch-depth: 0
          persist-credentials: false

      - name: Merge main with reviewed AI quality-gate resolution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            conflicts=$(git diff --name-only --diff-filter=U)
            expected=$'apps/ai-service/package.json\napps/ai-service/vitest.config.ts'
            if [[ "$conflicts" != "$expected" ]]; then
              printf 'Unexpected conflicts:\n%s\n' "$conflicts"
              exit 1
            fi
            cat > apps/ai-service/package.json <<'JSON'
          {
            "name": "@life-os/ai-service",
            "version": "0.1.0",
            "private": true,
            "scripts": {
              "build": "nest build",
              "dev": "nest start --watch --entryFile server",
              "lint": "tsc --noEmit && prettier --single-quote --check package.json tsconfig.json vitest.config.ts \"src/**/*.ts\" migrations/README.md ../../docs/research/2026-08-04-ai-gateway-context-standards.md ../../docs/operations/ai-proposal-audit-assurance.md ../../docs/superpowers/specs/2026-08-04-ai-authenticated-gateway-context-design.md ../../docs/superpowers/specs/2026-08-04-ai-service-quality-gates-design.md ../../docs/superpowers/plans/2026-08-04-ai-authenticated-gateway-context.md ../../docs/superpowers/plans/2026-08-04-ai-service-quality-gates.md",
              "test": "vitest run --no-file-parallelism --coverage",
              "typecheck": "tsc --noEmit",
              "start": "node dist/server.js"
            },
            "dependencies": {
              "@nestjs/common": "^11.1.6",
              "@nestjs/core": "^11.1.6",
              "@nestjs/platform-express": "^11.1.6",
              "pg": "^8.22.0",
              "reflect-metadata": "^0.2.2",
              "rxjs": "^7.8.2"
            },
            "devDependencies": {
              "@nestjs/cli": "^11.0.10",
              "@types/node": "^24.3.0",
              "@types/pg": "^8.20.0",
              "@vitest/coverage-v8": "^3.2.4",
              "typescript": "^5.9.2",
              "vitest": "^3.2.4"
            }
          }
          JSON
            cat > apps/ai-service/vitest.config.ts <<'TS'
          import { defineConfig } from 'vitest/config';

          /** Complete AI-service coverage gate, including every production boundary. */
          export default defineConfig({
            test: {
              coverage: {
                enabled: true,
                provider: 'v8',
                reporter: [['text', { maxCols: 1_000 }], 'json', 'json-summary'],
                include: ['src/**/*.ts'],
                exclude: ['src/**/*.test.ts'],
                thresholds: {
                  statements: 100,
                  branches: 100,
                  functions: 100,
                  lines: 100,
                },
              },
            },
          });
          TS
            git add apps/ai-service/package.json apps/ai-service/vitest.config.ts
          fi
          rm -f .github/merge-main-conflicts.txt
          git add -A
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git diff --cached --check
          git commit -m 'merge: reconcile authenticated AI gateway with audit assurance'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-authenticated-gateway-context
