name: Merge main repair

on:
  push:
    branches:
      - feat/ai-authenticated-gateway-context

permissions: {}

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ai-authenticated-gateway-context
          fetch-depth: 0
          persist-credentials: false

      - name: Merge current main or report conflicts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            echo 'Conflicting files:'
            git diff --name-only --diff-filter=U
            exit $merge_status
          fi
          git commit -m 'merge: reconcile authenticated AI gateway with main'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-authenticated-gateway-context
