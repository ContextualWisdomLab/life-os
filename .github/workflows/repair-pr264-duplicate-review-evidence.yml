name: Repair PR264 duplicate Review evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-pr264-duplicate-review-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 264 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/habit-review-period-projection-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded duplicate-identity repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/habit-service/src/habit-domain.ts')
          text = path.read_text()
          old = """    const habitIds = new Set(habits.map((habit) => habit.id));
          const completionDatesByHabit = new Map<string, Set<string>>();
          """
          new = """    const habitIds = new Set(habits.map((habit) => habit.id));
          if (habitIds.size !== habits.length) {
            throw new Error('Review projection habit evidence is invalid');
          }
          const completionDatesByHabit = new Map<string, Set<string>>();
          """
          if text.count(old) != 1:
              raise SystemExit('Expected exact Review evidence insertion point once')
          path.write_text(text.replace(old, new, 1))
          PY

          pnpm exec prettier --write \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/habit-review-projection.test.ts

      - name: Verify exact Habit repair
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/habit-service typecheck
          pnpm --filter @life-os/habit-service exec vitest run \
            src/habit-review-projection.test.ts \
            src/habit-review-evidence-contract.test.ts \
            src/habit-review-projection-postgres.test.ts
          pnpm --filter @life-os/habit-service test
          pnpm --filter @life-os/habit-service build

      - name: Retire writer and publish ordinary descendant
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          rm .github/workflows/repair-pr264-duplicate-review-evidence.yml
          git diff --check

          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            '.github/workflows/repair-pr264-duplicate-review-evidence.yml'
            'apps/habit-service/src/habit-domain.ts'
            'apps/habit-service/src/habit-review-projection.test.ts'
          )
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected changed paths: %s\n' "${changed[*]}" >&2
            exit 1
          fi

          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          if [ "$remote_sha" != "$INPUT_SHA" ]; then
            echo 'Contributor head moved; refusing stale publication.' >&2
            exit 1
          fi

          git config user.name 'LifeOS repair writer'
          git config user.email 'lifeos-repair-writer@users.noreply.github.com'
          git add \
            .github/workflows/repair-pr264-duplicate-review-evidence.yml \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/habit-review-projection.test.ts
          git commit -m 'fix(habit): reject duplicate Review habit evidence'
          git push origin "HEAD:${HEAD_REF}"
