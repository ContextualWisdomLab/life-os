name: Repair Review data-rights receipt scope

on:
  push:
    branches:
      - feat/review-data-rights-contributor-v1
    paths:
      - .github/workflows/repair-review-data-rights-receipt-scope.yml

permissions: {}

concurrency:
  group: repair-review-data-rights-receipt-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      REVIEW_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/review-data-rights-contributor-v1
          fetch-depth: 0

      - name: Reconcile protected main and exact branch head
        env:
          EXPECTED_PARENT: 50c9cb4700908ca88d9063eaf5a4a19327b20074
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/review-data-rights-contributor-v1:refs/remotes/origin/feat/review-data-rights-contributor-v1'
          test "$(git rev-parse origin/feat/review-data-rights-contributor-v1)" = "$(git rev-parse HEAD)"
          git merge --no-edit --no-ff origin/main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Verify the tenant-isolation regression is RED
        run: |
          set -Eeuo pipefail
          set +e
          pnpm --filter @life-os/review-service exec vitest run \
            src/review-data-rights-receipt-scope.integration.test.ts \
            --no-file-parallelism >"$RUNNER_TEMP/review-receipt-red.log" 2>&1
          status="$?"
          set -e
          cat "$RUNNER_TEMP/review-receipt-red.log"
          test "$status" -ne 0
          grep -F 'allows the same idempotency key to be isolated across workspaces' \
            "$RUNNER_TEMP/review-receipt-red.log"
          grep -F 'Review erasure idempotency authority conflicts' \
            "$RUNNER_TEMP/review-receipt-red.log"

      - name: Scope receipt identity to one workspace
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          migration_path = Path(
              'apps/review-service/migrations/0002_data_rights_erasure_receipt.sql'
          )
          migration = migration_path.read_text(encoding='utf-8')
          old_primary = 'PRIMARY KEY (idempotency_key)'
          new_primary = 'PRIMARY KEY (workspace_id, idempotency_key)'
          if migration.count(old_primary) != 1:
              raise SystemExit('unexpected Review receipt primary-key shape')
          migration = migration.replace(old_primary, new_primary, 1)
          migration_path.write_text(migration, encoding='utf-8')

          source_path = Path('apps/review-service/src/review-data-rights.ts')
          source = source_path.read_text(encoding='utf-8')
          old_query = """         FROM guided_review.data_rights_erasure_receipt
         WHERE idempotency_key = $1`,
        [idempotencyKey],
"""
          new_query = """         FROM guided_review.data_rights_erasure_receipt
         WHERE workspace_id = $1
           AND idempotency_key = $2`,
        [workspaceId, idempotencyKey],
"""
          if source.count(old_query) != 1:
              raise SystemExit('unexpected Review receipt lookup shape')
          source = source.replace(old_query, new_query, 1)
          source_path.write_text(source, encoding='utf-8')
          PY
          pnpm exec prettier --single-quote --write \
            apps/review-service/src/review-data-rights.ts \
            apps/review-service/src/review-data-rights-receipt-scope.integration.test.ts
          git diff --check

      - name: Verify focused Review behavior
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/review-service exec vitest run \
            src/review-data-rights-receipt-scope.integration.test.ts \
            src/review-data-rights.integration.test.ts \
            src/review-data-rights.test.ts \
            --no-file-parallelism
          pnpm --filter @life-os/review-service run lint
          pnpm --filter @life-os/review-service run typecheck
          pnpm --filter @life-os/review-service run test
          pnpm --filter @life-os/review-service run build

      - name: Verify current-main repository gates
        run: |
          set -Eeuo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config --quiet
          git diff --check

      - name: Commit verified fix and remove temporary workflow
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/repair-review-data-rights-receipt-scope.yml
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-review-data-rights-receipt-scope.yml' \
            'apps/review-service/migrations/0002_data_rights_erasure_receipt.sql' \
            'apps/review-service/src/review-data-rights-receipt-scope.integration.test.ts' \
            'apps/review-service/src/review-data-rights.ts' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git add \
            apps/review-service/migrations/0002_data_rights_erasure_receipt.sql \
            apps/review-service/src/review-data-rights-receipt-scope.integration.test.ts \
            apps/review-service/src/review-data-rights.ts
          git commit -m 'fix(review): scope erasure receipts by workspace'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/review-data-rights-contributor-v1:refs/remotes/origin/feat/review-data-rights-contributor-v1'
          test "$(git rev-parse origin/feat/review-data-rights-contributor-v1)" = "${{ github.sha }}"
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/feat/review-data-rights-contributor-v1
