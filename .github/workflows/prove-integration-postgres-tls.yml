name: Prove Integration PostgreSQL TLS acceptance

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: integration-postgres-tls-acceptance
  cancel-in-progress: false

jobs:
  prove:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact acceptance head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/plugin-vault-postgres-driver-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies and PostgreSQL client
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi

      - name: Start disposable PostgreSQL with verified TLS only
        id: postgres
        shell: bash
        run: |
          set -Eeuo pipefail
          tls_dir="$RUNNER_TEMP/lifeos-integration-postgres-tls"
          mkdir -p "$tls_dir"

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/ca.key" \
            -out "$tls_dir/ca.crt" \
            -days 1 \
            -subj '/CN=LifeOS Integration Test CA'
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/server.key" \
            -out "$tls_dir/server.csr" \
            -subj '/CN=localhost'
          cat >"$tls_dir/server.ext" <<'EOF'
          subjectAltName=DNS:localhost
          extendedKeyUsage=serverAuth
          EOF
          openssl x509 -req \
            -in "$tls_dir/server.csr" \
            -CA "$tls_dir/ca.crt" \
            -CAkey "$tls_dir/ca.key" \
            -CAcreateserial \
            -out "$tls_dir/server.crt" \
            -days 1 \
            -extfile "$tls_dir/server.ext"

          cat >"$tls_dir/pg_hba.conf" <<'EOF'
          local all all trust
          hostnossl all all 0.0.0.0/0 reject
          hostssl all all 0.0.0.0/0 scram-sha-256
          hostnossl all all ::/0 reject
          hostssl all all ::/0 scram-sha-256
          EOF

          postgres_image='postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193'
          postgres_uid="$(docker run --rm "$postgres_image" id -u postgres)"
          postgres_gid="$(docker run --rm "$postgres_image" id -g postgres)"
          sudo chown "$postgres_uid:$postgres_gid" \
            "$tls_dir/server.key" "$tls_dir/server.crt" "$tls_dir/pg_hba.conf"
          sudo chmod 600 "$tls_dir/server.key"
          sudo chmod 644 "$tls_dir/server.crt" "$tls_dir/ca.crt" "$tls_dir/pg_hba.conf"

          docker run --detach --name lifeos-integration-postgres \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_DB=lifeos \
            --env POSTGRES_USER=lifeos \
            --env POSTGRES_PASSWORD=lifeos \
            --volume "$tls_dir:/tls:ro" \
            "$postgres_image" \
            -c ssl=on \
            -c ssl_cert_file=/tls/server.crt \
            -c ssl_key_file=/tls/server.key \
            -c hba_file=/tls/pg_hba.conf

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs lifeos-integration-postgres || true
            fi
            exit "$status"
          }
          trap cleanup ERR

          for attempt in $(seq 1 30); do
            if PGPASSWORD=lifeos PGSSLMODE=verify-full PGSSLROOTCERT="$tls_dir/ca.crt" \
              psql -h localhost -p 55432 -U lifeos -d lifeos -Atqc 'SELECT 1' 2>/dev/null | grep -Fx 1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'PostgreSQL TLS readiness did not converge' >&2
              exit 1
            fi
            sleep 1
          done

          if PGPASSWORD=lifeos PGSSLMODE=disable \
            psql -h localhost -p 55432 -U lifeos -d lifeos -Atqc 'SELECT 1'; then
            echo 'Non-TLS PostgreSQL connection unexpectedly succeeded' >&2
            exit 1
          fi

          echo "tls_dir=$tls_dir" >> "$GITHUB_OUTPUT"

      - name: Prove migrations and driver against real verified TLS PostgreSQL
        shell: bash
        env:
          INTEGRATION_DATABASE_URL: postgresql://lifeos:lifeos@localhost:55432/lifeos
          INTEGRATION_DATABASE_TLS_HOST_MISMATCH_URL: postgresql://lifeos:lifeos@127.0.0.1:55432/lifeos
          INTEGRATION_POSTGRES_TLS_ACCEPTANCE: '1'
          NODE_EXTRA_CA_CERTS: ${{ steps.postgres.outputs.tls_dir }}/ca.crt
          PGSSLMODE: verify-full
          PGSSLROOTCERT: ${{ steps.postgres.outputs.tls_dir }}/ca.crt
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/integration-service exec vitest run \
            src/plugin-installation-migration.test.ts \
            src/plugin-credential-migration.test.ts \
            src/plugin-operator-replay-migration.test.ts \
            src/plugin-vault-postgres-driver-postgres.integration.test.ts

      - name: Publish acceptance regression and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/prove-integration-postgres-tls.yml
          test "$(git diff --name-only)" = '.github/workflows/prove-integration-postgres-tls.yml'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/prove-integration-postgres-tls.yml
          git commit -m 'test(integration): retain PostgreSQL TLS acceptance regression'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1

      - name: Stop disposable PostgreSQL
        if: always()
        shell: bash
        run: docker rm --force lifeos-integration-postgres >/dev/null 2>&1 || true
