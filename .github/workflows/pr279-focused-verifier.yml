name: PR279 Focused Source Verification

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1
    paths:
      - .github/workflows/pr279-focused-verifier.yml
      - packages/commercial-readiness/src/appguardrail-provenance-condition-contract.test.mjs
      - packages/commercial-readiness/src/appguardrail-provenance-env-contract.test.mjs
      - packages/commercial-readiness/src/workflow-source-yaml-alias-contract.test.mjs
      - packages/commercial-readiness/src/workflow-external-checkout-path-contract.test.mjs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'

      - name: Verify focused source contracts
        run: >-
          node --test
          packages/commercial-readiness/src/appguardrail-provenance-condition-contract.test.mjs
          packages/commercial-readiness/src/appguardrail-provenance-env-contract.test.mjs
          packages/commercial-readiness/src/workflow-source-yaml-alias-contract.test.mjs
          packages/commercial-readiness/src/workflow-external-checkout-path-contract.test.mjs

      - name: Syntax-check focused source contracts
        run: >-
          node --check packages/commercial-readiness/src/appguardrail-provenance-condition-contract.test.mjs &&
          node --check packages/commercial-readiness/src/appguardrail-provenance-env-contract.test.mjs &&
          node --check packages/commercial-readiness/src/workflow-source-yaml-alias-contract.test.mjs &&
          node --check packages/commercial-readiness/src/workflow-external-checkout-path-contract.test.mjs
