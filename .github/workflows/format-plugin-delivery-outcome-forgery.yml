name: Format plugin delivery outcome forgery regression

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-outcome-ledger-v1

permissions:
  contents: write

concurrency:
  group: format-plugin-delivery-outcome-forgery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-retire:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded canonical formatting
        run: >-
          pnpm exec prettier --single-quote --write
          apps/integration-service/src/plugin-delivery-attempt-outcome-forgery.integration.test.ts

      - name: Verify bounded delta and retire writer
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --exit-code -- apps/integration-service/migrations/0009_plugin_delivery_attempt_outcome_record.sql
          git rm .github/workflows/format-plugin-delivery-outcome-forgery.yml
          git status --short

      - name: Publish ordinary descendant
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/integration-service/src/plugin-delivery-attempt-outcome-forgery.integration.test.ts
          git commit -m 'style(integration): format plugin outcome forgery regression'
          git push origin "HEAD:${BRANCH_NAME}"
