name: Repair Habit Rule Change Authority

on:
  push:
    branches:
      - feat/habit-rule-change-authority-v1
    paths:
      - .github/workflows/repair-habit-rule-change-authority.yml

permissions:
  contents: write

concurrency:
  group: repair-habit-rule-change-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact RED parent and single writer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "be3c493c755570ed6abfdbef31830d5f26fd2a71"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          test -f .github/workflows/repair-habit-rule-change-authority.yml

      - name: Apply minimum Habit-owned durable authority
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one target, found {count}")
              return text.replace(old, new, 1)

          domain_path = Path('apps/habit-service/src/habit-domain.ts')
          domain = domain_path.read_text()
          domain = replace_once(
              domain,
              "export type HabitRecurrence = DailyRecurrence | WeeklyRecurrence;\n\nexport interface Habit {",
              """export type HabitRecurrence = DailyRecurrence | WeeklyRecurrence;

