name: Refresh Product Gap Baseline Currentness V3

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: life-os-product-gap-baseline-currentness
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Refresh exact live currentness and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request
          from datetime import datetime, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          doc = pathlib.Path('docs/product-technical-gap-baseline.md')
          stale_v1 = pathlib.Path('.github/workflows/refresh-product-gap-baseline-currentness.yml')
          stale_v2 = pathlib.Path('.github/workflows/refresh-product-gap-baseline-currentness-v2.yml')
          workflow = pathlib.Path('.github/workflows/refresh-product-gap-baseline-currentness-v3.yml')
          start = '<!-- life-os-live-currentness:start -->'
          end = '<!-- life-os-live-currentness:end -->'

          # PR #211 is intentionally excluded from SHA serialization. The output commit
          # cannot embed its own final Git SHA without creating an impossible self-reference.
          # Its containing commit is the authority; this block tracks all external PR refs.
          tracked = (
              214, 228, 229, 231, 232, 233, 234, 237, 247, 249, 252, 253,
              254, 255, 256, 257, 258, 260, 261, 264, 269, 273, 275, 276, 281,
              282, 283, 292, 293, 294, 295, 296, 297, 298, 299, 300, 301, 302,
              303, 304, 305, 306, 307, 309, 311, 313, 315,
          )

          def api(path):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'life-os-product-gap-currentness-writer-v3',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          main = api('/branches/main')['commit']['sha']
          self_pr = api('/pulls/211')
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          lines = [
              start,
              f'> **Live currentness override — {now}.** This block supersedes conflicting active head/base/run identifiers below while preserving the dated ledger as audit history. It does not promote any active PR, predecessor proof, or queued workflow to protected/shipped truth.',
              '>',
              f'> Protected `main`: `{main}`.',
              '>',
              f"> PR #211 is this containing documentation branch; its final output SHA is intentionally not serialized because a Git commit cannot contain its own final SHA. Snapshot metadata: base `{self_pr['base']['sha']}`, state `{self_pr['state']}`, draft `{str(self_pr.get('draft', False)).lower()}`, mergeable `{self_pr.get('mergeable')}`. The containing commit itself is the exact #211 source authority.",
          ]

          for number in tracked:
              pr = api(f'/pulls/{number}')
              head = pr['head']['sha']
              base = pr['base']['sha']
              branch = pr['head']['ref']
              params = urllib.parse.urlencode({'branch': branch, 'per_page': 20})
              runs = api(f'/actions/runs?{params}').get('workflow_runs', [])
              exact = [run for run in runs if run.get('head_sha') == head]
              if exact:
                  run = exact[0]
                  verdict = run.get('conclusion') or run.get('status') or 'unknown'
                  run_text = f"{run['name']} `{run['id']}` {verdict}"
              else:
                  run_text = 'no exact-head workflow in latest 20 branch runs'
              lines += [
                  '>',
                  f"> PR #{number}: head `{head}`, base `{base}`, state `{pr['state']}`, draft `{str(pr.get('draft', False)).lower()}`, mergeable `{pr.get('mergeable')}`; latest exact-head workflow: {run_text}.",
              ]

          lines += [
              '>',
              '> Mutable sibling heads and unreleased external owner contracts remain non-consumable; predecessor GREEN remains ancestry evidence only after any head/base movement.',
              end,
              '',
          ]
          block = '\n'.join(lines)
          text = doc.read_text(encoding='utf-8')
          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          doc.write_text(before + block.rstrip('\n') + after, encoding='utf-8')

          for stale in (stale_v1, stale_v2):
              if stale.exists():
                  stale.unlink()
          workflow.unlink()
          PY

          git diff --check
          git config user.name 'LifeOS currentness writer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md
          git add -u -- .github/workflows/refresh-product-gap-baseline-currentness-v3.yml
          for stale in \
            .github/workflows/refresh-product-gap-baseline-currentness.yml \
            .github/workflows/refresh-product-gap-baseline-currentness-v2.yml; do
            if git ls-files --error-unmatch "$stale" >/dev/null 2>&1; then
              git add -u -- "$stale"
            fi
          done
          git commit -m 'docs: refresh live product gap currentness without self-SHA cycle'
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
