name: Repair Today Canonical Evidence

on:
  push:
    branches:
      - test/web-today-canonical-evidence-v1
    paths:
      - .github/workflows/repair-today-canonical-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-today-canonical-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact owner head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Guard retained RED and exact remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7542a74f5d179a197b717533ca5faa1480701101 "$GITHUB_SHA"
          test -e .github/scripts/repair-today-canonical-evidence.py
          test -e .github/workflows/verify-today-canonical-evidence.yml
          test ! -e .github/workflows/repair-today-canonical-evidence-formatting.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce retained product RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @life-os/web exec tsx --test \
            app/today-sync-client-review-regression.test.ts \
            app/today-if-match-strong-comparison-regression.test.ts \
            app/today-workspace-sync.test.ts
          web_status=$?
          pnpm --filter @life-os/planning-service exec vitest run \
            src/today-if-match-strong-comparison-regression.test.ts
          planning_status=$?
          set -e
          test "$web_status" -ne 0
          test "$planning_status" -ne 0

      - name: Apply minimum canonical-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/repair-today-canonical-evidence.py
          pnpm exec prettier --single-quote --write \
            apps/web/app/today-sync-client.ts \
            apps/web/app/today-workspace-sync.ts \
            apps/planning-service/src/today-http.ts

      - name: Prove focused and complete GREEN
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @life-os/web exec tsx --test \
            app/today-sync-client-review-regression.test.ts \
            app/today-if-match-strong-comparison-regression.test.ts \
            app/today-workspace-sync.test.ts
          pnpm --filter @life-os/planning-service exec vitest run \
            src/today-if-match-strong-comparison-regression.test.ts
          pnpm --filter @life-os/web typecheck
          pnpm --filter @life-os/planning-service typecheck
          pnpm --filter @life-os/web test
          pnpm --filter @life-os/planning-service test
          git diff --check

      - name: Guard bounded delta and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/scripts/repair-today-canonical-evidence.py \
            .github/workflows/repair-today-canonical-evidence.yml
          git add \
            apps/planning-service/src/today-http.ts \
            apps/web/app/today-sync-client.ts \
            apps/web/app/today-workspace-sync.ts
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/scripts/repair-today-canonical-evidence.py' \
            '.github/workflows/repair-today-canonical-evidence.yml' \
            'apps/planning-service/src/today-http.ts' \
            'apps/web/app/today-sync-client.ts' \
            'apps/web/app/today-workspace-sync.ts' | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --cached --check

      - name: Publish ordinary semantic descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(today): preserve canonical and strong validator evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
