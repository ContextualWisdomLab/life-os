name: Repair Today Canonical Evidence

on:
  push:
    branches:
      - test/web-today-canonical-evidence-v1
    paths:
      - apps/web/app/today-sync-client.ts
      - apps/web/app/today-sync-client-review-regression.test.ts
      - apps/web/app/today-if-match-strong-comparison-regression.test.ts
      - apps/web/app/today-workspace-sync.ts
      - apps/web/app/today-workspace-sync.test.ts
      - apps/planning-service/src/today-http.ts
      - apps/planning-service/src/today-if-match-strong-comparison-regression.test.ts
      - .github/workflows/repair-today-canonical-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-today-canonical-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require exact repair authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/test/web-today-canonical-evidence-v1 | cut -f1)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 7542a74f5d179a197b717533ca5faa1480701101 HEAD
          test -e .github/workflows/verify-today-canonical-evidence.yml
          test ! -e .github/workflows/repair-today-canonical-evidence-formatting.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Stop when semantic repair is already published
        id: already_repaired
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'function requireCanonicalRevisionEtag' apps/web/app/today-sync-client.ts \
            && grep -q 'return match\[1\];' apps/web/app/today-workspace-sync.ts \
            && grep -q 'TODAY_REVISION_ENTITY_TAG_PATTERN' apps/planning-service/src/today-http.ts; then
            echo 'value=true' >> "$GITHUB_OUTPUT"
          else
            echo 'value=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reproduce retained product RED
        if: steps.already_repaired.outputs.value != 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @life-os/web exec tsx --test \
            app/today-sync-client-review-regression.test.ts \
            app/today-if-match-strong-comparison-regression.test.ts \
            app/today-workspace-sync.test.ts
          web_status=$?
          pnpm --filter @life-os/planning-service exec vitest run \
            src/today-if-match-strong-comparison-regression.test.ts
          planning_status=$?
          set -e
          test "$web_status" -ne 0
          test "$planning_status" -ne 0

      - name: Apply minimum canonical-evidence repair
        if: steps.already_repaired.outputs.value != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one repair anchor in {path}")
              target.write_text(text.replace(old, new, 1))

          web = "apps/web/app/today-sync-client.ts"
          replace_once(
              web,
              "const UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n",
              "const UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\nconst CANONICAL_UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;\n",
          )
          replace_once(
              web,
              """/** Requires a strong revision ETag returned by planning-service. */
function requireEtag(value: string | null): string {
  const match = /^\"([0-9a-f-]+)\"$/iu.exec(value ?? '');
  if (!match?.[1] || !UUID_V4_PATTERN.test(match[1])) {
    throw new Error('invalid etag');
  }
  return `\"${match[1].toLowerCase()}\"`;
}
""",
              """/** Requires one strong UUID-shaped browser entity-tag without rewriting octets. */
function requireOpaqueRevisionEtag(value: string | null): string {
  const match = /^\"([0-9a-f-]+)\"$/iu.exec(value ?? '');
  if (!match?.[1] || !UUID_V4_PATTERN.test(match[1])) {
    throw new Error('invalid etag');
  }
  return value as string;
}

/** Requires one lowercase-canonical revision ETag produced by Planning. */
function requireCanonicalRevisionEtag(value: string | null): string {
  const match = /^\"([0-9a-f-]+)\"$/u.exec(value ?? '');
  if (!match?.[1] || !CANONICAL_UUID_V4_PATTERN.test(match[1])) {
    throw new Error('invalid etag');
  }
  return value as string;
}
""",
          )
          replace_once(web, "const etag = requireEtag(ifMatch);", "const etag = requireOpaqueRevisionEtag(ifMatch);")
          replace_once(
              web,
              "typeof record.currentRevision === 'string' &&\n    UUID_V4_PATTERN.test(record.currentRevision)",
              "typeof record.currentRevision === 'string' &&\n    CANONICAL_UUID_V4_PATTERN.test(record.currentRevision)",
          )
          replace_once(web, "return record.currentRevision.toLowerCase();", "return record.currentRevision;")
          replace_once(web, "!UUID_V4_PATTERN.test(record.aggregateId)", "!CANONICAL_UUID_V4_PATTERN.test(record.aggregateId)")
          replace_once(web, "!UUID_V4_PATTERN.test(record.revision)", "!CANONICAL_UUID_V4_PATTERN.test(record.revision)")
          replace_once(
              web,
              "const etag = requireEtag(planningResponse.headers.get('etag'));",
              "const etag = requireCanonicalRevisionEtag(\n      planningResponse.headers.get('etag'),\n    );",
          )
          replace_once(
              web,
              "if (`\"${String(aggregate.revision).toLowerCase()}\"` !== etag) {",
              "if (`\"${String(aggregate.revision)}\"` !== etag) {",
          )

          workspace = "apps/web/app/today-workspace-sync.ts"
          replace_once(
              workspace,
              "const UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n",
              "const UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;\n",
          )
          replace_once(workspace, "return match[1].toLowerCase();", "return match[1];")
          replace_once(workspace, "return record.currentRevision.toLowerCase();", "return record.currentRevision;")
          replace_once(workspace, "else requestHeaders.set('if-match', `\"${revision.toLowerCase()}\"`);", "else requestHeaders.set('if-match', `\"${revision}\"`);")

          planning = "apps/planning-service/src/today-http.ts"
          replace_once(
              planning,
              "import { canonicalTodayDate, canonicalTodayUuidV4 } from './today-invariants';",
              "import { canonicalTodayDate } from './today-invariants';",
          )
          replace_once(
              planning,
              "} from './today-sync';\n\n",
              "} from './today-sync';\n\nconst TODAY_REVISION_ENTITY_TAG_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n\n",
          )
          replace_once(
              planning,
              """  const match = /^\"([^\"\\r\\n]+)\"$/u.exec(ifMatch ?? '');
  if (!match?.[1]) return invalidTodayPrecondition();
  return Object.freeze({
    kind: 'match',
    revision: canonicalTodayUuidV4(match[1], invalidTodayPrecondition),
  });
""",
              """  const match = /^\"([^\"\\r\\n]+)\"$/u.exec(ifMatch ?? '');
  if (!match?.[1] || !TODAY_REVISION_ENTITY_TAG_PATTERN.test(match[1])) {
    return invalidTodayPrecondition();
  }
  return Object.freeze({ kind: 'match', revision: match[1] });
""",
          )
          PY
          pnpm exec prettier --single-quote --write \
            apps/web/app/today-sync-client.ts \
            apps/web/app/today-workspace-sync.ts \
            apps/planning-service/src/today-http.ts

      - name: Prove focused and complete GREEN
        if: steps.already_repaired.outputs.value != 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @life-os/web exec tsx --test \
            app/today-sync-client-review-regression.test.ts \
            app/today-if-match-strong-comparison-regression.test.ts \
            app/today-workspace-sync.test.ts
          pnpm --filter @life-os/planning-service exec vitest run \
            src/today-if-match-strong-comparison-regression.test.ts
          pnpm --filter @life-os/web typecheck
          pnpm --filter @life-os/planning-service typecheck
          pnpm --filter @life-os/web test
          pnpm --filter @life-os/planning-service test

      - name: Guard bounded delta and publish
        if: steps.already_repaired.outputs.value != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            apps/planning-service/src/today-http.ts
            apps/web/app/today-sync-client.ts
            apps/web/app/today-workspace-sync.ts
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected repair delta:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${expected[@]}"
          git diff --cached --check
          git commit -m 'fix(today): preserve canonical and strong validator evidence'
          test "$(git ls-remote origin refs/heads/test/web-today-canonical-evidence-v1 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/test/web-today-canonical-evidence-v1
