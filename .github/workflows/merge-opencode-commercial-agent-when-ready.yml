name: Merge OpenCode Commercial Agent When Ready

on:
  push:
    branches:
      - feat/opencode-commercial-development-loop
    paths:
      - '.github/workflows/merge-opencode-commercial-agent-when-ready.yml'

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: merge-opencode-commercial-agent-when-ready
  cancel-in-progress: false

jobs:
  wait-clean-and-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - name: Wait until all substantive review threads are resolved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repository='ContextualWisdomLab/life-os'
          for _ in $(seq 1 110); do
            state="$(gh api "repos/${repository}/pulls/120" --jq '.state')"
            if [ "$state" != 'open' ]; then
              exit 0
            fi
            unresolved="$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated path}}}}}' \
              -f owner='ContextualWisdomLab' \
              -f name='life-os' \
              -F number=120 \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false and .path != ".github/workflows/review-fix-opencode-commercial-agent.yml" and .path != ".github/workflows/merge-opencode-commercial-agent-when-ready.yml")] | length')"
            if [ "$unresolved" = '0' ]; then
              exit 0
            fi
            sleep 60
          done
          echo '::error::Substantive review findings remained unresolved after the bounded wait.'
          exit 1

      - name: Remove every temporary write-capable review workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repository='ContextualWisdomLab/life-os'
          branch='feat/opencode-commercial-development-loop'
          for path in \
            .github/workflows/bootstrap-opencode-commercial-agent.yml \
            .github/workflows/repair-opencode-commercial-agent.yml \
            .github/workflows/finalize-opencode-commercial-agent.yml \
            .github/workflows/review-fix-opencode-commercial-agent.yml \
            .github/workflows/merge-opencode-commercial-agent-when-ready.yml \
            .github/scripts/finalize-opencode-commercial-agent.py; do
            sha="$(gh api "repos/${repository}/contents/${path}?ref=${branch}" --jq '.sha' 2>/dev/null || true)"
            if [ -n "$sha" ]; then
              gh api \
                --method DELETE \
                "repos/${repository}/contents/${path}" \
                -f branch="$branch" \
                -f sha="$sha" \
                -f message='chore(ci): remove temporary OpenCode review automation' \
                > /dev/null
            fi
          done

      - name: Request CodeRabbit review on the clean head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/ContextualWisdomLab/life-os/issues/120/comments \
            -f body='@coderabbitai review' > /dev/null

      - name: Wait for all exact-head checks and merge without bypass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          repository='ContextualWisdomLab/life-os'
          stable_head=''
          stable_count=0
          for _ in $(seq 1 110); do
            state="$(gh api "repos/${repository}/pulls/120" --jq '.state')"
            if [ "$state" != 'open' ]; then
              exit 0
            fi
            head_sha="$(gh api "repos/${repository}/pulls/120" --jq '.head.sha')"
            if [ "$head_sha" = "$stable_head" ]; then
              stable_count=$((stable_count + 1))
            else
              stable_head="$head_sha"
              stable_count=1
            fi
            unresolved="$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved isOutdated}}}}}' \
              -f owner='ContextualWisdomLab' \
              -f name='life-os' \
              -F number=120 \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false and .isOutdated == false)] | length')"
            requested_changes="$(gh api "repos/${repository}/pulls/120/reviews?per_page=100" \
              --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')"
            required_not_successful="$(
              gh pr checks 120 \
                --repo "$repository" \
                --required \
                --json state \
                --jq '[.[] | select(.state != "SUCCESS" and .state != "NEUTRAL" and .state != "SKIPPED")] | length' \
                2>/dev/null || echo 1
            )"
            coderabbit="$(gh api "repos/${repository}/commits/${head_sha}/status" \
              --jq '[.statuses[] | select(.context == "CodeRabbit" and .state == "success")] | length')"
            draft="$(gh api "repos/${repository}/pulls/120" --jq '.draft')"
            mergeable="$(gh api "repos/${repository}/pulls/120" --jq '.mergeable')"
            if [ "$draft" = 'false' ] && [ "$mergeable" = 'true' ] && \
               [ "$stable_count" -ge 2 ] && [ "$unresolved" = '0' ] && \
               [ "$requested_changes" = '0' ] && [ "$required_not_successful" = '0' ] && \
               [ "$coderabbit" != '0' ]; then
              merged="$(gh api \
                --method PUT \
                "repos/${repository}/pulls/120/merge" \
                -f merge_method='squash' \
                -f sha="$head_sha" \
                --jq '.merged')"
              if [ "$merged" = 'true' ]; then
                exit 0
              fi
            fi
            sleep 60
          done
          echo '::error::The clean exact-head merge gate did not become eligible within the bounded wait.'
          exit 1
