name: Repair AI Context Canonical Evidence

on:
  push:
    branches:
      - test/ai-context-canonical-evidence-v1
    paths:
      - .github/workflows/repair-ai-context-canonical-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-ai-context-canonical-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained RED ancestry and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "a91883e081b31a7b1752fab2de92ff765f7005ba" HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce signed identity evidence RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter @life-os/ai-service exec vitest run src/ai-http-boundary-canonical-evidence.test.ts; then
            echo 'Expected byte-different signed workspace or actor evidence to fail before repair.' >&2
            exit 1
          fi

      - name: Apply minimum canonical-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('apps/ai-service/src/ai-http-boundary.ts'); s=p.read_text(); old='  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu;'; new='  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;'; assert s.count(old) == 1; s=s.replace(old,new,1); old2='  const workspaceId = headers.workspaceId.toLowerCase();\\n  const actorId = headers.actorId.toLowerCase();'; new2='  const workspaceId = headers.workspaceId;\\n  const actorId = headers.actorId;'; assert s.count(old2) == 1; p.write_text(s.replace(old2,new2,1))"
          python -c "from pathlib import Path; p=Path('apps/ai-service/src/ai-http-boundary.test.ts'); s=p.read_text(); old='          workspaceId: WORKSPACE_ID.toUpperCase(),\\n          actorId: ACTOR_ID.toUpperCase(),'; new='          workspaceId: WORKSPACE_ID,\\n          actorId: ACTOR_ID,'; assert s.count(old) == 1; p.write_text(s.replace(old,new,1))"
          git rm .github/workflows/repair-ai-context-canonical-evidence.yml
          pnpm exec prettier --single-quote --write apps/ai-service/src/ai-http-boundary.ts apps/ai-service/src/ai-http-boundary.test.ts

      - name: Verify minimum repair and complete AI contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check apps/ai-service/src/ai-http-boundary.ts apps/ai-service/src/ai-http-boundary.test.ts apps/ai-service/src/ai-http-boundary-canonical-evidence.test.ts
          pnpm --filter @life-os/ai-service exec vitest run src/ai-http-boundary-canonical-evidence.test.ts src/ai-http-boundary.test.ts
          pnpm --filter @life-os/ai-service typecheck
          pnpm --filter @life-os/ai-service test
          git diff --check
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/repair-ai-context-canonical-evidence.yml' 'apps/ai-service/src/ai-http-boundary.test.ts' 'apps/ai-service/src/ai-http-boundary.ts' | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary semantic repair descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): require canonical signed identity evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
