name: Planning task completion transition canary

on:
  push:
    branches:
      - feat/planning-task-completion-transition-v1

permissions:
  contents: read

jobs:
  task_completion_transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused task completion transition contract
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion.test.ts
          --no-file-parallelism

      - name: Typecheck Planning service
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Build Planning service
        run: pnpm --filter @life-os/planning-service build
