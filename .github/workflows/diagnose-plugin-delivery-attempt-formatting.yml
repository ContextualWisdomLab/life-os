name: Diagnose plugin delivery attempt formatting

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-lifecycle-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install frozen workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Print canonical delivery-attempt formatting patch
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/integration-service/src/plugin-delivery-attempt-repository.ts \
            apps/integration-service/src/plugin-delivery-attempt-repository-hostile-collection.test.ts \
            apps/integration-service/src/plugin-delivery-attempt.ts \
            apps/integration-service/src/plugin-delivery-attempt.test.ts
          git --no-pager diff --check
          git --no-pager diff -- \
            apps/integration-service/src/plugin-delivery-attempt-repository.ts \
            apps/integration-service/src/plugin-delivery-attempt-repository-hostile-collection.test.ts \
            apps/integration-service/src/plugin-delivery-attempt.ts \
            apps/integration-service/src/plugin-delivery-attempt.test.ts
