name: Align Production Deployment Image Keys

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/align-deployment-image-keys.yml'

permissions:
  contents: write

concurrency:
  group: align-production-deployment-image-keys-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  align:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/production-deployment-reference
          fetch-depth: 0

      - name: Align Kustomize image source keys
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          renderer_path = Path(
              'infra/deployment/render-production-overlay.mjs',
          )
          renderer = renderer_path.read_text(encoding='utf-8').replace(
              'ghcr.io/contextualwisdomlab/life-os-',
              'docker.io/contextualwisdomlab/life-os-',
          )
          renderer_path.write_text(renderer, encoding='utf-8')

          test_path = Path(
              'infra/deployment/tests/deployment-contract.test.mjs',
          )
          tests = test_path.read_text(encoding='utf-8').replace(
              'ghcr.io\\/contextualwisdomlab\\/life-os-',
              'docker.io\\/contextualwisdomlab\\/life-os-',
          )
          test_path.write_text(tests, encoding='utf-8')
          PY
          git rm .github/workflows/align-deployment-image-keys.yml

      - name: Commit aligned keys and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            infra/deployment/render-production-overlay.mjs \
            infra/deployment/tests/deployment-contract.test.mjs
          git add -u .github/workflows
          git diff --cached --check
          git commit -m 'fix(deploy): align production Kustomize image keys'
          git push origin HEAD:feat/production-deployment-reference
