name: PR 127 Today lookup RED

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  today_lookup_red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event.pull_request.head.ref == 'feat/durable-today-sync' }}
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.5.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused lookup validation regression
        run: pnpm --filter @life-os/planning-service exec vitest run src/postgres-today-repository-input.test.ts
