name: PR 127 Today lookup repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  today_lookup_repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.event.pull_request.head.ref == 'feat/durable-today-sync' }}
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.5.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply bounded lookup validation and prove GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/planning-service/src/postgres-today-repository.ts')
          text = path.read_text()
          old = '''  async getToday(\n    workspaceId: string,\n    date: string,\n  ): Promise<DurableTodayAggregate | undefined> {\n    const result = await this.client.query<TodayAggregateRow>(\n      `SELECT workspace_id, local_date, aggregate_id, revision_token, payload_json\n       FROM planning.today_aggregates\n       WHERE workspace_id = $1::uuid AND local_date = $2::date\n       LIMIT 2`,\n      [workspaceId, date],\n    );\n    const row = oneOrUndefined(result.rows);\n    return row ? parseAggregateRow(row, workspaceId, date) : undefined;\n  }'''
          new = '''  async getToday(\n    workspaceId: string,\n    date: string,\n  ): Promise<DurableTodayAggregate | undefined> {\n    const safeWorkspaceId = requireUuid(workspaceId);\n    const safeDate = requireDate(date);\n    const result = await this.client.query<TodayAggregateRow>(\n      `SELECT workspace_id, local_date, aggregate_id, revision_token, payload_json\n       FROM planning.today_aggregates\n       WHERE workspace_id = $1::uuid AND local_date = $2::date\n       LIMIT 2`,\n      [safeWorkspaceId, safeDate],\n    );\n    const row = oneOrUndefined(result.rows);\n    return row ? parseAggregateRow(row, safeWorkspaceId, safeDate) : undefined;\n  }'''
          if text.count(old) != 1:
              raise SystemExit('Expected exact getToday source once')
          path.write_text(text.replace(old, new))
          PY
          pnpm --filter @life-os/planning-service exec vitest run src/postgres-today-repository-input.test.ts
          git rm -- .github/workflows/pr127-input-red.yml
          git diff --check
      - name: Commit exact bounded repair if branch did not move
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/feat/durable-today-sync:refs/remotes/origin/feat/durable-today-sync
          remote_head="$(git rev-parse refs/remotes/origin/feat/durable-today-sync)"
          if [[ "${remote_head}" != "${EXPECTED_HEAD}" ]]; then
            echo 'Branch moved; refusing repair push.' >&2
            exit 1
          fi
          changed="$(git diff --name-only)"
          allowed=$'apps/planning-service/src/postgres-today-repository.ts\n.github/workflows/pr127-input-red.yml'
          if [[ "$(printf '%s\n' "${changed}" | sort)" != "$(printf '%s\n' "${allowed}" | sort)" ]]; then
            printf 'Unexpected changed paths:\n%s\n' "${changed}" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/planning-service/src/postgres-today-repository.ts .github/workflows/pr127-input-red.yml
          git commit -m 'fix(planning): validate Today lookup scope before SQL'
          git push origin HEAD:refs/heads/feat/durable-today-sync
