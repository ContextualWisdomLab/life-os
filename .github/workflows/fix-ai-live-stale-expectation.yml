name: Repair AI Live Conformance Expectation

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/fix-ai-live-stale-expectation.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-nim-live-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Align the stale expectation and cover the generic fallback
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/ai-service/src/proposal-quality-live-conformance.test.ts')
          source = path.read_text(encoding='utf-8')
          marker = "it('fails the report when the baseline cannot be configured'"
          start = source.find(marker)
          if start < 0:
              raise SystemExit('baseline configuration test was not found')
          end = source.find("\n  });", start)
          if end < 0:
              raise SystemExit('baseline configuration test terminator was not found')
          end += len("\n  });")
          block = source[start:end]
          old = "unavailableCode: 'invalid_configuration'"
          if block.count(old) != 1:
              raise SystemExit('expected one stale classification inside the baseline test')
          repaired = block.replace(
              old,
              "unavailableCode: 'orchestrator_unavailable'",
              1,
          )
          path.write_text(source[:start] + repaired + source[end:], encoding='utf-8')
          PY

          cat > apps/ai-service/src/proposal-quality-live-invalid-configuration.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            runProposalLiveConformance,
            type ProposalLiveConformanceOptions,
          } from './proposal-quality-live-conformance';

          const TOKEN = Buffer.alloc(32, 0x49).toString('base64url');

          describe('live conformance configuration fallback', () => {
            it('classifies unexpected evaluator setup failures without retaining details', async () => {
              const options: ProposalLiveConformanceOptions = {
                lifeOsCommitSha: 'a'.repeat(40),
                contextualOrchestratorCommitSha: 'b'.repeat(40),
                modelInventory: ['meta/live-model'],
                evaluatedAt: new Date('2026-08-07T04:00:00.000Z'),
                providerCredentialAvailable: true,
                environment: {
                  CONTEXTUAL_ORCHESTRATOR_LIVE_URL: 'http://127.0.0.1:8765',
                  CONTEXTUAL_ORCHESTRATOR_LIVE_TOKEN: TOKEN,
                },
              };
              Object.defineProperty(options, 'monotonicClock', {
                get() {
                  throw new Error('private setup detail');
                },
              });

              const report = await runProposalLiveConformance(options);
              expect(report.status).toBe('failed');
              for (const profileId of [
                'route_low',
                'route_high',
                'conduct_template',
              ]) {
                expect(
                  report.profiles.find(
                    (profile) => profile.profileId === profileId,
                  ),
                ).toEqual({
                  profileId,
                  status: 'unavailable',
                  unavailableCode: 'invalid_configuration',
                });
              }
              expect(JSON.stringify(report)).not.toContain('private setup detail');
            });
          });
          EOF

          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/proposal-quality-live-conformance.test.ts \
            apps/ai-service/src/proposal-quality-live-invalid-configuration.test.ts

      - name: Verify the complete AI service
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test
          pnpm --filter @life-os/ai-service build

      - name: Commit verified correction and remove this workflow
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/fix-ai-live-stale-expectation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/ai-service/src/proposal-quality-live-conformance.test.ts \
            apps/ai-service/src/proposal-quality-live-invalid-configuration.test.ts
          git diff --cached --check
          git commit -m 'test(ai): complete live failure classification evidence'
          git push origin HEAD:feat/ai-nim-live-conformance
