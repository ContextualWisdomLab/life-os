name: Temporary Commercial Readiness Declared Response Changelog

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - .github/workflows/tmp-readiness-declared-response-changelog.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Update changelog and retire writer
        shell: bash
        env:
          BRANCH_NAME: fix/actions-draft-queue-pressure-v1
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'CHANGELOG.md';
          const marker = '### Fixed\n\n';
          const entry = '- Commercial Readiness now best-effort cancels GitHub response bodies rejected from an oversized declared `Content-Length`, while preserving the established bounded response-size error even when cleanup itself fails.\n';
          const source = fs.readFileSync(path, 'utf8');
          if (source.includes(entry)) throw new Error('changelog entry already present');
          const index = source.indexOf(marker);
          if (index < 0) throw new Error('Unreleased Fixed marker not found');
          fs.writeFileSync(path, source.slice(0, index + marker.length) + entry + source.slice(index + marker.length));
          NODE
          rm .github/workflows/tmp-readiness-declared-response-changelog.yml
          git add CHANGELOG.md .github/workflows/tmp-readiness-declared-response-changelog.yml
          git diff --cached --check
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(readiness): record declared response cleanup'
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"