name: Repair Planning task completion history harness

on:
  push:
    branches:
      - feat/planning-task-completion-history-v1
    paths:
      - .github/workflows/repair-planning-task-completion-history.yml

permissions:
  contents: write

concurrency:
  group: planning-task-completion-history-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair migration harness exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/planning-service/src/postgres-planning-repository.integration.test.ts')
          text = path.read_text()
          old_migrations = """    '0005_task_completion_chronology.sql',
              '0006_validate_task_completion_chronology.sql',
            ]) {"""
          new_migrations = """    '0005_task_completion_chronology.sql',
              '0006_validate_task_completion_chronology.sql',
              '0007_task_completion_facts.sql',
            ]) {"""
          old_truncate = """planning.today_idempotency_records,
                 planning.today_aggregates,"""
          new_truncate = """planning.task_completion_facts,
                 planning.today_idempotency_records,
                 planning.today_aggregates,"""
          if text.count(old_migrations) != 1:
              raise SystemExit('migration-list anchor count is not exactly one')
          if text.count(old_truncate) != 1:
              raise SystemExit('truncate anchor count is not exactly one')
          text = text.replace(old_migrations, new_migrations)
          text = text.replace(old_truncate, new_truncate)
          path.write_text(text)
          PY

      - name: Run completion-history integration
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion-history.integration.test.ts
          --no-file-parallelism

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run complete Planning suite
        run: pnpm --filter @life-os/planning-service test -- --no-file-parallelism

      - name: Check changed-source formatting
        run: >-
          pnpm exec prettier --check
          apps/planning-service/src/task-completion.ts
          apps/planning-service/src/task-completion-history.integration.test.ts
          apps/planning-service/src/postgres-planning-repository.integration.test.ts
          apps/planning-service/migrations/README.md

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Retire bounded workflows and verify diff
        run: |
          rm .github/workflows/repair-planning-task-completion-history.yml
          rm .github/workflows/verify-planning-task-completion-history.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' \
            '.github/workflows/repair-planning-task-completion-history.yml' \
            '.github/workflows/verify-planning-task-completion-history.yml' \
            'apps/planning-service/src/postgres-planning-repository.integration.test.ts' | sort)"

      - name: Verify writer still owns exact remote head
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Publish ordinary descendant
        run: |
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add -A
          git commit -m 'test(planning): apply completion facts in integration harness'
          git push origin "HEAD:${TARGET_BRANCH}"
