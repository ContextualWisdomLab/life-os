name: Verify Planning completion cleanup RED

on:
  push:
    branches: [feat/planning-task-completion-history-v1]
    paths:
      - apps/planning-service/src/postgres-planning-repository.integration.test.ts
      - apps/planning-service/migrations/0007_task_completion_facts.sql
      - .github/workflows/verify-planning-completion-cleanup-red.yml

permissions:
  contents: read

concurrency:
  group: verify-planning-completion-cleanup-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --check
          apps/planning-service/src/postgres-planning-repository.integration.test.ts

      - name: Run PostgreSQL repository integration
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/postgres-planning-repository.integration.test.ts
