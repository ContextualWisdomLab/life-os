name: Verify PR279 Item45 repair

on:
  push:
    branches: [fix/appguardrail-sarif-provenance-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair exact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: 1f9f37b48cef7cda750274830f56ad06b362dd3f

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify focused SARIF provenance upload gate contract
        run: |
          set -euo pipefail
          node --test packages/commercial-readiness/src/appguardrail-provenance-upload-gate-contract.test.mjs

      - name: Verify complete Commercial Readiness contracts
        run: |
          set -euo pipefail
          node --test packages/commercial-readiness/src/*.test.mjs

      - name: Verify changed source syntax and whitespace
        run: |
          set -euo pipefail
          node --check packages/commercial-readiness/src/appguardrail-provenance-upload-gate-contract.test.mjs
          git diff --check
