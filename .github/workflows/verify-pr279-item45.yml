name: Verify PR279 Item45 regression

on:
  push:
    branches: [fix/appguardrail-sarif-provenance-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout regression exact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: cd6c5c3ce7cf3cd0da32e79c16d25d2ffd6d0079

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Verify SARIF provenance upload gate contract
        run: |
          set -euo pipefail
          node --test packages/commercial-readiness/src/appguardrail-provenance-upload-gate-contract.test.mjs
