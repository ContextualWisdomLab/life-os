name: Bootstrap OpenCode Commercial Development Agent

on:
  push:
    branches:
      - feat/opencode-commercial-development-loop
    paths:
      - '.github/workflows/bootstrap-opencode-commercial-agent.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/opencode-commercial-development-loop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Resolve and pin the current official OpenCode package
        id: opencode
        run: |
          set -Eeuo pipefail
          corepack enable
          version="$(npm view opencode-ai version --json | jq -r '.')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::OpenCode registry version is not an exact semantic version.'
            exit 1
          fi
          pnpm --filter @life-os/commercial-development-agent add \
            --save-dev \
            --save-exact \
            "opencode-ai@${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Apply deterministic bootstrap corrections
        env:
          OPENCODE_VERSION: ${{ steps.opencode.outputs.version }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              source = file.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(source.replace(old, new, 1), encoding='utf-8')

          workflow_path = Path('.github/workflows/opencode-commercial-development.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              "OPENCODE_PACKAGE_VERSION: '__PINNED_BY_BOOTSTRAP__'",
              f"OPENCODE_PACKAGE_VERSION: '{os.environ['OPENCODE_VERSION']}'",
              1,
          )
          workflow = workflow.replace(
              """          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run_id={run_id}\\n')
              output.write(f'branch_name=automation/opencode-commercial-{run_id}\\n')
              output.write(f'model_label={model_label}\\n')
          PY
          git switch --create "${{ steps.branch.outputs.branch_name }}"
""",
              """          branch_name = f'automation/opencode-commercial-{run_id}'
          branch_path = os.path.join(receipt_dir, 'branch-name.txt')
          with open(branch_path, 'w', encoding='utf-8') as branch_file:
              branch_file.write(f'{branch_name}\\n')
          os.chmod(branch_path, 0o600)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'run_id={run_id}\\n')
              output.write(f'branch_name={branch_name}\\n')
              output.write(f'model_label={model_label}\\n')
          PY
          git switch --create "$(cat "$RECEIPT_DIR/branch-name.txt")"
""",
              1,
          )
          workflow = workflow.replace(
              """      - name: Compose credential-free development receipt
        if: always()
        env:
          OPENCODE_VERSION: ${{ env.OPENCODE_PACKAGE_VERSION }}
        run: |
""",
              """      - name: Compose credential-free development receipt
        if: always()
        run: |
""",
              1,
          )
          workflow = workflow.replace(
              """          import os
          from datetime import datetime, timezone
""",
              """          import os
          import uuid
          from datetime import datetime, timezone
""",
              1,
          )
          workflow = workflow.replace(
              "'run_id': '00000000-0000-4000-8000-000000000001',",
              "'run_id': str(uuid.uuid4()),",
              1,
          )
          workflow = workflow.replace(
              """            "$RECEIPT_DIR/run.json"
""",
              """            "$RECEIPT_DIR/run.json" \\
            "$RECEIPT_DIR/branch-name.txt"
""",
              1,
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          workflow_test = Path('packages/commercial-development-agent/src/workflow-contract.test.mjs')
          test_source = workflow_test.read_text(encoding='utf-8')
          test_source = test_source.replace(
              "    expect(model).not.toContain('secrets.');\n",
              '',
              1,
          )
          workflow_test.write_text(test_source, encoding='utf-8')

          replace_once(
              'packages/commercial-development-agent/src/contracts.mjs',
              """    opencode_version: requireString(input.opencode_version, {
      maximumBytes: 128,
    }),
""",
              """    opencode_version: requireOpaqueLabel(input.opencode_version, 128),
""",
              'receipt OpenCode version redaction',
          )

          receipt_path = Path('packages/commercial-development-agent/src/receipt.mjs')
          receipt = receipt_path.read_text(encoding='utf-8')
          receipt = receipt.replace(
              """  requireExactKeys(value, DIFF_KEYS);
  return {
""",
              """  const keys = Object.keys(value);
  const projectedKeys = new Set(DIFF_KEYS);
  const completeKeys = new Set(['accepted', 'reason_code', ...DIFF_KEYS]);
  const matches = (expected) =>
    keys.length === expected.size && keys.every((key) => expected.has(key));
  if (!matches(projectedKeys) && !matches(completeKeys)) {
    return invalid();
  }
  if (
    matches(completeKeys) &&
    (value.accepted !== true || value.reason_code !== 'accepted')
  ) {
    return invalid();
  }
  return {
""",
              1,
          )
          receipt_path.write_text(receipt, encoding='utf-8')
          PY

      - name: Format the complete initial slice
        run: |
          pnpm exec prettier --single-quote --write \
            .github/workflows/opencode-commercial-development.yml \
            packages/commercial-development-agent/package.json \
            packages/commercial-development-agent/vitest.config.mjs \
            packages/commercial-development-agent/src \
            product/opencode-commercial-development-policy.json \
            docs/superpowers/specs/2026-08-07-opencode-commercial-development-loop-design.md \
            docs/superpowers/plans/2026-08-07-opencode-commercial-development-loop.md

      - name: Verify the exact OpenCode CLI and deterministic package
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/commercial-development-agent exec opencode --version
          pnpm --filter @life-os/commercial-development-agent exec opencode run --help > /dev/null
          pnpm --filter @life-os/commercial-development-agent lint
          pnpm --filter @life-os/commercial-development-agent test
          pnpm --filter @life-os/commercial-development-agent build

      - name: Commit exact package evidence and remove bootstrap workflow
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/bootstrap-opencode-commercial-agent.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(agent): add bounded NVIDIA OpenCode development loop'
          git push origin HEAD:feat/opencode-commercial-development-loop
