name: Verify Web Goal Canonical Evidence

on:
  push:
    branches:
      - feat/web-goal-bff-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/package.json
          apps/web/app/planning-goal-client.ts
          apps/web/app/planning-goal-canonical-evidence-regression.test.ts
      - name: Typecheck Web
        run: pnpm --filter @life-os/web typecheck
      - name: Prove canonical durable Goal evidence rejection
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/planning-goal-canonical-evidence-regression.test.ts
      - name: Run complete Web unit suite
        run: pnpm --filter @life-os/web test
