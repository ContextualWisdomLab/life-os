name: Verify and Clean AI Live Review Fixes

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/verify-and-clean-ai-live-review-fixes.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-nim-live-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Materialize pending reviewed corrections
        run: |
          set -Eeuo pipefail
          if ! grep -q 'export function applyProposalLiveRateDeltas' \
            apps/ai-service/src/proposal-quality-live-conformance.ts; then
            test -f .github/scripts/apply-ai-live-review-fixes.py
            test -f .github/scripts/augment-ai-live-review-fixes.py
            python3 .github/scripts/apply-ai-live-review-fixes.py
            sed -i \
              's/JSON.stringify(await noProviderReport())/JSON.stringify(await validReport())/' \
              apps/ai-service/src/proposal-quality-live-final-coverage.test.ts
            python3 .github/scripts/augment-ai-live-review-fixes.py
          fi

      - name: Format all reviewed files
        run: |
          pnpm exec prettier --single-quote --write \
            AGENTS.md \
            ARCHITECTURE.md \
            CLAUDE.md \
            CHANGELOG.md \
            product/capabilities.json \
            .github/workflows/ai-proposal-live-conformance.yml \
            apps/ai-service/package.json \
            'apps/ai-service/src/**/*.ts' \
            docs/superpowers/plans/2026-08-06-ai-nim-live-conformance.md \
            docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md

      - name: Verify exact implementation and commercial evidence
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test
          pnpm --filter @life-os/ai-service build
          pnpm --filter @life-os/commercial-readiness test
          pnpm format:check

      - name: Remove every temporary write-capable repair artifact
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/apply-ai-live-review-fixes.yml \
            .github/workflows/apply-ai-live-review-fixes-v2.yml \
            .github/workflows/finalize-ai-live-review-fixes.yml \
            .github/workflows/finalize-ai-live-review-fixes-v2.yml \
            .github/workflows/verify-and-clean-ai-live-review-fixes.yml \
            .github/scripts/apply-ai-live-review-fixes.py \
            .github/scripts/augment-ai-live-review-fixes.py

      - name: Commit only a clean verified branch
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'The branch is already clean and verified.'
          else
            git commit -m 'fix(ai): finalize live conformance review fixes'
            git push origin HEAD:feat/ai-nim-live-conformance
          fi
