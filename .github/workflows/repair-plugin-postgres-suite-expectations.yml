name: Repair Plugin PostgreSQL Suite Expectations

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: repair-plugin-postgres-suite-expectations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-repair-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_integration
          POSTGRES_USER: life_os
          POSTGRES_PASSWORD: life_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os -d life_os_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://life_os:life_os_test@127.0.0.1:5432/life_os_integration
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Plugin SDK runtime dependency
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Prove current PostgreSQL-backed suite RED
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set +e
          pnpm --filter @life-os/integration-service exec vitest run \
            src/plugin-vault-hosted-bootstrap.test.ts \
            src/plugin-vault-hosted-runtime.test.ts \
            src/plugin-delivery-origin-migration.integration.test.ts \
            2>&1 | tee /tmp/plugin-postgres-red.log
          red_status=${PIPESTATUS[0]}
          set -e
          if [ "${red_status}" -eq 0 ]; then
            echo "Expected the retained PostgreSQL-backed suite defects to reproduce before repair" >&2
            exit 1
          fi
          grep -F "rejects malformed environment envelope undefined before pool acquisition" /tmp/plugin-postgres-red.log
          grep -F "bounds malformed environment envelope undefined before configuration field access" /tmp/plugin-postgres-red.log
          grep -F "plugin_delivery_origin_active_installation_check" /tmp/plugin-postgres-red.log

      - name: Apply minimal expectation repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          table_files = [
              Path('apps/integration-service/src/plugin-vault-hosted-bootstrap.test.ts'),
              Path('apps/integration-service/src/plugin-vault-hosted-runtime.test.ts'),
          ]
          needle = "it.each([null, undefined, 'invalid', []])(" 
          replacement = "it.each([null, 'invalid', []])(" 
          for path in table_files:
              text = path.read_text()
              if text.count(needle) != 1:
                  raise SystemExit(f'unexpected malformed-environment fixture count in {path}')
              path.write_text(text.replace(needle, replacement, 1))

          origin = Path('apps/integration-service/src/plugin-delivery-origin-migration.integration.test.ts')
          text = origin.read_text()
          old = "      'plugin_delivery_origin_installation_authority_fk',"
          new = "      'plugin_delivery_origin_active_installation_check',"
          if text.count(old) != 1:
              raise SystemExit('unexpected delivery-origin constraint expectation count')
          origin.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/repair-plugin-postgres-suite-expectations.yml
          pnpm exec prettier --single-quote --write \
            apps/integration-service/src/plugin-vault-hosted-bootstrap.test.ts \
            apps/integration-service/src/plugin-vault-hosted-runtime.test.ts \
            apps/integration-service/src/plugin-delivery-origin-migration.integration.test.ts
          git diff --check

      - name: Commit exact candidate before GREEN
        run: |
          git config user.name "LifeOS Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add apps/integration-service/src/plugin-vault-hosted-bootstrap.test.ts \
            apps/integration-service/src/plugin-vault-hosted-runtime.test.ts \
            apps/integration-service/src/plugin-delivery-origin-migration.integration.test.ts
          git commit -m "test(integration): align PostgreSQL-backed authority expectations"
          echo "REPAIR_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"
          test -z "$(git status --porcelain)"
          git show --check --oneline --no-patch HEAD

      - name: Verify repaired focused PostgreSQL GREEN
        run: |
          test "$(git rev-parse HEAD)" = "${REPAIR_SHA}"
          pnpm exec prettier --single-quote --check \
            apps/integration-service/src/plugin-vault-hosted-bootstrap.test.ts \
            apps/integration-service/src/plugin-vault-hosted-runtime.test.ts \
            apps/integration-service/src/plugin-delivery-origin-migration.integration.test.ts
          pnpm --filter @life-os/integration-service exec vitest run \
            src/plugin-vault-hosted-bootstrap.test.ts \
            src/plugin-vault-hosted-runtime.test.ts \
            src/plugin-delivery-origin-migration.integration.test.ts

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration suite with PostgreSQL
        run: pnpm --filter @life-os/integration-service test

      - name: Publish verified non-force descendant
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          test "$(git rev-parse HEAD)" = "${REPAIR_SHA}"
          test -z "$(git status --porcelain)"
          remote_head="$(git ls-remote origin refs/heads/feat/plugin-vault-postgres-driver-v1 | cut -f1)"
          if [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            echo "Branch moved from ${GITHUB_SHA} to ${remote_head}; refusing to overwrite intervening work" >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/feat/plugin-vault-postgres-driver-v1
