name: Refresh LifeOS delivery-origin gap baseline

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: refresh-lifeos-gap-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact documentation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preservation-safe currentness update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text(encoding='utf-8')
          marker = '> **Currentness override — 2026-09-08 delivery-origin operator and HTTP transport.**'
          if marker in text:
              raise SystemExit('delivery-origin currentness marker already exists')

          canonical_anchor = '\n## Canonical architecture and evidence rules\n'
          if text.count(canonical_anchor) != 1:
              raise SystemExit('canonical architecture anchor is not unique')

          currentness = """
> **Currentness override — 2026-09-08 delivery-origin operator and HTTP transport.** Draft #250 is exact `be4a209d56efe928c61d9d6cc3ce43a830fa2986`, stacked on #245. Hosted verifier run `34182864012`, job `101925292293`, passed canonical formatting, focused delivery-origin contract, Integration typecheck, Plugin SDK build, and the complete Integration suite on exact predecessor `2459058f2b84c19d9bc74604474483a64bec93ef`; its final step removed only the purpose-complete verifier and published ordinary descendant `be4a209d...`. That predecessor GREEN remains unshipped evidence rather than protected-main or separately executed descendant GREEN. Draft #251 is stacked exactly on #250 for the next #130 boundary: real Nest HTTP grant/read/revoke routes over the same signed one-time operator context. Regression `39377b33d7348babeb4f262b1efb5b2256537eb1` and minimum source repair `2d31334b2259713878f55d71eb08ca94edebb0f5` are retained on current head `f1e43cb81bba6166c921c46db018ab43b8a9b6ef`. Initial run `34185831022` was cancelled pre-runner and is not RED; current verifier `34186006887` / job `101934350873` explicitly requires exact parent `be4a209d...` to fail the HTTP regression before restoring current source and requiring focused GREEN, typecheck, and the complete Integration suite. At this baseline update it remains pre-runner queued, so no terminal GREEN is inferred. Neither #250 nor #251 performs outbound HTTPS; durable origin identity remains distinct from connect-time egress authorization.
"""
          text = text.replace(canonical_anchor, '\n' + currentness + canonical_anchor, 1)

          old = """Fresh source-to-runtime review exposes an earlier #130 buyer gap before outbound networking: Integration already owns delivery-origin aggregate/persistence truth and the migrated PostgreSQL active-installation fence, including a real integration contract that rejects grants after durable installation revocation and requires `FOR SHARE` serialization while admitting a grant. However, current `PluginOperatorApplication`, Vault operator composition, hosted runtime/module, and signed HTTP route family compose only installation, credential-binding, and replay authority; they do not compose or expose delivery-origin grant/read/revoke authority. The next independent LifeOS-owned slice must therefore attach the existing delivery-origin repository/domain authority to the authenticated hosted operator, add purpose-bound signed routes with one-time durable replay semantics, and prove create/read/revoke plus installation-revocation fencing against migrated PostgreSQL. Only after that authority exists should outbound delivery consume a released/versioned canonical egress contract; manifest/origin identity must not become connect-time network authorization. Durable delivery attempt/outcome/idempotency/retry/dead-letter/recovery persistence and buyer-visible recovery state remain a separate Integration-owned concern."""
          new = """The delivery-origin prerequisite has advanced through two explicit unshipped successors. Draft #250 exact `be4a209d56efe928c61d9d6cc3ce43a830fa2986` composes the existing Integration-owned delivery-origin domain/repository authority into `PluginOperatorApplication`, Vault/PostgreSQL hosted composition, and the canonical signed-route verifier. Hosted run `34182864012` / job `101925292293` proved the retained application tree on predecessor `2459058f2b84c19d9bc74604474483a64bec93ef`, then retired only its temporary verifier by ordinary descendant push. Draft #251 exact `f1e43cb81bba6166c921c46db018ab43b8a9b6ef` is stacked exactly on #250 and exposes only the already-authorized delivery-origin grant/read/revoke lifecycle through real Nest HTTP routes. Its regression starts a real HTTP server, rejects request-body tenant/user override, rejects forged signatures without reflecting origin material, and requires absent delivery-origin composition to fail closed. The current serialized verifier explicitly proves the exact #250 parent is RED before requiring the #251 focused contract, Integration typecheck, and complete Integration suite; run `34186006887` / job `101934350873` is still pre-runner queued at this evidence point and therefore not GREEN.

Outbound delivery remains intentionally incomplete. Neither successor turns an origin grant into connect-time network authority. The next networking slice must consume a released/versioned canonical egress-owner contract for DNS/IP/redirect/proxy/connect-time SSRF controls, finite response bytes/time, and purpose-bound credential use. Integration must still own durable delivery attempt/outcome/idempotency/retry/dead-letter/recovery persistence and buyer-visible recovery state."""
          if text.count(old) != 1:
              raise SystemExit('stale #130 delivery-origin paragraph is not uniquely present')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit currentness and retire writer
        shell: bash
        env:
          TARGET_BRANCH: docs/product-gap-baseline-2026-08-20
        run: |
          set -euo pipefail
          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/refresh-lifeos-gap-baseline-delivery-origin.yml
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/refresh-lifeos-gap-baseline-delivery-origin.yml' 'docs/product-technical-gap-baseline.md' | sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(gap): refresh delivery-origin currentness"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
