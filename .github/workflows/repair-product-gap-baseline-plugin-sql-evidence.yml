name: Repair Product Gap Baseline Plugin SQL Evidence

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: repair-product-gap-baseline-plugin-sql-evidence
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace only the Integration currentness override
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start = '> **Currentness override — 2026-09-08 Integration delivery authority.**'
          end = '\n\n## Canonical architecture and evidence rules'
          if text.count(start) != 1:
              raise SystemExit(f'expected exactly one Integration override, found {text.count(start)}')
          start_index = text.index(start)
          end_index = text.index(end, start_index)
          replacement = '''> **Currentness override — 2026-09-08 Integration delivery authority.** Integration parent #245 remains workflow-free exact `39ebec99d907356a99a1a15528a3a1df713472ed`; #250 is non-force current at `2fef9decf5053c7abf2443ec8e5cae4278e7baac`; #251 is non-force current at `5067f870bdaa9a026411298a2233d4d053708b5a`; #252 remains an independent durable-attempt slice directly on #245. Dependency-rejection RED was proven on `987f0a8ca1ffb132146eee784bf3a3f281801f58` by run `34202494161` / job `101984290407`; minimum repair `c6330c06b6372b2bcdbebf08b16e51a4339d300a` then passed exact run `34203636724` / job `101987958062`. Fresh review defects in timestamp persistence, destructive PostgreSQL target/TLS policy, bracketed IPv6 loopback and the persistence-contract declaration retain RED ancestors `8ef43e183968a6713c0cf76da9a27a6400472ba0`, `9f2d9b7717ea39e0c2a71df4b0bd49bc4253ce9f`, `87b247ff8043470f1807286f5b3a4f84a14237a8`, and `c77d0a38c48caa7e02e50a9dac6a44b9ba6f4cd2`, with causal repairs `5bfdee3d5fbb6fb22027d240279b9cc708aeb3cf`, `aca4c3bb69b6b76a6ceff790da3c08e304fe56ab`, `da94bb6b96391fcc3c66f3b4460979f62e6c964f`, `f6ba35dbc7c3fd630880489fe59e2aeb78bbe1e3c`, and `171f15ed75be0331b37e2912ba42e2d37f201003`. After bounded formatting repair, harness-only proof head `9e6e88e49e14d0b2d247e747df968e2494697666` completed run `34209314512` / job `102006262067` GREEN on Ubuntu 24.04/PostgreSQL 16 and all four CodeRabbit repair threads were resolved. A later repository-boundary review found that SQL result envelopes, durable row getters, and stored `Date.toISOString()` conversion could throw native dependency detail before the fixed persistence-evidence boundary. Reality RED `b390f37ed651ce2d9cb74d862fbae02641f3a55f` demonstrated the leak through a hostile SQL result/row accessor; minimum causal repair `e9a8b212b24b4914069a48a113d118ff4e4c0a56` snapshots and bounds those evidence reads without changing SQL/schema/admission semantics. Exact proof head `ec2353a003c15c9f464b5d5d2454d3593427d768`, run `34213508199`, job `102019765395`, replayed that RED for the intended reason and completed GREEN: canonical formatting and diff hygiene passed, focused delivery-attempt acceptance passed 24/24 tests, Integration typecheck passed, and the complete Integration suite passed 403 tests with 3 environment-dependent skips across 65 files (63 passed, 2 skipped). Current #252 exact head `fe51a79c1e19cc7fb14e5296f04b3f91b41bf535` is an ordinary docs-only descendant adding the CHANGELOG contract for that repair; its exact-head verifier run `34213937828` / job `102021136219` is queued and therefore is not current-head GREEN evidence yet. The purpose verifier remains present until that exact-head lane terminates. #252 remains Draft and unshipped pending prerequisite integration, applicable repository/security authority and independent approval. Neither durable origin nor attempt identity grants outbound HTTPS or connect-time egress authority, which must come from an immutable released/versioned canonical owner contract.'''
          updated = text[:start_index] + replacement + text[end_index:]
          path.write_text(updated)
          PY

      - name: Verify exact writer lease and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin docs/product-gap-baseline-2026-08-20
          test "$(git rev-parse origin/docs/product-gap-baseline-2026-08-20)" = "${GITHUB_SHA}"
          git diff --check
          git diff -- docs/product-technical-gap-baseline.md

      - name: Publish bounded source repair and retire writer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-product-gap-baseline-plugin-sql-evidence.yml
          git config user.name "LifeOS Documentation Writer"
          git config user.email "actions@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md .github/workflows/repair-product-gap-baseline-plugin-sql-evidence.yml
          if git diff --cached --quiet; then
            echo "No bounded source repair to publish" >&2
            exit 1
          fi
          git commit -m "docs: refresh plugin SQL evidence baseline"
          git fetch origin docs/product-gap-baseline-2026-08-20
          test "$(git rev-parse origin/docs/product-gap-baseline-2026-08-20)" = "${GITHUB_SHA}"
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
