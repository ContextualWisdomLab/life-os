name: Repair PR264 Review HTTP RED formatting

on:
  push:
    branches: [feat/habit-review-period-projection-v1]
    paths:
      - .github/workflows/repair-pr264-review-http-red-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-pr264-review-http-red-formatting
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Canonicalize the RED contract only
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            apps/habit-service/src/habit-review-projection-http.test.ts
          pnpm format:check
          git diff --check

      - name: Publish bounded self-retired formatting repair
        shell: bash
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/repair-pr264-review-http-red-formatting.yml'
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              apps/habit-service/src/habit-review-projection-http.test.ts) ;;
              *) echo "unexpected formatter delta: $path" >&2; exit 1 ;;
            esac
          done

          rm "$workflow"
          git add apps/habit-service/src/habit-review-projection-http.test.ts "$workflow"

          git config user.name 'life-os-maintainer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(habit): format Review projection HTTP RED'

          git fetch origin feat/habit-review-period-projection-v1
          remote_head="$(git rev-parse origin/feat/habit-review-period-projection-v1)"
          test "$remote_head" = "$INPUT_SHA"
          git push origin HEAD:feat/habit-review-period-projection-v1
