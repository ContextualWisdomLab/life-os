name: Verify Plugin Delivery Outcome Restack

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-outcome-ledger-v1

permissions:
  contents: read

concurrency:
  group: life-os-plugin-delivery-outcome-restack
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_integration
          POSTGRES_USER: life_os
          POSTGRES_PASSWORD: life_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os -d life_os_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://life_os:life_os_test@127.0.0.1:5432/life_os_integration?sslmode=disable
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Build Plugin SDK runtime entry
        run: pnpm --filter @life-os/plugin-sdk build
      - name: Check retry and outcome formatting
        run: >-
          pnpm exec prettier --check
          apps/integration-service/src/plugin-delivery-attempt-retry.ts
          apps/integration-service/src/plugin-delivery-attempt-retry.test.ts
          apps/integration-service/src/plugin-delivery-attempt-retry-repository.ts
          apps/integration-service/src/plugin-delivery-attempt-retry-repository.test.ts
          apps/integration-service/src/plugin-delivery-attempt-retry.integration.test.ts
          apps/integration-service/src/plugin-delivery-attempt-retry-forgery.integration.test.ts
          apps/integration-service/src/plugin-delivery-attempt-outcome.integration.test.ts
          apps/integration-service/src/plugin-delivery-attempt-outcome-forgery.integration.test.ts
      - name: Run adopted retry acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-retry.test.ts
          src/plugin-delivery-attempt-retry-repository.test.ts
          src/plugin-delivery-attempt-retry.integration.test.ts
          src/plugin-delivery-attempt-retry-forgery.integration.test.ts
          --no-file-parallelism
      - name: Run outcome ledger acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-outcome.integration.test.ts
          src/plugin-delivery-attempt-outcome-forgery.integration.test.ts
          --no-file-parallelism
      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck
      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test
