name: Format plugin delivery retry integration regression

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-retry-backoff-v1

permissions:
  contents: write

concurrency:
  group: format-plugin-delivery-retry-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: feat/plugin-delivery-attempt-retry-backoff-v1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting and self-retire
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          pnpm exec prettier --single-quote --write \
            apps/integration-service/src/plugin-delivery-attempt-retry.integration.test.ts
          rm .github/workflows/format-plugin-delivery-retry-integration.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/integration-service/src/plugin-delivery-attempt-retry.integration.test.ts \
            .github/workflows/format-plugin-delivery-retry-integration.yml
          if git diff --cached --quiet; then
            exit 1
          fi
          git commit -m "style(integration): format retry PostgreSQL regression"
          git push origin HEAD:feat/plugin-delivery-attempt-retry-backoff-v1
