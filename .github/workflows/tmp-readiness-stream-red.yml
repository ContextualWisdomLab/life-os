name: Temporary Readiness Stream RED

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1

permissions:
  contents: read

concurrency:
  group: tmp-readiness-stream-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact regression head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Run stream-boundary regression only
        run: >-
          pnpm --filter @life-os/commercial-readiness exec node --test
          src/github-client-stream-boundary.test.mjs
