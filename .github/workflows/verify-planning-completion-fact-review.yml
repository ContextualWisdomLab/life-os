name: Verify Planning completion fact review

on:
  push:
    branches:
      - feat/planning-task-completion-history-v1
    paths:
      - .github/workflows/verify-planning-completion-fact-review.yml
      - apps/planning-service/migrations/0007_task_completion_facts.sql
      - apps/planning-service/src/task-completion-history.integration.test.ts
      - apps/planning-service/src/task-completion.ts
      - apps/planning-service/tests/postgres-data-rights.integration.test.ts

permissions:
  contents: read

concurrency:
  group: planning-completion-fact-review-verifier
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run completion-history PostgreSQL acceptance
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion-history.integration.test.ts --no-file-parallelism

      - name: Run Planning data-rights PostgreSQL acceptance
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          tests/postgres-data-rights.integration.test.ts --no-file-parallelism

      - name: Check review-owned TypeScript formatting
        run: >-
          pnpm exec prettier --check
          apps/planning-service/src/task-completion-history.integration.test.ts
          apps/planning-service/src/task-completion.ts
          apps/planning-service/tests/postgres-data-rights.integration.test.ts

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run complete Planning suite with normal file parallelism
        run: pnpm --filter @life-os/planning-service exec vitest run --passWithNoTests

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Verify diff hygiene
        run: git diff --check
