name: Repair Planning Completion Fact Chronology

on:
  push:
    branches: [feat/planning-task-completion-history-v1]
    paths:
      - .github/workflows/repair-planning-completion-fact-chronology.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded review repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          import re
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              target.write_text(text.replace(old, new, 1))

          def regex_replace_once(path: str, pattern: str, replacement: str) -> None:
              target = Path(path)
              text = target.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex replacement target, found {count}')
              target.write_text(updated)

          replace_once(
              'apps/planning-service/src/planning-data-rights.ts',
              """interface PlanningTaskCompletionFactExportRow {
            task_id: unknown;
            completed_at: unknown;
          }
          """,
              """/**
           * Data-rights projection for user-owned completion evidence only.
           * Internal fact identity and ordering sequence stay inside Planning persistence.
           */
          interface PlanningTaskCompletionFactExportRow {
            task_id: unknown;
            completed_at: unknown;
          }
          """,
          )

          regex_replace_once(
              'apps/planning-service/tests/postgres-data-rights.integration.test.ts',
              r"`INSERT INTO planning\.tasks \(id, workspace_id, project_id, title\)\s*\n\s*VALUES \(\$1, \$2, \$3, 'Task'\)`",
              """`INSERT INTO planning.tasks
                 (id, workspace_id, project_id, title, status, created_at, completed_at)
               VALUES ($1, $2, $3, 'Task', 'done',
                       TIMESTAMPTZ '2026-08-10T12:00:00.000Z',
                       TIMESTAMPTZ '2026-08-10T12:00:00.000Z')`""",
          )

          replace_once(
              'apps/planning-service/src/task-completion.test.ts',
              """    return {
              rows: this.rows.map((row) => {
                if (row === null || typeof row !== 'object' || Array.isArray(row)) {
                  return row as Row;
                }
                return {
                  previous_status: 'todo',
                  completion_fact_count: 1,
                  ...(row as Record<string, unknown>),
                } as Row;
              }),
            };
          """,
              """    return { rows: this.rows as Row[] };
          """,
          )

          replace_once(
              'apps/planning-service/src/task-completion.test.ts',
              """    const client = new RecordingSqlClient([
              {
                workspace_id: WORKSPACE_ID,
                id: TASK_ID,
                status: 'done',
                completed_at: COMPLETED_AT,
              },
            ]);
          """,
              """    const client = new RecordingSqlClient([
              {
                workspace_id: WORKSPACE_ID,
                id: TASK_ID,
                status: 'done',
                completed_at: COMPLETED_AT,
                previous_status: 'todo',
                completion_fact_count: 1,
              },
            ]);
          """,
          )

          replace_once(
              'apps/planning-service/src/task-completion.test.ts',
              """    expect(client.calls[0]?.text).toContain(
              'RETURNING workspace_id, id, status, completed_at',
            );
          """,
              """    expect(client.calls[0]?.text).toContain(
              'RETURNING workspace_id, id, status, completed_at',
            );
            expect(client.calls[0]?.text).toContain(
              'previous.previous_status AS previous_status',
            );
            expect(client.calls[0]?.text).toContain(
              'AS completion_fact_count',
            );
            expect(client.calls[0]?.text).toContain(
              'INSERT INTO planning.task_completion_facts',
            );
          """,
          )

          replace_once(
              'apps/planning-service/src/task-completion.test.ts',
              """        {
                  workspace_id: WORKSPACE_ID,
                  id: TASK_ID,
                  status: 'done',
                  completed_at: new Date(COMPLETED_AT),
                },
          """,
              """        {
                  workspace_id: WORKSPACE_ID,
                  id: TASK_ID,
                  status: 'done',
                  completed_at: new Date(COMPLETED_AT),
                  previous_status: 'todo',
                  completion_fact_count: 1,
                },
          """,
          )

          replace_once(
              'apps/planning-service/migrations/README.md',
              """- `0007_task_completion_facts.sql` creates the Planning-owned completion-fact ledger used to retain each real `todo → done` transition after later retries or reopen. Every fact has an application-generated opaque UUIDv4 primary key; `completion_sequence` is a separate unique ordering key, not domain identity and is not exported through the data-rights contract. Facts retain tenant/task ownership and the committed completion instant, cascade with task erasure, and are indexed by workspace + completion time for bounded period projections. The completion repository appends a fact in the same PostgreSQL statement that changes task state; retries while already done do not append duplicates.
          """,
              """- `0007_task_completion_facts.sql` creates the Planning-owned completion-fact ledger used to retain each real `todo → done` transition after later retries or reopen. Every fact has an application-generated opaque UUIDv4 primary key; `completion_sequence` is a separate unique ordering key, not domain identity and is not exported through the data-rights contract. Facts retain tenant/task ownership and the committed completion instant, cascade with task erasure, and are indexed by workspace + completion time for bounded period projections. A Planning-owned trigger rejects any fact whose completion instant predates the owning task's creation instant. The completion repository appends a fact in the same PostgreSQL statement that changes task state; retries while already done do not append duplicates.
          """,
          )

          replace_once(
              'apps/planning-service/migrations/README.md',
              "Migrations are forward-only in automated environments. Rolling back `0007` destroys historical completion facts, so drop `planning.task_completion_facts` only after an operator-approved export/retention decision and only when loss of Review provenance is acceptable.",
              "Migrations are forward-only in automated environments. Rolling back `0007` destroys historical completion facts, so drop `planning.task_completion_facts` only after an operator-approved export/retention decision and only when loss of Review provenance is acceptable; after the table and its trigger are removed, also drop `planning.enforce_task_completion_fact_chronology()` so no orphan migration function remains.",
          )

          replace_once(
              'CHANGELOG.md',
              """- Planning task completion now treats the atomic completion-fact cardinality and prior durable task state as part of persistence acceptance evidence, so a repository cannot report a successful new completion when the corresponding append-only fact is absent, duplicated, or otherwise inconsistent with the requested transition.
          """,
              """- Planning task completion now treats the atomic completion-fact cardinality and prior durable task state as part of persistence acceptance evidence, so a repository cannot report a successful new completion when the corresponding append-only fact is absent, duplicated, or otherwise inconsistent with the requested transition. The completion-fact ledger also rejects persisted completion instants that predate the owning task's creation instant.
          """,
          )
          PY

      - name: Remove purpose-complete repair workflows
        run: >-
          git rm
          .github/workflows/repair-planning-completion-fact-chronology.yml
          .github/workflows/verify-planning-completion-fact-chronology.yml

      - name: Canonicalize changed sources
        run: >-
          pnpm exec prettier --write
          apps/planning-service/src/planning-data-rights.ts
          apps/planning-service/src/task-completion.test.ts
          apps/planning-service/src/task-completion-fact-chronology.integration.test.ts
          apps/planning-service/tests/postgres-data-rights.integration.test.ts
          apps/planning-service/migrations/README.md
          CHANGELOG.md

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run focused Planning persistence regressions
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion.test.ts
          src/task-completion-history.integration.test.ts
          src/task-completion-fact-chronology.integration.test.ts
          tests/postgres-data-rights.integration.test.ts

      - name: Run complete Planning suite
        run: pnpm --filter @life-os/planning-service test

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Check changed-source formatting
        run: >-
          pnpm exec prettier --check
          apps/planning-service/src/planning-data-rights.ts
          apps/planning-service/src/task-completion.test.ts
          apps/planning-service/src/task-completion-fact-chronology.integration.test.ts
          apps/planning-service/tests/postgres-data-rights.integration.test.ts
          apps/planning-service/migrations/README.md
          CHANGELOG.md

      - name: Publish ordinary repair descendant
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add \
            apps/planning-service/src/planning-data-rights.ts \
            apps/planning-service/src/task-completion.test.ts \
            apps/planning-service/src/task-completion-fact-chronology.integration.test.ts \
            apps/planning-service/tests/postgres-data-rights.integration.test.ts \
            apps/planning-service/migrations/README.md \
            CHANGELOG.md
          git diff --cached --check
          git commit -m 'fix(planning): harden completion fact evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
