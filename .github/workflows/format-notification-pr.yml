name: Format notification PR

on:
  push:
    branches: [feat/notification-postgres-inbox]

permissions:
  contents: write

concurrency:
  group: format-notification-pr
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/notification-postgres-inbox

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format notification slice
        run: |
          pnpm exec prettier --single-quote --write \
            apps/notification-service/src/postgres-reminder-migration.test.ts \
            apps/notification-service/src/postgres-reminder-repository.ts \
            apps/notification-service/src/postgres-reminder-repository.test.ts \
            apps/notification-service/src/postgres-reminder-repository.integration.test.ts \
            docs/operations/notification-persistence.md \
            docs/superpowers/specs/2026-08-04-notification-postgres-inbox-design.md
          rm .github/workflows/format-notification-pr.yml

      - name: Commit formatting
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/format-notification-pr.yml \
            apps/notification-service/src/postgres-reminder-migration.test.ts \
            apps/notification-service/src/postgres-reminder-repository.ts \
            apps/notification-service/src/postgres-reminder-repository.test.ts \
            apps/notification-service/src/postgres-reminder-repository.integration.test.ts \
            docs/operations/notification-persistence.md \
            docs/superpowers/specs/2026-08-04-notification-postgres-inbox-design.md
          git diff --cached --quiet && exit 1
          git commit -m "style(notification): format durable persistence slice"
          git push origin HEAD:feat/notification-postgres-inbox
