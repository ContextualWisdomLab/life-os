name: Temporary Readiness Status Pagination Fixture

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - packages/commercial-readiness/src/github-client-status-pagination-stability.test.mjs
      - .github/workflows/tmp-readiness-status-pagination-fixture.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify status pagination fixture
        run: node --test packages/commercial-readiness/src/github-client-status-pagination-stability.test.mjs
