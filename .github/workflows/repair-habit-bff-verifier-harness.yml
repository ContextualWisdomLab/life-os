name: Repair Habit BFF Verifier Harness

on:
  push:
    branches:
      - feat/web-habit-bff-v1
    paths:
      - .github/workflows/repair-habit-bff-verifier-harness.yml

permissions:
  contents: write

concurrency:
  group: repair-habit-bff-verifier-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact formatting-repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          test -f .github/workflows/repair-habit-bff-verifier-harness.yml
          grep -Fq 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' \
            .github/workflows/verify-habit-bff-canonical-evidence.yml
          grep -Fq 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' \
            .github/workflows/verify-habit-bff-canonical-evidence.yml

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Format only proven Habit BFF evidence files
        run: >-
          pnpm exec prettier --single-quote --write
          apps/web/app/habit-client.ts
          apps/web/app/habit-client.test.ts

      - name: Guard code-only repair delta
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/web/app/habit-client.ts \
            apps/web/app/habit-client.test.ts
          git add \
            apps/web/app/habit-client.ts \
            apps/web/app/habit-client.test.ts
          allowed="$(printf '%s\n' \
            apps/web/app/habit-client.ts \
            apps/web/app/habit-client.test.ts | sort)"
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | sort)"
          test "$changed" = "$allowed"
          git diff --check --cached

      - name: Publish ordinary code-only formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(web): format Habit BFF evidence fixtures"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
