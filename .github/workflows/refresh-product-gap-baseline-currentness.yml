name: Refresh Product Gap Baseline Currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: life-os-product-gap-baseline-currentness
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Refresh exact live currentness and self-retire
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          doc = pathlib.Path('docs/product-technical-gap-baseline.md')
          workflow = pathlib.Path('.github/workflows/refresh-product-gap-baseline-currentness.yml')
          start_marker = '<!-- life-os-live-currentness:start -->'
          end_marker = '<!-- life-os-live-currentness:end -->'
          tracked_prs = (211, 252, 253, 254, 258, 260, 261, 264, 269, 273, 281, 282, 283)

          def api(path: str):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}{path}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'life-os-product-gap-currentness-writer',
                  },
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          main = api('/branches/main')['commit']['sha']
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          lines = [
              start_marker,
              f'> **Live currentness override — {now}.** This block supersedes conflicting active head/base/run identifiers below while preserving the dated ledger as audit history. It does not promote any active PR, predecessor proof, or queued workflow to protected/shipped truth.',
              '>',
              f'> Protected `main`: `{main}`.',
          ]

          for number in tracked_prs:
              pr = api(f'/pulls/{number}')
              head = pr['head']['sha']
              base = pr['base']['sha']
              head_branch = pr['head']['ref']
              params = urllib.parse.urlencode({'branch': head_branch, 'per_page': 20})
              runs = api(f'/actions/runs?{params}').get('workflow_runs', [])
              exact_runs = [run for run in runs if run.get('head_sha') == head]
              if exact_runs:
                  run = exact_runs[0]
                  verdict = run.get('conclusion') or run.get('status') or 'unknown'
                  run_text = f"{run['name']} `{run['id']}` {verdict}"
              else:
                  run_text = 'no exact-head workflow in latest 20 branch runs'
              lines.extend([
                  '>',
                  f"> PR #{number}: head `{head}`, base `{base}`, state `{pr['state']}`, draft `{str(pr.get('draft', False)).lower()}`, mergeable `{pr.get('mergeable')}`; latest exact-head workflow: {run_text}.",
              ])

          lines.extend([
              '>',
              '> Mutable sibling heads and unreleased external owner contracts remain non-consumable; predecessor GREEN remains ancestry evidence only after any head/base movement.',
              end_marker,
              '',
          ])
          block = '\n'.join(lines)

          text = doc.read_text(encoding='utf-8')
          if start_marker in text:
              before, remainder = text.split(start_marker, 1)
              _, after = remainder.split(end_marker, 1)
              text = before + block.rstrip('\n') + after
          else:
              needle = (
                  'This baseline separates protected shipped truth from active or work-in-progress evidence. '
                  'A branch, mergeable PR, test source, queued check, successful predecessor run, or documentation claim is not shipped capability. '
                  'Exact unchanged-head evidence must integrate through the live protected-branch policy before promotion.\n\n'
              )
              if needle not in text:
                  raise SystemExit('baseline insertion anchor not found')
              text = text.replace(needle, needle + block, 1)

          doc.write_text(text, encoding='utf-8')
          workflow.unlink()
          PY

          git diff --check
          git diff -- docs/product-technical-gap-baseline.md .github/workflows/refresh-product-gap-baseline-currentness.yml

          git config user.name 'LifeOS currentness writer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md .github/workflows/refresh-product-gap-baseline-currentness.yml
          git commit -m 'docs: refresh live product gap currentness'

          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"
