name: Update gap baseline 261 currentness

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: update-gap-baseline-261-currentness
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Replace only the stale coverage statement
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          old = "The p95 gap for this buyer path is therefore empirically satisfied on the active candidate; an owned coverage-percentage artifact remains missing and 100% Test/Edge Coverage is not claimed."
          new = """The p95 gap for this buyer path is therefore empirically satisfied on the active candidate. Direct descendant #261 now provides the missing percentage artifact without weakening the path: it owns `@vitest/coverage-v8`, `test:coverage`, and unchanged 100% statements/branches/functions/lines thresholds over Integration production TypeScript. After repairing only Plugin SDK build order and replay-PostgreSQL test isolation, exact head `20e8af0edd8cb2044cf18c21ba510cddd924a8ac`, run `34298516686`, job `102300245764`, completed frozen install, canonical formatting, Plugin SDK build, Integration typecheck and all enabled tests (82 test files passed / 2 skipped; 468 tests passed / 3 skipped) before V8 returned the valid RED baseline **89.38% statements, 81.15% branches, 93.85% functions, 89.38% lines**. The remaining skips are separately provisioned Vault/PostgreSQL acceptance. The percentage artifact now exists but 100% Test/Edge Coverage is still not claimed; uncovered production branches remain the causal #261 quality gap."""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale coverage statement, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = "docs/product-technical-gap-baseline.md"

      - name: Publish bounded currentness and retire writer
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin refs/heads/docs/product-gap-baseline-2026-08-20 | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Baseline branch moved from ${GITHUB_SHA} to ${remote_sha}; refusing publication." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/update-gap-baseline-261-currentness.yml
          git commit -m 'docs: record Integration coverage RED'
          git push origin HEAD:refs/heads/docs/product-gap-baseline-2026-08-20
