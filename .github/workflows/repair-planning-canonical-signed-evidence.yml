name: Repair Planning Canonical Signed Evidence

on:
  push:
    branches:
      - test/planning-context-canonical-evidence-v1
    paths:
      - .github/workflows/repair-planning-canonical-signed-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-planning-canonical-signed-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained assertion RED and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "8a38ccfe97a0702c901d3f853296a581824e6f82" HEAD
          test ! -e .github/workflows/repair-planning-context-canonical-evidence-formatting.yml
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce canonical signed-evidence RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter @life-os/planning-service exec vitest run \
            src/planning-context-canonical-evidence.test.ts \
            src/planning-data-rights-canonical-evidence.test.ts; then
            echo 'Expected byte-different signed Planning evidence to fail before repair.' >&2
            exit 1
          fi

      - name: Apply minimum signed-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('apps/planning-service/src/http-boundary.ts'); s=p.read_text(); old='/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;'; new='/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;'; assert s.count(old)==1; s=s.replace(old,new,1); old2='  const workspaceId = headers.workspaceId.toLowerCase();'; assert s.count(old2)==1; p.write_text(s.replace(old2,'  const workspaceId = headers.workspaceId;',1))"
          python -c "from pathlib import Path; p=Path('apps/planning-service/src/http-boundary.test.ts'); s=p.read_text(); old='${workspaceId.toLowerCase()}'; assert s.count(old)==1; s=s.replace(old,'${workspaceId}',1); old2='          workspaceId: WORKSPACE_ID.toUpperCase(),'; assert s.count(old2)==1; p.write_text(s.replace(old2,'          workspaceId: WORKSPACE_ID,',1))"
          python -c "from pathlib import Path; p=Path('apps/planning-service/src/planning-data-rights-http-boundary.ts'); s=p.read_text(); old='/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu;'; new='/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;'; assert s.count(old)==1; s=s.replace(old,new,1); s=s.replace('/** Requires and canonicalizes one opaque UUIDv4 product identity. */','/** Requires already-canonical lowercase UUIDv4 signed product identity. */',1); old2='  return value.toLowerCase();'; assert s.count(old2)==1; p.write_text(s.replace(old2,'  return value;',1))"
          git rm .github/workflows/repair-planning-canonical-signed-evidence.yml
          pnpm exec prettier --single-quote --write \
            apps/planning-service/src/http-boundary.ts \
            apps/planning-service/src/http-boundary.test.ts \
            apps/planning-service/src/planning-data-rights-http-boundary.ts

      - name: Verify minimum repair and complete Planning contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/planning-service/src/http-boundary.ts \
            apps/planning-service/src/http-boundary.test.ts \
            apps/planning-service/src/planning-context-canonical-evidence.test.ts \
            apps/planning-service/src/planning-data-rights-http-boundary.ts \
            apps/planning-service/src/planning-data-rights-canonical-evidence.test.ts \
            .github/workflows/verify-planning-context-canonical-evidence.yml
          pnpm --filter @life-os/planning-service exec vitest run \
            src/planning-context-canonical-evidence.test.ts \
            src/planning-data-rights-canonical-evidence.test.ts \
            src/http-boundary.test.ts
          pnpm --filter @life-os/planning-service typecheck
          pnpm --filter @life-os/planning-service test
          git diff --check
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-planning-canonical-signed-evidence.yml' \
            'apps/planning-service/src/http-boundary.test.ts' \
            'apps/planning-service/src/http-boundary.ts' \
            'apps/planning-service/src/planning-data-rights-http-boundary.ts' | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary semantic repair descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(planning): require canonical signed identity evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
