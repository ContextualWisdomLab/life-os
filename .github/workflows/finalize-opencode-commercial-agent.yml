name: Finalize OpenCode Commercial Development Agent

on:
  push:
    branches:
      - feat/opencode-commercial-development-loop
    paths:
      - '.github/workflows/finalize-opencode-commercial-agent.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/opencode-commercial-development-loop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Ensure an exact OpenCode package pin and reproducible lockfile
        run: |
          set -Eeuo pipefail
          corepack enable
          configured="$(node -p "require('./packages/commercial-development-agent/package.json').devDependencies?.['opencode-ai'] || ''")"
          if [[ "$configured" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pnpm install --frozen-lockfile
          else
            version="$(npm view opencode-ai version --json | jq -r '.')"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo '::error::OpenCode registry version is not an exact semantic version.'
              exit 1
            fi
            pnpm --filter @life-os/commercial-development-agent add \
              --save-dev \
              --save-exact \
              "opencode-ai@${version}"
          fi

      - name: Apply final deterministic architecture and security contract
        run: python3 .github/scripts/finalize-opencode-commercial-agent.py

      - name: Format the complete feature slice
        run: |
          pnpm exec prettier --single-quote --write \
            AGENTS.md \
            CLAUDE.md \
            ARCHITECTURE.md \
            README.md \
            CHANGELOG.md \
            product/capabilities.json \
            product/opencode-commercial-development-policy.json \
            .github/workflows/opencode-commercial-development.yml \
            packages/commercial-development-agent/package.json \
            packages/commercial-development-agent/vitest.config.mjs \
            packages/commercial-development-agent/src \
            docs/operations/opencode-commercial-development-loop.md \
            docs/research/2026-08-07-opencode-commercial-development-loop-standards.md \
            docs/superpowers/specs/2026-08-07-opencode-commercial-development-loop-design.md \
            docs/superpowers/plans/2026-08-07-opencode-commercial-development-loop.md

      - name: Verify exact OpenCode CLI and complete deterministic package
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/commercial-development-agent exec opencode --version
          pnpm --filter @life-os/commercial-development-agent exec opencode run --help > /dev/null
          pnpm --filter @life-os/commercial-development-agent exec opencode debug config --help > /dev/null
          pnpm --filter @life-os/commercial-development-agent lint
          pnpm --filter @life-os/commercial-development-agent test
          pnpm --filter @life-os/commercial-development-agent build
          pnpm --filter @life-os/commercial-readiness test

      - name: Remove every temporary write-capable bootstrap asset
        run: |
          rm -f \
            .github/workflows/bootstrap-opencode-commercial-agent.yml \
            .github/workflows/repair-opencode-commercial-agent.yml \
            .github/workflows/finalize-opencode-commercial-agent.yml \
            .github/scripts/finalize-opencode-commercial-agent.py

      - name: Commit the exact verified clean head
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(agent): finalize bounded NVIDIA OpenCode development loop'
          git push origin HEAD:feat/opencode-commercial-development-loop
