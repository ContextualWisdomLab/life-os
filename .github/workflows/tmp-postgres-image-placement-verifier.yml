name: Temporary PostgreSQL image placement verifier

on:
  push:
    branches:
      - fix/postgres-ci-init-contract-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Run focused PostgreSQL service contract
        run: pnpm --dir packages/commercial-development-agent exec vitest run src/postgres-ci-service-contract.test.mjs --no-file-parallelism
