name: Repair Review Workspace Formatting

on:
  push:
    branches:
      - feat/web-review-workspace-v1
    paths:
      - .github/workflows/repair-review-workspace-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-review-workspace-formatting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove formatting RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec prettier --single-quote --check \
            apps/web/app/review/review-client.tsx \
            apps/web/e2e/review-workspace.spec.ts; then
            echo 'Expected the retained Review files to be noncanonical before repair.' >&2
            exit 1
          fi

      - name: Apply bounded formatter repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            apps/web/app/review/review-client.tsx \
            apps/web/e2e/review-workspace.spec.ts
          git rm .github/workflows/repair-review-workspace-formatting.yml

      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/web/app/review/review-client.tsx \
            apps/web/e2e/review-workspace.spec.ts
          git diff --check
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-review-workspace-formatting.yml' \
            'apps/web/app/review/review-client.tsx' \
            'apps/web/e2e/review-workspace.spec.ts' | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary descendant
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${GITHUB_REF_NAME}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/review/review-client.tsx apps/web/e2e/review-workspace.spec.ts
          git commit -m 'style(web): format Review mutation claim evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
