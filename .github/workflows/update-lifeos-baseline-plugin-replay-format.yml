name: Advance LifeOS baseline plugin replay formatting currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: lifeos-baseline-plugin-replay-format-currentness
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact documentation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/product-gap-baseline-2026-08-20
          fetch-depth: 0

      - name: Verify exact preservation parent
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_parent='70a41acc60125a76e1dec72be22eb6dfd690cc71'
          test "$(git rev-parse HEAD^)" = "$expected_parent"
          test "$(git diff --name-only HEAD^...HEAD)" = '.github/workflows/update-lifeos-baseline-plugin-replay-format.yml'

      - name: Advance exact product currentness
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          old_head = '#245 is now exact `1c65617233f565b624c1c74045bfcc834b74a632`, open Draft/mergeable on #244.'
          new_head = '#245 is now exact `a345f824a44e920b161fd668752adc33cf468afa`, open Draft/mergeable on #244.'
          if text.count(old_head) != 1:
              raise SystemExit('baseline exact-head currentness target is not unique')
          text = text.replace(old_head, new_head, 1)

          old_evidence = 'then removed its one-shot workflow and normally published `1c656172...`. This is unshipped Integration-scope evidence'
          new_evidence = (
              'then removed its one-shot workflow and normally published `1c656172...`. '
              'A follow-up formatting audit found the generated TypeScript repair and regression were not canonical Prettier output. '
              'The first formatting run `34158609418` correctly failed because its scope also checked the pre-existing repository-wide `CHANGELOG.md` style; no formatting mutation was published. '
              'Successor run `34158765750`, job `101855994449`, scoped formatting to the two owned TypeScript files, proved Prettier, focused replay 3/3, plugin-sdk build, Integration typecheck, and the complete Integration suite (56 passed/4 skipped test files; 366 passed/16 skipped tests), then removed its one-shot workflow and normally published formatting-only descendant `a345f824...`. '
              'This is unshipped Integration-scope evidence'
          )
          if text.count(old_evidence) != 1:
              raise SystemExit('baseline evidence target is not unique')
          path.write_text(text.replace(old_evidence, new_evidence, 1))
          PY

      - name: Validate and publish docs-only descendant
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/update-lifeos-baseline-plugin-replay-format.yml
          actual_paths=$(git diff --name-only | sort)
          expected_paths=$(cat <<'EOF'
          .github/workflows/update-lifeos-baseline-plugin-replay-format.yml
          docs/product-technical-gap-baseline.md
          EOF
          )
          test "$actual_paths" = "$(printf '%s\n' "$expected_paths" | sort)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: advance plugin replay formatting currentness'
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
