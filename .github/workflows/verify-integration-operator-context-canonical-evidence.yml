name: Verify Integration Canonical Signed Evidence

on:
  push:
    branches:
      - test/integration-operator-context-canonical-evidence-v1
    paths:
      - apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts
      - apps/integration-service/src/integration-event-context-canonical-evidence.test.ts
      - apps/integration-service/src/plugin-operator-context.ts
      - apps/integration-service/src/main.ts
      - .github/workflows/verify-integration-operator-context-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-integration-canonical-signed-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact formatter publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          test ! -e .github/workflows/repair-integration-context-canonical-evidence-formatting.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts
          apps/integration-service/src/integration-event-context-canonical-evidence.test.ts
          apps/integration-service/src/plugin-operator-context.ts
          apps/integration-service/src/main.ts
          .github/workflows/verify-integration-operator-context-canonical-evidence.yml

      - name: Reproduce Integration canonical signed-evidence regressions
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-operator-context-canonical-evidence.test.ts
          src/integration-event-context-canonical-evidence.test.ts

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration suite
        run: pnpm --filter @life-os/integration-service test
