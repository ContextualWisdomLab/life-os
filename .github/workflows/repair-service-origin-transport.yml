name: Repair Service Origin Transport

on:
  push:
    branches:
      - test/web-service-origin-transport-v1
    paths:
      - .github/workflows/repair-service-origin-transport.yml
      - .github/scripts/repair-service-origin-transport.py

permissions:
  contents: write

concurrency:
  group: repair-service-origin-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: test/web-service-origin-transport-v1

      - name: Require current RED ancestry and single writer
        shell: bash
        run: |
          set -Eeuo pipefail
          red='59e424db91655e04587d9e8a978e4ef7afbfe0e8'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin refs/heads/test/web-service-origin-transport-v1 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$red" "$GITHUB_SHA"
          test -f .github/workflows/verify-web-service-origin-transport-red.yml
          test -f .github/workflows/repair-service-origin-transport.yml
          test -f .github/scripts/repair-service-origin-transport.py

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reproduce hosted cleartext RED locally
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          output="$(pnpm --filter @life-os/web exec tsx --test app/service-origin-transport-red.test.ts 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          grep -F 'Missing expected exception' <<<"$output"

      - name: Apply minimum shared transport-policy repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python .github/scripts/repair-service-origin-transport.py
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Keep transport operations evidence code-current
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one documentation anchor')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/operations/durable-today-synchronization.md',
              '- `PLANNING_GATEWAY_CONTEXT_SECRET` with at least 32 bytes\n',
              '- `PLANNING_GATEWAY_CONTEXT_SECRET` with at least 32 bytes\n'
              '- HTTPS `IDENTITY_SERVICE_ORIGIN` and `PLANNING_SERVICE_ORIGIN` in non-local environments\n'
              '- `SERVICE_ORIGIN_HTTP_MODE=loopback` only for explicit local development when every cleartext service origin is an exact loopback host; omit it in deployed environments\n',
          )

          replace_once(
              'docs/operations/production-deployment.md',
              'The base denies all ambient traffic, then permits DNS, edge ingress, web-to-gateway TCP `4000`, and gateway egress to explicitly named LifeOS pods on service ports `4101` through `4107`, NATS `4222`, and PostgreSQL `5432`. The current gateway endpoint is a placeholder and does not yet require PostgreSQL or NATS, but these internal paths are ready for separately deployed, correctly labeled LifeOS services.\n',
              'The base denies all ambient traffic, then permits DNS, edge ingress, web-to-gateway TCP `4000`, and gateway egress to explicitly named LifeOS pods on service ports `4101` through `4107`, NATS `4222`, and PostgreSQL `5432`. The current gateway endpoint is a placeholder and does not yet require PostgreSQL or NATS. NetworkPolicy reachability does not establish encrypted application transport: before enabling an internal Identity, Planning, Habit, or AI origin, terminate authenticated TLS at the service, sidecar, or reviewed service-mesh boundary and configure an exact HTTPS origin. `SERVICE_ORIGIN_HTTP_MODE=loopback` is a local-only exception and must not be set on cluster workloads or used to authorize service-DNS/IP cleartext.\n',
          )

          replace_once(
              'CHANGELOG.md',
              '### Security\n\n',
              '### Security\n\n'
              '- Web and Gateway upstream service origins now fail closed to HTTPS; cleartext is accepted only through an explicit local loopback mode, with one shared transport validator preventing browser or service configuration from widening the exception.\n',
          )
          PY

      - name: Prove focused and owned GREEN
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            packages/contracts/src/service-origin.ts \
            packages/contracts/service-origin.test.mjs \
            packages/contracts/src/index.ts \
            packages/contracts/package.json \
            apps/web/package.json \
            apps/web/app/service-origin-transport.test.ts \
            apps/web/app/ai-service-origin-transport.test.ts \
            apps/web/app/planning-search-client.ts \
            apps/web/app/today-sync-client.ts \
            apps/web/app/ai-proposal-client-core.ts \
            apps/web/app/planning-search-client.test.ts \
            apps/web/app/ai-proposal-client.test.ts \
            apps/web/app/ai-proposal-scope-regression.test.ts \
            apps/web/app/ai-proposal-identity-stream-regression.test.ts \
            apps/web/app/api/ai/proposals/routes.test.ts \
            apps/gateway/src/today-composition.ts \
            apps/gateway/src/service-origin-transport.test.ts \
            docs/operations/durable-today-synchronization.md \
            docs/operations/production-deployment.md \
            CHANGELOG.md
          pnpm --filter @life-os/contracts typecheck
          pnpm --filter @life-os/contracts build
          pnpm --filter @life-os/contracts test
          pnpm --filter @life-os/web typecheck
          pnpm --filter @life-os/web test
          pnpm --filter @life-os/gateway typecheck
          pnpm --filter @life-os/gateway test
          pnpm --filter @life-os/web build
          pnpm --filter @life-os/gateway build
          grep -F 'SERVICE_ORIGIN_HTTP_MODE=loopback' docs/operations/durable-today-synchronization.md
          grep -F 'must not be set on cluster workloads' docs/operations/production-deployment.md
          git diff --check

      - name: Publish ordinary workflow-free repair
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote --refs origin refs/heads/test/web-service-origin-transport-v1 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          rm .github/workflows/verify-web-service-origin-transport-red.yml
          rm .github/workflows/repair-service-origin-transport.yml
          rm .github/scripts/repair-service-origin-transport.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m 'fix(security): fail closed on cleartext service origins'
          git push origin HEAD:test/web-service-origin-transport-v1
