name: Repair Plugin credential replay revocation fence

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: integration-plugin-credential-replay-revocation
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/plugin-vault-postgres-driver-v1
          fetch-depth: 0

      - name: Verify exact RED lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          red_head='a4f92ceb51d3eb249817745d29f7dc4b57df8667'
          test "$(git rev-parse HEAD^)" = "$red_head"
          test "$(git diff --name-only HEAD^...HEAD)" = '.github/workflows/verify-plugin-credential-replay-revocation.yml'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply minimal replay revocation repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('apps/integration-service/src/plugin-credential.ts')
          text = source.read_text()
          old = '''      try {
                await this.secretStore.verifySecret(existing.secretReference, {
                  credentialBindingId,
                  installationId,
                  workspaceId: context.workspaceId,
                  installedByUserId: context.actorUserId,
                  credentialName,
                  secretValue,
                });
              } catch {
                return invalid();
              }
              return view(existing);'''
          new = '''      try {
                await this.secretStore.verifySecret(existing.secretReference, {
                  credentialBindingId,
                  installationId,
                  workspaceId: context.workspaceId,
                  installedByUserId: context.actorUserId,
                  credentialName,
                  secretValue,
                });
              } catch {
                return invalid();
              }

              let currentInstallation: PluginInstallationRecord | undefined;
              try {
                currentInstallation = await this.installationAuthority.getInstallation(
                  context,
                  installationId,
                );
              } catch {
                return invalid();
              }
              if (
                !currentInstallation ||
                currentInstallation.status !== 'active' ||
                currentInstallation.revokedAt !== null ||
                currentInstallation.workspaceId !== context.workspaceId ||
                currentInstallation.installedByUserId !== context.actorUserId ||
                currentInstallation.installationId !== installationId ||
                requireStoredInstant(currentInstallation.installedAt) !== installedAt
              ) {
                return invalid();
              }
              return view(existing);'''
          if text.count(old) != 1:
              raise SystemExit('credential replay repair target is not exact')
          source.write_text(text.replace(old, new))

          changelog = Path('CHANGELOG.md')
          log = changelog.read_text()
          marker = '### Fixed\n\n'
          addition = (
              '- Plugin credential replay now revalidates the owning installation after provider-backed secret verification; '
              'a concurrent installation revocation cannot leave stale active replay metadata accepted after secret-store I/O.\n'
          )
          if log.count(marker) != 1:
              raise SystemExit('CHANGELOG Fixed section is ambiguous')
          if addition not in log:
              log = log.replace(marker, marker + addition, 1)
              changelog.write_text(log)
          PY

      - name: Prove focused and complete Integration acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-credential-replay-secret.test.ts
          pnpm --filter @life-os/plugin-sdk build
          pnpm --filter @life-os/integration-service typecheck
          pnpm --filter @life-os/integration-service test

      - name: Publish causal repair and remove one-shot writer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/verify-plugin-credential-replay-revocation.yml
          actual_paths=$(git diff --name-only | sort)
          expected_paths=$(cat <<'EOF'
          .github/workflows/verify-plugin-credential-replay-revocation.yml
          CHANGELOG.md
          apps/integration-service/src/plugin-credential.ts
          EOF
          )
          test "$actual_paths" = "$(printf '%s\n' "$expected_paths" | sort)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(integration): revalidate installation on credential replay'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1
