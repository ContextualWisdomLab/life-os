name: Verify plugin delivery retry slice

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-retry-backoff-v1

permissions:
  contents: read

concurrency:
  group: verify-plugin-delivery-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Show canonical formatting delta
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            apps/integration-service/src/plugin-delivery-attempt-retry.ts \
            apps/integration-service/src/plugin-delivery-attempt-retry.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-retry-repository.test.ts
          git diff -- \
            apps/integration-service/src/plugin-delivery-attempt-retry.ts \
            apps/integration-service/src/plugin-delivery-attempt-retry.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-retry-repository.test.ts
          test -z "$(git status --short -- apps/integration-service/src/plugin-delivery-attempt-retry.ts apps/integration-service/src/plugin-delivery-attempt-retry.test.ts apps/integration-service/src/plugin-delivery-attempt-retry-repository.test.ts)"

      - name: Build Plugin SDK dependency
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Run retry capability and persistence acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-retry.test.ts
          src/plugin-delivery-attempt-retry-repository.test.ts

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck
