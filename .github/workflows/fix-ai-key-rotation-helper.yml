name: Fix AI Key Rotation Helper

on:
  push:
    branches:
      - feat/ai-gateway-key-rotation
    paths:
      - '.github/workflows/fix-ai-key-rotation-helper.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-gateway-key-rotation
          fetch-depth: 0

      - name: Repair helper action pin and remove this fixer
        run: |
          set -Eeuo pipefail
          sed -i \
            's#actions/setup-node@fdbd5b5d6a1c9bb1f77880bc2f733d820f4737e0 #actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #' \
            .github/workflows/complete-ai-key-rotation.yml
          git rm .github/workflows/fix-ai-key-rotation-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/complete-ai-key-rotation.yml
          git diff --cached --check
          git commit -m 'fix(ci): use available setup-node action pin'
          git push origin HEAD:feat/ai-gateway-key-rotation
