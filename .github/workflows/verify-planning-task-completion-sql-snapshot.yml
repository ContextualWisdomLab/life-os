name: Verify Planning Task Completion SQL Snapshot

on:
  push:
    branches:
      - feat/planning-task-completion-transition-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check focused formatting
        run: pnpm exec prettier --check apps/planning-service/src/task-completion.ts apps/planning-service/src/task-completion-hostile-evidence.test.ts
      - name: Run hostile SQL evidence regression
        run: pnpm --filter @life-os/planning-service test -- task-completion-hostile-evidence.test.ts
      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck
