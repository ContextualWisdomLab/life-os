name: Prettier Diagnostic

on:
  push:
    branches:
      - test/oauth-http-integration

permissions:
  contents: read

jobs:
  format-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Print Prettier diff
        run: |
          pnpm exec prettier --single-quote --write apps/identity-service/src/oauth-http.integration.test.ts
          git diff --no-ext-diff -- apps/identity-service/src/oauth-http.integration.test.ts
