name: Repair OpenCode commercial security contract

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/repair-opencode-commercial-security-contract.yml

permissions:
  contents: write

concurrency:
  group: repair-opencode-commercial-security-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/opencode-commercial-development-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Apply reviewed workflow hardening
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          readonly expected_branch='feat/opencode-commercial-development-loop'
          readonly expected_workflow_blob='6771c53ba753a79e4ae5c8127fb6e1db40ce1196'
          readonly target='.github/workflows/opencode-commercial-development.yml'
          test "$TARGET_BRANCH" = "$expected_branch"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object "$target")" = "$expected_workflow_blob"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/repair.py"
          python3 "$RUNNER_TEMP/repair.py"
          corepack enable
          test "$(pnpm --version)" = '10.15.0'
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --single-quote --write "$target"
          pnpm --filter @life-os/commercial-development-agent lint
          pnpm --filter @life-os/commercial-development-agent exec vitest run src/workflow-contract.test.mjs --no-file-parallelism
          git diff --check -- "$target"
          test "$(git diff --name-only)" = "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'fix(agent): harden trusted development workflow boundary'
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git push --dry-run origin "HEAD:refs/heads/$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
