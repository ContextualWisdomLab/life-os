name: Finalize OpenCode Commercial Development Loop
# Temporary verification workflow; successful push verification self-removes it.

on:
  push:
    branches:
      - feat/opencode-commercial-development-loop
    paths:
      - '.github/workflows/finalize-opencode-commercial-agent-clean.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-opencode-commercial-agent-clean.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && 'feat/opencode-commercial-development-loop' || github.sha }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Pin the current official OpenCode package and refresh the lockfile
        id: opencode
        run: |
          set -Eeuo pipefail
          corepack enable
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('package.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          pnpm = document.setdefault('pnpm', {})
          allowed = pnpm.setdefault('onlyBuiltDependencies', [])
          if 'opencode-ai' not in allowed:
              allowed.append('opencode-ai')
          pnpm['onlyBuiltDependencies'] = sorted(set(allowed))
          path.write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')
          PY
          version="$(timeout 60s npm view opencode-ai version --json | jq -r '.')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::OpenCode registry version is not an exact semantic version.'
            exit 1
          fi
          pnpm --filter @life-os/commercial-development-agent add \
            --save-dev \
            --save-exact \
            "opencode-ai@${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Finalize the persistent workflow contract
        env:
          OPENCODE_VERSION: ${{ steps.opencode.outputs.version }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          workflow_path = Path('.github/workflows/opencode-commercial-development.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          placeholder = "OPENCODE_PACKAGE_VERSION: '__PINNED_BY_BOOTSTRAP__'"
          replacement = f"OPENCODE_PACKAGE_VERSION: '{os.environ['OPENCODE_VERSION']}'"
          if placeholder in workflow:
              workflow = workflow.replace(placeholder, replacement, 1)
          elif replacement not in workflow:
              raise SystemExit('OpenCode package-version contract is neither placeholder nor expected exact pin')
          workflow_path.write_text(workflow, encoding='utf-8')

          package_path = Path('packages/commercial-development-agent/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          lint = package['scripts']['lint']
          package['scripts']['lint'] = lint.replace(' "fixtures/**/*.json"', '')
          package_path.write_text(
              json.dumps(package, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Normalize the isolation script's bounded replacement seam
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/finalize-opencode-commercial-agent-isolation.py')
          source = path.read_text(encoding='utf-8')
          old = '''def replace_once(path: Path, old: str, new: str, label: str) -> None:
              """Replace one exact source block or fail before ambiguous mutation."""

              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              path.write_text(source.replace(old, new, 1), encoding="utf-8")
          '''.replace('          ', '')
          new = '''def replace_once(path: Path, old: str, new: str, label: str) -> None:
              """Replace one exact source block or one explicitly bounded model block."""

              source = path.read_text(encoding="utf-8")
              count = source.count(old)
              if count == 1:
                  path.write_text(source.replace(old, new, 1), encoding="utf-8")
                  return
              if label == "isolated OpenCode process" and path == WORKFLOW:
                  start_marker = '          export NVIDIA_API_KEY="$NVIDIA_NIM_API_KEY"\n'
                  end_marker = '          chmod 0600 "$RECEIPT_DIR/opencode.log"\n'
                  start = source.find(start_marker)
                  end = source.find(end_marker, start)
                  if start >= 0 and end >= 0:
                      end += len(end_marker)
                      path.write_text(
                          source[:start] + new + source[end:],
                          encoding="utf-8",
                      )
                      return
              raise SystemExit(f"{label}: expected one match, found {count}")
          '''.replace('          ', '')
          if source.count(old) != 1:
              raise SystemExit('isolation replacement helper did not match reviewed source')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply deterministic bounded contract corrections and hardening tests
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/finalize-opencode-commercial-agent-contracts.py
          python3 .github/scripts/finalize-opencode-commercial-agent-isolation.py
          python3 .github/scripts/finalize-opencode-commercial-agent-quality.py tests

      - name: Prove the least-authority regressions fail before implementation
        run: |
          set +e
          pnpm --filter @life-os/commercial-development-agent exec vitest run \
            src/diff-validator.test.mjs \
            src/workflow-contract.test.mjs \
            --no-file-parallelism
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo '::error::Least-authority regressions unexpectedly passed before implementation.'
            exit 1
          fi

      - name: Apply the least-authority implementation
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/finalize-opencode-commercial-agent-quality.py implementation

      - name: Remove temporary write-capable repair assets
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/scripts/finalize-opencode-commercial-agent.py \
            .github/scripts/finalize-opencode-commercial-agent-contracts.py \
            .github/scripts/finalize-opencode-commercial-agent-isolation.py \
            .github/scripts/finalize-opencode-commercial-agent-quality.py \
            .github/workflows/bootstrap-opencode-commercial-agent.yml \
            .github/workflows/diagnose-opencode-coverage.yml \
            .github/workflows/finalize-opencode-commercial-agent.yml \
            .github/workflows/merge-opencode-commercial-agent-when-ready.yml \
            .github/workflows/repair-opencode-commercial-agent.yml \
            .github/workflows/review-fix-opencode-commercial-agent.yml

      - name: Format and verify the bounded package
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            package.json \
            .github/workflows/opencode-commercial-development.yml \
            packages/commercial-development-agent/package.json \
            packages/commercial-development-agent/vitest.config.mjs \
            packages/commercial-development-agent/src \
            product/opencode-commercial-development-policy.json \
            docs/operations/opencode-commercial-development-loop.md \
            docs/research/2026-08-07-opencode-commercial-development-loop-standards.md \
            docs/superpowers/specs/2026-08-07-opencode-commercial-development-loop-design.md \
            docs/superpowers/plans/2026-08-07-opencode-commercial-development-loop.md
          pnpm --filter @life-os/commercial-development-agent exec opencode --version
          pnpm --filter @life-os/commercial-development-agent exec opencode run --help > /dev/null
          pnpm --filter @life-os/commercial-development-agent lint
          pnpm --filter @life-os/commercial-development-agent test
          pnpm --filter @life-os/commercial-development-agent build

      - name: Commit the exact verified final slice
        if: github.event_name == 'push'
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin refs/heads/feat/opencode-commercial-development-loop | awk '{print $1}')"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo '::error::Feature head moved during final verification.'
            exit 1
          fi
          git rm .github/workflows/finalize-opencode-commercial-agent-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(agent): broker credentials and finalize isolated OpenCode loop'
          git push origin HEAD:feat/opencode-commercial-development-loop
