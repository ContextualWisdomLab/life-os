name: Verify AI Context Canonical Evidence

on:
  push:
    branches:
      - test/ai-context-canonical-evidence-v1
    paths:
      - apps/ai-service/src/ai-http-boundary-canonical-evidence.test.ts
      - apps/ai-service/src/ai-http-boundary.test.ts
      - apps/ai-service/src/ai-http-boundary.ts
      - .github/workflows/verify-ai-context-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-ai-context-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Require exact published semantic descendant
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor "a488d76c14a794423cb74d6fade9db3bbc07ecad" HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          test ! -e .github/workflows/repair-ai-context-canonical-evidence.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/ai-service/src/ai-http-boundary-canonical-evidence.test.ts
          apps/ai-service/src/ai-http-boundary.test.ts
          apps/ai-service/src/ai-http-boundary.ts

      - name: Verify signed identity evidence exactness
        run: >-
          pnpm --filter @life-os/ai-service exec vitest run
          src/ai-http-boundary-canonical-evidence.test.ts
          src/ai-http-boundary.test.ts

      - name: Typecheck AI service
        run: pnpm --filter @life-os/ai-service typecheck

      - name: Run complete AI service suite
        run: pnpm --filter @life-os/ai-service test

      - name: Verify clean exact evidence
        run: git diff --check
