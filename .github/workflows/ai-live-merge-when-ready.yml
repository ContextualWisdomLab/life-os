name: Merge AI Live Conformance When Exact Head Is Ready

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/ai-live-merge-when-ready.yml'

permissions:
  actions: write
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ai-live-conformance-autofinish
  cancel-in-progress: false

jobs:
  verify-clean-wait-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-nim-live-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply any still-pending reviewed corrections
        run: |
          set -Eeuo pipefail
          if grep -Fq 'baseline!.quality.rates' apps/ai-service/src/proposal-quality-live-conformance.ts; then
            python3 .github/scripts/apply-ai-live-review-fixes.py
            python3 .github/scripts/augment-ai-live-review-fixes.py
            sed -i \
              's/JSON.stringify(await noProviderReport())/JSON.stringify(await validReport())/' \
              apps/ai-service/src/proposal-quality-live-final-coverage.test.ts
          fi

      - name: Format exact reviewed source and evidence
        run: |
          pnpm exec prettier --single-quote --write \
            AGENTS.md \
            CLAUDE.md \
            ARCHITECTURE.md \
            CHANGELOG.md \
            product/capabilities.json \
            .github/workflows/ai-proposal-live-conformance.yml \
            apps/ai-service/package.json \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/contextual-orchestrator-proposal-model.ts \
            apps/ai-service/src/contextual-orchestrator-proposal-contract.test.ts \
            apps/ai-service/src/proposal-quality-live-command.ts \
            apps/ai-service/src/proposal-quality-live-command.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-conformance.test.ts \
            apps/ai-service/src/proposal-quality-live-coverage.test.ts \
            apps/ai-service/src/proposal-quality-live-final-coverage.test.ts \
            apps/ai-service/src/proposal-quality-live-null-baseline.test.ts \
            apps/ai-service/src/proposal-quality-live-validation-regression.test.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts \
            docs/superpowers/plans/2026-08-06-ai-nim-live-conformance.md \
            docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md

      - name: Verify complete source, documentation, coverage, build, and readiness
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test
          pnpm --filter @life-os/ai-service build
          pnpm --filter @life-os/commercial-readiness test

      - name: Publish a clean exact head without temporary automation
        id: publish
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/apply-ai-live-review-fixes.yml \
            .github/workflows/apply-ai-live-review-fixes-v2.yml \
            .github/workflows/apply-ai-live-review-fixes-v3.yml \
            .github/workflows/apply-ai-live-review-fixes-v4.yml \
            .github/workflows/finalize-ai-live-review-gate.yml \
            .github/workflows/trigger-commercial-readiness-after-ai.yml \
            .github/workflows/trigger-commercial-readiness-after-ai-v2.yml \
            .github/workflows/ai-live-review-autofinish.yml \
            .github/workflows/ai-live-merge-when-ready.yml \
            .github/scripts/apply-ai-live-review-fixes.py \
            .github/scripts/augment-ai-live-review-fixes.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ai): publish clean exact-head live conformance evidence'
            git push origin HEAD:feat/ai-nim-live-conformance
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve review threads addressed by the verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for thread_id in \
            PRRT_kwDOTq3wqs6W7zrL \
            PRRT_kwDOTq3wqs6W7zrO \
            PRRT_kwDOTq3wqs6W7zrU \
            PRRT_kwDOTq3wqs6W7zrW \
            PRRT_kwDOTq3wqs6W7zrZ \
            PRRT_kwDOTq3wqs6W7zra \
            PRRT_kwDOTq3wqs6W7zre \
            PRRT_kwDOTq3wqs6W7zrj \
            PRRT_kwDOTq3wqs6W7zrm; do
            gh api graphql \
              -f query='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{id isResolved}}}' \
              -f threadId="$thread_id" >/dev/null
          done

      - name: Request CodeRabbit review on the clean exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/ContextualWisdomLab/life-os/issues/117/comments \
            -f body='@coderabbitai review' >/dev/null

      - name: Wait for exact-head required gates and merge without bypass
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.publish.outputs.head_sha }}
        run: |
          set -Eeuo pipefail
          repository='ContextualWisdomLab/life-os'
          for _ in $(seq 1 115); do
            state="$(gh api "repos/${repository}/pulls/117" --jq '.state')"
            if [ "$state" != 'open' ]; then
              exit 0
            fi
            current_head="$(gh api "repos/${repository}/pulls/117" --jq '.head.sha')"
            if [ "$current_head" != "$EXPECTED_HEAD" ]; then
              echo '::error::Pull request head changed after exact-head verification.'
              exit 1
            fi
            unresolved="$(gh api graphql \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}' \
              -f owner='ContextualWisdomLab' \
              -f name='life-os' \
              -F number=117 \
              --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
            required_not_successful="$(
              gh pr checks 117 \
                --repo "$repository" \
                --required \
                --json state \
                --jq '[.[] | select(.state != "SUCCESS" and .state != "NEUTRAL" and .state != "SKIPPED")] | length' \
                2>/dev/null || echo 1
            )"
            coderabbit="$(gh api "repos/${repository}/commits/${EXPECTED_HEAD}/status" \
              --jq '[.statuses[] | select(.context == "CodeRabbit" and .state == "success")] | length')"
            changes_requested="$(gh api "repos/${repository}/pulls/117/reviews?per_page=100" \
              --jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length')"
            if [ "$unresolved" = '0' ] && [ "$required_not_successful" = '0' ] && [ "$coderabbit" != '0' ] && [ "$changes_requested" = '0' ]; then
              merged="$(gh api \
                --method PUT \
                "repos/${repository}/pulls/117/merge" \
                -f merge_method='squash' \
                -f sha="$EXPECTED_HEAD" \
                --jq '.merged')"
              if [ "$merged" = 'true' ]; then
                exit 0
              fi
            fi
            sleep 60
          done
          echo '::error::Exact-head merge gate did not become eligible within the bounded wait.'
          exit 1
