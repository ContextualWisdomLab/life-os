name: Verify Planning Context Canonical Evidence

on:
  push:
    branches:
      - test/planning-context-canonical-evidence-v1
    paths:
      - apps/planning-service/src/http-boundary.ts
      - apps/planning-service/src/planning-context-canonical-evidence.test.ts
      - apps/planning-service/src/planning-data-rights-http-boundary.ts
      - apps/planning-service/src/planning-data-rights-canonical-evidence.test.ts
      - .github/workflows/verify-planning-context-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-planning-context-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact formatter publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          test ! -e .github/workflows/repair-planning-context-canonical-evidence-formatting.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/planning-service/src/http-boundary.ts
          apps/planning-service/src/planning-context-canonical-evidence.test.ts
          apps/planning-service/src/planning-data-rights-http-boundary.ts
          apps/planning-service/src/planning-data-rights-canonical-evidence.test.ts
          .github/workflows/verify-planning-context-canonical-evidence.yml

      - name: Reproduce Planning canonical signed-evidence regressions
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/planning-context-canonical-evidence.test.ts
          src/planning-data-rights-canonical-evidence.test.ts

      - name: Typecheck Planning package
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run complete Planning suite
        run: pnpm --filter @life-os/planning-service test
