name: Finalize AI context coverage repair

on:
  push:
    branches:
      - feat/ai-authenticated-gateway-context

permissions: {}

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ai-authenticated-gateway-context
          fetch-depth: 0
          persist-credentials: false

      - name: Complete exact AI context coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          boundary_path = Path('apps/ai-service/src/ai-http-boundary.ts')
          boundary = boundary_path.read_text(encoding='utf-8')
          redundant_constant = """const CANONICAL_UUID_V4_PATTERN =
  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;
"""
          redundant_guard = """  if (proposalId && !CANONICAL_UUID_V4_PATTERN.test(proposalId)) {
    return invalidGatewayContext();
  }
"""
          if boundary.count(redundant_constant) != 1 or boundary.count(redundant_guard) != 1:
              raise SystemExit('canonical path guard pattern mismatch')
          boundary = boundary.replace(redundant_constant, '', 1)
          boundary = boundary.replace(redundant_guard, '', 1)
          boundary_path.write_text(boundary, encoding='utf-8')

          test_path = Path('apps/ai-service/src/ai-http-boundary.test.ts')
          test = test_path.read_text(encoding='utf-8')
          anchor = """  it.each([
    {
      method: 'GET',
      path: '/v1/proposals',
      signature: signContext({ method: 'POST' }),
"""
          addition = """  it('rejects a noncanonical base64url spelling of a 32-byte signature', () => {
    const alphabet =
      'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
    const canonical = signContext();
    const finalIndex = alphabet.indexOf(canonical[canonical.length - 1]);
    expect(finalIndex).toBeGreaterThanOrEqual(0);
    expect(finalIndex % 4).toBe(0);
    const alternateFinalCharacter = alphabet[finalIndex + 1];
    expect(alternateFinalCharacter).toBeDefined();
    const noncanonical = `${canonical.slice(0, -1)}${alternateFinalCharacter}`;

    expectProblem(
      () =>
        requireTrustedAiContext(
          contextHeaders({ signature: noncanonical }),
          GATEWAY_SECRET,
          'POST',
          '/v1/proposals',
          NOW_SECONDS,
        ),
      {
        title: 'Trusted gateway context is invalid',
        status: 401,
        code: 'invalid_gateway_context',
      },
    );
  });

"""
          if test.count(anchor) != 1:
              raise SystemExit('signature replay test anchor mismatch')
          test_path.write_text(test.replace(anchor, addition + anchor, 1), encoding='utf-8')

          Path('.github/workflows/ai-quality-gateway-compat-repair.yml').unlink()
          PY

      - name: Verify AI service
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/ai-http-boundary.ts \
            apps/ai-service/src/ai-http-boundary.test.ts
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test

      - name: Commit final coverage repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A \
            apps/ai-service/src/ai-http-boundary.ts \
            apps/ai-service/src/ai-http-boundary.test.ts \
            .github/workflows/ai-quality-gateway-compat-repair.yml
          git diff --cached --check
          git commit -m 'test(ai): close trusted context coverage gaps'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-authenticated-gateway-context
