name: Verify plugin delivery attempt claim hostile boundary

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-claim-lease-v1
    paths:
      - 'apps/integration-service/src/plugin-delivery-attempt-claim-repository.ts'
      - 'apps/integration-service/src/plugin-delivery-attempt-claim-repository.test.ts'
      - '.github/workflows/verify-plugin-delivery-attempt-claim-hostile-boundary.yml'

permissions:
  contents: read

concurrency:
  group: life-os-plugin-delivery-attempt-claim-hostile-boundary
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_integration
          POSTGRES_USER: life_os
          POSTGRES_PASSWORD: life_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os -d life_os_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://life_os:life_os_test@127.0.0.1:5432/life_os_integration?sslmode=disable
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build Plugin SDK runtime entry
        run: pnpm --filter @life-os/plugin-sdk build
      - name: Check bounded source formatting
        run: pnpm exec prettier --single-quote --check apps/integration-service/src/plugin-delivery-attempt-claim-repository.ts apps/integration-service/src/plugin-delivery-attempt-claim-repository.test.ts
      - name: Check diff hygiene
        run: git diff --check HEAD^ HEAD
      - name: Run focused hostile-boundary acceptance
        run: pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-attempt-claim-repository.test.ts --no-file-parallelism
      - name: Run real PostgreSQL claim acceptance
        run: pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-attempt-claim.integration.test.ts --no-file-parallelism
      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck
      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test
