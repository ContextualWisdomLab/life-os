name: Repair PR264 Review asOf evidence fence

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: repair-pr264-review-asof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.number == 264 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/habit-review-period-projection-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove the asOf regression is RED before source repair
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          pnpm --filter @life-os/habit-service exec vitest run \
            src/habit-review-evidence-contract.test.ts \
            -t 'does not attribute completion evidence recorded after the advertised asOf instant' \
            2>&1 | tee /tmp/review-asof-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected the asOf hostile regression to fail before repair.' >&2
            exit 1
          fi
          grep -F 'expected [ { …(3) } ] to deeply equal []' /tmp/review-asof-red.log >/dev/null || \
            grep -F 'does not attribute completion evidence recorded after the advertised asOf instant' /tmp/review-asof-red.log >/dev/null

      - name: Apply the bounded Habit-owned asOf evidence fence
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text: str, label: str, old: str, new: str) -> None:
              path = Path(path_text)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_text}: {label}: expected 1 anchor, found {count}')
              path.write_text(text.replace(old, new, 1))

          domain = 'apps/habit-service/src/habit-domain.ts'
          replace_once(
              domain,
              'repository interface asOf parameter',
              """  readReviewWeekEvidence(\n    workspaceId: string,\n    periodStartDate: string,\n    periodEndDate: string,\n    maximumHabits: number,\n  ): Promise<HabitReviewWeekEvidence>;\n""",
              """  readReviewWeekEvidence(\n    workspaceId: string,\n    periodStartDate: string,\n    periodEndDate: string,\n    maximumHabits: number,\n    asOf: string,\n  ): Promise<HabitReviewWeekEvidence>;\n""",
          )
          replace_once(
              domain,
              'in-memory signature and timestamp validation',
              """  async readReviewWeekEvidence(\n    workspaceId: string,\n    periodStartDate: string,\n    periodEndDate: string,\n    maximumHabits: number,\n  ): Promise<HabitReviewWeekEvidence> {\n    const periodStart = parseLocalDate(periodStartDate);\n""",
              """  async readReviewWeekEvidence(\n    workspaceId: string,\n    periodStartDate: string,\n    periodEndDate: string,\n    maximumHabits: number,\n    asOf: string,\n  ): Promise<HabitReviewWeekEvidence> {\n    const safeAsOf = requireTimestamp(asOf);\n    const periodStart = parseLocalDate(periodStartDate);\n""",
          )
          replace_once(
              domain,
              'in-memory habit creation fence',
              """    const habits = (await this.listHabits(workspaceId)).slice(\n      0,\n      maximumHabits + 1,\n    );\n""",
              """    const habits = (await this.listHabits(workspaceId))\n      .filter((habit) => requireTimestamp(habit.createdAt) <= safeAsOf)\n      .slice(0, maximumHabits + 1);\n""",
          )
          replace_once(
              domain,
              'in-memory completion recording fence',
              """        completion.workspaceId !== workspaceId ||\n        !habitIds.has(completion.habitId) ||\n        completion.scheduledLocalDate < periodStart.text ||\n""",
              """        completion.workspaceId !== workspaceId ||\n        !habitIds.has(completion.habitId) ||\n        requireTimestamp(completion.recordedAt) > safeAsOf ||\n        completion.scheduledLocalDate < periodStart.text ||\n""",
          )
          replace_once(
              domain,
              'service captures asOf before persistence read',
              """    const periodEndDate = localDateFromEpochDay(\n      periodStart.epochDay + REVIEW_WEEK_DAYS - 1,\n    ).text;\n    const evidence = await this.repository.readReviewWeekEvidence(\n""",
              """    const periodEndDate = localDateFromEpochDay(\n      periodStart.epochDay + REVIEW_WEEK_DAYS - 1,\n    ).text;\n    const asOf = requireTimestamp(this.projectionClock());\n    const evidence = await this.repository.readReviewWeekEvidence(\n""",
          )
          replace_once(
              domain,
              'service passes same asOf to persistence',
              """      periodEndDate,\n      MAXIMUM_REVIEW_PROJECTION_HABITS,\n    );\n""",
              """      periodEndDate,\n      MAXIMUM_REVIEW_PROJECTION_HABITS,\n      asOf,\n    );\n""",
          )
          replace_once(
              domain,
              'projection returns captured asOf',
              """      asOf: requireTimestamp(this.projectionClock()),\n""",
              """      asOf,\n""",
          )

          postgres = 'apps/habit-service/src/postgres-habit-repository.ts'
          replace_once(
              postgres,
              'postgres signature and timestamp validation',
              """  async readReviewWeekEvidence(\n    workspaceId: string,\n    periodStartDate: string,\n    periodEndDate: string,\n    maximumHabits: number,\n  ): Promise<HabitReviewWeekEvidence> {\n    const safeWorkspaceId = requireUuidV4(workspaceId);\n    const safePeriodStartDate = requireLocalDate(periodStartDate);\n    const safePeriodEndDate = requireLocalDate(periodEndDate);\n""",
              """  async readReviewWeekEvidence(\n    workspaceId: string,\n    periodStartDate: string,\n    periodEndDate: string,\n    maximumHabits: number,\n    asOf: string,\n  ): Promise<HabitReviewWeekEvidence> {\n    const safeWorkspaceId = requireUuidV4(workspaceId);\n    const safePeriodStartDate = requireLocalDate(periodStartDate);\n    const safePeriodEndDate = requireLocalDate(periodEndDate);\n    const safeAsOf = requireTimestamp(asOf);\n""",
          )
          replace_once(
              postgres,
              'postgres habit creation fence',
              """         WHERE workspace_id = $1\n         ORDER BY created_at ASC, id ASC\n         LIMIT $4\n""",
              """         WHERE workspace_id = $1\n           AND created_at <= $4::timestamptz\n         ORDER BY created_at ASC, id ASC\n         LIMIT $5\n""",
          )
          replace_once(
              postgres,
              'postgres completion recording fence',
              """           AND scheduled_local_date BETWEEN $2::date AND $3::date\n         ORDER BY scheduled_local_date ASC, recorded_at ASC, id ASC\n""",
              """           AND scheduled_local_date BETWEEN $2::date AND $3::date\n           AND recorded_at <= $4::timestamptz\n         ORDER BY scheduled_local_date ASC, recorded_at ASC, id ASC\n""",
          )
          replace_once(
              postgres,
              'postgres query values',
              """        safePeriodEndDate,\n        queryLimit,\n""",
              """        safePeriodEndDate,\n        safeAsOf,\n        queryLimit,\n""",
          )

          contract = Path('apps/habit-service/src/habit-review-evidence-contract.test.ts')
          text = contract.read_text()
          if text.count("        100,\n      ),") != 3:
              raise SystemExit('contract test: expected three 100-bound call anchors')
          text = text.replace("        100,\n      ),", "        100,\n        AS_OF,\n      ),")
          if text.count("        0,\n      ),") != 1:
              raise SystemExit('contract test: expected one invalid-bound call anchor')
          text = text.replace("        0,\n      ),", "        0,\n        AS_OF,\n      ),", 1)
          old_reflect = """    const evidence = await Reflect.apply(\n      repository.readReviewWeekEvidence,\n      repository,\n      [WORKSPACE_ID, '2026-09-07', '2026-09-13', 100, AS_OF],\n    );\n"""
          new_direct = """    const evidence = await repository.readReviewWeekEvidence(\n      WORKSPACE_ID,\n      '2026-09-07',\n      '2026-09-13',\n      100,\n      AS_OF,\n    );\n"""
          if text.count(old_reflect) != 1:
              raise SystemExit('contract test: expected regression call anchor once')
          contract.write_text(text.replace(old_reflect, new_direct, 1))

          projection = 'apps/habit-service/src/habit-review-projection.test.ts'
          replace_once(
              projection,
              'duplicate-evidence repository signature',
              """    periodEndDate: string,\n    maximumHabits: number,\n  ) {\n    const evidence = await super.readReviewWeekEvidence(\n      workspaceId,\n      periodStartDate,\n      periodEndDate,\n      maximumHabits,\n    );\n""",
              """    periodEndDate: string,\n    maximumHabits: number,\n    asOf: string,\n  ) {\n    const evidence = await super.readReviewWeekEvidence(\n      workspaceId,\n      periodStartDate,\n      periodEndDate,\n      maximumHabits,\n      asOf,\n    );\n""",
          )

          postgres_test = Path('apps/habit-service/src/habit-review-projection-postgres.test.ts')
          text = postgres_test.read_text()
          anchor = "const OTHER_HABIT_ID = 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';\n"
          if text.count(anchor) != 1:
              raise SystemExit('postgres test: expected constant anchor once')
          text = text.replace(anchor, anchor + "const AS_OF = '2026-09-13T23:59:59.000Z';\n", 1)
          helper_old = """  return await repository.readReviewWeekEvidence(\n    WORKSPACE_ID,\n    '2026-09-07',\n    '2026-09-13',\n    100,\n  );\n"""
          helper_new = """  return await repository.readReviewWeekEvidence(\n    WORKSPACE_ID,\n    '2026-09-07',\n    '2026-09-13',\n    100,\n    AS_OF,\n  );\n"""
          if text.count(helper_old) != 1:
              raise SystemExit('postgres test: expected readEvidence helper anchor once')
          text = text.replace(helper_old, helper_new, 1)
          direct_old = """    const evidence = await repository.readReviewWeekEvidence(\n      WORKSPACE_ID,\n      '2026-09-07',\n      '2026-09-13',\n      100,\n    );\n"""
          direct_new = """    const evidence = await repository.readReviewWeekEvidence(\n      WORKSPACE_ID,\n      '2026-09-07',\n      '2026-09-13',\n      100,\n      AS_OF,\n    );\n"""
          if text.count(direct_old) != 1:
              raise SystemExit('postgres test: expected primary read anchor once')
          text = text.replace(direct_old, direct_new, 1)
          if text.count("        100,\n      ),") != 2:
              raise SystemExit('postgres test: expected two nested 100-bound anchors')
          text = text.replace("        100,\n      ),", "        100,\n        AS_OF,\n      ),")
          if text.count("        0,\n      ),") != 1:
              raise SystemExit('postgres test: expected one invalid-bound anchor')
          text = text.replace("        0,\n      ),", "        0,\n        AS_OF,\n      ),", 1)
          old_values = """    expect(client.calls[0]?.values).toEqual([\n      WORKSPACE_ID,\n      '2026-09-07',\n      '2026-09-13',\n      101,\n    ]);\n    expect(client.calls[0]?.text).toContain('LIMIT $4');\n"""
          new_values = """    expect(client.calls[0]?.values).toEqual([\n      WORKSPACE_ID,\n      '2026-09-07',\n      '2026-09-13',\n      AS_OF,\n      101,\n    ]);\n    expect(client.calls[0]?.text).toContain('LIMIT $5');\n    expect(client.calls[0]?.text).toContain(\n      'created_at <= $4::timestamptz',\n    );\n    expect(client.calls[0]?.text).toContain(\n      'recorded_at <= $4::timestamptz',\n    );\n"""
          if text.count(old_values) != 1:
              raise SystemExit('postgres test: expected SQL value assertion anchor once')
          postgres_test.write_text(text.replace(old_values, new_values, 1))
          PY

          pnpm exec prettier --write \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/habit-review-evidence-contract.test.ts \
            apps/habit-service/src/habit-review-projection-postgres.test.ts \
            apps/habit-service/src/habit-review-projection.test.ts \
            apps/habit-service/src/postgres-habit-repository.ts

      - name: Check bounded source formatting
        run: >-
          pnpm exec prettier --check
          apps/habit-service/src/habit-domain.ts
          apps/habit-service/src/habit-review-evidence-contract.test.ts
          apps/habit-service/src/habit-review-projection-postgres.test.ts
          apps/habit-service/src/habit-review-projection.test.ts
          apps/habit-service/src/postgres-habit-repository.ts

      - name: Typecheck Habit service
        run: pnpm --filter @life-os/habit-service typecheck

      - name: Run Review evidence contract regressions
        run: pnpm --filter @life-os/habit-service exec vitest run src/habit-review-evidence-contract.test.ts

      - name: Run Review projection regressions
        run: pnpm --filter @life-os/habit-service exec vitest run src/habit-review-projection.test.ts

      - name: Run PostgreSQL Review projection regressions
        run: pnpm --filter @life-os/habit-service exec vitest run src/habit-review-projection-postgres.test.ts

      - name: Run full Habit service tests
        run: pnpm --filter @life-os/habit-service test

      - name: Build Habit service
        run: pnpm --filter @life-os/habit-service build

      - name: Retire writer and publish ordinary descendant
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          rm .github/workflows/repair-pr264-review-asof.yml
          git diff --check

          mapfile -t changed < <(git diff --name-only HEAD | sort)
          expected=(
            '.github/workflows/repair-pr264-review-asof.yml'
            'apps/habit-service/src/habit-domain.ts'
            'apps/habit-service/src/habit-review-evidence-contract.test.ts'
            'apps/habit-service/src/habit-review-projection-postgres.test.ts'
            'apps/habit-service/src/habit-review-projection.test.ts'
            'apps/habit-service/src/postgres-habit-repository.ts'
          )
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'Unexpected changed paths: %s\n' "${changed[*]}" >&2
            exit 1
          fi

          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          if [ "$remote_sha" != "$INPUT_SHA" ]; then
            echo 'Contributor head moved; refusing stale publication.' >&2
            exit 1
          fi

          git config user.name 'LifeOS repair writer'
          git config user.email 'lifeos-repair-writer@users.noreply.github.com'
          git add \
            .github/workflows/repair-pr264-review-asof.yml \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/habit-review-evidence-contract.test.ts \
            apps/habit-service/src/habit-review-projection-postgres.test.ts \
            apps/habit-service/src/habit-review-projection.test.ts \
            apps/habit-service/src/postgres-habit-repository.ts
          git commit -m 'fix(habit): bind Review evidence to asOf'
          git push origin "HEAD:${HEAD_REF}"
