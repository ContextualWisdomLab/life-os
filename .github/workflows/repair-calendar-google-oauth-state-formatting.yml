name: Repair Calendar Google OAuth State Formatting

on:
  push:
    branches:
      - feat/calendar-google-oauth-state-v1
    paths:
      - .github/workflows/repair-calendar-google-oauth-state-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-calendar-google-oauth-state-formatting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained regression ancestry and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "127ecc2c0410e96e9f74cdb254452341eac9d4ef" HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove focused formatting RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec prettier --single-quote --check \
            apps/integration-calendar-service/src/calendar-google-oauth-authorization.ts \
            apps/integration-calendar-service/src/calendar-google-oauth-state-canonicality.test.ts; then
            echo 'Expected retained Calendar OAuth-state files to be noncanonical before repair.' >&2
            exit 1
          fi

      - name: Apply bounded formatter repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            apps/integration-calendar-service/src/calendar-google-oauth-authorization.ts \
            apps/integration-calendar-service/src/calendar-google-oauth-state-canonicality.test.ts
          git rm .github/workflows/repair-calendar-google-oauth-state-formatting.yml

      - name: Diagnose Calendar typecheck after formatting
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @life-os/integration-calendar-service exec tsc --noEmit --pretty false 2>&1 | tee /tmp/calendar-typecheck.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            echo 'Calendar typecheck failed after the bounded formatting repair.' >&2
            echo 'Compiler output bytes:' >&2
            wc -c /tmp/calendar-typecheck.log >&2
            exit "${status}"
          fi

      - name: Verify bounded repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/integration-calendar-service/src/calendar-google-oauth-authorization.ts \
            apps/integration-calendar-service/src/calendar-google-oauth-state-canonicality.test.ts
          git diff --check
          source_delta="$(git diff --name-only HEAD -- \
            apps/integration-calendar-service/src/calendar-google-oauth-authorization.ts \
            apps/integration-calendar-service/src/calendar-google-oauth-state-canonicality.test.ts | LC_ALL=C sort)"
          test -n "${source_delta}"
          allowed_sources="$(printf '%s\n' \
            'apps/integration-calendar-service/src/calendar-google-oauth-authorization.ts' \
            'apps/integration-calendar-service/src/calendar-google-oauth-state-canonicality.test.ts' | LC_ALL=C sort)"
          unexpected_sources="$(comm -23 \
            <(printf '%s\n' "${source_delta}") \
            <(printf '%s\n' "${allowed_sources}"))"
          test -z "${unexpected_sources}"
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-calendar-google-oauth-state-formatting.yml' \
            ${source_delta} | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/integration-calendar-service/src/calendar-google-oauth-authorization.ts apps/integration-calendar-service/src/calendar-google-oauth-state-canonicality.test.ts
          git commit -m 'style(calendar): format OAuth state canonicality evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
