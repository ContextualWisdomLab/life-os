name: Apply AI Live Conformance Review Fixes

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/apply-ai-live-review-fixes.yml'

permissions:
  contents: write

concurrency:
  group: apply-ai-live-review-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact triggering head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply reviewed corrections
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            .github/scripts/apply-ai-live-review-fixes.py \
            .github/scripts/augment-ai-live-review-fixes.py
          python3 .github/scripts/apply-ai-live-review-fixes.py
          python3 .github/scripts/augment-ai-live-review-fixes.py
          sed -i \
            's/JSON.stringify(await noProviderReport())/JSON.stringify(await validReport())/' \
            apps/ai-service/src/proposal-quality-live-final-coverage.test.ts

      - name: Format reviewed corrections
        run: |
          pnpm exec prettier --single-quote --write \
            AGENTS.md \
            .github/workflows/ai-proposal-live-conformance.yml \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/contextual-orchestrator-proposal-model.ts \
            apps/ai-service/src/contextual-orchestrator-proposal-contract.test.ts \
            apps/ai-service/src/proposal-quality-live-command.ts \
            apps/ai-service/src/proposal-quality-live-command.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-conformance.test.ts \
            apps/ai-service/src/proposal-quality-live-coverage.test.ts \
            apps/ai-service/src/proposal-quality-live-final-coverage.test.ts \
            apps/ai-service/src/proposal-quality-live-null-baseline.test.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts \
            docs/superpowers/plans/2026-08-06-ai-nim-live-conformance.md \
            docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md

      - name: Run focused review regressions
        run: |
          pnpm --filter @life-os/ai-service exec vitest run \
            src/contextual-orchestrator-live-model.test.ts \
            src/contextual-orchestrator-proposal-contract.test.ts \
            src/proposal-quality-live-command.test.ts \
            src/proposal-quality-live-conformance.test.ts \
            src/proposal-quality-live-null-baseline.test.ts \
            src/proposal-quality-live-workflow.test.ts \
            --no-file-parallelism

      - name: Remove temporary repair machinery
        run: |
          rm -f \
            .github/scripts/apply-ai-live-review-fixes.py \
            .github/scripts/augment-ai-live-review-fixes.py \
            .github/workflows/apply-ai-live-review-fixes.yml

      - name: Commit and push from the exact unchanged branch head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin refs/heads/feat/ai-nim-live-conformance | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai): resolve live conformance review findings'

          remote_head="$(git ls-remote origin refs/heads/feat/ai-nim-live-conformance | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD_SHA"
          git push \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:feat/ai-nim-live-conformance
