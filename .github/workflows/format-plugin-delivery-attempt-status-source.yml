name: Format plugin delivery attempt status source

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-status-v1

permissions:
  contents: write

concurrency:
  group: format-plugin-delivery-attempt-status-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonicalize only status production source and retire formatter
        shell: bash
        run: |
          set -euo pipefail
          first='apps/integration-service/src/plugin-delivery-attempt-status.ts'
          second='apps/integration-service/src/plugin-delivery-attempt-status-repository.ts'
          workflow='.github/workflows/format-plugin-delivery-attempt-status-source.yml'
          pnpm exec prettier --single-quote --write "$first" "$second"
          mapfile -t changed < <(git diff --name-only | sort)
          expected=("$second" "$first")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${changed[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Unexpected formatting delta:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
          git diff --check
          git rm "$workflow"
          git add "$first" "$second"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(integration): canonicalize delivery status source'
          git fetch origin refs/heads/feat/plugin-delivery-attempt-status-v1
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_head" != "${GITHUB_SHA}" ]]; then
            echo "Branch advanced from ${GITHUB_SHA} to ${remote_head}; refusing stale publication" >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/feat/plugin-delivery-attempt-status-v1
