name: Verify Node24 Checkout Env Authority

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout exact regression source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: 0a7fdba2b7279842c40e5d454b716fca10dd8dba
          path: _checkout_env_regression

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove sibling-mapping regression RED then current repair GREEN
        shell: bash
        run: |
          set -Eeuo pipefail
          test_path='packages/commercial-development-agent/src/node24-actions-contract.test.mjs'
          regression_path="_checkout_env_regression/${test_path}"
          current_copy="${RUNNER_TEMP}/node24-actions-contract.current.mjs"
          regression_log="${RUNNER_TEMP}/node24-actions-contract.regression.log"
          cp "$test_path" "$current_copy"
          cp "$regression_path" "$test_path"

          set +e
          pnpm --filter @life-os/commercial-development-agent exec vitest run \
            src/node24-actions-contract.test.mjs --no-file-parallelism \
            2>&1 | tee "$regression_log"
          red_status=${PIPESTATUS[0]}
          set -e

          cp "$current_copy" "$test_path"
          if (( red_status == 0 )); then
            echo '::error::Regression source unexpectedly accepted sibling-mapping Git config authority.'
            exit 1
          fi
          grep -F 'rejects checkout Git config authority borrowed from a sibling mapping' \
            "$regression_log" >/dev/null
          grep -F 'expected [Function] to throw an error' "$regression_log" >/dev/null

          pnpm --filter @life-os/commercial-development-agent exec vitest run \
            src/node24-actions-contract.test.mjs --no-file-parallelism
          git diff --exit-code -- "$test_path"
