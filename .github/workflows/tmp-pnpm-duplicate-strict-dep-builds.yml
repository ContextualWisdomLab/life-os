name: Temporary pnpm duplicate strictDepBuilds diagnostic

on:
  push:
    branches:
      - fix/pnpm-esbuild-build-script-policy-v1
    paths:
      - .github/workflows/tmp-pnpm-duplicate-strict-dep-builds.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Probe duplicate strictDepBuilds parsing
        shell: bash
        run: |
          corepack enable
          tmp="$(mktemp -d)"
          cat >"$tmp/package.json" <<'JSON'
          {"name":"pnpm-duplicate-strict-probe","private":true,"packageManager":"pnpm@10.15.0"}
          JSON
          cat >"$tmp/pnpm-workspace.yaml" <<'YAML'
          packages:
            - .
          strictDepBuilds: true
          strictDepBuilds: false
          YAML
          set +e
          output="$(pnpm -C "$tmp" install --lockfile-only 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          printf 'duplicate-strict-exit=%s\n' "$status"
          if [ "$status" -eq 0 ]; then
            echo 'RED: pnpm accepted conflicting duplicate strictDepBuilds declarations' >&2
            exit 1
          fi
          echo 'GREEN: pnpm rejected the conflicting duplicate mapping before installation authority could be weakened'