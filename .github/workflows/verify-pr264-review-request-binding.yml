name: Repair PR264 Review request binding

on:
  push:
    branches:
      - feat/habit-review-period-projection-v1

permissions:
  contents: write

concurrency:
  group: repair-pr264-review-request-binding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonicalize bounded Habit source and regression
        run: >-
          pnpm exec prettier --write
          apps/habit-service/src/habit-request-bound-context.ts
          apps/habit-service/src/habit-review-projection-http.test.ts
          apps/habit-service/src/main.ts

      - name: Verify bounded Habit formatting
        run: >-
          pnpm exec prettier --check
          apps/habit-service/src/habit-request-bound-context.ts
          apps/habit-service/src/habit-review-projection-http.test.ts
          apps/habit-service/src/main.ts

      - name: Typecheck Habit service
        run: pnpm --filter @life-os/habit-service typecheck

      - name: Run server-observed Review request binding regression
        run: >-
          pnpm --filter @life-os/habit-service exec vitest run
          src/habit-review-projection-http.test.ts
          --no-file-parallelism

      - name: Run full Habit test suite
        run: pnpm --filter @life-os/habit-service test

      - name: Build Habit service
        run: pnpm --filter @life-os/habit-service build

      - name: Retire purpose workflow and verify bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/verify-pr264-review-request-binding.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          allowed='^(apps/habit-service/src/habit-request-bound-context\.ts|apps/habit-service/src/habit-review-projection-http\.test\.ts|apps/habit-service/src/main\.ts|\.github/workflows/verify-pr264-review-request-binding\.yml)$'
          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "::error::Unexpected candidate path: $path"
              exit 1
            fi
          done
          test ! -e .github/workflows/verify-pr264-review-request-binding.yml

      - name: Publish verified ordinary descendant
        env:
          TARGET_BRANCH: feat/habit-review-period-projection-v1
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          remote_head="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Remote head moved from input $GITHUB_SHA to $remote_head; refusing to publish."
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/habit-service/src/habit-request-bound-context.ts \
            apps/habit-service/src/habit-review-projection-http.test.ts \
            apps/habit-service/src/main.ts \
            .github/workflows/verify-pr264-review-request-binding.yml
          git commit -m "fix(habit): verify observed Review request authority"
          git push origin "HEAD:${TARGET_BRANCH}"
