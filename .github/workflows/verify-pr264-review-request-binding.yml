name: Verify PR264 Review request binding

on:
  push:
    branches:
      - feat/habit-review-period-projection-v1

permissions:
  contents: read

concurrency:
  group: verify-pr264-review-request-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Run server-observed Review request binding regression
        run: >-
          pnpm --filter @life-os/habit-service exec vitest run
          src/habit-review-projection-http.test.ts
          --no-file-parallelism
