name: Verify PR264 Review request binding

on:
  push:
    branches:
      - feat/habit-review-period-projection-v1

permissions:
  contents: read

concurrency:
  group: verify-pr264-review-request-binding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check request-bound context formatting
        run: pnpm exec prettier --check apps/habit-service/src/habit-request-bound-context.ts
        continue-on-error: true
        id: context_format

      - name: Check Review HTTP regression formatting
        run: pnpm exec prettier --check apps/habit-service/src/habit-review-projection-http.test.ts
        continue-on-error: true
        id: test_format

      - name: Check Habit controller formatting
        run: pnpm exec prettier --check apps/habit-service/src/main.ts
        continue-on-error: true
        id: controller_format

      - name: Enforce bounded Habit formatting
        env:
          CONTEXT_FORMAT: ${{ steps.context_format.outcome }}
          TEST_FORMAT: ${{ steps.test_format.outcome }}
          CONTROLLER_FORMAT: ${{ steps.controller_format.outcome }}
        run: |
          set -euo pipefail
          printf 'context=%s test=%s controller=%s\n' "$CONTEXT_FORMAT" "$TEST_FORMAT" "$CONTROLLER_FORMAT"
          test "$CONTEXT_FORMAT" = success
          test "$TEST_FORMAT" = success
          test "$CONTROLLER_FORMAT" = success

      - name: Typecheck Habit service
        run: pnpm --filter @life-os/habit-service typecheck

      - name: Run server-observed Review request binding regression
        run: >-
          pnpm --filter @life-os/habit-service exec vitest run
          src/habit-review-projection-http.test.ts
          --no-file-parallelism

      - name: Run full Habit test suite
        run: pnpm --filter @life-os/habit-service test

      - name: Build Habit service
        run: pnpm --filter @life-os/habit-service build

      - name: Verify diff hygiene
        run: git diff --check HEAD~1 HEAD
