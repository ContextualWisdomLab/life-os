name: Prepare OpenCode commercial security commit

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/prepare-opencode-commercial-security-commit.yml

permissions:
  contents: read

concurrency:
  group: prepare-opencode-commercial-security-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/opencode-commercial-development-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Build, validate, and identify hardened workflow blob
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail
          readonly expected_branch='feat/opencode-commercial-development-loop'
          readonly expected_workflow_blob='6771c53ba753a79e4ae5c8127fb6e1db40ce1196'
          readonly target='.github/workflows/opencode-commercial-development.yml'
          readonly repair_source='.github/workflows/repair-opencode-commercial-security-contract.yml'

          test "$TARGET_BRANCH" = "$expected_branch"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object "$target")" = "$expected_workflow_blob"
          remote_head="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"

          REPAIR_SOURCE="$repair_source" python3 - <<'PY'
          import base64
          import gzip
          import os
          import re
          from pathlib import Path

          source = Path(os.environ['REPAIR_SOURCE']).read_text(encoding='utf-8')
          match = re.search(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d",
              source,
          )
          if match is None:
              raise SystemExit('repair_payload_missing')
          payload = gzip.decompress(base64.b64decode(match.group(1)))
          target = Path(os.environ['RUNNER_TEMP']) / 'repair.py'
          target.write_bytes(payload)
          compile(payload, str(target), 'exec')
          PY
          python3 "$RUNNER_TEMP/repair.py"

          corepack enable
          test "$(pnpm --version)" = '10.15.0'
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec prettier --single-quote --write "$target"
          pnpm --filter @life-os/commercial-development-agent lint
          pnpm --filter @life-os/commercial-development-agent exec vitest run src/workflow-contract.test.mjs --no-file-parallelism
          git diff --check -- "$target"
          test "$(git diff --name-only)" = "$target"

          remote_head="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          blob_sha="$(git hash-object "$target")"
          test -n "$blob_sha"
          echo "::notice::TRANSFORMED_BLOB_SHA=$blob_sha"
