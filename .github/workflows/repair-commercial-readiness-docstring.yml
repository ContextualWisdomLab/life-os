name: Repair Commercial Readiness Docstring

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - .github/workflows/repair-commercial-readiness-docstring.yml

permissions:
  contents: write

concurrency:
  group: repair-commercial-readiness-docstring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact owner head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Guard retained failure ancestry and exact remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor 96dfbe60360dfb895e0ffc22377dd8ee5276c0d7 "$GITHUB_SHA"
          test -e .github/workflows/verify-commercial-readiness-docstring-repair.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce retained docstring RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @life-os/commercial-readiness exec node --test \
            src/production-docstring-coverage.test.mjs
          status=$?
          set -e
          test "$status" -ne 0

      - name: Apply minimum explanatory JSDoc repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/commercial-readiness/src/github-client.mjs')
          source = path.read_text()
          old = """function stringAuthority(value) {
            return typeof value === 'string' ? value : '__invalid__';
          }
          """
          new = """/**
           * Preserve untrusted GitHub scalar authority only when upstream evidence is already a string.
           *
           * Merge evidence must not coerce arrays, objects, numbers, or null into apparently valid
           * identities or states. Malformed scalar authority collapses to one explicit fail-closed
           * sentinel so downstream evaluators cannot accidentally grant trust through coercion.
           *
           * @param {unknown} value Untrusted scalar from a GitHub REST response.
           * @returns {string} Original string evidence or the fail-closed invalid sentinel.
           */
          function stringAuthority(value) {
            return typeof value === 'string' ? value : '__invalid__';
          }
          """
          if source.count(old) != 1:
              raise SystemExit('stringAuthority repair target is missing or ambiguous')
          path.write_text(source.replace(old, new, 1))
          PY
          pnpm exec prettier --single-quote --write \
            packages/commercial-readiness/src/github-client.mjs

      - name: Prove focused and package GREEN
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @life-os/commercial-readiness exec node --test \
            src/production-docstring-coverage.test.mjs
          pnpm --filter @life-os/commercial-readiness typecheck
          pnpm --filter @life-os/commercial-readiness test
          git diff --check

      - name: Guard bounded publication and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-commercial-readiness-docstring.yml
          git add packages/commercial-readiness/src/github-client.mjs
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-commercial-readiness-docstring.yml' \
            'packages/commercial-readiness/src/github-client.mjs' | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --cached --check

      - name: Publish ordinary semantic descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(commercial-readiness): document scalar authority boundary'
          git push origin "HEAD:${GITHUB_REF_NAME}"
