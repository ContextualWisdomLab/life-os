name: Format plugin delivery control regression

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-control-v1

permissions:
  contents: write

concurrency:
  group: format-plugin-delivery-control-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Canonicalize only the regression
        run: |
          pnpm exec prettier --single-quote --write apps/integration-service/src/plugin-delivery-attempt-control.test.ts
          git diff --check
          changed="$(git diff --name-only | tr '\n' ' ')"
          test -z "${changed}" || test "${changed}" = "apps/integration-service/src/plugin-delivery-attempt-control.test.ts "

      - name: Retire formatter and publish ordinary descendant
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/integration-service/src/plugin-delivery-attempt-control.test.ts
          git rm .github/workflows/format-plugin-delivery-control-regression.yml
          git commit -m 'test(integration): format delivery control regression'
          git push origin "HEAD:${BRANCH_NAME}"
