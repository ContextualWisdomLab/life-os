name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-ai-audit-redaction:
    if: >-
      github.head_ref == 'feat/ai-authenticated-gateway-context' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/ai-authenticated-gateway-context
          fetch-depth: 0
          persist-credentials: false

      - name: Strengthen redaction evidence and commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/ai-service/src/quality-coverage.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "    expect(JSON.stringify(logger.mock.calls)).not.toContain('password=secret');\n"
          new = """    const loggedOutput = logger.mock.calls
              .flat()
              .flatMap((value) =>
                value instanceof Error
                  ? [value.name, value.message, value.stack ?? '']
                  : [typeof value === 'string' ? value : JSON.stringify(value)],
              )
              .join('\\n');
            expect(loggedOutput).not.toContain('password=secret');
          """.replace('              ', '      ').replace('                ', '        ').replace('                  ', '          ').replace('            ', '    ')
          if text.count(old) != 1:
              raise SystemExit('redaction assertion pattern mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/ai-service/src/quality-coverage.test.ts
          git diff --cached --check
          git commit -m 'test(ai): inspect error details in redaction evidence'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-authenticated-gateway-context
