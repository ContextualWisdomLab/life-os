name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-ai-gateway-evidence:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/ai-authenticated-gateway-context' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/ai-authenticated-gateway-context
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed coverage and redaction repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          boundary_path = Path('apps/ai-service/src/ai-http-boundary.ts')
          boundary = boundary_path.read_text(encoding='utf-8')
          redundant_constant = """const CANONICAL_UUID_V4_PATTERN =
            /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;
          """.replace('            ', '  ')
          redundant_guard = """  if (proposalId && !CANONICAL_UUID_V4_PATTERN.test(proposalId)) {
              return invalidGatewayContext();
            }
          """.replace('              ', '    ').replace('            ', '  ')
          if redundant_constant in boundary:
              boundary = boundary.replace(redundant_constant, '', 1)
          if redundant_guard in boundary:
              boundary = boundary.replace(redundant_guard, '', 1)
          if 'CANONICAL_UUID_V4_PATTERN' in boundary:
              raise SystemExit('canonical path guard was not removed cleanly')
          boundary_path.write_text(boundary, encoding='utf-8')

          test_path = Path('apps/ai-service/src/ai-http-boundary.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test_title = 'rejects a noncanonical base64url spelling of a 32-byte signature'
          if test_title not in test:
              anchor = """  it.each([
                {
                  method: 'GET',
                  path: '/v1/proposals',
                  signature: signContext({ method: 'POST' }),
          """.replace('                ', '    ').replace('                  ', '      ')
              addition = """  it('rejects a noncanonical base64url spelling of a 32-byte signature', () => {
              const alphabet =
                'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
              const canonical = signContext();
              const finalIndex = alphabet.indexOf(canonical[canonical.length - 1]);
              expect(finalIndex).toBeGreaterThanOrEqual(0);
              expect(finalIndex % 4).toBe(0);
              const alternateFinalCharacter = alphabet[finalIndex + 1];
              expect(alternateFinalCharacter).toBeDefined();
              const noncanonical = `${canonical.slice(0, -1)}${alternateFinalCharacter}`;

              expectProblem(
                () =>
                  requireTrustedAiContext(
                    contextHeaders({ signature: noncanonical }),
                    GATEWAY_SECRET,
                    'POST',
                    '/v1/proposals',
                    NOW_SECONDS,
                  ),
                {
                  title: 'Trusted gateway context is invalid',
                  status: 401,
                  code: 'invalid_gateway_context',
                },
              );
            });

          """.replace('              ', '    ').replace('                ', '      ').replace('                  ', '        ').replace('                    ', '          ')
              if anchor not in test:
                  raise SystemExit('signature replay test anchor mismatch')
              test = test.replace(anchor, addition + anchor, 1)
          test_path.write_text(test, encoding='utf-8')

          quality_path = Path('apps/ai-service/src/quality-coverage.test.ts')
          quality = quality_path.read_text(encoding='utf-8')
          old_assertion = "    expect(JSON.stringify(logger.mock.calls)).not.toContain('password=secret');\n"
          robust_marker = 'const loggedOutput = logger.mock.calls'
          if old_assertion in quality:
              replacement = """    const loggedOutput = logger.mock.calls
                .flat()
                .flatMap((value) =>
                  value instanceof Error
                    ? [value.name, value.message, value.stack ?? '']
                    : [typeof value === 'string' ? value : JSON.stringify(value)],
                )
                .join('\\n');
              expect(loggedOutput).not.toContain('password=secret');
          """.replace('                ', '      ').replace('                  ', '        ').replace('                    ', '          ').replace('              ', '    ')
              quality = quality.replace(old_assertion, replacement, 1)
          elif robust_marker not in quality:
              raise SystemExit('redaction assertion pattern mismatch')
          quality_path.write_text(quality, encoding='utf-8')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and verify repaired AI service
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/ai-http-boundary.ts \
            apps/ai-service/src/ai-http-boundary.test.ts \
            apps/ai-service/src/quality-coverage.test.ts
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test

      - name: Commit verified repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/ai-service/src/ai-http-boundary.ts \
            apps/ai-service/src/ai-http-boundary.test.ts \
            apps/ai-service/src/quality-coverage.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No AI gateway evidence repair was required.'
            exit 0
          fi
          git commit -m 'test(ai): close gateway assurance coverage gaps'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-authenticated-gateway-context

  validate:
    needs: repair-ai-gateway-evidence
    if: >-
      always() &&
      (needs.repair-ai-gateway-evidence.result == 'skipped' ||
       github.actor == 'github-actions[bot]' ||
       github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check deployment reference sources
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --check \
            .github/workflows/deploy.yml \
            trivy.yaml \
            infra/trivy-data/trusted-registries.yaml \
            infra/kubernetes/base/kustomization.yaml \
            infra/kubernetes/base/namespace.yaml \
            infra/kubernetes/base/edge-workloads.yaml \
            infra/kubernetes/base/network-policies.yaml \
            infra/kubernetes/overlays/production/kustomization.yaml \
            infra/tests/deployment.spec.ts \
            infra/tests/deployment-scripts.spec.ts \
            docs/superpowers/plans/2026-08-04-production-kubernetes-reference-slice.md
          bash -n infra/kubernetes/run-migrations.sh
          python -m py_compile \
            infra/kubernetes/render-production-manifest.py \
            infra/kubernetes/write-pg-service.py

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Compose
        run: docker compose config --quiet
