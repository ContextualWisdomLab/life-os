name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PRIVACY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check deployment reference sources
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --check \
            .github/workflows/deploy.yml \
            trivy.yaml \
            infra/trivy-data/trusted-registries.yaml \
            infra/kubernetes/base/kustomization.yaml \
            infra/kubernetes/base/namespace.yaml \
            infra/kubernetes/base/edge-workloads.yaml \
            infra/kubernetes/base/network-policies.yaml \
            infra/kubernetes/overlays/production/kustomization.yaml \
            infra/tests/deployment.spec.ts \
            infra/tests/deployment-scripts.spec.ts \
            docs/superpowers/plans/2026-08-04-production-kubernetes-reference-slice.md
          bash -n infra/kubernetes/run-migrations.sh
          python -m py_compile \
            infra/kubernetes/render-production-manifest.py \
            infra/kubernetes/write-pg-service.py

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Compose
        run: docker compose config --quiet

  finalize-commercial-development-rca:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/opencode-commercial-development-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/opencode-commercial-development-loop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Reproduce, repair, and verify the current-main candidate
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          branch='feat/opencode-commercial-development-loop'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$branch:refs/remotes/origin/$branch"
          test "$(git rev-parse origin/$branch)" = "$EXPECTED_HEAD_SHA"
          base_head="$(git rev-parse origin/main)"
          git merge --no-edit --no-ff origin/main
          corepack enable

          python3 - <<'PY'
          from pathlib import Path

          tests_path = Path('packages/commercial-development-agent/src/contracts.test.mjs')
          tests = tests_path.read_text(encoding='utf-8')
          old_valid = """  it('validates one bounded open GitHub issue', () => {
    const validated = validateCommercialDevelopmentIssue(issue(), policy());
    expect(validated).toEqual(issue());
    expect(Object.isFrozen(validated)).toBe(true);
  });

  it.each([
"""
          new_valid = """  it('validates one bounded open GitHub issue', () => {
    const validated = validateCommercialDevelopmentIssue(issue(), policy());
    expect(validated).toEqual(issue());
    expect(Object.isFrozen(validated)).toBe(true);
  });

  it('preserves bounded multiline issue text as untrusted data', () => {
    const value = {
      ...issue(),
      body: '\\tFirst line\\r\\nSecond line\\n',
    };
    expect(validateCommercialDevelopmentIssue(value, policy())).toEqual(value);
  });

  it.each([
"""
          if tests.count(old_valid) != 1:
              raise SystemExit('unexpected projected-issue test shape')
          tests = tests.replace(old_valid, new_valid, 1)
          old_invalid = """    { ...issue(), body: 'x'.repeat(16_385) },
    { ...issue(), body: 'line\\u0000break' },
"""
          new_invalid = """    { ...issue(), body: null },
    { ...issue(), body: 'x'.repeat(16_385) },
    { ...issue(), body: 'line\\u0000break' },
"""
          if tests.count(old_invalid) != 1:
              raise SystemExit('unexpected unsafe-body test shape')
          tests = tests.replace(old_invalid, new_invalid, 1)
          tests_path.write_text(tests, encoding='utf-8')
          PY

          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          set +e
          pnpm --filter @life-os/commercial-development-agent exec vitest run \
            src/contracts.test.mjs src/prompt-builder.test.mjs \
            --no-file-parallelism >"$RUNNER_TEMP/rca-red.log" 2>&1
          red_status="$?"
          set -e
          cat "$RUNNER_TEMP/rca-red.log"
          test "$red_status" -ne 0
          grep -F 'preserves bounded multiline issue text as untrusted data' \
            "$RUNNER_TEMP/rca-red.log"

          python3 - <<'PY'
          from pathlib import Path

          contracts_path = Path('packages/commercial-development-agent/src/contracts.mjs')
          contracts = contracts_path.read_text(encoding='utf-8')
          old_constant = "const CONTROL_CHARACTER_PATTERN = /[\\u0000-\\u001f\\u007f]/u;\n"
          new_constant = (
              old_constant
              + "const UNTRUSTED_TEXT_CONTROL_CHARACTER_PATTERN =\n"
              + "  /[\\u0000-\\u0008\\u000b\\u000c\\u000e-\\u001f\\u007f]/u;\n"
          )
          if contracts.count(old_constant) != 1:
              raise SystemExit('unexpected control-character contract shape')
          contracts = contracts.replace(old_constant, new_constant, 1)
          old_helper = """  return value;
}

/** Requires one bounded safe integer. */
function requireInteger(value, minimum, maximum) {
"""
          new_helper = """  return value;
}

/** Preserves bounded untrusted issue text while rejecting unsafe controls. */
function requireUntrustedText(value, maximumBytes) {
  if (
    typeof value !== 'string' ||
    UNTRUSTED_TEXT_CONTROL_CHARACTER_PATTERN.test(value) ||
    byteLength(value) > maximumBytes
  ) {
    return invalid();
  }
  return value;
}

/** Requires one bounded safe integer. */
function requireInteger(value, minimum, maximum) {
"""
          if contracts.count(old_helper) != 1:
              raise SystemExit('unexpected string-helper contract shape')
          contracts = contracts.replace(old_helper, new_helper, 1)
          old_body = """    body: requireString(input.body, {
      maximumBytes: policy.maximum_issue_body_bytes,
      allowEmpty: true,
      minimumBytes: 0,
    }),
"""
          new_body = """    body: requireUntrustedText(
      input.body,
      policy.maximum_issue_body_bytes,
    ),
"""
          if contracts.count(old_body) != 1:
              raise SystemExit('unexpected issue-body contract shape')
          contracts = contracts.replace(old_body, new_body, 1)
          contracts_path.write_text(contracts, encoding='utf-8')
          PY

          pnpm --filter @life-os/commercial-development-agent exec vitest run \
            src/contracts.test.mjs src/prompt-builder.test.mjs \
            --no-file-parallelism
          pnpm --filter @life-os/commercial-development-agent run lint
          pnpm --filter @life-os/commercial-development-agent run typecheck
          pnpm --filter @life-os/commercial-development-agent run build
          pnpm --filter @life-os/commercial-development-agent run test

          git checkout origin/main -- .github/workflows/ci.yml
          git rm .github/workflows/diagnose-commercial-development-lockfile.yml
          git rm .github/workflows/apply-commercial-development-rca-contract.yml
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/apply-commercial-development-rca-contract.yml' \
            '.github/workflows/ci.yml' \
            '.github/workflows/diagnose-commercial-development-lockfile.yml' \
            'packages/commercial-development-agent/src/contracts.mjs' \
            'packages/commercial-development-agent/src/contracts.test.mjs' \
            'pnpm-lock.yaml' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git add .github/workflows/ci.yml \
            packages/commercial-development-agent/src/contracts.mjs \
            packages/commercial-development-agent/src/contracts.test.mjs \
            pnpm-lock.yaml
          git commit -m 'fix(agent): verify RCA prompt on realistic issue evidence'

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$branch:refs/remotes/origin/$branch"
          test "$(git rev-parse origin/$branch)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/main)" = "$base_head"
          git push origin "HEAD:refs/heads/$branch"
