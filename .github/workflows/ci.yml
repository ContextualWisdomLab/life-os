name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair_notification:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/notification-postgres-inbox'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/notification-postgres-inbox
          fetch-depth: 0

      - name: Detect pending reviewed repair
        id: repair_state
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f .github/scripts/repair_notification_persistence.py ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.repair_state.outputs.required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        if: steps.repair_state.outputs.required == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.repair_state.outputs.required == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Apply reviewed repair
        if: steps.repair_state.outputs.required == 'true'
        run: python3 .github/scripts/repair_notification_persistence.py

      - name: Format and verify notification service
        if: steps.repair_state.outputs.required == 'true'
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            apps/notification-service/package.json \
            apps/notification-service/src/main.ts \
            apps/notification-service/src/reminder-scheduler.ts \
            apps/notification-service/src/reminder-scheduler.test.ts \
            apps/notification-service/src/reminder-scheduler.integration.test.ts \
            apps/notification-service/src/postgres-reminder-migration.test.ts \
            apps/notification-service/src/postgres-reminder-repository.ts \
            apps/notification-service/src/postgres-reminder-repository.test.ts \
            apps/notification-service/src/postgres-reminder-repository.integration.test.ts \
            apps/notification-service/src/notification-runtime.ts \
            apps/notification-service/src/notification-runtime.test.ts \
            docs/operations/notification-persistence.md \
            docs/superpowers/specs/2026-08-04-notification-postgres-inbox-design.md
          pnpm --filter @life-os/notification-service lint
          pnpm --filter @life-os/notification-service typecheck
          pnpm --filter @life-os/notification-service test
          pnpm --filter @life-os/notification-service build

      - name: Commit reviewed repair
        if: steps.repair_state.outputs.required == 'true'
        run: |
          set -Eeuo pipefail
          rm -f pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/scripts/repair_notification_persistence.py
          git add \
            apps/notification-service/package.json \
            apps/notification-service/src/main.ts \
            apps/notification-service/src/reminder-scheduler.ts \
            apps/notification-service/src/reminder-scheduler.test.ts \
            apps/notification-service/src/reminder-scheduler.integration.test.ts \
            apps/notification-service/src/postgres-reminder-migration.test.ts \
            apps/notification-service/src/postgres-reminder-repository.ts \
            apps/notification-service/src/postgres-reminder-repository.test.ts \
            apps/notification-service/src/postgres-reminder-repository.integration.test.ts \
            apps/notification-service/src/notification-runtime.ts \
            apps/notification-service/src/notification-runtime.test.ts \
            docs/operations/notification-persistence.md \
            docs/superpowers/specs/2026-08-04-notification-postgres-inbox-design.md
          git diff --cached --check
          git commit -m "fix(notification): fence expiring reminder claims"
          git push origin HEAD:feat/notification-postgres-inbox

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check deployment reference sources
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --check \
            .github/workflows/deploy.yml \
            trivy.yaml \
            infra/trivy-data/trusted-registries.yaml \
            infra/kubernetes/base/kustomization.yaml \
            infra/kubernetes/base/namespace.yaml \
            infra/kubernetes/base/edge-workloads.yaml \
            infra/kubernetes/base/network-policies.yaml \
            infra/kubernetes/overlays/production/kustomization.yaml \
            infra/tests/deployment.spec.ts \
            infra/tests/deployment-scripts.spec.ts \
            docs/superpowers/plans/2026-08-04-production-kubernetes-reference-slice.md
          bash -n infra/kubernetes/run-migrations.sh
          python -m py_compile \
            infra/kubernetes/render-production-manifest.py \
            infra/kubernetes/write-pg-service.py

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Compose
        run: docker compose config --quiet
