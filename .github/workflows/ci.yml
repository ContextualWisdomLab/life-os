name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check deployment reference sources
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --check \
            .github/workflows/deploy.yml \
            trivy.yaml \
            infra/trivy-data/trusted-registries.yaml \
            infra/kubernetes/base/kustomization.yaml \
            infra/kubernetes/base/namespace.yaml \
            infra/kubernetes/base/edge-workloads.yaml \
            infra/kubernetes/base/network-policies.yaml \
            infra/kubernetes/overlays/production/kustomization.yaml \
            infra/tests/deployment.spec.ts \
            infra/tests/deployment-scripts.spec.ts \
            docs/superpowers/plans/2026-08-04-production-kubernetes-reference-slice.md
          bash -n infra/kubernetes/run-migrations.sh
          python -m py_compile \
            infra/kubernetes/render-production-manifest.py \
            infra/kubernetes/write-pg-service.py

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Compose
        run: docker compose config --quiet

  apply_review_fixes:
    name: Apply reviewed non-workflow fixes once
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'ContextualWisdomLab/life-os' &&
      github.head_ref == 'feat/ai-nim-live-conformance'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply deterministic reviewed corrections
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-cache
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 -m py_compile \
            .github/scripts/apply-ai-live-review-fixes.py \
            .github/scripts/augment-ai-live-review-fixes.py
          python3 .github/scripts/apply-ai-live-review-fixes.py
          python3 .github/scripts/augment-ai-live-review-fixes.py
          sed -i \
            's/JSON.stringify(await noProviderReport())/JSON.stringify(await validReport())/' \
            apps/ai-service/src/proposal-quality-live-final-coverage.test.ts
          git show "${BASE_SHA}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git checkout "$EXPECTED_HEAD_SHA" -- \
            .github/workflows/ai-proposal-live-conformance.yml \
            .github/workflows/apply-ai-live-review-fixes.yml
          rm -f \
            .github/scripts/apply-ai-live-review-fixes.py \
            .github/scripts/augment-ai-live-review-fixes.py
          rm -rf .github/scripts/__pycache__

      - name: Commit only from the unchanged exact branch head
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin refs/heads/feat/ai-nim-live-conformance | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m 'fix(ai): resolve live conformance review findings'
          remote_head="$(git ls-remote origin refs/heads/feat/ai-nim-live-conformance | cut -f1)"
          test "$remote_head" = "$EXPECTED_HEAD_SHA"
          git push origin HEAD:feat/ai-nim-live-conformance
