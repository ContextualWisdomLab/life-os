name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review_repair:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/notification-postgres-inbox'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/notification-postgres-inbox
          fetch-depth: 0

      - name: Start runner PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql \
            --set=ON_ERROR_STOP=1 \
            --command "ALTER USER postgres PASSWORD 'postgres'"
          if ! sudo -u postgres psql \
            --tuples-only \
            --no-align \
            --command "SELECT 1 FROM pg_database WHERE datname = 'life_os_test'" \
            | grep -qx 1; then
            sudo -u postgres createdb life_os_test
          fi
          pg_isready -h 127.0.0.1 -U postgres -d life_os_test

      - name: Detect pending review repair
        id: repair_state
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f .github/scripts/finalize_notification_review.py ]] || \
             [[ -f .github/scripts/complete_notification_docstrings.py ]]; then
            echo 'required=true' >> "$GITHUB_OUTPUT"
          else
            echo 'required=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.repair_state.outputs.required == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        if: steps.repair_state.outputs.required == 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.repair_state.outputs.required == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Apply reviewed notification fixes
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -f .github/scripts/finalize_notification_review.py ]]; then
            python3 .github/scripts/finalize_notification_review.py
          fi
          if [[ -f .github/scripts/complete_notification_docstrings.py ]]; then
            python3 .github/scripts/complete_notification_docstrings.py
          fi

      - name: Format and validate reviewed fixes
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            .github/workflows/ci.yml \
            apps/notification-service/package.json \
            apps/notification-service/tsconfig.json \
            apps/notification-service/vitest.config.ts \
            "apps/notification-service/src/**/*.ts"
          pnpm --filter @life-os/notification-service lint
          pnpm --filter @life-os/notification-service typecheck
          pnpm --filter @life-os/notification-service exec vitest run \
            --no-file-parallelism \
            --coverage.enabled=false

      - name: Commit reviewed fixes and remove temporary automation
        if: steps.repair_state.outputs.required == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git restore --worktree pnpm-lock.yaml 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for temporary_script in \
            .github/scripts/finalize_notification_review.py \
            .github/scripts/complete_notification_docstrings.py; do
            if [[ -f "$temporary_script" ]]; then
              git rm -f "$temporary_script"
            fi
          done
          git add \
            .github/workflows/ci.yml \
            apps/notification-service/package.json \
            apps/notification-service/src
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(notification): close review and documentation gaps"
          git push origin HEAD:feat/notification-postgres-inbox

  validate:
    needs: review_repair
    if: >-
      always() &&
      (needs.review_repair.result == 'success' ||
       needs.review_repair.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Start runner PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo systemctl start postgresql.service
          sudo -u postgres psql \
            --set=ON_ERROR_STOP=1 \
            --command "ALTER USER postgres PASSWORD 'postgres'"
          if ! sudo -u postgres psql \
            --tuples-only \
            --no-align \
            --command "SELECT 1 FROM pg_database WHERE datname = 'life_os_test'" \
            | grep -qx 1; then
            sudo -u postgres createdb life_os_test
          fi
          pg_isready -h 127.0.0.1 -U postgres -d life_os_test

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check deployment reference sources
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --check \
            .github/workflows/deploy.yml \
            trivy.yaml \
            infra/trivy-data/trusted-registries.yaml \
            infra/kubernetes/base/kustomization.yaml \
            infra/kubernetes/base/namespace.yaml \
            infra/kubernetes/base/edge-workloads.yaml \
            infra/kubernetes/base/network-policies.yaml \
            infra/kubernetes/overlays/production/kustomization.yaml \
            infra/tests/deployment.spec.ts \
            infra/tests/deployment-scripts.spec.ts \
            docs/superpowers/plans/2026-08-04-production-kubernetes-reference-slice.md
          bash -n infra/kubernetes/run-migrations.sh
          python -m py_compile \
            infra/kubernetes/render-production-manifest.py \
            infra/kubernetes/write-pg-service.py

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate Compose
        run: docker compose config --quiet
