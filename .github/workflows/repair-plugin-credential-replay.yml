name: Repair Plugin credential replay secret authority

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: integration-plugin-credential-replay-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/plugin-vault-postgres-driver-v1
          fetch-depth: 0

      - name: Verify bounded predecessor lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_product_parent='d6280b2464be5a1b60625a87f46232f8ef6dd26e'
          test "$(git rev-parse HEAD~2)" = "$expected_product_parent"
          test "$(git diff --name-only "$expected_product_parent"...HEAD)" = '.github/workflows/repair-plugin-credential-replay.yml'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Materialize conflicting-replay regression and prove predecessor RED
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > apps/integration-service/src/plugin-credential-replay-secret.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            PluginCredentialApplication,
            PluginCredentialError,
            type PluginCredentialBindingRecord,
            type PluginCredentialBindingStore,
            type PluginSecretStore,
            type PutPluginSecretInput,
            type RevokePluginCredential,
          } from './plugin-credential';
          import type {
            PluginInstallationContext,
            PluginInstallationRecord,
          } from './plugin-installation';

          const INSTALLATION_ID = '11111111-1111-4111-8111-111111111111';
          const WORKSPACE_ID = '22222222-2222-4222-8222-222222222222';
          const USER_ID = '33333333-3333-4333-8333-333333333333';
          const BINDING_ID = '44444444-4444-4444-8444-444444444444';
          const BOUND_AT = '2026-09-08T00:00:00.000Z';
          const SECRET_VALUE = 'original-plugin-secret-value';
          const SECRET_REFERENCE = 'lifeos-plugin-vault://44444444-4444-4444-8444-444444444444';
          const CONTEXT = Object.freeze({ workspaceId: WORKSPACE_ID, actorUserId: USER_ID });

          const INSTALLATION: PluginInstallationRecord = Object.freeze({
            installationId: INSTALLATION_ID,
            workspaceId: WORKSPACE_ID,
            installedByUserId: USER_ID,
            pluginId: 'example.plugin',
            pluginContractVersion: '1.0',
            manifestSha256: 'a'.repeat(64),
            grantedCapabilities: Object.freeze(['lifeos.task.completed.v1']),
            status: 'active',
            installedAt: '2026-09-07T23:59:00.000Z',
            revokedAt: null,
          });

          const BINDING: PluginCredentialBindingRecord = Object.freeze({
            credentialBindingId: BINDING_ID,
            installationId: INSTALLATION_ID,
            workspaceId: WORKSPACE_ID,
            installedByUserId: USER_ID,
            credentialName: 'webhook.signing',
            secretReference: SECRET_REFERENCE,
            status: 'active',
            boundAt: BOUND_AT,
            revokedAt: null,
          });

          class InstallationAuthority {
            async getInstallation(
              _context: PluginInstallationContext,
              _installationId: string,
            ): Promise<PluginInstallationRecord> {
              return INSTALLATION;
            }
          }

          class ExistingBindingStore implements PluginCredentialBindingStore {
            async findById(): Promise<PluginCredentialBindingRecord> {
              return BINDING;
            }
            async createIfAbsent(
              _record: PluginCredentialBindingRecord,
            ): Promise<PluginCredentialBindingRecord> {
              throw new Error('existing replay must not create metadata');
            }
            async revokeActive(
              _input: RevokePluginCredential,
            ): Promise<PluginCredentialBindingRecord | undefined> {
              return undefined;
            }
          }

          class ExactSecretStore implements PluginSecretStore {
            readonly verifications: PutPluginSecretInput[] = [];
            async putSecret(_input: PutPluginSecretInput): Promise<string> {
              throw new Error('existing replay must not create provider material');
            }
            async verifySecret(
              secretReference: string,
              input: PutPluginSecretInput,
            ): Promise<void> {
              this.verifications.push(input);
              if (
                secretReference !== SECRET_REFERENCE ||
                input.secretValue !== SECRET_VALUE
              ) {
                throw new Error('provider evidence does not match replay');
              }
            }
            async deleteSecret(_secretReference: string): Promise<void> {}
          }

          function application(secretStore: ExactSecretStore): PluginCredentialApplication {
            return new PluginCredentialApplication(
              new InstallationAuthority(),
              new ExistingBindingStore(),
              secretStore,
              () => new Date(BOUND_AT),
            );
          }

          function bindInput(secretValue: string) {
            return Object.freeze({
              trustedContext: CONTEXT,
              installationId: INSTALLATION_ID,
              credentialBindingId: BINDING_ID,
              credentialName: 'webhook.signing',
              secretValue,
            });
          }

          describe('Plugin credential replay secret authority', () => {
            it('requires provider-backed proof before accepting an exact durable replay', async () => {
              const secrets = new ExactSecretStore();
              await expect(application(secrets).bind(bindInput(SECRET_VALUE))).resolves.toMatchObject({
                credentialBindingId: BINDING_ID,
                status: 'active',
              });
              expect(secrets.verifications).toHaveLength(1);
            });

            it('rejects a reused binding identity carrying different secret material', async () => {
              const secrets = new ExactSecretStore();
              await expect(
                application(secrets).bind(bindInput('different-plugin-secret-value')),
              ).rejects.toBeInstanceOf(PluginCredentialError);
              expect(secrets.verifications).toHaveLength(1);
            });
          });
          EOF

          if pnpm --filter @life-os/integration-service exec vitest run src/plugin-credential-replay-secret.test.ts; then
            echo 'Expected predecessor RED, but conflicting replay was already rejected with provider verification' >&2
            exit 1
          fi

      - name: Apply minimal provider-verification repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one repair anchor, found {count}')
              target.write_text(text.replace(old, new, 1))

          credential = 'apps/integration-service/src/plugin-credential.ts'
          old_interface = (
              " * `putSecret` must be idempotent for one credential binding identity and return an\n"
              " * opaque reference rather than plaintext. `deleteSecret` must tolerate exact\n"
              " * retries so a durable revocation can complete provider cleanup after an outage.\n"
              " */\n"
              "export interface PluginSecretStore {\n"
              "  putSecret(input: PutPluginSecretInput): Promise<string>;\n"
              "  deleteSecret(secretReference: string): Promise<void>;\n"
              "}\n"
          )
          new_interface = (
              " * `putSecret` must be idempotent for one credential binding identity and return an\n"
              " * opaque reference rather than plaintext. `verifySecret` must prove that an existing\n"
              " * opaque reference still contains the exact immutable authority and secret bytes before\n"
              " * metadata-only replay can be accepted. `deleteSecret` must tolerate exact retries so a\n"
              " * durable revocation can complete provider cleanup after an outage.\n"
              " */\n"
              "export interface PluginSecretStore {\n"
              "  putSecret(input: PutPluginSecretInput): Promise<string>;\n"
              "  verifySecret(secretReference: string, input: PutPluginSecretInput): Promise<void>;\n"
              "  deleteSecret(secretReference: string): Promise<void>;\n"
              "}\n"
          )
          replace_once(credential, old_interface, new_interface)

          old_replay = "      return view(existing);\n    }\n\n    let secretReference: string;\n"
          new_replay = (
              "      try {\n"
              "        await this.secretStore.verifySecret(existing.secretReference, {\n"
              "          credentialBindingId,\n"
              "          installationId,\n"
              "          workspaceId: context.workspaceId,\n"
              "          installedByUserId: context.actorUserId,\n"
              "          credentialName,\n"
              "          secretValue,\n"
              "        });\n"
              "      } catch {\n"
              "        return invalid();\n"
              "      }\n"
              "      return view(existing);\n"
              "    }\n\n"
              "    let secretReference: string;\n"
          )
          replace_once(credential, old_replay, new_replay)

          vault_store = 'apps/integration-service/src/plugin-vault-secret-store.ts'
          vault_anchor = "  /**\n   * Creates exactly one binding secret or returns the exact matching durable replay.\n"
          vault_verifier = (
              "  /**\n"
              "   * Proves that one existing opaque binding reference still contains exactly the\n"
              "   * caller-supplied immutable authority and secret bytes. Missing or conflicting\n"
              "   * provider evidence is never repaired implicitly during metadata replay.\n"
              "   */\n"
              "  async verifySecret(\n"
              "    secretReference: string,\n"
              "    input: PutPluginSecretInput,\n"
              "  ): Promise<void> {\n"
              "    const bindingId = parseReference(secretReference);\n"
              "    const expected = requirePayload(input);\n"
              "    if (bindingId !== expected.credentialBindingId) {\n"
              "      return unavailable();\n"
              "    }\n"
              "    let result: PluginVaultHttpResult;\n"
              "    try {\n"
              "      result = await this.request(this.dataUrl(bindingId), 'GET', undefined, true);\n"
              "    } catch {\n"
              "      return unavailable();\n"
              "    }\n"
              "    if (result.response.status !== 200 || result.body === undefined) {\n"
              "      return unavailable();\n"
              "    }\n"
              "    let parsed: unknown;\n"
              "    try {\n"
              "      parsed = JSON.parse(result.body);\n"
              "    } catch {\n"
              "      return unavailable();\n"
              "    }\n"
              "    const durable = requireVaultReadPayload(parsed);\n"
              "    if (!samePayload(durable, expected)) {\n"
              "      return unavailable();\n"
              "    }\n"
              "  }\n\n"
          )
          replace_once(vault_store, vault_anchor, vault_verifier + vault_anchor)

          credential_test = 'apps/integration-service/src/plugin-credential.test.ts'
          old_delete = (
              "  async deleteSecret(secretReference: string): Promise<void> {\n"
              "    this.deletes.push(secretReference);\n"
          )
          new_delete = (
              "  async verifySecret(\n"
              "    secretReference: string,\n"
              "    _input: PutPluginSecretInput,\n"
              "  ): Promise<void> {\n"
              "    if (secretReference !== this.reference) {\n"
              "      throw new Error('secret reference unavailable');\n"
              "    }\n"
              "  }\n\n"
              "  async deleteSecret(secretReference: string): Promise<void> {\n"
              "    this.deletes.push(secretReference);\n"
          )
          replace_once(credential_test, old_delete, new_delete)

          http_test = 'apps/integration-service/src/plugin-operator-http-authority.integration.test.ts'
          old_memory_delete = (
              "  async deleteSecret(secretReference: string): Promise<void> {\n"
              "    this.references.delete(secretReference);\n"
              "  }\n"
          )
          new_memory_delete = (
              "  async verifySecret(\n"
              "    secretReference: string,\n"
              "    _input: Parameters<PluginSecretStore['verifySecret']>[1],\n"
              "  ): Promise<void> {\n"
              "    if (!this.references.has(secretReference)) {\n"
              "      throw new Error('secret reference unavailable');\n"
              "    }\n"
              "  }\n\n"
              "  async deleteSecret(secretReference: string): Promise<void> {\n"
              "    this.references.delete(secretReference);\n"
              "  }\n"
          )
          replace_once(http_test, old_memory_delete, new_memory_delete)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          marker = '### Fixed\n\n'
          if text.count(marker) != 1:
              raise SystemExit('CHANGELOG Fixed anchor is not unique')
          entry = (
              '- Plugin credential metadata replays now require exact provider-backed secret evidence before acceptance; '
              'reusing a binding identity with different secret bytes, or with missing/conflicting Vault evidence, fails closed instead of returning stale active metadata.\n'
          )
          changelog.write_text(text.replace(marker, marker + entry, 1))
          PY

      - name: Add Vault replay-verification regression
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > apps/integration-service/src/plugin-vault-secret-store-verification.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import {
            PluginVaultSecretStore,
            PluginVaultSecretStoreError,
            type PluginVaultHttpResponse,
          } from './plugin-vault-secret-store';
          import type { PutPluginSecretInput } from './plugin-credential';

          const BINDING_ID = '44444444-4444-4444-8444-444444444444';
          const INPUT: PutPluginSecretInput = Object.freeze({
            credentialBindingId: BINDING_ID,
            installationId: '11111111-1111-4111-8111-111111111111',
            workspaceId: '22222222-2222-4222-8222-222222222222',
            installedByUserId: '33333333-3333-4333-8333-333333333333',
            credentialName: 'webhook.signing',
            secretValue: 'original-plugin-secret-value',
          });
          const REFERENCE = `lifeos-plugin-vault://${BINDING_ID}`;

          function vaultEnvelope(secretValue = INPUT.secretValue): object {
            return {
              data: {
                data: {
                  schemaVersion: 1,
                  credentialBindingId: INPUT.credentialBindingId,
                  installationId: INPUT.installationId,
                  workspaceId: INPUT.workspaceId,
                  installedByUserId: INPUT.installedByUserId,
                  credentialName: INPUT.credentialName,
                  secretValue,
                },
              },
            };
          }

          function response(status: number, body?: object): PluginVaultHttpResponse {
            const encoded = body === undefined ? undefined : JSON.stringify(body);
            return new Response(encoded, {
              status,
              headers: encoded === undefined ? undefined : { 'content-type': 'application/json' },
            });
          }

          describe('PluginVaultSecretStore replay verification', () => {
            it('accepts only exact durable Vault authority and secret bytes', async () => {
              const store = new PluginVaultSecretStore(
                'https://vault.example.test',
                'vault-token-that-is-long-enough',
                'secret',
                async (_url, request) => {
                  expect(request.method).toBe('GET');
                  return response(200, vaultEnvelope());
                },
              );
              await expect(store.verifySecret(REFERENCE, INPUT)).resolves.toBeUndefined();
            });

            it('rejects conflicting or missing provider evidence without recreating it', async () => {
              const conflicting = new PluginVaultSecretStore(
                'https://vault.example.test',
                'vault-token-that-is-long-enough',
                'secret',
                async () => response(200, vaultEnvelope('different-provider-secret')),
              );
              await expect(conflicting.verifySecret(REFERENCE, INPUT)).rejects.toBeInstanceOf(
                PluginVaultSecretStoreError,
              );

              const missing = new PluginVaultSecretStore(
                'https://vault.example.test',
                'vault-token-that-is-long-enough',
                'secret',
                async () => response(404),
              );
              await expect(missing.verifySecret(REFERENCE, INPUT)).rejects.toBeInstanceOf(
                PluginVaultSecretStoreError,
              );
            });
          });
          EOF

      - name: Prove focused GREEN and Integration type contract
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/integration-service exec vitest run \
            src/plugin-credential-replay-secret.test.ts \
            src/plugin-vault-secret-store-verification.test.ts \
            src/plugin-credential.test.ts \
            src/plugin-vault-secret-store.test.ts \
            src/plugin-operator-http-authority.integration.test.ts
          pnpm --filter @life-os/integration-service typecheck

      - name: Prove complete Integration test suite
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/integration-service test

      - name: Publish causal repair and remove one-shot writer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/repair-plugin-credential-replay.yml
          expected_paths=$(cat <<'EOF'
          CHANGELOG.md
          apps/integration-service/src/plugin-credential-replay-secret.test.ts
          apps/integration-service/src/plugin-credential.test.ts
          apps/integration-service/src/plugin-credential.ts
          apps/integration-service/src/plugin-operator-http-authority.integration.test.ts
          apps/integration-service/src/plugin-vault-secret-store-verification.test.ts
          apps/integration-service/src/plugin-vault-secret-store.ts
          EOF
          )
          actual_paths=$(git diff --name-only | sort)
          test "$actual_paths" = "$(printf '%s\n' "$expected_paths" | sort)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(integration): verify credential replay secret evidence'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1
