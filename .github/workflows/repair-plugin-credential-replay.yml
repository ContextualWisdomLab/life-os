name: Repair Plugin credential replay secret authority

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: integration-plugin-credential-replay-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/plugin-vault-postgres-driver-v1
          fetch-depth: 0

      - name: Verify bounded predecessor lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_product_parent='d6280b2464be5a1b60625a87f46232f8ef6dd26e'
          test "$(git rev-parse HEAD~10)" = "$expected_product_parent"
          test "$(git diff --name-only "$expected_product_parent"...HEAD)" = '.github/workflows/repair-plugin-credential-replay.yml'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply previously verified repair script
        shell: bash
        run: |
          set -Eeuo pipefail
          git show HEAD~1:.github/workflows/repair-plugin-credential-replay.yml > /tmp/verified-repair.yml
          awk '
            /      - name: Apply reviewed repair and adapt complete secret-store contract/ { wanted=1; next }
            wanted && /        run: \|/ { script=1; next }
            script && /^      - name:/ { exit }
            script { sub(/^          /, ""); print }
          ' /tmp/verified-repair.yml > /tmp/apply-verified-repair.sh
          test -s /tmp/apply-verified-repair.sh
          bash /tmp/apply-verified-repair.sh

      - name: Prove Integration contract and complete suite
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/plugin-sdk build
          pnpm --filter @life-os/integration-service typecheck
          pnpm --filter @life-os/integration-service test

      - name: Publish causal repair and remove one-shot writer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/repair-plugin-credential-replay.yml

          allowed_paths=$(cat <<'EOF'
          .github/workflows/repair-plugin-credential-replay.yml
          CHANGELOG.md
          apps/integration-service/src/plugin-credential-clock-evidence.test.ts
          apps/integration-service/src/plugin-credential-durable-record.test.ts
          apps/integration-service/src/plugin-credential-lifecycle-authority.test.ts
          apps/integration-service/src/plugin-credential-malformed-authority.test.ts
          apps/integration-service/src/plugin-credential-malformed-read-evidence.test.ts
          apps/integration-service/src/plugin-credential-replay-secret.test.ts
          apps/integration-service/src/plugin-credential-repository-invalid-evidence.test.ts
          apps/integration-service/src/plugin-credential-revocation-winner-consistency.test.ts
          apps/integration-service/src/plugin-credential.test.ts
          apps/integration-service/src/plugin-credential.ts
          apps/integration-service/src/plugin-operator-http-authority.integration.test.ts
          apps/integration-service/src/plugin-vault-postgres-driver-ip-authority.test.ts
          apps/integration-service/src/plugin-vault-postgres-driver-logger-boundary.test.ts
          apps/integration-service/src/plugin-vault-postgres-driver.test.ts
          apps/integration-service/src/plugin-vault-secret-store-body-cleanup.test.ts
          apps/integration-service/src/plugin-vault-secret-store-verification.test.ts
          apps/integration-service/src/plugin-vault-secret-store.ts
          apps/integration-service/src/server.ts
          EOF
          )
          actual_paths=$(git diff --name-only | sort)
          unexpected_paths=$(comm -23 \
            <(printf '%s\n' "$actual_paths") \
            <(printf '%s\n' "$allowed_paths" | sort))
          test -z "$unexpected_paths"

          required_paths=$(cat <<'EOF'
          .github/workflows/repair-plugin-credential-replay.yml
          CHANGELOG.md
          apps/integration-service/src/plugin-credential-replay-secret.test.ts
          apps/integration-service/src/plugin-credential.ts
          apps/integration-service/src/plugin-vault-secret-store-verification.test.ts
          apps/integration-service/src/plugin-vault-secret-store.ts
          EOF
          )
          while IFS= read -r required; do
            printf '%s\n' "$actual_paths" | grep -Fx -- "$required" >/dev/null
          done <<< "$required_paths"

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(integration): verify credential replay secret evidence'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1
