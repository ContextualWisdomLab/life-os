name: Verify plugin delivery control chronology

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-control-v1

permissions:
  contents: read

concurrency:
  group: verify-plugin-delivery-control-chronology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: life_os
          POSTGRES_PASSWORD: life_os_test
          POSTGRES_DB: life_os_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os -d life_os_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INTEGRATION_DATABASE_URL: postgresql://life_os:life_os_test@127.0.0.1:5432/life_os_integration?sslmode=disable
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check chronology regression formatting and diff hygiene
        run: |
          pnpm exec prettier --single-quote --check \
            apps/integration-service/src/plugin-delivery-attempt-control-chronology.integration.test.ts
          git diff --check HEAD^

      - name: Build Plugin SDK dependency
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Run delivery control chronology acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-control-chronology.integration.test.ts
          --no-file-parallelism

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test
