name: Verify Planning Task Due Authority

on:
  push:
    branches:
      - feat/planning-task-due-authority-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Require workflow-free exact head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/repair-planning-due-data-rights-export.yml
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/planning-service/src/main.ts
          apps/planning-service/src/planning-domain.ts
          apps/planning-service/src/planning-runtime.ts
          apps/planning-service/src/task-due-authority.ts
          apps/planning-service/src/task-due-authority-postgres.integration.test.ts
          apps/planning-service/src/planning-data-rights.ts
          apps/planning-service/src/planning-data-rights-controller-authority.test.ts
          apps/planning-service/tests/postgres-data-rights.integration.test.ts
          apps/planning-service/migrations/README.md
      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck
      - name: Prove durable UTC task deadline authority
        run: pnpm --filter @life-os/planning-service exec vitest run --no-file-parallelism src/task-due-authority-postgres.integration.test.ts
      - name: Prove versioned deadline data-rights evidence
        run: pnpm --filter @life-os/planning-service exec vitest run --no-file-parallelism tests/postgres-data-rights.integration.test.ts src/planning-data-rights-controller-authority.test.ts
      - name: Run complete Planning suite
        run: pnpm --filter @life-os/planning-service test
      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build
