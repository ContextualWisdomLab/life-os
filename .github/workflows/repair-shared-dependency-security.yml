name: Repair shared dependency security graph

on:
  push:
    branches: [fix/qs-6-16-0-v1]

permissions:
  contents: write

concurrency:
  group: repair-shared-dependency-security-${{ github.repository }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/qs-6-16-0-v1
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Apply package-owner security floor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs = require('node:fs');

          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          if (root.packageManager !== 'pnpm@10.15.0') {
            throw new Error(`Unexpected package manager: ${root.packageManager}`);
          }
          root.pnpm ??= {};
          root.pnpm.overrides ??= {};
          root.pnpm.overrides.qs = '6.16.0';
          root.pnpm.overrides.multer = '2.3.0';
          root.pnpm.overrides.sharp = '0.35.4';
          fs.writeFileSync(rootPath, `${JSON.stringify(root, null, 2)}\n`);

          const webPath = 'apps/web/package.json';
          const web = JSON.parse(fs.readFileSync(webPath, 'utf8'));
          if (typeof web.dependencies?.next !== 'string') {
            throw new Error('apps/web does not declare next');
          }
          web.dependencies.next = '^15.5.24';
          fs.writeFileSync(webPath, `${JSON.stringify(web, null, 2)}\n`);
          NODE

      - name: Regenerate package-manager-owned lockfile
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Verify patched dependency identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').pnpm.overrides.qs")" = '6.16.0'
          test "$(node -p "require('./package.json').pnpm.overrides.multer")" = '2.3.0'
          test "$(node -p "require('./package.json').pnpm.overrides.sharp")" = '0.35.4'
          test "$(node -p "require('./apps/web/package.json').dependencies.next")" = '^15.5.24'
          pnpm list qs multer sharp next -r --depth Infinity --json > /tmp/dependency-list.json
          node <<'NODE'
          const fs = require('node:fs');
          const graph = JSON.parse(fs.readFileSync('/tmp/dependency-list.json', 'utf8'));
          const seen = new Map([
            ['qs', new Set()],
            ['multer', new Set()],
            ['sharp', new Set()],
            ['next', new Set()],
          ]);

          const visit = (value) => {
            if (Array.isArray(value)) {
              for (const entry of value) visit(entry);
              return;
            }
            if (!value || typeof value !== 'object') return;
            for (const [key, child] of Object.entries(value)) {
              if (seen.has(key) && child && typeof child === 'object' && typeof child.version === 'string') {
                seen.get(key).add(child.version);
              }
              visit(child);
            }
          };
          visit(graph);

          const exact = new Map([
            ['qs', '6.16.0'],
            ['multer', '2.3.0'],
            ['sharp', '0.35.4'],
          ]);
          for (const [name, expected] of exact) {
            const versions = [...seen.get(name)];
            console.log(`${name}: ${versions.join(', ') || '<absent>'}`);
            if (versions.length === 0 || versions.some((version) => version !== expected)) {
              throw new Error(`${name} must resolve only to ${expected}`);
            }
          }

          const nextVersions = [...seen.get('next')];
          console.log(`next: ${nextVersions.join(', ') || '<absent>'}`);
          if (nextVersions.length === 0 || nextVersions.some((version) => {
            const match = /^15\.5\.(\d+)$/.exec(version);
            return match === null || Number(match[1]) < 24;
          })) {
            throw new Error('next must resolve only to patched 15.5.24+ versions on the retained 15.5 line');
          }
          NODE
          for vulnerable in 'qs@6.15.3' 'multer@2.2.0' 'sharp@0.35.0'; do
            if grep -Fq "$vulnerable" pnpm-lock.yaml; then
              echo "::error::Vulnerable resolution remains: $vulnerable"
              exit 1
            fi
          done

      - name: Retire writer before exact candidate verification
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-shared-dependency-security.yml
          pnpm exec prettier --single-quote --check package.json apps/web/package.json
          git diff --check

      - name: Verify exact candidate contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm --filter @life-os/web build

      - name: Publish exact verified descendant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json apps/web/package.json pnpm-lock.yaml .github/workflows/repair-shared-dependency-security.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Repair produced no package-manager-owned delta.'
            exit 1
          fi
          git commit -m 'fix(security): upgrade shared vulnerable dependencies'
          remote_head="$(git ls-remote origin refs/heads/fix/qs-6-16-0-v1 | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Branch moved during verification: expected $GITHUB_SHA, found $remote_head"
            exit 1
          fi
          git push origin HEAD:fix/qs-6-16-0-v1
