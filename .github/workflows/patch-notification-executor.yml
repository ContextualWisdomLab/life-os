name: Patch notification repair executor

on:
  push:
    branches:
      - feat/notification-data-rights-contributor-v2
    paths:
      - .github/workflows/patch-notification-executor.yml

permissions: {}

concurrency:
  group: patch-notification-executor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/notification-data-rights-contributor-v2
          fetch-depth: 0

      - name: Patch executor and remove bootstrap
        env:
          EXPECTED_PARENT: da8f4ad21002100fb4b573ca3806f7fbc216acfc
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/notification-data-rights-contributor-v2:refs/remotes/origin/feat/notification-data-rights-contributor-v2'
          test "$(git rev-parse origin/feat/notification-data-rights-contributor-v2)" = "$(git rev-parse HEAD)"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/execute-notification-data-rights-repair.yml')
          workflow = path.read_text(encoding='utf-8')
          start = workflow.index("          comparator_patch = r'''source_path = Path(\n")
          end = workflow.index("\n          implement = (\n", start)
          replacement = r"""          comparator_patch = r'''source_path = Path(
              'apps/notification-service/src/notification-data-rights.ts'
          )
          source = source_path.read_text(encoding='utf-8')
          comparator_pattern = re.compile(
              r"    entries\.sort\(\(\[left\], \[right\]\) => \{\n"
              r"(?:      .*\n)+?"
              r"    \}\);",
          )
          source, comparator_replacements = comparator_pattern.subn(
              "    entries.sort(([left], [right]) =>\n"
              "      left < right ? -1 : 1,\n"
              "    );",
              source,
              count=1,
          )
          if comparator_replacements != 1:
            raise SystemExit('unexpected canonical comparator shape')
          source_path.write_text(source, encoding='utf-8')
          '''"""
          workflow = workflow[:start] + replacement + workflow[end:]
          path.write_text(workflow, encoding='utf-8')
          PY

          git rm .github/workflows/patch-notification-executor.yml
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/execute-notification-data-rights-repair.yml' \
            '.github/workflows/patch-notification-executor.yml' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git add .github/workflows/execute-notification-data-rights-repair.yml
          git commit -m 'ci(notification): tolerate comparator formatting drift'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/notification-data-rights-contributor-v2:refs/remotes/origin/feat/notification-data-rights-contributor-v2'
          test "$(git rev-parse origin/feat/notification-data-rights-contributor-v2)" = "${{ github.sha }}"
          git push origin HEAD:refs/heads/feat/notification-data-rights-contributor-v2
