name: Verify Dependency Install Authority

on:
  push:
    branches:
      - fix/pnpm-esbuild-build-script-policy-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up repository Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          packages/commercial-development-agent/src/opencode-install-contract.test.mjs
          .github/workflows/verify-dependency-install-authority.yml
      - name: Prove dependency install authority is package-bounded
        run: >-
          pnpm --filter @life-os/commercial-development-agent exec vitest run
          src/opencode-install-contract.test.mjs
