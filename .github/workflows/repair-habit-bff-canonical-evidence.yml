name: Repair Habit BFF Canonical Evidence

on:
  push:
    branches:
      - feat/web-habit-bff-v1
    paths:
      - .github/workflows/repair-habit-bff-canonical-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-habit-bff-canonical-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Guard retained finding and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 898fcccdd7c41cc2a8eae2725c114b0f36f03eee HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair hostile UUID fixtures before product mutation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/app/habit-client.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = new Map([
            ["const WORKSPACE_ID = '11111111-1111-4111-8111-111111111111';", "const WORKSPACE_ID = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';"],
            ["const HABIT_ID = '22222222-2222-4222-8222-222222222222';", "const HABIT_ID = 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb';"],
            ["const SECOND_HABIT_ID = '55555555-5555-4555-8555-555555555555';", "const SECOND_HABIT_ID = 'cccccccc-cccc-4ccc-8ccc-cccccccccccc';"],
            ["const USER_ID = '44444444-4444-4444-8444-444444444444';", "const USER_ID = 'dddddddd-dddd-4ddd-8ddd-dddddddddddd';"],
            ["const SESSION_ID = '33333333-3333-4333-8333-333333333333';", "const SESSION_ID = 'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee';"],
          ]);
          for (const [before, after] of replacements) {
            const occurrences = source.split(before).length - 1;
            if (occurrences !== 1) {
              throw new Error(`Expected exactly one hostile-fixture source occurrence for ${before}, found ${occurrences}`);
            }
            source = source.replace(before, after);
          }
          const canonical = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
          if (canonical.toUpperCase() === canonical) {
            throw new Error('Hostile UUID fixture must contain alphabetic hexadecimal digits.');
          }
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --single-quote --write apps/web/app/habit-client.test.ts

      - name: Prove corrected canonical UUID evidence RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter @life-os/web exec tsx --test --test-name-pattern='noncanonical' app/habit-client.test.ts; then
            echo 'Expected alpha-bearing noncanonical UUID aliases to fail before production repair.' >&2
            exit 1
          fi

      - name: Apply minimum canonical UUID repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/app/habit-client.ts';
          let source = fs.readFileSync(path, 'utf8');
          const patternBefore = `const UUID_V4_PATTERN =
            /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;`;
          const patternAfter = `const UUID_V4_PATTERN =
            /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;`;
          const uuidBefore = `function requireUuid(value: unknown): string {
            if (typeof value !== 'string' || !UUID_V4_PATTERN.test(value)) {
              throw new Error('Habit identifier is invalid');
            }
            return value.toLowerCase();
          }`;
          const uuidAfter = `function requireUuid(value: unknown): string {
            if (typeof value !== 'string' || !UUID_V4_PATTERN.test(value)) {
              throw new Error('Habit identifier is invalid');
            }
            return value;
          }`;
          for (const [before, after, label] of [
            [patternBefore, patternAfter, 'UUID pattern'],
            [uuidBefore, uuidAfter, 'UUID validator'],
          ]) {
            const occurrences = source.split(before).length - 1;
            if (occurrences !== 1) {
              throw new Error(`Expected exactly one ${label} occurrence, found ${occurrences}`);
            }
            source = source.replace(before, after);
          }
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --single-quote --write apps/web/app/habit-client.ts

      - name: Prove focused canonical UUID GREEN
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          --test-name-pattern='noncanonical' app/habit-client.test.ts

      - name: Typecheck Web package
        run: pnpm --filter @life-os/web typecheck

      - name: Run complete Web suite
        run: pnpm --filter @life-os/web test

      - name: Guard bounded fixture and source delta
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check apps/web/app/habit-client.ts apps/web/app/habit-client.test.ts
          git diff --check
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'apps/web/app/habit-client.test.ts' \
            'apps/web/app/habit-client.ts' | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary fixture and source descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/app/habit-client.ts apps/web/app/habit-client.test.ts
          git commit -m 'fix(web): require canonical Habit UUID evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
