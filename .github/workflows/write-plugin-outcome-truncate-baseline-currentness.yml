name: Write plugin outcome truncation baseline currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: write-plugin-outcome-truncate-baseline-currentness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Replace only Integration currentness block
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start = '> **Currentness override — 2026-09-09 Integration delivery authority.**'
          end = '> Durable origin/delivery/claim/retry/outcome identity is not outbound-network authority.'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('bounded Integration currentness markers are not unique')
          a = text.index(start)
          b = text.index(end, a)
          b = text.index('\n', b) + 1
          replacement = '''> **Currentness override — 2026-09-09 Integration delivery authority.** Protected `main` remains `193a87ef54c3fe6dcda4755bce4d6bc81e3a0297`. Integration #252 remains Draft/unshipped exact `9ed7847d3106d9418e1ff6e04e45c1c7d84d0b0d`; its hostile durable-evidence proof head `ec2353a003c15c9f464b5d5d2454d3593427d768` completed run `34213508199` / job `102019765395` GREEN, and CHANGELOG descendant `fe51a79c1e19cc7fb14e5296f04b3f91b41bf535` completed run `34213937828` / job `102021136219` GREEN before the purpose verifier was retired.\n\n> #253 is the direct #252 claim/lease child and remains Draft/unshipped exact `8252575a510254883cb62c44198cb665daa0d0b5`. Its retained lineage owns deterministic finite 30–3600 second worker claims with token digest-only persistence and atomic due/retry-budget acquisition.\n\n> #254 is the direct #253 retry/backoff child and remains Draft/unshipped exact `edc79d1291025b8787a9ccf16c39a10df4157023`. Exact proof head `ca22c71e4f2ec11de6539df79632376d4134f90a`, run `34237354956`, job `102098403313`, completed GREEN on Ubuntu 24.04/PostgreSQL 16 across frozen install, formatting/diff hygiene, Plugin SDK build, focused retry acceptance, real PostgreSQL retry/exhaustion acceptance, Integration typecheck and the complete Integration suite.\n\n> #255 is the direct #254 append-only outcome-ledger child and remains Draft/unshipped exact `e201b649cdea7d50ee2b856ac98a01d2b6c1368e`. Its source-transition review already proved and repaired direct forged INSERT. A subsequent append-only review found row-level UPDATE/DELETE protection still allowed PostgreSQL `TRUNCATE` to erase accepted evidence. Regression `675460dbc0803e188b4d49aed43eb51f2a683cd8` plus verifier exact `f728835cbb57efb6840cd97f96d1e9ef392546c0`, run `34252044527`, job `102148573723`, passed checkout, frozen install, formatting/diff hygiene and Plugin SDK build before real PostgreSQL acceptance failed exactly because TRUNCATE succeeded; the other six focused outcome tests passed. Minimum migration-only repair `d731abda5da6931a684c73b2786a276c4288ab29` adds a statement-level `BEFORE TRUNCATE` guard using the same fixed SQLSTATE `55000` append-only rejection function. Exact run `34252162271`, job `102148973258`, completed GREEN with focused outcome acceptance 7/7, Integration typecheck and the complete Integration suite 434 passed / 3 environment-dependent skipped across 74 files (72 passed / 2 skipped). Current #255 removes only the purpose-complete truncation verifier after that proven head.\n\n> Durable origin/delivery/claim/retry/outcome identity is not outbound-network authority. Fresh `ContextualWisdomLab/EgressWeave` release inventory remains empty, so a later executor remains fail closed rather than consuming mutable sibling source.\n'''
          path.write_text(text[:a] + replacement + text[b:])
          PY
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "docs/product-technical-gap-baseline.md "

      - name: Retire writer and publish ordinary descendant
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/write-plugin-outcome-truncate-baseline-currentness.yml
          git commit -m 'docs: record outcome truncation boundary proof'
          git push origin "HEAD:${BRANCH_NAME}"
