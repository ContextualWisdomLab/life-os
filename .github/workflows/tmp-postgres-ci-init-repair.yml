name: Temporary PostgreSQL CI init repair

on:
  push:
    branches: [fix/postgres-ci-init-contract-v1]

permissions:
  contents: write

concurrency:
  group: postgres-ci-init-repair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify single-writer lease
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/postgres-ci-init-contract-v1 | cut -f1)"
          test "$remote_head" = "${GITHUB_SHA}"

      - name: Apply causal PostgreSQL service repair
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          const oldImage = 'postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777';
          const newImage = 'postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825';
          const workflowCounts = new Map([
            ['.github/workflows/ci.yml', 3],
            ['.github/workflows/ai-proposal-live-conformance.yml', 1],
            ['.github/workflows/opencode-commercial-development.yml', 1],
          ]);

          for (const [path, expectedCount] of workflowCounts) {
            let source = readFileSync(path, 'utf8');
            const imageCount = source.split(oldImage).length - 1;
            if (imageCount !== expectedCount) {
              throw new Error(`${path}: expected ${expectedCount} legacy PostgreSQL image references, found ${imageCount}`);
            }
            source = source.split(oldImage).join(newImage);

            const passwordLine = '          POSTGRES_PASSWORD: postgres\n';
            const passwordCount = source.split(passwordLine).length - 1;
            if (passwordCount !== expectedCount) {
              throw new Error(`${path}: expected ${expectedCount} PostgreSQL password anchors, found ${passwordCount}`);
            }
            const explicitAuth =
              passwordLine +
              '          POSTGRES_HOST_AUTH_METHOD: scram-sha-256\n' +
              '          POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256\n';
            source = source.split(passwordLine).join(explicitAuth);
            writeFileSync(path, source);
          }

          const workflowContractPath = 'packages/commercial-development-agent/src/workflow-contract.test.mjs';
          let workflowContract = readFileSync(workflowContractPath, 'utf8');
          const contractImageCount = workflowContract.split(oldImage).length - 1;
          if (contractImageCount !== 1) {
            throw new Error(`workflow contract expected one legacy image reference, found ${contractImageCount}`);
          }
          workflowContract = workflowContract.split(oldImage).join(newImage);
          const readinessAnchor = "    expect(workflow).toContain('pg_isready -U postgres -d life_os_test');\n";
          if (!workflowContract.includes(readinessAnchor)) {
            throw new Error('workflow contract readiness anchor missing');
          }
          workflowContract = workflowContract.replace(
            readinessAnchor,
            "    expect(workflow).toContain('POSTGRES_HOST_AUTH_METHOD: scram-sha-256');\n" +
              "    expect(workflow).toContain(\n" +
              "      'POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256',\n" +
              "    );\n" +
              readinessAnchor,
          );
          writeFileSync(workflowContractPath, workflowContract);

          const changelogPath = 'CHANGELOG.md';
          let changelog = readFileSync(changelogPath, 'utf8');
          const bullet = '- CI PostgreSQL service initialization now uses an immutable locale-capable PostgreSQL 16 Debian image with explicit SCRAM authentication for local and host connections, preventing implicit trust-authentication and missing-locale startup warnings.\n';
          if (!changelog.includes(bullet)) {
            const marker = '### Fixed\n\n';
            if (!changelog.includes(marker)) throw new Error('CHANGELOG Fixed marker missing');
            changelog = changelog.replace(marker, marker + bullet);
            writeFileSync(changelogPath, changelog);
          }
          NODE

          cat > docs/operations/postgresql-ci-service-boundary.md <<'DOC'
          # PostgreSQL CI service boundary

          LifeOS CI uses PostgreSQL as an ephemeral service boundary for database-backed acceptance tests. The service image and bootstrap authentication are part of the reviewed test environment rather than ambient runner defaults.

          ## Decision

          The affected hosted CI and scheduled conformance/development workflows use the Docker Official PostgreSQL `16.15-bookworm` image pinned by digest:

          `sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825`

          Initialization sets both `POSTGRES_HOST_AUTH_METHOD=scram-sha-256` and `POSTGRES_INITDB_ARGS=--auth-local=scram-sha-256 --auth-host=scram-sha-256`. Database clients continue to use the service-owned `postgres` test credential. The health probe remains `pg_isready`, while application acceptance uses authenticated PostgreSQL connections.

          ## Evidence and rationale

          The previous pinned Alpine service emitted `sh: locale: not found`, `WARNING: no usable system locales were found`, and `initdb: warning: enabling "trust" authentication for local connections` on hosted Ubuntu runners. A hosted candidate probe against the pinned Bookworm image verified both explicit SCRAM/SCRAM and peer/SCRAM profiles without those warnings and with an authenticated TCP query succeeding. LifeOS selected SCRAM for both local and host bootstrap paths so the policy is explicit and credential-bound instead of relying on operating-system user identity inside the service container.

          The Debian variant was selected over adding Alpine locale packages at runtime. Runtime package installation would make CI initialization depend on an additional mutable network/package-manager step and would not address the implicit authentication policy by itself. Warning filtering was rejected because it would hide the control failure rather than remove it.

          PostgreSQL `initdb` defines `--auth-local` and `--auth-host` as the bootstrap controls for `pg_hba.conf`. The Docker Official Image passes `POSTGRES_INITDB_ARGS` through to `initdb`; `POSTGRES_HOST_AUTH_METHOD` remains explicit so the container entrypoint and generated host rule agree on SCRAM.

          ## Verification and rollback

          A change to this boundary must prove all of the following on one exact candidate head:

          - every owned PostgreSQL service block uses the reviewed immutable image and explicit authentication settings;
          - initialization logs contain none of `no usable system locales were found`, `enabling "trust" authentication`, or `sh: locale: not found`;
          - a password-authenticated TCP query succeeds;
          - PostgreSQL-backed LifeOS acceptance remains GREEN.

          Rollback means reverting the complete image/authentication change together. Do not retain the Debian image while silently restoring implicit authentication, and do not suppress initialization diagnostics.

          ## References

          - PostgreSQL Global Development Group. (2026). *PostgreSQL 16: initdb*. https://www.postgresql.org/docs/16/app-initdb.html
          - Docker, Inc. (2026). *Postgres Official Image*. https://hub.docker.com/_/postgres
          DOC

          rm -f .github/workflows/tmp-postgres-auth-profile-probe.yml
          rm -f .github/workflows/tmp-postgres-ci-init-repair.yml

      - name: Verify source contract without dependency installation
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check packages/commercial-development-agent/src/postgres-ci-service-contract.test.mjs
          node --check packages/commercial-development-agent/src/workflow-contract.test.mjs
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const image = 'postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825';
          const paths = [
            ['.github/workflows/ci.yml', 3],
            ['.github/workflows/ai-proposal-live-conformance.yml', 1],
            ['.github/workflows/opencode-commercial-development.yml', 1],
          ];
          for (const [path, expected] of paths) {
            const source = readFileSync(path, 'utf8');
            if ((source.split(image).length - 1) !== expected) throw new Error(`${path}: image count`);
            if ((source.split('POSTGRES_HOST_AUTH_METHOD: scram-sha-256').length - 1) !== expected) throw new Error(`${path}: host auth count`);
            if ((source.split('POSTGRES_INITDB_ARGS: --auth-local=scram-sha-256 --auth-host=scram-sha-256').length - 1) !== expected) throw new Error(`${path}: initdb auth count`);
          }
          NODE
          git diff --check

      - name: Verify exact runtime profile
        shell: bash
        run: |
          set -Eeuo pipefail
          image='postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825'
          name='lifeos-postgres-repair'
          log="${RUNNER_TEMP}/postgres.log"
          cleanup() { docker rm -f "$name" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$name" \
            -e POSTGRES_DB=life_os_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=scram-sha-256 \
            -e 'POSTGRES_INITDB_ARGS=--auth-local=scram-sha-256 --auth-host=scram-sha-256' \
            "$image" >/dev/null
          for _ in $(seq 1 60); do
            if docker exec "$name" pg_isready -U postgres -d life_os_test >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -e PGPASSWORD=postgres "$name" \
            psql -h 127.0.0.1 -U postgres -d life_os_test -v ON_ERROR_STOP=1 -tAc 'SELECT 1' |
            grep -Fx 1
          docker logs "$name" >"$log" 2>&1
          ! grep -Fq 'no usable system locales were found' "$log"
          ! grep -Fq 'enabling "trust" authentication' "$log"
          ! grep -Fq 'sh: locale: not found' "$log"

      - name: Publish ordinary descendant
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin refs/heads/fix/postgres-ci-init-contract-v1 | cut -f1)"
          test "$remote_head" = "${GITHUB_SHA}"
          git config user.name 'LifeOS PostgreSQL CI repair'
          git config user.email 'postgres-ci-repair@life-os.invalid'
          git add .
          git commit -m 'fix(ci): make PostgreSQL initialization explicit'
          git push origin HEAD:refs/heads/fix/postgres-ci-init-contract-v1
