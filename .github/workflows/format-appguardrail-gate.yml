name: Format AppGuardrail Gate

on:
  push:
    branches: [feat/appguardrail-security-gate]

permissions:
  contents: write

concurrency:
  group: format-appguardrail-gate
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/appguardrail-security-gate
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format AppGuardrail gate files
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            packages/appguardrail-contract/src/verify-contract.mjs \
            packages/appguardrail-contract/src/verify-contract.test.mjs \
            tests/appguardrail-fixtures/dangerous-cors.ts \
            docs/superpowers/plans/2026-08-03-appguardrail-security-gate.md \
            apps/identity-service/src/tests/oauth-provider-response.test.ts
          git rm .github/workflows/format-appguardrail-gate.yml

      - name: Commit formatted files and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/appguardrail-contract/src/verify-contract.mjs \
            packages/appguardrail-contract/src/verify-contract.test.mjs \
            tests/appguardrail-fixtures/dangerous-cors.ts \
            docs/superpowers/plans/2026-08-03-appguardrail-security-gate.md \
            apps/identity-service/src/tests/oauth-provider-response.test.ts \
            .github/workflows/format-appguardrail-gate.yml
          git diff --cached --check
          git commit -m "chore: format AppGuardrail security gate"
          git push origin HEAD:feat/appguardrail-security-gate
