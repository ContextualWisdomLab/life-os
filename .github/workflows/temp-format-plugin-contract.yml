name: Temporary plugin contract formatter

on:
  push:
    branches:
      - feat/versioned-plugin-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/versioned-plugin-contract
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format new integration files
        run: >-
          pnpm exec prettier --single-quote --write
          apps/integration-service
          packages/plugin-sdk
          docs/superpowers/plans/2026-08-04-versioned-plugin-contract-slice.md
      - name: Commit formatted files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/integration-service packages/plugin-sdk docs/superpowers/plans/2026-08-04-versioned-plugin-contract-slice.md
          git diff --cached --quiet || git commit -m "style(integrations): apply repository formatting"
          git push origin HEAD:feat/versioned-plugin-contract
