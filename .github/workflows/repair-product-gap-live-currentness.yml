name: Repair Product Gap Live Currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20
    paths:
      - .github/workflows/repair-product-gap-live-currentness.yml

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: repair-product-gap-live-currentness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact documentation head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Guard exact publication input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Replace only the live-currentness block from fresh GitHub state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const repository = 'ContextualWisdomLab/life-os';
          const documentPath = 'docs/product-technical-gap-baseline.md';
          const startMarker = '<!-- life-os-live-currentness:start -->';
          const endMarker = '<!-- life-os-live-currentness:end -->';
          const trackedPullRequests = [
            214, 237, 247, 249, 252, 253, 254, 255, 256, 257, 258,
            260, 261, 264, 269, 273, 281, 282, 283,
          ];

          function api(path) {
            return JSON.parse(
              execFileSync('gh', ['api', path], {
                encoding: 'utf8',
                env: process.env,
              }),
            );
          }

          function formatRun(run) {
            if (!run) return 'no exact-head workflow found in the current query window';
            return `${run.name} \`${run.id}\` ${run.status}${
              run.conclusion ? `/${run.conclusion}` : ''
            }`;
          }

          const mainRef = api(`repos/${repository}/git/ref/heads/main`);
          const mainSha = mainRef.object.sha;
          const rows = [];

          for (const number of trackedPullRequests) {
            const pr = api(`repos/${repository}/pulls/${number}`);
            const headSha = pr.head.sha;
            const runs = api(
              `repos/${repository}/actions/runs?head_sha=${headSha}&per_page=100`,
            ).workflow_runs.filter((run) => run.head_sha === headSha);
            rows.push(
              `> PR #${number}: head \`${headSha}\`, base \`${pr.base.sha}\`, state \`${pr.state}\`, draft \`${Boolean(
                pr.draft,
              )}\`, mergeable \`${String(pr.mergeable)}\`; latest exact-head workflow: ${formatRun(
                runs[0],
              )}.`,
            );
          }

          const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
          const replacement = [
            startMarker,
            `> **Live currentness override — ${timestamp}.** This block supersedes conflicting active head/base/run identifiers below while preserving the dated ledger as audit history. It does not promote any active PR, predecessor proof, queued workflow, mutable owner branch, or documentation claim to protected/shipped truth.`,
            '>',
            `> Protected \`main\`: \`${mainSha}\`.`,
            '>',
            `> PR #211 publication lane: input exact \`${process.env.GITHUB_SHA}\`; this block is generated in its immediate ordinary publication descendant, so live PR metadata is authoritative for the final self-referential publication SHA.`,
            '>',
            ...rows.flatMap((row) => [row, '>']),
            '> Mutable sibling heads and unreleased external owner contracts remain non-consumable. Predecessor GREEN/RED remains ancestry evidence only after any head/base movement; purpose-complete temporary writers must be absent from the published descendant.',
            endMarker,
          ].join('\n');

          const source = fs.readFileSync(documentPath, 'utf8');
          const startIndex = source.indexOf(startMarker);
          const endIndex = source.indexOf(endMarker);
          if (
            startIndex < 0 ||
            endIndex < 0 ||
            startIndex !== source.lastIndexOf(startMarker) ||
            endIndex !== source.lastIndexOf(endMarker) ||
            endIndex <= startIndex
          ) {
            throw new Error('Live-currentness markers are missing, duplicated, or out of order');
          }
          const afterEnd = endIndex + endMarker.length;
          const updated = source.slice(0, startIndex) + replacement + source.slice(afterEnd);
          fs.writeFileSync(documentPath, updated);
          NODE

          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/repair-product-gap-live-currentness.yml

          allowed="$(printf '%s\n' \
            .github/workflows/repair-product-gap-live-currentness.yml \
            docs/product-technical-gap-baseline.md | sort)"
          changed="$(git diff --cached --name-only | sort)"
          test "$changed" = "$allowed"
          grep -q '<!-- life-os-live-currentness:start -->' docs/product-technical-gap-baseline.md
          grep -q '<!-- life-os-live-currentness:end -->' docs/product-technical-gap-baseline.md
          test "$(grep -c '<!-- life-os-live-currentness:start -->' docs/product-technical-gap-baseline.md)" -eq 1
          test "$(grep -c '<!-- life-os-live-currentness:end -->' docs/product-technical-gap-baseline.md)" -eq 1
          git diff --check --cached

      - name: Publish byte-preserving currentness repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh live product-gap currentness"
          test "$(git show -s --format=%P HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
