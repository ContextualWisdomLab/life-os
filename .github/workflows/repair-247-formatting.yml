name: Repair PR 247 formatting

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - .github/workflows/repair-247-formatting.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify writer input lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d44bbedfea8bf65e95dbe745ef4edd4ba948a9ea"
          remote_head="$(git ls-remote origin refs/heads/fix/actions-draft-queue-pressure-v1 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
      - name: Canonicalize only the failing owned file
        run: pnpm exec prettier --single-quote --write packages/commercial-readiness/src/github-client.mjs
      - name: Verify Commercial Readiness package
        run: |
          pnpm exec prettier --single-quote --check packages/commercial-readiness/src/github-client.mjs
          pnpm --filter @life-os/commercial-readiness test
          pnpm --filter @life-os/commercial-readiness typecheck
          git diff --check
      - name: Retire writer and publish tested candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-247-formatting.yml
          remote_head="$(git ls-remote origin refs/heads/fix/actions-draft-queue-pressure-v1 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(commercial-readiness): canonicalize GitHub client'
          git push origin HEAD:fix/actions-draft-queue-pressure-v1
