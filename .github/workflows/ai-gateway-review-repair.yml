name: AI gateway review repair

on:
  push:
    branches: [feat/ai-authenticated-gateway-context]

permissions:
  contents: write

concurrency:
  group: ai-gateway-review-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-authenticated-gateway-context
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed security repairs
        run: python3 .github/scripts/address_ai_gateway_review.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format reviewed files
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/no-silent-mutation.integration.test.ts \
            apps/ai-service/src/proposal-audit-http.integration.test.ts \
            apps/web/app/ai-proposal-client.test.ts \
            docs/superpowers/plans/2026-08-04-ai-authenticated-gateway-context.md

      - name: Verify complete repository
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config --quiet

      - name: Commit verified repair and remove temporary automation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git restore --worktree pnpm-lock.yaml 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f \
            .github/scripts/address_ai_gateway_review.py \
            .github/workflows/ai-gateway-review-repair.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No reviewed AI gateway repair was produced.' >&2
            exit 1
          fi
          git commit -m "fix(ai): remove credential-shaped gateway fixtures"
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-authenticated-gateway-context
