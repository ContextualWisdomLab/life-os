name: Diagnose plugin delivery profile formatting

on:
  push:
    branches:
      - perf/plugin-delivery-status-k6-v1
    paths:
      - .github/workflows/diagnose-plugin-delivery-profile-formatting.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Install frozen workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
      - name: Print canonical profiler formatting patch
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            apps/integration-service/perf/profile-plugin-delivery-status.mjs
          git --no-pager diff --check
          git --no-pager diff -- \
            apps/integration-service/perf/profile-plugin-delivery-status.mjs
