name: Diagnose OpenCode Commercial Agent Coverage

on:
  push:
    branches:
      - feat/opencode-commercial-development-loop
    paths:
      - '.github/workflows/diagnose-opencode-coverage.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/opencode-commercial-development-loop
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Materialize the exact candidate tree locally
        run: |
          set -Eeuo pipefail
          corepack enable
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('package.json')
          document = json.loads(root.read_text(encoding='utf-8'))
          pnpm = document.setdefault('pnpm', {})
          allowed = pnpm.setdefault('onlyBuiltDependencies', [])
          pnpm['onlyBuiltDependencies'] = sorted(set([*allowed, 'opencode-ai']))
          root.write_text(json.dumps(document, indent=2) + '\n', encoding='utf-8')

          workflow = Path('.github/workflows/opencode-commercial-development.yml')
          text = workflow.read_text(encoding='utf-8').replace(
              "OPENCODE_PACKAGE_VERSION: '__PINNED_BY_BOOTSTRAP__'",
              "OPENCODE_PACKAGE_VERSION: '1.18.15'",
              1,
          )
          workflow.write_text(text, encoding='utf-8')

          package = Path('packages/commercial-development-agent/package.json')
          package_data = json.loads(package.read_text(encoding='utf-8'))
          package_data['scripts']['lint'] = package_data['scripts']['lint'].replace(
              ' "fixtures/**/*.json"',
              '',
          )
          package.write_text(
              json.dumps(package_data, indent=2) + '\n',
              encoding='utf-8',
          )

          vitest = Path('packages/commercial-development-agent/vitest.config.mjs')
          config = vitest.read_text(encoding='utf-8').replace(
              "reporter: ['text', 'json-summary']",
              "reporter: ['text', 'json', 'json-summary']",
              1,
          )
          vitest.write_text(config, encoding='utf-8')
          PY
          pnpm --filter @life-os/commercial-development-agent add \
            --save-dev \
            --save-exact \
            opencode-ai@1.18.15
          python3 .github/scripts/finalize-opencode-commercial-agent-contracts.py
          pnpm exec prettier --single-quote --write \
            packages/commercial-development-agent/package.json \
            packages/commercial-development-agent/vitest.config.mjs \
            packages/commercial-development-agent/src \
            .github/workflows/opencode-commercial-development.yml

      - name: Run coverage and print every uncovered statement and branch
        working-directory: packages/commercial-development-agent
        run: |
          set +e
          pnpm test
          status=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const coverage = JSON.parse(
            fs.readFileSync(path.join('coverage', 'coverage-final.json'), 'utf8'),
          );
          for (const [file, entry] of Object.entries(coverage)) {
            const statements = Object.entries(entry.s)
              .filter(([, count]) => count === 0)
              .map(([id]) => entry.statementMap[id]);
            const functions = Object.entries(entry.f)
              .filter(([, count]) => count === 0)
              .map(([id]) => entry.fnMap[id]);
            const branches = [];
            for (const [id, counts] of Object.entries(entry.b)) {
              counts.forEach((count, index) => {
                if (count === 0) {
                  branches.push({ map: entry.branchMap[id], index });
                }
              });
            }
            if (statements.length || functions.length || branches.length) {
              console.log(`UNCOVERED ${file}`);
              console.log(JSON.stringify({ statements, functions, branches }, null, 2));
            }
          }
          NODE
          exit "$status"
