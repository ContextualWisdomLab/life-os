name: Repair Gateway Today Canonical Evidence Formatting

on:
  push:
    branches:
      - test/gateway-today-canonical-evidence-v1

permissions:
  contents: write

concurrency:
  group: repair-gateway-today-canonical-evidence-formatting
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/gateway-today-canonical-evidence-v1
          fetch-depth: 2

      - name: Guard bounded parent and current remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7dd50ca5a3fec37561bac0b4fd671401c8b79e9f"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r remote_head _ < <(git ls-remote --refs origin refs/heads/test/gateway-today-canonical-evidence-v1)
          test "$remote_head" = "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install frozen workspace
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format bounded evidence files
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/gateway/src/today-canonical-evidence.test.ts \
            .github/workflows/verify-gateway-today-canonical-evidence.yml
          pnpm exec prettier --check \
            apps/gateway/src/today-canonical-evidence.test.ts \
            .github/workflows/verify-gateway-today-canonical-evidence.yml
          git diff --check

      - name: Publish ordinary self-retiring descendant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/gateway/src/today-canonical-evidence.test.ts \
            .github/workflows/verify-gateway-today-canonical-evidence.yml
          git rm .github/workflows/repair-gateway-today-canonical-evidence-formatting.yml
          git commit -m "test(gateway): format canonical Today evidence"
          git push origin HEAD:test/gateway-today-canonical-evidence-v1
