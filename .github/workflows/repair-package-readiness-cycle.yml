name: Repair package readiness cycle

on:
  push:
    branches: [fix/qs-6-16-0-v1]

permissions:
  contents: write

concurrency:
  group: repair-package-readiness-cycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      PRIVACY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact package owner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: fix/qs-6-16-0-v1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Verify exact cycle RED source
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq '}...${encodeURIComponent(headSha)}`,' packages/commercial-readiness/src/github-client.mjs
          if test -e packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs; then
            echo '::error::Compare-payload regression already exists; refusing duplicate bridge repair.'
            exit 1
          fi

      - name: Adopt canonical Finding 68 regression and causal repair
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { it } from 'node:test';
          import { collectRepositorySnapshot } from './github-client.mjs';

          it('requests compare freshness from a file-free paginated response', async () => {
            const headSha = 'a'.repeat(40);
            const baseSha = 'b'.repeat(40);
            const comparePath = `/repos/o/r/compare/${baseSha}...${headSha}?per_page=1&page=2`;
            const calls = [];
            const client = {
              async requestJson(path) {
                calls.push(path);
                if (path.startsWith('/repos/o/r/pulls?')) return [{ number: 7 }];
                if (path.startsWith('/repos/o/r/issues?')) return [];
                if (path === '/repos/o/r/pulls/7') {
                  return {
                    number: 7,
                    title: 'bounded compare fixture',
                    state: 'open',
                    draft: false,
                    mergeable: true,
                    mergeable_state: 'clean',
                    author_association: 'OWNER',
                    user: { login: 'owner' },
                    base: { ref: 'main', sha: baseSha },
                    head: { sha: headSha, repo: { full_name: 'o/r' } },
                  };
                }
                if (path.startsWith('/repos/o/r/pulls/7/reviews?')) return [];
                if (path.startsWith('/repos/o/r/actions/runs?')) {
                  return { total_count: 0, workflow_runs: [] };
                }
                if (path.startsWith(`/repos/o/r/commits/${headSha}/statuses?`)) return [];
                if (path.startsWith('/repos/o/r/compare/')) {
                  return {
                    url: `https://api.github.com/repos/o/r/compare/${baseSha}...${headSha}`,
                    base_commit: { sha: baseSha },
                    merge_base_commit: { sha: baseSha },
                    behind_by: 0,
                  };
                }
                if (path === '/graphql') {
                  return {
                    data: {
                      repository: {
                        pullRequest: {
                          reviewThreads: {
                            nodes: [],
                            pageInfo: { hasNextPage: false, endCursor: null },
                          },
                        },
                      },
                    },
                  };
                }
                throw new Error(`Unexpected path: ${path}`);
              },
            };

            const snapshot = await collectRepositorySnapshot(client, 'o/r', {
              policy: {
                default_branch: 'main',
                trusted_author_associations: ['OWNER'],
                required_workflows: [],
                required_statuses: [],
                merge_method: 'squash',
              },
              commitSha: 'c'.repeat(40),
              generatedAt: '2026-09-09T20:15:00Z',
            });

            assert.equal(snapshot.pull_requests[0].behind_by, 0);
            assert.ok(calls.includes(comparePath));
            assert.equal(
              calls.some(
                (path) =>
                  path.startsWith(`/repos/o/r/compare/${baseSha}...${headSha}`) &&
                  path !== comparePath,
              ),
              false,
            );
          });
          EOF

          python3 - <<'PY'
          from pathlib import Path

          source = Path('packages/commercial-readiness/src/github-client.mjs')
          text = source.read_text(encoding='utf-8')
          old = "        )}...${encodeURIComponent(headSha)}`,\n"
          new = "        )}...${encodeURIComponent(headSha)}?per_page=1&page=2`,\n"
          if text.count(old) != 1:
              raise SystemExit('expected exactly one unbounded compare request')
          source.write_text(text.replace(old, new), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          body = changelog.read_text(encoding='utf-8')
          bullet = '- Commercial Readiness now requests compare freshness from a file-free paginated GitHub response, preserving exact base/merge-base/behind provenance without downloading the changed-file payload that can exceed the bounded response envelope.\n'
          if bullet not in body:
              marker = '### Fixed\n\n'
              if body.count(marker) != 1:
                  raise SystemExit('CHANGELOG Fixed marker is ambiguous')
              body = body.replace(marker, marker + bullet, 1)
              changelog.write_text(body, encoding='utf-8')
          PY

      - name: Retire purpose writer before candidate verification
        run: rm .github/workflows/repair-package-readiness-cycle.yml

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify focused causal contract
        run: |
          pnpm exec prettier --single-quote --check \
            packages/commercial-readiness/src/github-client.mjs \
            packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs \
            CHANGELOG.md
          pnpm --filter @life-os/commercial-readiness build
          pnpm --filter @life-os/commercial-readiness test

      - name: Verify package foundation remains patched
        shell: bash
        run: |
          set -Eeuo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const web = JSON.parse(fs.readFileSync('apps/web/package.json', 'utf8'));
          if (root.packageManager !== 'pnpm@10.15.0') throw new Error('package manager drift');
          if (root.pnpm?.overrides?.qs !== '6.16.0') throw new Error('qs floor drift');
          if (root.pnpm?.overrides?.multer !== '2.3.0') throw new Error('multer floor drift');
          if (root.pnpm?.overrides?.sharp !== '0.35.4') throw new Error('sharp floor drift');
          if (web.dependencies?.next !== '^15.5.24') throw new Error('Next.js retained-line floor drift');
          NODE
          test ! -e .github/workflows/repair-package-readiness-cycle.yml
          git diff --check

      - name: Publish exact non-force descendant
        shell: bash
        env:
          EXPECTED_PARENT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/commercial-readiness/src/github-client.mjs \
            packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs \
            CHANGELOG.md \
            .github/workflows/repair-package-readiness-cycle.yml
          git commit -m 'fix(commercial-readiness): adopt bounded compare evidence'
          remote_head="$(git ls-remote origin refs/heads/fix/qs-6-16-0-v1 | cut -f1)"
          if [ "$remote_head" != "$EXPECTED_PARENT" ]; then
            echo '::error::Package owner branch moved during repair; refusing publication.'
            exit 1
          fi
          git push origin HEAD:refs/heads/fix/qs-6-16-0-v1
