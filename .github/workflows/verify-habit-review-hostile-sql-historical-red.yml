name: Verify Habit Review Hostile SQL Historical RED

on:
  push:
    branches:
      - feat/habit-review-period-projection-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout historical regression-only head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: 94dfb860efbc372a6235a6a99ac7d53b8c3a20f5
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install historical frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Prove historical hostile-evidence boundary
        shell: bash
        run: |
          set +e
          pnpm --filter @life-os/habit-service exec vitest run src/habit-review-projection-hostile-sql.test.ts -t "collapses a revoked query-result envelope before reading rows" --reporter=verbose 2>&1 | tee /tmp/habit-review-envelope.log
          envelope_status=${PIPESTATUS[0]}
          pnpm --filter @life-os/habit-service exec vitest run src/habit-review-projection-hostile-sql.test.ts -t "collapses a revoked row collection before reading cardinality" --reporter=verbose 2>&1 | tee /tmp/habit-review-rows.log
          rows_status=${PIPESTATUS[0]}
          pnpm --filter @life-os/habit-service exec vitest run src/habit-review-projection-hostile-sql.test.ts -t "collapses a revoked durable row before reading Habit authority fields" --reporter=verbose 2>&1 | tee /tmp/habit-review-row.log
          row_status=${PIPESTATUS[0]}
          set -e

          # Promise resolution probes `then` before the repository receives a
          # resolved object. A revoked top-level envelope is therefore already
          # converted by the existing query-rejection boundary on this historical
          # head; it is retained as a GREEN boundary control, not mislabelled RED.
          test "$envelope_status" -eq 0

          # The two post-resolution evidence shapes really reached repository
          # property access and escaped a native TypeError pre-repair. Vitest 3
          # abbreviates the native revoked-Proxy message in verbose output, so
          # assert the stable reporter facts instead of grepping truncated text.
          test "$rows_status" -ne 0
          test "$row_status" -ne 0
          grep -F "expected TypeError:" /tmp/habit-review-rows.log
          grep -F "to be an instance of HabitPersistenceError" /tmp/habit-review-rows.log
          grep -F "expected TypeError:" /tmp/habit-review-row.log
          grep -F "to be an instance of HabitPersistenceError" /tmp/habit-review-row.log
      - name: Checkout exact current head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install current frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check current focused formatting
        run: pnpm exec prettier --check apps/habit-service/src/postgres-habit-repository.ts apps/habit-service/src/habit-review-projection-hostile-sql.test.ts apps/habit-service/src/habit-review-projection-postgres.test.ts
      - name: Prove current hostile-evidence GREEN
        run: pnpm --filter @life-os/habit-service exec vitest run src/habit-review-projection-hostile-sql.test.ts src/habit-review-projection-postgres.test.ts
      - name: Typecheck Habit
        run: pnpm --filter @life-os/habit-service typecheck
