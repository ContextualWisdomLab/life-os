name: Repair Planning completion export boundary

on:
  push:
    branches:
      - feat/planning-task-completion-history-v1
    paths:
      - .github/workflows/repair-planning-completion-export.yml

permissions:
  contents: write

concurrency:
  group: planning-completion-export-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply purpose-bound export repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/planning-service/src/planning-data-rights.ts')
          text = path.read_text()
          replacements = [
              (
                  "interface PlanningTaskCompletionFactExportRow {\n  completion_sequence: unknown;\n  task_id: unknown;\n  completed_at: unknown;\n}",
                  "interface PlanningTaskCompletionFactExportRow {\n  task_id: unknown;\n  completed_at: unknown;\n}",
              ),
              (
                  "`SELECT completion_sequence::text, task_id, completed_at\n             FROM planning.task_completion_facts\n             WHERE workspace_id = $1\n             ORDER BY completed_at ASC, task_id ASC, completion_sequence ASC\n             LIMIT $2 OFFSET $3`",
                  "`SELECT task_id, completed_at\n             FROM planning.task_completion_facts\n             WHERE workspace_id = $1\n             ORDER BY completed_at ASC, task_id ASC, completion_fact_id ASC\n             LIMIT $2 OFFSET $3`",
              ),
              (
                  "          (row) => ({\n            completionSequence: requireString(\n              row.completion_sequence,\n              'taskCompletionFact.completion_sequence',\n            ),\n            taskId: requireUuidV4(row.task_id, 'taskCompletionFact.task_id'),",
                  "          (row) => ({\n            taskId: requireUuidV4(row.task_id, 'taskCompletionFact.task_id'),",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source anchor, found {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)

          readme = Path('apps/planning-service/migrations/README.md')
          docs = readme.read_text()
          old = "Every fact has an application-generated opaque UUIDv4 primary key; `completion_sequence` is a separate unique ordering key, not domain identity."
          new = "Every fact has an application-generated opaque UUIDv4 primary key; `completion_sequence` is a separate unique ordering key, not domain identity and is not exported through the data-rights contract."
          count = docs.count(old)
          if count != 1:
              raise SystemExit(f'expected one README anchor, found {count}')
          readme.write_text(docs.replace(old, new))
          PY
          pnpm exec prettier --write apps/planning-service/src/planning-data-rights.ts apps/planning-service/tests/postgres-data-rights.integration.test.ts

      - name: Run completion-history PostgreSQL acceptance
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion-history.integration.test.ts --no-file-parallelism

      - name: Run Planning data-rights PostgreSQL acceptance
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          tests/postgres-data-rights.integration.test.ts --no-file-parallelism

      - name: Check repaired formatting
        run: >-
          pnpm exec prettier --check
          apps/planning-service/src/task-completion-history.integration.test.ts
          apps/planning-service/src/task-completion.ts
          apps/planning-service/src/planning-data-rights.ts
          apps/planning-service/tests/postgres-data-rights.integration.test.ts

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run complete Planning suite with normal file parallelism
        run: pnpm --filter @life-os/planning-service exec vitest run --passWithNoTests

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Retire temporary workflows and verify diff
        run: |
          rm .github/workflows/repair-planning-completion-export.yml
          rm .github/workflows/verify-planning-completion-fact-review.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/repair-planning-completion-export.yml \
            .github/workflows/verify-planning-completion-fact-review.yml \
            apps/planning-service/migrations/README.md \
            apps/planning-service/src/planning-data-rights.ts \
            apps/planning-service/tests/postgres-data-rights.integration.test.ts | sort)"
          test "$changed" = "$expected"

      - name: Publish ordinary workflow-free descendant
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"
          git config user.name "LifeOS Hourly Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(planning): keep completion ordering private"
          test ! -e .github/workflows/repair-planning-completion-export.yml
          test ! -e .github/workflows/verify-planning-completion-fact-review.yml
          git push origin "HEAD:${TARGET_BRANCH}"
