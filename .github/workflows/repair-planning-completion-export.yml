name: Repair Planning completion durable acceptance

on:
  push:
    branches:
      - feat/planning-task-completion-history-v1
    paths:
      - .github/workflows/repair-planning-completion-export.yml

permissions:
  contents: write

concurrency:
  group: planning-completion-export-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Stage durable-acceptance regression and stale fixture repair
        run: |
          python .github/scripts/repair_planning_completion.py stage-tests
          pnpm exec prettier --write apps/planning-service/src/task-completion.test.ts

      - name: Prove durable-acceptance reality RED
        run: |
          pnpm --filter @life-os/planning-service exec vitest run \
            src/task-completion.test.ts \
            -t "updates status and completed_at atomically inside one tenant-scoped statement" \
            --no-file-parallelism
          set +e
          pnpm --filter @life-os/planning-service exec vitest run \
            src/task-completion.test.ts \
            -t "fails closed when persistence reports no fact for a new completion" \
            --no-file-parallelism
          red_status="$?"
          set -e
          if [ "$red_status" -eq 0 ]; then
            echo 'expected completion-fact durable acceptance RED did not reproduce' >&2
            exit 1
          fi

      - name: Apply minimal durable-acceptance and export repair
        run: |
          python .github/scripts/repair_planning_completion.py apply-repair
          pnpm exec prettier --write \
            apps/planning-service/src/task-completion-history.integration.test.ts \
            apps/planning-service/src/task-completion.test.ts \
            apps/planning-service/src/task-completion.ts \
            apps/planning-service/src/planning-data-rights.ts \
            apps/planning-service/tests/postgres-data-rights.integration.test.ts

      - name: Run completion durable-acceptance unit GREEN
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion.test.ts --no-file-parallelism

      - name: Run completion-history PostgreSQL acceptance
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion-history.integration.test.ts --no-file-parallelism

      - name: Run Planning data-rights PostgreSQL acceptance
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          tests/postgres-data-rights.integration.test.ts --no-file-parallelism

      - name: Check repaired formatting
        run: >-
          pnpm exec prettier --check
          apps/planning-service/src/task-completion-history.integration.test.ts
          apps/planning-service/src/task-completion.test.ts
          apps/planning-service/src/task-completion.ts
          apps/planning-service/src/planning-data-rights.ts
          apps/planning-service/tests/postgres-data-rights.integration.test.ts

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run complete Planning suite with normal file parallelism
        run: pnpm --filter @life-os/planning-service exec vitest run --passWithNoTests

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Retire temporary repair assets and verify bounded diff
        run: |
          rm .github/workflows/repair-planning-completion-export.yml
          rm .github/workflows/verify-planning-completion-fact-review.yml
          rm .github/scripts/repair_planning_completion.py
          git diff --check
          git diff --quiet -- apps/planning-service/src/task-completion.ts && exit 1 || true
          git diff --quiet -- apps/planning-service/src/task-completion.test.ts && exit 1 || true
          git diff --quiet -- apps/planning-service/src/planning-data-rights.ts && exit 1 || true
          git diff --quiet -- apps/planning-service/migrations/README.md && exit 1 || true
          while IFS= read -r changed_path; do
            case "$changed_path" in
              .github/scripts/repair_planning_completion.py|\
              .github/workflows/repair-planning-completion-export.yml|\
              .github/workflows/verify-planning-completion-fact-review.yml|\
              apps/planning-service/migrations/README.md|\
              apps/planning-service/src/planning-data-rights.ts|\
              apps/planning-service/src/task-completion-history.integration.test.ts|\
              apps/planning-service/src/task-completion.test.ts|\
              apps/planning-service/src/task-completion.ts|\
              apps/planning-service/tests/postgres-data-rights.integration.test.ts)
                ;;
              *)
                echo "unexpected repair path: ${changed_path}" >&2
                exit 1
                ;;
            esac
          done < <(git status --short | sed -E 's/^.. //')
          test ! -e .github/scripts/repair_planning_completion.py
          test ! -e .github/workflows/repair-planning-completion-export.yml
          test ! -e .github/workflows/verify-planning-completion-fact-review.yml

      - name: Publish ordinary workflow-free descendant
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"
          git config user.name "LifeOS Hourly Maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(planning): verify durable completion fact acceptance"
          git push origin "HEAD:${TARGET_BRANCH}"
