name: Temporary Readiness Workflow Response Boundary

on:
  push:
    branches: [fix/actions-draft-queue-pressure-v1]

permissions:
  contents: read

concurrency:
  group: tmp-readiness-workflow-response-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Run workflow response-boundary regression
        run: node --test packages/commercial-readiness/src/github-client-workflow-response-boundary.test.mjs
