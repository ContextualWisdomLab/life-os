name: Repair Planning Completion Fact Evidence V3

on:
  push:
    branches: [feat/planning-task-completion-history-v1]
    paths:
      - .github/workflows/repair-planning-completion-fact-evidence-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply causal review and integration repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          def nl(*lines: str) -> str:
              return '\n'.join(lines) + '\n'

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              target.write_text(text.replace(old, new, 1))

          # Document the public data-rights projection without exposing internal fact identity/order.
          replace_once(
              'apps/planning-service/src/planning-data-rights.ts',
              nl(
                  'interface PlanningTaskCompletionFactExportRow {',
                  '  task_id: unknown;',
                  '  completed_at: unknown;',
                  '}',
              ),
              nl(
                  '/**',
                  ' * Data-rights projection of user-owned completion evidence.',
                  ' * Internal fact identity and ordering sequence stay private to Planning persistence.',
                  ' */',
                  'interface PlanningTaskCompletionFactExportRow {',
                  '  task_id: unknown;',
                  '  completed_at: unknown;',
                  '}',
              ),
          )

          # Keep missing durable evidence visible to the repository parser instead of manufacturing it in the test double.
          task_test = Path('apps/planning-service/src/task-completion.test.ts')
          text = task_test.read_text()
          test_name = 'fails closed when atomic acceptance evidence columns are missing'
          if test_name not in text:
              anchor = "  it('fails closed when persistence reports no fact for a new completion', async () => {"
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected one regression insertion anchor, found {text.count(anchor)}')
              regression = nl(
                  "  it('fails closed when atomic acceptance evidence columns are missing', async () => {",
                  '    const repository = new PostgresTaskCompletionRepository(',
                  '      new RecordingSqlClient([',
                  '        {',
                  '          workspace_id: WORKSPACE_ID,',
                  '          id: TASK_ID,',
                  "          status: 'done',",
                  '          completed_at: COMPLETED_AT,',
                  '        },',
                  '      ]),',
                  '    );',
                  '',
                  '    await expect(',
                  '      repository.transitionTaskCompletion(WORKSPACE_ID, TASK_ID, {',
                  "        status: 'done',",
                  '        completedAt: COMPLETED_AT,',
                  '      }),',
                  '    ).rejects.toBeInstanceOf(TaskCompletionPersistenceError);',
                  '  });',
                  '',
              )
              task_test.write_text(text.replace(anchor, regression + anchor, 1))

          replace_once(
              'apps/planning-service/src/task-completion.test.ts',
              nl(
                  '    return {',
                  '      rows: this.rows.map((row) => {',
                  "        if (row === null || typeof row !== 'object' || Array.isArray(row)) {",
                  '          return row as Row;',
                  '        }',
                  '        return {',
                  "          previous_status: 'todo',",
                  '          completion_fact_count: 1,',
                  '          ...(row as Record<string, unknown>),',
                  '        } as Row;',
                  '      }),',
                  '    };',
              ),
              nl('    return { rows: this.rows as Row[] };'),
          )

          replace_once(
              'apps/planning-service/src/task-completion.test.ts',
              nl(
                  '    const client = new RecordingSqlClient([',
                  '      {',
                  '        workspace_id: WORKSPACE_ID,',
                  '        id: TASK_ID,',
                  "        status: 'done',",
                  '        completed_at: COMPLETED_AT,',
                  '      },',
                  '    ]);',
              ),
              nl(
                  '    const client = new RecordingSqlClient([',
                  '      {',
                  '        workspace_id: WORKSPACE_ID,',
                  '        id: TASK_ID,',
                  "        status: 'done',",
                  '        completed_at: COMPLETED_AT,',
                  "        previous_status: 'todo',",
                  '        completion_fact_count: 1,',
                  '      },',
                  '    ]);',
              ),
          )

          replace_once(
              'apps/planning-service/src/task-completion.test.ts',
              nl(
                  '    expect(client.calls[0]?.text).toContain(',
                  "      'RETURNING workspace_id, id, status, completed_at',",
                  '    );',
              ),
              nl(
                  '    expect(client.calls[0]?.text).toContain(',
                  "      'RETURNING workspace_id, id, status, completed_at',",
                  '    );',
                  '    expect(client.calls[0]?.text).toContain(',
                  "      'previous.previous_status AS previous_status',",
                  '    );',
                  "    expect(client.calls[0]?.text).toContain('AS completion_fact_count');",
                  '    expect(client.calls[0]?.text).toContain(',
                  "      'INSERT INTO planning.task_completion_facts',",
                  '    );',
              ),
          )

          replace_once(
              'apps/planning-service/src/task-completion.test.ts',
              nl(
                  '        {',
                  '          workspace_id: WORKSPACE_ID,',
                  '          id: TASK_ID,',
                  "          status: 'done',",
                  '          completed_at: new Date(COMPLETED_AT),',
                  '        },',
              ),
              nl(
                  '        {',
                  '          workspace_id: WORKSPACE_ID,',
                  '          id: TASK_ID,',
                  "          status: 'done',",
                  '          completed_at: new Date(COMPLETED_AT),',
                  "          previous_status: 'todo',",
                  '          completion_fact_count: 1,',
                  '        },',
              ),
          )

          # Migration isolation must rewrite functions/triggers as well as tables.
          replace_once(
              'apps/planning-service/src/task-completion-history.integration.test.ts',
              nl(
                  '/** Rewrites only canonical Planning table qualifiers into the isolated test schema. */',
                  'function isolatedSql(text: string): string {',
                  '  return text',
                  '    .replaceAll(',
                  "      'planning.task_completion_facts',",
                  "      'planning_task_completion_history_test.task_completion_facts',",
                  '    )',
                  '    .replaceAll(',
                  "      'planning.tasks',",
                  "      'planning_task_completion_history_test.tasks',",
                  '    );',
                  '}',
              ),
              nl(
                  '/** Rewrites all Planning-owned qualifiers into the isolated PostgreSQL test schema. */',
                  'function isolatedSql(text: string): string {',
                  "  return text.replaceAll('planning.', 'planning_task_completion_history_test.');",
                  '}',
              ),
          )

          # Preserve the intentional reopened/todo history fixture, but give the owning task a truthful creation instant.
          replace_once(
              'apps/planning-service/tests/postgres-data-rights.integration.test.ts',
              nl(
                  '    `INSERT INTO planning.tasks (id, workspace_id, project_id, title)',
                  "     VALUES ($1, $2, $3, 'Task')`,",
                  '    [taskId, WORKSPACE_ID, projectId],',
              ),
              nl(
                  '    `INSERT INTO planning.tasks (id, workspace_id, project_id, title, created_at)',
                  "     VALUES ($1, $2, $3, 'Task', TIMESTAMPTZ '2026-08-10T12:00:00.000Z')`,",
                  '    [taskId, WORKSPACE_ID, projectId],',
              ),
          )

          readme = Path('apps/planning-service/migrations/README.md')
          text = readme.read_text()
          old = "Facts retain tenant/task ownership and the committed completion instant, cascade with task erasure, and are indexed by workspace + completion time for bounded period projections. The completion repository appends a fact in the same PostgreSQL statement that changes task state; retries while already done do not append duplicates."
          new = "Facts retain tenant/task ownership and the committed completion instant, cascade with task erasure, and are indexed by workspace + completion time for bounded period projections. A Planning-owned trigger rejects any fact whose completion instant predates the owning task's creation instant. The completion repository appends a fact in the same PostgreSQL statement that changes task state; retries while already done do not append duplicates."
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('migrations README chronology contract not found')
          old = "Rolling back `0007` destroys historical completion facts, so drop `planning.task_completion_facts` only after an operator-approved export/retention decision and only when loss of Review provenance is acceptable."
          new = "Rolling back `0007` destroys historical completion facts, so drop `planning.task_completion_facts` only after an operator-approved export/retention decision and only when loss of Review provenance is acceptable; after the table and its trigger are removed, also drop `planning.enforce_task_completion_fact_chronology()` so no orphan migration function remains."
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('migrations README rollback contract not found')
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          old = "- Planning task completion now treats the atomic completion-fact cardinality and prior durable task state as part of persistence acceptance evidence, so a repository cannot report a successful new completion when the corresponding append-only fact is absent, duplicated, or otherwise inconsistent with the requested transition."
          new = old + " The completion-fact ledger also rejects persisted completion instants that predate the owning task's creation instant."
          if old in text and new not in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('CHANGELOG completion-fact contract not found')
          changelog.write_text(text)
          PY

      - name: Canonicalize changed sources
        run: >-
          pnpm exec prettier --write
          apps/planning-service/src/planning-data-rights.ts
          apps/planning-service/src/task-completion.test.ts
          apps/planning-service/src/task-completion-history.integration.test.ts
          apps/planning-service/tests/postgres-data-rights.integration.test.ts
          apps/planning-service/migrations/README.md
          CHANGELOG.md

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run focused Planning persistence regressions
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion.test.ts
          src/task-completion-history.integration.test.ts
          src/task-completion-fact-chronology.integration.test.ts
          tests/postgres-data-rights.integration.test.ts

      - name: Run complete Planning suite
        run: pnpm --filter @life-os/planning-service test

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Check changed-source formatting
        run: >-
          pnpm exec prettier --check
          apps/planning-service/src/planning-data-rights.ts
          apps/planning-service/src/task-completion.test.ts
          apps/planning-service/src/task-completion-history.integration.test.ts
          apps/planning-service/tests/postgres-data-rights.integration.test.ts
          apps/planning-service/migrations/README.md
          CHANGELOG.md

      - name: Retire temporary workflows and publish ordinary descendant
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git rm -f --ignore-unmatch \
            .github/workflows/repair-planning-completion-fact-chronology.yml \
            .github/workflows/verify-planning-completion-fact-chronology.yml \
            .github/workflows/repair-planning-completion-fact-evidence-v2.yml \
            .github/workflows/repair-planning-completion-fact-evidence-v3.yml
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add -A
          git diff --cached --check
          git commit -m 'fix(planning): harden completion fact acceptance evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
