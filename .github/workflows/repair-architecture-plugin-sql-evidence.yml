name: Repair Architecture Plugin SQL Evidence

on:
  push:
    branches: [docs/canonical-product-architecture-mainline]

permissions:
  contents: write

concurrency:
  group: repair-architecture-plugin-sql-evidence
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace only the active #252 Architecture paragraph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          start = 'Draft PR #252 proceeds in parallel from #245 and establishes Integration-owned durable delivery-attempt admission without depending on mutable #250/#251 transport.'
          end = '\n\nIssue #130 remains **Partial**.'
          if text.count(start) != 1:
              raise SystemExit(f'expected exactly one #252 Architecture paragraph, found {text.count(start)}')
          start_index = text.index(start)
          end_index = text.index(end, start_index)
          replacement = '''Draft PR #252 proceeds in parallel from #245 and establishes Integration-owned durable delivery-attempt admission without depending on mutable #250/#251 transport. It introduces opaque `life-os.plugin-delivery-attempt.v1` work identity plus service-owned PostgreSQL migration/store, exact idempotency scope, bounded retry budget metadata, and a durable INSERT-time fence requiring both the exact active origin grant and active installation under matching workspace/user authority. The table intentionally stores no origin copy, credential, request payload, response body, or network authorization. Exact review-repair proof head `9e6e88e49e14d0b2d247e747df968e2494697666` completed hosted run `34209314512`, job `102006262067`, GREEN on Ubuntu 24.04/PostgreSQL 16 after replaying the timestamp, PostgreSQL/TLS target, IPv6 loopback and table-contract RED ancestors for their intended reasons. A subsequent repository-boundary review found that SQL result envelopes, durable row getters and stored timestamp conversion could throw native dependency detail before the fixed persistence-evidence boundary. Reality RED `b390f37ed651ce2d9cb74d862fbae02641f3a55f` demonstrates that hostile evidence leak; minimum repair `e9a8b212b24b4914069a48a113d118ff4e4c0a56` snapshots and bounds those evidence reads without changing SQL/schema/admission authority. Exact proof head `ec2353a003c15c9f464b5d5d2454d3593427d768`, run `34213508199`, job `102019765395`, completed GREEN with the focused delivery-attempt suite 24/24, Integration typecheck and the complete Integration suite 403 passed / 3 environment-dependent skipped across 65 files. CHANGELOG descendant `fe51a79c1e19cc7fb14e5296f04b3f91b41bf535` also completed exact run `34213937828` / job `102021136219` GREEN. Current #252 head `9ed7847d3106d9418e1ff6e04e45c1c7d84d0b0d` removes only the purpose-complete hostile-SQL verifier. This remains active-PR evidence, not protected shipped truth.'''
          path.write_text(text[:start_index] + replacement + text[end_index:])
          PY

      - name: Verify exact writer lease and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin docs/canonical-product-architecture-mainline
          test "$(git rev-parse origin/docs/canonical-product-architecture-mainline)" = "${GITHUB_SHA}"
          git diff --check
          git diff -- ARCHITECTURE.md

      - name: Publish bounded source repair and retire writer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-architecture-plugin-sql-evidence.yml
          git config user.name "LifeOS Architecture Writer"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHITECTURE.md .github/workflows/repair-architecture-plugin-sql-evidence.yml
          if git diff --cached --quiet; then
            echo "No bounded Architecture repair to publish" >&2
            exit 1
          fi
          git commit -m "docs: refresh plugin SQL architecture evidence"
          git fetch origin docs/canonical-product-architecture-mainline
          test "$(git rev-parse origin/docs/canonical-product-architecture-mainline)" = "${GITHUB_SHA}"
          git push origin HEAD:docs/canonical-product-architecture-mainline
