name: Proposal Quality Format Artifact

on:
  push:
    branches: [feat/ai-proposal-quality-evaluation]

permissions:
  contents: read

concurrency:
  group: proposal-quality-format-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Format proposal quality evidence
        run: |
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/proposal-quality-evaluation.test.ts \
            apps/ai-service/src/proposal-quality-fixtures.test.ts \
            apps/ai-service/src/proposal-quality-fixtures.ts \
            docs/research/2026-08-05-ai-proposal-quality-evaluation-standards.md \
            docs/superpowers/specs/2026-08-05-ai-proposal-quality-evaluation-design.md

      - name: Upload exact formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proposal-quality-formatted-${{ github.sha }}
          path: |
            apps/ai-service/src/proposal-quality-evaluation.test.ts
            apps/ai-service/src/proposal-quality-fixtures.test.ts
            apps/ai-service/src/proposal-quality-fixtures.ts
            docs/research/2026-08-05-ai-proposal-quality-evaluation-standards.md
            docs/superpowers/specs/2026-08-05-ai-proposal-quality-evaluation-design.md
          if-no-files-found: error
          retention-days: 1
