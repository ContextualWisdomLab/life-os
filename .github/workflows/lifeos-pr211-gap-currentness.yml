name: LifeOS PR211 Gap Currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: lifeos-pr211-gap-currentness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/product-gap-baseline-2026-08-20

      - name: Append preservation-safe currentness override
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          marker = '### 2026-09-08 #245 credential-binding revocation currentness'
          if marker not in text:
              addition = '''\n\n### 2026-09-08 #245 credential-binding revocation currentness\n\n- Integration successor #245 is now exact `056e3dae2bf8e4b3d9810b48893f1124e1d0c806`, open Draft/mergeable on unchanged parent #244 `f0b91869f306b1b7d0d5759307acf347e413aa06`; this active stack remains unshipped and must not be treated as protected-main truth.\n- Fresh replay review found that provider-backed `verifySecret()` was followed by installation revalidation but not by a second durable credential-binding read. Concurrent credential revocation could therefore complete during provider I/O while replay still returned the stale pre-I/O active record. Hosted RED `fecaf9882b9737cb5e14a6e4eeeb96b8d37c270a` / run `34161976266` / job `101865484366` proved the new case failed while the three predecessor replay cases passed.\n- Minimal repair `e3508eb504d67c7d56b6946a432ef0f99726c9a1` re-reads the exact binding after provider verification and installation revalidation, requiring the binding to remain active and to preserve installation/workspace/installer/name, opaque secret reference, and `boundAt` evidence. Run `34162364466` / job `101866630375` passed Prettier, focused replay 4/4, plugin-sdk build, Integration typecheck, and the complete Integration suite with 56 passed / 4 environment-dependent skipped files and 367 passed / 16 skipped tests.\n- Finalizer run `34162555923` / job `101867173922` repeated that source acceptance, added the Unreleased changelog entry, removed its one-shot workflow, and normally published final #245 `056e3dae...`. The final child differs from the GREEN source state only by `CHANGELOG.md` plus temporary-workflow removal.\n- Remaining #130 buyer acceptance is still real Vault-backed create -> exact replay -> credential/installation revocation -> recovery/cleanup over migrated PostgreSQL, followed by outbound SSRF/DNS-rebinding-safe delivery and durable retry/dead-letter/recovery. Exact-head repository/security checks and independent approval remain separate merge authority.\n'''
              path.write_text(text.rstrip() + addition + '\n')
          PY
          rm .github/workflows/lifeos-pr211-gap-currentness.yml
          git diff --check
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          expected="$(printf '%s\n' \
            '.github/workflows/lifeos-pr211-gap-currentness.yml' \
            'docs/product-technical-gap-baseline.md' | sort)"
          actual="$(printf '%s\n' "$changed" | sort)"
          test "$actual" = "$expected"
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add --all
          git commit -m 'docs(product): record credential replay revoke evidence'
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
