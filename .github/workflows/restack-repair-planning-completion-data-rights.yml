name: Restack Planning completion history and repair data rights

on:
  push:
    branches:
      - feat/planning-task-completion-history-v1
    paths:
      - .github/workflows/restack-repair-planning-completion-data-rights.yml

permissions:
  contents: write

concurrency:
  group: planning-task-completion-history-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
      BASE_BRANCH: feat/planning-task-completion-http-v1
      EXPECTED_BASE_SHA: 44305a6572c463cd5e633412793f656b795aafb1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Adopt exact owner-base descendant by ordinary merge
        run: |
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          base_head="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | cut -f1)"
          test "$base_head" = "$EXPECTED_BASE_SHA"
          git fetch origin "${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
          git merge --no-ff --no-edit "origin/${BASE_BRANCH}"

      - name: Add data-rights regression before production repair
        env:
          PATCH_B64: ")"
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/data-rights-red.py
          python /tmp/data-rights-red.py
          pnpm exec prettier --write apps/planning-service/tests/postgres-data-rights.integration.test.ts

      - name: Prove completion facts are absent from data-rights export
        run: |
          set +e
          pnpm --filter @life-os/planning-service exec vitest run tests/postgres-data-rights.integration.test.ts --no-file-parallelism > /tmp/data-rights-red.log 2>&1
          status=$?
          set -e
          cat /tmp/data-rights-red.log
          test "$status" -ne 0
          grep -q '"schemaVersion": "planning.data-rights.v1"' /tmp/data-rights-red.log
          grep -q '"recordCount": 5' /tmp/data-rights-red.log

      - name: Apply service-owned data-rights repair
        env:
          PATCH_B64: "...TRUNCATED..."
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/data-rights-green.py
          python /tmp/data-rights-green.py
          pnpm exec prettier --write apps/planning-service/src/planning-data-rights.ts apps/planning-service/src/planning-data-rights-controller-authority.test.ts

      - name: Run data-rights GREEN
        run: pnpm --filter @life-os/planning-service exec vitest run tests/postgres-data-rights.integration.test.ts --no-file-parallelism

      - name: Run completion-history GREEN
        run: pnpm --filter @life-os/planning-service exec vitest run src/task-completion-history.integration.test.ts --no-file-parallelism

      - name: Run complete Planning suite with normal file parallelism
        run: pnpm --filter @life-os/planning-service exec vitest run --passWithNoTests

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Check changed-source formatting
        run: pnpm exec prettier --check apps/planning-service/src/planning-data-rights.ts apps/planning-service/src/planning-data-rights-controller-authority.test.ts apps/planning-service/tests/postgres-data-rights.integration.test.ts apps/planning-service/src/task-completion.ts apps/planning-service/src/task-completion-history.integration.test.ts apps/planning-service/src/postgres-planning-repository.integration.test.ts apps/planning-service/migrations/README.md apps/planning-service/src/main.ts

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Retire bounded writer and verify diff
        run: |
          rm .github/workflows/restack-repair-planning-completion-data-rights.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' '.github/workflows/restack-repair-planning-completion-data-rights.yml' 'apps/planning-service/src/planning-data-rights.ts' 'apps/planning-service/src/planning-data-rights-controller-authority.test.ts' 'apps/planning-service/tests/postgres-data-rights.integration.test.ts' | sort)"

      - name: Verify exact remote ownership and base
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          base_head="$(git ls-remote origin "refs/heads/${BASE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          test "$base_head" = "$EXPECTED_BASE_SHA"

      - name: Publish ordinary descendants
        run: |
          git add -A
          git commit -m 'fix(planning): include completion facts in data rights'
          git push origin "HEAD:${TARGET_BRANCH}"
