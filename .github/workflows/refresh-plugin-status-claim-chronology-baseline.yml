name: Refresh Plugin Status Claim Chronology Baseline

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: refresh-plugin-status-claim-chronology-baseline
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace bounded Integration currentness paragraph
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start_marker = '> Durable origin/delivery/claim/retry/outcome/control/fence identity is not outbound-network authority.'
          end_marker = '\n\n## Canonical architecture and evidence rules'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('expected one bounded Integration currentness region')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''> Durable origin/delivery/claim/retry/outcome/control/fence identity is not outbound-network authority. #257 does not materialize provider credentials or authorize DNS/IP/redirect/proxy/connect behavior. A later executor must consume only an immutable released/versioned canonical egress contract and otherwise remain fail closed. #258 is the direct #257 child and remains Draft/unshipped. Earlier exact proof head `8855427b8fcfa3b364223e91cd088546df84d684`, run `34276065348`, job `102229247458`, completed GREEN after application and PostgreSQL repository boundaries were repaired to reject durable `updated_at` later than the trusted status-read instant. Fresh migration-parity review then proved two additional hostile durable-row gaps at regression-only exact `a84c265afa07a54900afba1af148a9f51dfb6f94`, run `34278422118`, job `102237052398`: the status repository accepted a claim beginning before `requested_at` and a claim beginning after aggregate `updated_at`, despite migration 0007 requiring `claim_started_at >= requested_at` and `updated_at >= claim_started_at`. Minimum causal repair `6c29a685a457ad7d199a502e82c99711b39219c2` revalidates those existing durable chronology invariants at the repository evidence boundary without changing schema, SQL scope, persistence ownership or network authority. Exact hosted proof run `34279136682`, job `102239393667`, completed GREEN on Ubuntu 24.04: the focused chronology regression passed 2/2, focused status acceptance passed 9/9, Integration typecheck passed, and the complete Integration suite passed 420 tests with 45 environment-dependent skips across 82 files (68 passed / 14 skipped). Current #258 exact `e9eec8f8dc99c80f2712d452a94c205db78bf3d5` removes only the purpose-complete chronology verifier from the proven head; retained production and regression evidence is unchanged. The read remains exact delivery/workspace/requesting-user scoped, credential-free and restart-recoverable; it exposes derived claim state rather than claim token/digest and grants no provider-execution or outbound-network authority. Remaining LifeOS-owned delivery work is bounded provider execution/outcome integration and authenticated operator HTTP composition; outbound I/O must continue to fail closed until an immutable released/versioned canonical egress contract is available.'''
          path.write_text(text[:start] + replacement + text[end:])

      - name: Verify bounded documentation delta
        run: |
          git diff --check
          git diff -- docs/product-technical-gap-baseline.md
          test -n "$(git status --short docs/product-technical-gap-baseline.md)"

      - name: Fence concurrent branch movement and publish
        env:
          INPUT_SHA: ${{ github.sha }}
          BRANCH: docs/product-gap-baseline-2026-08-20
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          test "${remote_sha}" = "${INPUT_SHA}"
          git config user.name "LifeOS commercial maintainer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/refresh-plugin-status-claim-chronology-baseline.yml
          git add docs/product-technical-gap-baseline.md
          git commit -m "docs: record plugin claim chronology repair"
          git push origin "HEAD:${BRANCH}"
