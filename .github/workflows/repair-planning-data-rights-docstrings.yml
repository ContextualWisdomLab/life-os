name: Repair Planning Data Rights Docstrings

on:
  push:
    branches: [feat/planning-task-completion-history-v1]
    paths:
      - .github/workflows/repair-planning-data-rights-docstrings.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove owned production docstrings are incomplete RED
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          python <<'PY' > /tmp/docstring-red.log 2>&1
          from pathlib import Path
          text = Path('apps/planning-service/src/planning-data-rights.ts').read_text()
          required = [
              'Validates one opaque UUIDv4 identifier without reflecting rejected data.',
              'Validates one non-empty persisted string before it enters export evidence.',
              'Normalizes one persisted timestamp to canonical UTC form.',
              'Validates the persisted local-date shape used by Today export records.',
              'Accepts only bounded non-negative integer persistence evidence.',
              'Validates a canonical SHA-256 digest returned from Planning persistence.',
              'Recursively normalizes untrusted persistence values into bounded immutable JSON.',
              'Serializes normalized JSON deterministically for stable evidence hashing.',
              'Hashes canonical JSON without exposing service-owned persistence metadata.',
              'Validates request authority fields before any Planning persistence operation.',
              'Deletes one Planning-owned table slice and validates the returned cardinality.',
              'Creates a contributor over the Planning-owned transactional SQL boundary.',
              'Exports one workspace from a repeatable-read snapshot with deterministic ordering.',
              'Reports whether the durable erasure-receipt prerequisite is available.',
              'Erases one workspace transactionally and returns replay-safe receipt evidence.',
              'Verifies that no Planning-owned user records remain for the workspace.',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              print('Missing owned production docstrings:')
              for marker in missing:
                  print('-', marker)
              raise SystemExit(1)
          print('all required owned production docstrings present')
          PY
          status=$?
          set -e
          cat /tmp/docstring-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected current source to fail the owned production docstring contract.' >&2
            exit 1
          fi
          grep -q 'Missing owned production docstrings:' /tmp/docstring-red.log

      - name: Add explanatory docstrings without changing behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('apps/planning-service/src/planning-data-rights.ts')
          text = path.read_text()

          replacements = [
              (
                  'interface ContributorRequestBase {',
                  '/** Authority fields shared by every Planning data-rights operation. */\ninterface ContributorRequestBase {',
              ),
              (
                  'interface ContributorResponseBase {',
                  '/** Correlation fields shared by every successful Planning contributor response. */\ninterface ContributorResponseBase {',
              ),
              (
                  'interface PlanningGoalExportRow {',
                  '/** Untrusted goal row before data-rights export normalization. */\ninterface PlanningGoalExportRow {',
              ),
              (
                  'interface PlanningProjectExportRow extends PlanningGoalExportRow {',
                  '/** Untrusted project row before data-rights export normalization. */\ninterface PlanningProjectExportRow extends PlanningGoalExportRow {',
              ),
              (
                  'interface PlanningTaskExportRow extends PlanningGoalExportRow {',
                  '/** Untrusted task row before data-rights export normalization. */\ninterface PlanningTaskExportRow extends PlanningGoalExportRow {',
              ),
              (
                  'interface TodayAggregateExportRow {',
                  '/** Untrusted Today aggregate row before data-rights export normalization. */\ninterface TodayAggregateExportRow {',
              ),
              (
                  'interface TodayIdempotencyExportRow {',
                  '/** Untrusted Today idempotency row before data-rights export normalization. */\ninterface TodayIdempotencyExportRow {',
              ),
              (
                  'interface CountRow {',
                  '/** Untrusted aggregate-count evidence returned by Planning persistence. */\ninterface CountRow {',
              ),
              (
                  'interface ErasureReceiptRow {',
                  '/** Untrusted durable erasure receipt before replay-evidence validation. */\ninterface ErasureReceiptRow {',
              ),
              (
                  "  constructor(message = 'Planning data-rights operation failed validation') {",
                  "  /** Creates a stable validation error without reflecting persisted values. */\n  constructor(message = 'Planning data-rights operation failed validation') {",
              ),
              (
                  'function requireUuidV4(value: unknown, field: string): string {',
                  '/** Validates one opaque UUIDv4 identifier without reflecting rejected data. */\nfunction requireUuidV4(value: unknown, field: string): string {',
              ),
              (
                  'function requireString(value: unknown, field: string): string {',
                  '/** Validates one non-empty persisted string before it enters export evidence. */\nfunction requireString(value: unknown, field: string): string {',
              ),
              (
                  'function requireTimestamp(value: unknown, field: string): string | null {',
                  '/** Normalizes one persisted timestamp to canonical UTC form. */\nfunction requireTimestamp(value: unknown, field: string): string | null {',
              ),
              (
                  'function requireDate(value: unknown): string {',
                  '/** Validates the persisted local-date shape used by Today export records. */\nfunction requireDate(value: unknown): string {',
              ),
              (
                  'function requireNonnegativeInteger(value: unknown, field: string): number {',
                  '/** Accepts only bounded non-negative integer persistence evidence. */\nfunction requireNonnegativeInteger(value: unknown, field: string): number {',
              ),
              (
                  'function requireSha256(value: unknown): string {',
                  '/** Validates a canonical SHA-256 digest returned from Planning persistence. */\nfunction requireSha256(value: unknown): string {',
              ),
              (
                  'function normalizeJson(value: unknown, depth = 0): DataRightsJsonValue {',
                  '/** Recursively normalizes untrusted persistence values into bounded immutable JSON. */\nfunction normalizeJson(value: unknown, depth = 0): DataRightsJsonValue {',
              ),
              (
                  'function canonicalJson(value: DataRightsJsonValue): string {',
                  '/** Serializes normalized JSON deterministically for stable evidence hashing. */\nfunction canonicalJson(value: DataRightsJsonValue): string {',
              ),
              (
                  'function digest(value: DataRightsJsonValue): string {',
                  '/** Hashes canonical JSON without exposing service-owned persistence metadata. */\nfunction digest(value: DataRightsJsonValue): string {',
              ),
              (
                  'function normalizeRequest(request: DataRightsContributorRequest): {',
                  '/** Validates request authority fields before any Planning persistence operation. */\nfunction normalizeRequest(request: DataRightsContributorRequest): {',
              ),
              (
                  'async function countDeleted(',
                  '/** Deletes one Planning-owned table slice and validates the returned cardinality. */\nasync function countDeleted(',
              ),
              (
                  '  constructor(private readonly client: TodayTransactionalSqlClient) {}',
                  '  /** Creates a contributor over the Planning-owned transactional SQL boundary. */\n  constructor(private readonly client: TodayTransactionalSqlClient) {}',
              ),
              (
                  '  private async exportWorkspace(',
                  '  /** Exports one workspace from a repeatable-read snapshot with deterministic ordering. */\n  private async exportWorkspace(',
              ),
              (
                  '  private async preflightErase(',
                  '  /** Reports whether the durable erasure-receipt prerequisite is available. */\n  private async preflightErase(',
              ),
              (
                  '  private async eraseWorkspace(',
                  '  /** Erases one workspace transactionally and returns replay-safe receipt evidence. */\n  private async eraseWorkspace(',
              ),
              (
                  '  private async verifyWorkspaceErased(',
                  '  /** Verifies that no Planning-owned user records remain for the workspace. */\n  private async verifyWorkspaceErased(',
              ),
          ]

          for anchor, replacement in replacements:
              if replacement in text:
                  continue
              if text.count(anchor) != 1:
                  raise SystemExit(f'docstring anchor mismatch: {anchor}')
              text = text.replace(anchor, replacement, 1)

          path.write_text(text)
          PY
          pnpm exec prettier --write apps/planning-service/src/planning-data-rights.ts

      - name: Verify owned production docstrings GREEN
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path
          text = Path('apps/planning-service/src/planning-data-rights.ts').read_text()
          required = [
              'Validates one opaque UUIDv4 identifier without reflecting rejected data.',
              'Validates one non-empty persisted string before it enters export evidence.',
              'Normalizes one persisted timestamp to canonical UTC form.',
              'Validates the persisted local-date shape used by Today export records.',
              'Accepts only bounded non-negative integer persistence evidence.',
              'Validates a canonical SHA-256 digest returned from Planning persistence.',
              'Recursively normalizes untrusted persistence values into bounded immutable JSON.',
              'Serializes normalized JSON deterministically for stable evidence hashing.',
              'Hashes canonical JSON without exposing service-owned persistence metadata.',
              'Validates request authority fields before any Planning persistence operation.',
              'Deletes one Planning-owned table slice and validates the returned cardinality.',
              'Creates a contributor over the Planning-owned transactional SQL boundary.',
              'Exports one workspace from a repeatable-read snapshot with deterministic ordering.',
              'Reports whether the durable erasure-receipt prerequisite is available.',
              'Erases one workspace transactionally and returns replay-safe receipt evidence.',
              'Verifies that no Planning-owned user records remain for the workspace.',
          ]
          missing = [marker for marker in required if marker not in text]
          if missing:
              raise SystemExit('missing required docstrings: ' + ', '.join(missing))
          print(f'owned production docstring contract: {len(required)}/{len(required)} present')
          PY

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Verify Planning data-rights paths
        run: pnpm --filter @life-os/planning-service exec vitest run src/planning-data-rights.test.ts src/planning-data-rights-controller-authority.test.ts tests/postgres-data-rights.integration.test.ts

      - name: Run complete Planning suite
        run: pnpm --filter @life-os/planning-service test

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Check formatting and diff hygiene
        run: |
          pnpm exec prettier --check apps/planning-service/src/planning-data-rights.ts
          git diff --check

      - name: Retire verifier and publish ordinary descendant
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git rm -f .github/workflows/repair-planning-data-rights-docstrings.yml
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add -A
          git diff --cached --check
          git commit -m 'docs(planning): complete data-rights production docstrings'
          git push origin "HEAD:${TARGET_BRANCH}"
