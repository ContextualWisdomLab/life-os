name: Repair Integration Canonical Signed Evidence

on:
  push:
    branches:
      - test/integration-operator-context-canonical-evidence-v1
    paths:
      - .github/workflows/repair-integration-canonical-signed-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-integration-canonical-signed-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained assertion RED and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "826197621b138ac43209b4b37aaf5756f52e9276" HEAD
          test ! -e .github/workflows/repair-integration-context-canonical-evidence-formatting.yml
          test -e .github/workflows/verify-integration-operator-context-canonical-evidence.yml
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce canonical signed-evidence RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter @life-os/integration-service exec vitest run \
            src/plugin-operator-context-canonical-evidence.test.ts \
            src/integration-event-context-canonical-evidence.test.ts; then
            echo 'Expected byte-different signed Integration identity evidence to fail before repair.' >&2
            exit 1
          fi

      - name: Apply minimum signed-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('apps/integration-service/src/plugin-operator-context.ts'); s=p.read_text(); s=s.replace('/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/iu;', '/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;', 1); s=s.replace('/** UUIDv4 grammar accepted for tenant, user, and one-time evidence identities; values normalize to lowercase. */', '/** Canonical lowercase UUIDv4 grammar for signed tenant, user, and one-time evidence identities. */', 1); s=s.replace('/** Requires UUIDv4 identity evidence and returns its canonical lowercase representation. */', '/** Requires already-canonical lowercase UUIDv4 signed identity evidence byte-for-byte. */', 1); old='  return value.toLowerCase();'; assert s.count(old) == 1; p.write_text(s.replace(old, '  return value;', 1))"
          python -c "from pathlib import Path; p=Path('apps/integration-service/src/main.ts'); s=p.read_text(); old='/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;'; new='/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;'; assert s.count(old) == 1; s=s.replace(old,new,1); old2='  const workspaceId = headers.workspaceId.toLowerCase();'; assert s.count(old2) == 1; p.write_text(s.replace(old2, '  const workspaceId = headers.workspaceId;', 1))"
          python -c "from pathlib import Path; p=Path('apps/integration-service/src/integration-controller-authority.test.ts'); s=p.read_text(); old='${workspaceId.toLowerCase()}'; assert s.count(old) == 1; s=s.replace(old, '${workspaceId}', 1); old2='          workspaceId: WORKSPACE_ID.toUpperCase(),'; assert s.count(old2) == 1; p.write_text(s.replace(old2, '          workspaceId: WORKSPACE_ID,', 1))"
          git rm .github/workflows/repair-integration-canonical-signed-evidence.yml
          pnpm exec prettier --single-quote --write \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/main.ts \
            apps/integration-service/src/integration-controller-authority.test.ts

      - name: Verify minimum repair and complete Integration contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/main.ts \
            apps/integration-service/src/integration-controller-authority.test.ts \
            apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts \
            apps/integration-service/src/integration-event-context-canonical-evidence.test.ts \
            .github/workflows/verify-integration-operator-context-canonical-evidence.yml
          pnpm --filter @life-os/integration-service exec vitest run \
            src/plugin-operator-context-canonical-evidence.test.ts \
            src/integration-event-context-canonical-evidence.test.ts \
            src/plugin-operator-context.test.ts \
            src/integration-controller-authority.test.ts
          pnpm --filter @life-os/integration-service typecheck
          pnpm --filter @life-os/integration-service test
          git diff --check
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-integration-canonical-signed-evidence.yml' \
            'apps/integration-service/src/integration-controller-authority.test.ts' \
            'apps/integration-service/src/main.ts' \
            'apps/integration-service/src/plugin-operator-context.ts' | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary semantic repair descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(integration): require canonical signed identity evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
