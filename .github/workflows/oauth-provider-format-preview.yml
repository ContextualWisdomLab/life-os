name: OAuth Provider Format Preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/identity-service/src/oauth-provider-http-client.ts'
      - 'apps/identity-service/src/tests/oauth-provider-http-client.test.ts'
      - '.github/workflows/oauth-provider-format-preview.yml'

permissions:
  contents: read

concurrency:
  group: oauth-provider-format-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format provider HTTP files
        run: |
          pnpm exec prettier --single-quote --write \
            apps/identity-service/src/oauth-provider-http-client.ts \
            apps/identity-service/src/tests/oauth-provider-http-client.test.ts

      - name: Stage formatted files
        run: |
          mkdir -p "${RUNNER_TEMP}/oauth-provider-format-preview/apps/identity-service/src/tests"
          cp apps/identity-service/src/oauth-provider-http-client.ts \
            "${RUNNER_TEMP}/oauth-provider-format-preview/apps/identity-service/src/"
          cp apps/identity-service/src/tests/oauth-provider-http-client.test.ts \
            "${RUNNER_TEMP}/oauth-provider-format-preview/apps/identity-service/src/tests/"

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oauth-provider-format-preview
          path: ${{ runner.temp }}/oauth-provider-format-preview/
          if-no-files-found: error
          retention-days: 1
