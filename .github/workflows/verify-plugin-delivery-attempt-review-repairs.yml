name: Verify Plugin Delivery Attempt Review Repairs

on:
  push:
    branches: [feat/plugin-delivery-attempt-lifecycle-v1]
  # A bounded repair writer publishes with GITHUB_TOKEN; GitHub intentionally does
  # not recursively start a second workflow from that push. Keep an explicit
  # dispatch entry point so the exact repaired descendant can be proved without
  # no-op source churn or a privileged token.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-plugin-delivery-attempt-review-repairs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_integration
          POSTGRES_USER: life_os
          POSTGRES_PASSWORD: life_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os -d life_os_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://life_os:life_os_test@127.0.0.1:5432/life_os_integration?sslmode=disable
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Plugin SDK runtime dependency
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Prove timestamp-binding RED
        shell: bash
        env:
          RED_SHA: 8ef43e183968a6713c0cf76da9a27a6400472ba0
        run: |
          set -euo pipefail
          git checkout --detach "${RED_SHA}"
          set +e
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-attempt-repository.test.ts
          red_status=$?
          set -e
          git checkout --detach "${GITHUB_SHA}"
          if [ "${red_status}" -eq 0 ]; then
            echo "Expected ${RED_SHA} to fail when updated/next timestamps reuse requested_at" >&2
            exit 1
          fi

      - name: Prove destructive-target policy RED
        shell: bash
        env:
          RED_SHA: 9f2d9b7717ea39e0c2a71df4b0bd49bc4253ce9f
        run: |
          set -euo pipefail
          git checkout --detach "${RED_SHA}"
          set +e
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-attempt-test-database.test.ts
          red_status=$?
          set -e
          git checkout --detach "${GITHUB_SHA}"
          if [ "${red_status}" -eq 0 ]; then
            echo "Expected ${RED_SHA} to fail before explicit sslmode and disposable-target validation" >&2
            exit 1
          fi

      - name: Prove IPv6 loopback edge RED
        shell: bash
        env:
          RED_SHA: 87b247ff8043470f1807286f5b3a4f84a14237a8
        run: |
          set -euo pipefail
          git checkout --detach "${RED_SHA}"
          set +e
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-attempt-test-database.test.ts
          red_status=$?
          set -e
          git checkout --detach "${GITHUB_SHA}"
          if [ "${red_status}" -eq 0 ]; then
            echo "Expected ${RED_SHA} to fail before bracketed IPv6 loopback is recognized" >&2
            exit 1
          fi

      - name: Prove database-contract comment RED
        shell: bash
        env:
          RED_SHA: c77d0a38c48caa7e02e50a9dac6a44b9ba6f4cd2
        run: |
          set -euo pipefail
          git checkout --detach "${RED_SHA}"
          set +e
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-attempt-migration.integration.test.ts
          red_status=$?
          set -e
          git checkout --detach "${GITHUB_SHA}"
          if [ "${red_status}" -eq 0 ]; then
            echo "Expected ${RED_SHA} to fail before the delivery-attempt table contract is documented" >&2
            exit 1
          fi

      - name: Verify canonical bounded TypeScript sources
        run: >-
          pnpm exec prettier --single-quote --check
          apps/integration-service/src/plugin-delivery-attempt.ts
          apps/integration-service/src/plugin-delivery-attempt.test.ts
          apps/integration-service/src/plugin-delivery-attempt-repository.ts
          apps/integration-service/src/plugin-delivery-attempt-repository.test.ts
          apps/integration-service/src/plugin-delivery-attempt-test-database.ts
          apps/integration-service/src/plugin-delivery-attempt-test-database.test.ts
          apps/integration-service/src/plugin-delivery-attempt-migration.integration.test.ts

      - name: Verify source diff hygiene
        run: git diff --check

      - name: Run focused delivery-attempt acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt.test.ts
          src/plugin-delivery-attempt-repository.test.ts
          src/plugin-delivery-attempt-test-database.test.ts
          src/plugin-delivery-attempt-migration.integration.test.ts

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test
