name: Write plugin outcome architecture currentness

on:
  push:
    branches:
      - docs/canonical-product-architecture-mainline

permissions:
  contents: write

concurrency:
  group: write-plugin-outcome-architecture-currentness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Replace only terminal Plugin delivery currentness block
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          start = 'Draft PR #254 is the direct #253 child'
          end = 'Manifests and stored installations never self-authorize network capabilities.'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('bounded Plugin currentness markers are not unique')
          a = text.index(start)
          b = text.index(end, a) + len(end)
          replacement = '''Draft PR #254 is the direct #253 child and adds Integration-owned claim-bound retry/backoff without provider execution or outbound HTTPS. Migration `0008_plugin_delivery_attempt_retry_transition.sql` preserves row-owned retry budgets and finite claim leases while admitting only explicit admission, active-claim, scheduled-retry and terminal-exhaustion shapes. Exact proof head `ca22c71e4f2ec11de6539df79632376d4134f90a`, run `34237354956`, job `102098403313`, completed GREEN on Ubuntu 24.04/PostgreSQL 16 across frozen install, formatting/diff hygiene, Plugin SDK build, focused retry acceptance, real PostgreSQL retry/exhaustion acceptance, Integration typecheck and the complete Integration suite. Current #254 exact `edc79d1291025b8787a9ccf16c39a10df4157023` removes only the purpose verifier and remains Draft/unshipped.\n\nDraft PR #255 is the direct #254 child and owns append-only sanitized retry/exhaustion outcome evidence. Migration `0009_plugin_delivery_attempt_outcome_record.sql` keeps provider payloads, response bodies, credentials, origin URI and network authority out of the ledger; `(delivery_id, attempt_number)` plus a bounded outcome discriminator and occurrence instant are retained as same-database lifecycle evidence. After the original missing-table RED and claim-identity/chronology repair, fresh review proved that UPDATE/DELETE immutability alone did not prevent a direct INSERT from fabricating immutable-looking evidence. Regression exact `f113c09dd6f818471051f74440708363bf289103`, run `34250512787`, job `102143453765`, passed checkout/PostgreSQL/frozen-install/format/build gates and failed at real PostgreSQL acceptance for that direct-forgery boundary. Minimum migration-only repair `885163b16c0904a07bb217725e7ab4e71671aac6` adds a `BEFORE INSERT` source-transition guard: accepted evidence must be emitted from nested trigger execution and match the exact post-consumption attempt number, outcome, occurrence time, cleared claim state and retry/terminal lifecycle shape. Exact run `34250976172`, job `102145020949`, completed GREEN across original + forgery real-PostgreSQL acceptance, Integration typecheck and the complete Integration suite. Current #255 exact `102b4b9360897c69c598d2a34397412ac1c36f51` removes only the purpose-complete verifier after that proven head and remains active-PR evidence rather than protected shipped truth.\n\nIssue #130 remains **Partial**. Protected main does not yet contain this Vault/PostgreSQL/delivery-origin/delivery-attempt active stack. #252 establishes durable admission, #253 deterministic finite worker claim/lease, #254 claim-bound bounded retry/backoff and #255 append-only source-bound outcome evidence. Dead-letter/pause/resume, the per-attempt revocation fence immediately before execution, operator-visible status, restart/recovery and provider execution remain successor work. No active LifeOS PR supplies complete host-authorized outbound HTTPS. Fresh `ContextualWisdomLab/EgressWeave` release inventory is empty, so the network boundary remains fail closed rather than consuming mutable sibling source. Durable origin/delivery/claim/retry/outcome identity is not network authorization. Manifests and stored installations never self-authorize network capabilities.'''
          path.write_text(text[:a] + replacement + text[b:])
          PY
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "ARCHITECTURE.md "

      - name: Retire writer and publish ordinary descendant
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md
          git rm .github/workflows/write-plugin-outcome-architecture-currentness.yml
          git commit -m 'docs: record plugin outcome source-transition architecture'
          git push origin "HEAD:${BRANCH_NAME}"
