name: Repair Planning Completion Fact Immutability

on:
  push:
    branches: [feat/planning-task-completion-history-v1]
    paths:
      - .github/workflows/repair-planning-completion-fact-immutability.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Add hostile append-only regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('apps/planning-service/src/task-completion-history.integration.test.ts')
          text = path.read_text()
          const_anchor = "const CASCADE_TASK_ID = '66666666-6666-4666-8666-666666666666';\n"
          if "IMMUTABLE_TASK_ID" not in text:
              if text.count(const_anchor) != 1:
                  raise SystemExit('immutable task constant anchor mismatch')
              text = text.replace(
                  const_anchor,
                  const_anchor + "const IMMUTABLE_TASK_ID = '99999999-9999-4999-8999-999999999998';\n",
                  1,
              )

          test_anchor = "  it('retains each real todo-to-done fact across retries and later reopen', async () => {\n"
          test_name = "rejects mutation of an existing completion fact"
          if test_name not in text:
              if text.count(test_anchor) != 1:
                  raise SystemExit('immutability regression anchor mismatch')
              regression = """  it('rejects mutation of an existing completion fact', async () => {
    await insertTask(IMMUTABLE_TASK_ID);
    const repository = new PostgresTaskCompletionRepository(createSqlClient());
    await repository.transitionTaskCompletion(WORKSPACE_ID, IMMUTABLE_TASK_ID, {
      status: 'done',
      completedAt: FIRST_COMPLETED_AT,
    });

    const original = await pool.query<{
      completion_fact_id: string;
      completed_at: Date;
    }>(
      `SELECT completion_fact_id::text AS completion_fact_id, completed_at
       FROM planning_task_completion_history_test.task_completion_facts
       WHERE workspace_id = $1 AND task_id = $2`,
      [WORKSPACE_ID, IMMUTABLE_TASK_ID],
    );
    expect(original.rows).toHaveLength(1);
    const completionFactId = original.rows[0]?.completion_fact_id;
    expect(completionFactId).toMatch(UUID_V4_PATTERN);

    await expect(
      pool.query(
        `UPDATE planning_task_completion_history_test.task_completion_facts
         SET completed_at = $3::timestamptz
         WHERE workspace_id = $1 AND task_id = $2`,
        [WORKSPACE_ID, IMMUTABLE_TASK_ID, RETRIED_AT],
      ),
    ).rejects.toMatchObject({
      code: '23514',
      constraint: 'task_completion_facts_immutable',
    });

    await expect(
      pool.query(
        `UPDATE planning_task_completion_history_test.task_completion_facts
         SET completion_fact_id = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab'
         WHERE workspace_id = $1 AND task_id = $2`,
        [WORKSPACE_ID, IMMUTABLE_TASK_ID],
      ),
    ).rejects.toMatchObject({
      code: '23514',
      constraint: 'task_completion_facts_immutable',
    });

    const unchanged = await pool.query<{
      completion_fact_id: string;
      completed_at: Date;
    }>(
      `SELECT completion_fact_id::text AS completion_fact_id, completed_at
       FROM planning_task_completion_history_test.task_completion_facts
       WHERE workspace_id = $1 AND task_id = $2`,
      [WORKSPACE_ID, IMMUTABLE_TASK_ID],
    );
    expect(unchanged.rows).toEqual([
      {
        completion_fact_id: completionFactId,
        completed_at: new Date(FIRST_COMPLETED_AT),
      },
    ]);
  });

"""
              text = text.replace(test_anchor, regression + test_anchor, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/planning-service/src/task-completion-history.integration.test.ts

      - name: Prove current migration permits historical mutation RED
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          pnpm --filter @life-os/planning-service exec vitest run src/task-completion-history.integration.test.ts > /tmp/immutability-red.log 2>&1
          status=$?
          set -e
          cat /tmp/immutability-red.log
          if [ "$status" -eq 0 ]; then
            echo 'Expected append-only regression to fail before the causal migration repair.' >&2
            exit 1
          fi
          grep -q 'rejects mutation of an existing completion fact' /tmp/immutability-red.log

      - name: Apply Planning-owned immutability boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python <<'PY'
          from pathlib import Path

          migration = Path('apps/planning-service/migrations/0007_task_completion_facts.sql')
          text = migration.read_text()
          anchor = """CREATE INDEX task_completion_facts_workspace_completed_idx
  ON planning.task_completion_facts
  (workspace_id, completed_at, task_id, completion_sequence);
"""
          addition = """CREATE FUNCTION planning.reject_task_completion_fact_update()
RETURNS trigger
LANGUAGE plpgsql
AS $$
BEGIN
  RAISE EXCEPTION 'Task completion facts are immutable'
    USING ERRCODE = '23514',
          CONSTRAINT = 'task_completion_facts_immutable';
END;
$$;

COMMENT ON FUNCTION planning.reject_task_completion_fact_update() IS
  'Rejects UPDATE so durable Planning completion facts remain append-only while DELETE remains available for erasure and cascade.';

CREATE TRIGGER task_completion_facts_immutability_guard
BEFORE UPDATE
ON planning.task_completion_facts
FOR EACH ROW
EXECUTE FUNCTION planning.reject_task_completion_fact_update();

"""
          if 'task_completion_facts_immutability_guard' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('migration immutability insertion anchor mismatch')
              text = text.replace(anchor, addition + anchor, 1)
          migration.write_text(text)

          readme = Path('apps/planning-service/migrations/README.md')
          text = readme.read_text()
          old = "A Planning-owned trigger rejects any fact whose completion instant predates the owning task's creation instant. The completion repository appends a fact in the same PostgreSQL statement that changes task state; retries while already done do not append duplicates."
          new = "A Planning-owned chronology trigger rejects any fact whose completion instant predates the owning task's creation instant, and a separate immutability trigger rejects UPDATE so accepted facts remain append-only. DELETE remains available for user erasure and task-owned cascade. The completion repository appends a fact in the same PostgreSQL statement that changes task state; retries while already done do not append duplicates."
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('README append-only contract anchor mismatch')
          old = "after the table and its trigger are removed, also drop `planning.enforce_task_completion_fact_chronology()` so no orphan migration function remains."
          new = "after the table and its triggers are removed, also drop `planning.enforce_task_completion_fact_chronology()` and `planning.reject_task_completion_fact_update()` so no orphan migration function remains."
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('README rollback function anchor mismatch')
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          anchor = "The completion-fact ledger also rejects persisted completion instants that predate the owning task's creation instant."
          replacement = anchor + " Accepted completion facts are append-only: ordinary UPDATE is rejected while data-rights erasure and task cascade DELETE remain supported."
          if anchor in text and replacement not in text:
              text = text.replace(anchor, replacement, 1)
          elif replacement not in text:
              raise SystemExit('CHANGELOG immutability anchor mismatch')
          changelog.write_text(text)
          PY
          pnpm exec prettier --write \
            apps/planning-service/src/task-completion-history.integration.test.ts \
            apps/planning-service/migrations/0007_task_completion_facts.sql \
            apps/planning-service/migrations/README.md \
            CHANGELOG.md

      - name: Verify immutability GREEN against PostgreSQL
        run: pnpm --filter @life-os/planning-service exec vitest run src/task-completion-history.integration.test.ts src/task-completion-fact-chronology.integration.test.ts tests/postgres-data-rights.integration.test.ts

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run complete Planning suite
        run: pnpm --filter @life-os/planning-service test

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build

      - name: Check changed-source formatting
        run: >-
          pnpm exec prettier --check
          apps/planning-service/src/task-completion-history.integration.test.ts
          apps/planning-service/migrations/0007_task_completion_facts.sql
          apps/planning-service/migrations/README.md
          CHANGELOG.md

      - name: Retire temporary workflow and publish ordinary descendant
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git rm -f .github/workflows/repair-planning-completion-fact-immutability.yml
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add -A
          git diff --cached --check
          git commit -m 'fix(planning): enforce append-only completion facts'
          git push origin "HEAD:${TARGET_BRANCH}"
