name: LifeOS PR245 Credential Revoke Repair

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: lifeos-pr245-credential-revoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/plugin-vault-postgres-driver-v1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply minimal credential replay revalidation
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/integration-service/src/plugin-credential.ts')
          text = path.read_text()
          old = """      if (\n        !currentInstallation ||\n        currentInstallation.status !== 'active' ||\n        currentInstallation.revokedAt !== null ||\n        currentInstallation.workspaceId !== context.workspaceId ||\n        currentInstallation.installedByUserId !== context.actorUserId ||\n        currentInstallation.installationId !== installationId ||\n        requireStoredInstant(currentInstallation.installedAt) !== installedAt\n      ) {\n        return invalid();\n      }\n      return view(existing);\n"""
          new = """      if (\n        !currentInstallation ||\n        currentInstallation.status !== 'active' ||\n        currentInstallation.revokedAt !== null ||\n        currentInstallation.workspaceId !== context.workspaceId ||\n        currentInstallation.installedByUserId !== context.actorUserId ||\n        currentInstallation.installationId !== installationId ||\n        requireStoredInstant(currentInstallation.installedAt) !== installedAt\n      ) {\n        return invalid();\n      }\n      let currentBindingEvidence: PluginCredentialBindingRecord | undefined;\n      try {\n        currentBindingEvidence = await this.bindingStore.findById(\n          credentialBindingId,\n          context.workspaceId,\n          context.actorUserId,\n        );\n      } catch {\n        return invalid();\n      }\n      if (currentBindingEvidence === undefined) {\n        return invalid();\n      }\n      const currentBinding = requireBindingRecord(currentBindingEvidence);\n      if (\n        !activeBinding(currentBinding, authority) ||\n        !sameImmutableBindingEvidence(currentBinding, existing) ||\n        !bindingVisibleAt(currentBinding, boundAt)\n      ) {\n        return invalid();\n      }\n      return view(currentBinding);\n"""
          if text.count(old) != 1:
              raise SystemExit('expected replay return site was not found exactly once')
          path.write_text(text.replace(old, new))
          PY

      - name: Format owned TypeScript
        run: >-
          pnpm exec prettier --write
          apps/integration-service/src/plugin-credential.ts
          apps/integration-service/src/plugin-credential-replay-secret.test.ts

      - name: Verify formatting
        run: >-
          pnpm exec prettier --check
          apps/integration-service/src/plugin-credential.ts
          apps/integration-service/src/plugin-credential-replay-secret.test.ts

      - name: Run credential replay revocation regression
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-credential-replay-secret.test.ts

      - name: Build plugin SDK
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Typecheck Integration
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration suite
        run: pnpm --filter @life-os/integration-service test

      - name: Publish verified causal repair and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/lifeos-pr245-credential-revoke-red.yml
          git diff --check
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          expected="$(printf '%s\n' \
            '.github/workflows/lifeos-pr245-credential-revoke-red.yml' \
            'apps/integration-service/src/plugin-credential-replay-secret.test.ts' \
            'apps/integration-service/src/plugin-credential.ts' | sort)"
          actual="$(printf '%s\n' "$changed" | sort)"
          test "$actual" = "$expected"
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add --all
          git commit -m 'fix(integration): revalidate credential replay authority'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1
