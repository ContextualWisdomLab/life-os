name: LifeOS PR245 Credential Revoke RED

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: read

concurrency:
  group: lifeos-pr245-credential-revoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Run credential replay revocation regression
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-credential-replay-secret.test.ts
