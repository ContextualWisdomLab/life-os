name: LifeOS PR245 Credential Revoke Finalize

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: lifeos-pr245-credential-revoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout writer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/plugin-vault-postgres-driver-v1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify owned TypeScript formatting
        run: >-
          pnpm exec prettier --check
          apps/integration-service/src/plugin-credential.ts
          apps/integration-service/src/plugin-credential-replay-secret.test.ts

      - name: Run credential replay revocation regression
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-credential-replay-secret.test.ts

      - name: Build plugin SDK
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Typecheck Integration
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration suite
        run: pnpm --filter @life-os/integration-service test

      - name: Record changelog and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text()
          bullet = '- Plugin credential replay now revalidates the exact durable credential binding after provider-backed secret verification and installation revalidation, so a concurrent credential revocation cannot be returned as stale active replay authority.\n'
          if bullet not in text:
              marker = '### Fixed\n\n'
              if text.count(marker) != 1:
                  raise SystemExit('expected changelog Fixed section marker exactly once')
              text = text.replace(marker, marker + bullet, 1)
              path.write_text(text)
          PY
          rm .github/workflows/lifeos-pr245-credential-revoke-red.yml
          git diff --check
          changed="$(git status --porcelain | sed -E 's/^.. //')"
          expected="$(printf '%s\n' \
            '.github/workflows/lifeos-pr245-credential-revoke-red.yml' \
            'CHANGELOG.md' | sort)"
          actual="$(printf '%s\n' "$changed" | sort)"
          test "$actual" = "$expected"
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add --all
          git commit -m 'docs(integration): record credential replay revoke fence'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1
