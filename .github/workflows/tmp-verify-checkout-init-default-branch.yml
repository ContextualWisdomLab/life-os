name: Temporary checkout initial-branch verifier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prove explicit Git init branch authority
        shell: bash
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        run: |
          set -Eeuo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          output="$(git -C "$probe_dir" init 2>&1)"
          printf '%s\n' "$output"
          test "$(git -C "$probe_dir" symbolic-ref --short HEAD)" = main
          ! grep -F "Using 'master' as the name for the initial branch" <<<"$output"
          ! grep -F 'will change to "main" in Git 3.0' <<<"$output"

      - name: Checkout exact contributor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checkout initial-branch contract
        run: >-
          pnpm --filter @life-os/commercial-development-agent exec vitest run
          src/node24-actions-contract.test.mjs
