name: Temporary checkout initial-branch writer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prove explicit Git init branch authority
        shell: bash
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        run: |
          set -Eeuo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          output="$(git -C "$probe_dir" init 2>&1)"
          printf '%s\n' "$output"
          test "$(git -C "$probe_dir" symbolic-ref --short HEAD)" = main
          ! grep -F "Using 'master' as the name for the initial branch" <<<"$output"
          ! grep -F 'will change to "main" in Git 3.0' <<<"$output"

      - name: Checkout exact contributor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Apply bounded checkout initialization repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          checkout = 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
          paths = [
              Path('.github/workflows/ci.yml'),
              Path('.github/workflows/deploy.yml'),
              Path('.github/workflows/commercial-readiness.yml'),
              Path('.github/workflows/ai-proposal-live-conformance.yml'),
              Path('.github/workflows/opencode-commercial-development.yml'),
              Path('.github/workflows/appguardrail.yml'),
          ]
          total = 0
          for path in paths:
              lines = path.read_text().splitlines(keepends=True)
              repaired = []
              count = 0
              for line in lines:
                  repaired.append(line)
                  if f'uses: {checkout}' not in line:
                      continue
                  indent = line[: len(line) - len(line.lstrip())]
                  repaired.extend([
                      f'{indent}env:\n',
                      f"{indent}  GIT_CONFIG_COUNT: '1'\n",
                      f'{indent}  GIT_CONFIG_KEY_0: init.defaultBranch\n',
                      f'{indent}  GIT_CONFIG_VALUE_0: main\n',
                  ])
                  count += 1
              if count == 0:
                  raise SystemExit(f'{path}: no reviewed checkout step found')
              path.write_text(''.join(repaired))
              total += count
          print(f'configured {total} checkout steps across {len(paths)} workflows')
          PY
          git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize owned contract source
        run: >-
          pnpm exec prettier --single-quote --write
          packages/commercial-development-agent/src/node24-actions-contract.test.mjs

      - name: Run checkout and workflow contracts
        run: |
          pnpm --filter @life-os/commercial-development-agent exec vitest run \
            src/node24-actions-contract.test.mjs \
            src/workflow-contract.test.mjs
          pnpm --filter @life-os/ai-service exec vitest run \
            src/proposal-quality-live-workflow.test.ts

      - name: Check bounded repair formatting
        run: >-
          pnpm exec prettier --single-quote --check
          .github/workflows/ci.yml
          .github/workflows/deploy.yml
          .github/workflows/commercial-readiness.yml
          .github/workflows/ai-proposal-live-conformance.yml
          .github/workflows/opencode-commercial-development.yml
          packages/commercial-development-agent/src/node24-actions-contract.test.mjs

      - name: Publish ordinary descendant only from exact lease
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          remote_head="$(git ls-remote origin "refs/heads/${SOURCE_BRANCH}" | cut -f1)"
          test "$remote_head" = "$SOURCE_SHA"
          git diff --check
          git config user.name 'LifeOS CI repair writer'
          git config user.email 'ci-repair-writer@life-os.invalid'
          git add \
            .github/workflows/ci.yml \
            .github/workflows/deploy.yml \
            .github/workflows/commercial-readiness.yml \
            .github/workflows/ai-proposal-live-conformance.yml \
            .github/workflows/opencode-commercial-development.yml \
            .github/workflows/appguardrail.yml \
            packages/commercial-development-agent/src/node24-actions-contract.test.mjs
          git diff --cached --quiet && {
            printf 'No repair delta remained after verification.\n' >&2
            exit 1
          }
          git commit -m 'fix(ci): set explicit checkout initial branch'
          git push origin "HEAD:refs/heads/${SOURCE_BRANCH}"
