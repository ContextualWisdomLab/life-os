name: Apply adaptive contextual-orchestrator proposal default

on:
  push:
    branches:
      - agent/adaptive-orchestrator-default
    paths:
      - scripts/apply_adaptive_orchestrator_default.mjs
      - .github/workflows/apply-adaptive-orchestrator-default.yml

permissions:
  contents: write

concurrency:
  group: apply-adaptive-orchestrator-default-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply bounded source transformation
        run: node scripts/apply_adaptive_orchestrator_default.mjs

      - name: Install locked workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Run focused proposal-model tests
        run: pnpm --filter @life-os/ai-service exec vitest run src/contextual-orchestrator-proposal-model.test.ts --no-file-parallelism

      - name: Typecheck AI service
        run: pnpm --filter @life-os/ai-service typecheck

      - name: Inspect patch
        run: git diff --check

      - name: Publish verified implementation commit
        env:
          TARGET_BRANCH: agent/adaptive-orchestrator-default
        run: |
          rm scripts/apply_adaptive_orchestrator_default.mjs
          rm .github/workflows/apply-adaptive-orchestrator-default.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(ai): delegate proposal depth to contextual-orchestrator"
          git push origin "HEAD:${TARGET_BRANCH}"
