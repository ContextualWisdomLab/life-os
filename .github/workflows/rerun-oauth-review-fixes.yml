name: Rerun OAuth review fixes

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: rerun-oauth-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'feat/oauth-http-boundary'
      && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Apply staged patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/apply-oauth-review-fixes.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Install dependencies"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          script = textwrap.dedent(text[start:end])
          subprocess.run(['python3', '-c', script], check=True)
          PY

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Format and validate
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            apps/identity-service/src/oauth-http-boundary.ts \
            apps/identity-service/src/oauth-http-application.ts \
            apps/identity-service/src/oauth-http-boundary.test.ts
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config --quiet
          git diff --check

      - name: Commit validated fixes
        run: |
          set -euo pipefail
          rm -f apps/web/tsconfig.tsbuildinfo
          git checkout -- apps/web/tsconfig.json apps/web/next-env.d.ts 2>/dev/null || true
          git config user.name "LifeOS maintenance automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/identity-service/src/oauth-http-boundary.ts \
            apps/identity-service/src/oauth-http-application.ts \
            apps/identity-service/src/oauth-http-boundary.test.ts
          git diff --cached --check
          git commit -m "fix(identity): harden OAuth cookie boundary"
          git push origin HEAD:feat/oauth-http-boundary
