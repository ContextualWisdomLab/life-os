name: Repair Habit Rule Change Authority V2

on:
  push:
    branches:
      - feat/habit-rule-change-authority-v1
    paths:
      - .github/workflows/repair-habit-rule-change-authority-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-habit-rule-change-authority-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HABIT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: true

      - name: Guard exact staged writer lineage
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "0a13190d79ab1cdc39020232496457bb885f3fc2"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git cat-file -e e7e6c68db1e1e243dcff48220e81819b7ed83762^{commit}
          git merge-base --is-ancestor e7e6c68db1e1e243dcff48220e81819b7ed83762 "$GITHUB_SHA"
          test ! -e .github/workflows/repair-habit-rule-change-authority.yml
          test -f .github/workflows/repair-habit-rule-change-authority-v2.yml

      - name: Materialize bounded repair from retained specification commit
        shell: bash
        run: |
          set -euo pipefail
          git show e7e6c68db1e1e243dcff48220e81819b7ed83762:.github/workflows/repair-habit-rule-change-authority.yml > /tmp/habit-rule-change-source.yml
          python <<'PY'
          from pathlib import Path

          source = Path('/tmp/habit-rule-change-source.yml')
          lines = source.read_text().splitlines()

          def bounds(start_text: str, end_text: str) -> tuple[int, int]:
              start = next(i for i, line in enumerate(lines) if line.strip() == start_text)
              end = next(
                  i
                  for i in range(start + 1, len(lines))
                  if lines[i].strip() == end_text
              )
              return start, end

          def python_heredoc(start_text: str, end_text: str) -> str:
              start, end = bounds(start_text, end_text)
              base_indent = len(lines[start]) - len(lines[start].lstrip())
              prefix = ' ' * base_indent
              rendered: list[str] = []
              triple: str | None = None
              for raw in lines[start + 1 : end]:
                  if triple is not None:
                      rendered.append(raw)
                      if raw.count(triple) % 2 == 1:
                          triple = None
                      continue
                  line = raw[len(prefix) :] if raw.startswith(prefix) else raw
                  rendered.append(line)
                  for delimiter in ('"""', "'''"):
                      if line.count(delimiter) % 2 == 1:
                          triple = delimiter
                          break
              return '\n'.join(rendered) + '\n'

          def indented_block(start_text: str, end_text: str) -> str:
              start, end = bounds(start_text, end_text)
              selected = lines[start + 1 : end]
              nonblank = [line for line in selected if line.strip()]
              indent = min(len(line) - len(line.lstrip()) for line in nonblank)
              return '\n'.join(line[indent:] if line.strip() else '' for line in selected) + '\n'

          Path('/tmp/habit-rule-change-repair.py').write_text(
              python_heredoc("python <<'PY'", 'PY')
          )
          migration = indented_block(
              "cat > apps/habit-service/migrations/0005_habit_rule_change_authority.sql <<'SQL'",
              'SQL',
          )
          ambiguous = 'SELECT max(effective_from_local_date)'
          qualified = (
              'SELECT max('
              'habit_definition_revisions.effective_from_local_date)'
          )
          if migration.count(ambiguous) != 1:
              raise SystemExit(
                  'retained migration: expected one ambiguous effective-date aggregate'
              )
          Path('apps/habit-service/migrations/0005_habit_rule_change_authority.sql').write_text(
              migration.replace(ambiguous, qualified, 1)
          )
          PY
          python /tmp/habit-rule-change-repair.py

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Format owned TypeScript repair
        run: >-
          pnpm exec prettier --single-quote --write
          apps/habit-service/src/habit-domain.ts
          apps/habit-service/src/postgres-habit-repository.ts

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/habit-service/src/habit-domain.ts
          apps/habit-service/src/postgres-habit-repository.ts
          apps/habit-service/src/habit-rule-change-postgres.integration.test.ts
          apps/habit-service/src/habit-rule-change-idempotency-postgres.integration.test.ts
          apps/habit-service/src/habit-rule-change-idempotency-payload-postgres.integration.test.ts

      - name: Typecheck Habit
        run: pnpm --filter @life-os/habit-service typecheck

      - name: Prove effective-dated durable authority
        run: >-
          pnpm --filter @life-os/habit-service exec vitest run
          --no-file-parallelism
          src/habit-rule-change-postgres.integration.test.ts
          src/habit-rule-change-idempotency-postgres.integration.test.ts
          src/habit-rule-change-idempotency-payload-postgres.integration.test.ts
          src/habit-definition-history-postgres.integration.test.ts

      - name: Run complete Habit suite
        run: pnpm --filter @life-os/habit-service test

      - name: Guard exact product delta and retire repair writer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-habit-rule-change-authority-v2.yml
          git add \
            apps/habit-service/migrations/0005_habit_rule_change_authority.sql \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/postgres-habit-repository.ts
          allowed="$(printf '%s\n' \
            .github/workflows/repair-habit-rule-change-authority-v2.yml \
            apps/habit-service/migrations/0005_habit_rule_change_authority.sql \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/postgres-habit-repository.ts | sort)"
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | sort)"
          test "$changed" = "$allowed"
          git diff --check --cached

      - name: Publish exact GREEN repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(habit): own effective-dated rule changes"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
