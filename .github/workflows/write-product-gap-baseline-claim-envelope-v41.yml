name: Write product gap baseline claim envelope evidence

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: life-os-product-gap-baseline-writer
  cancel-in-progress: true

jobs:
  write:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/product-gap-baseline-2026-08-20
          fetch-depth: 0
      - name: Require exact writer input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/docs/product-gap-baseline-2026-08-20)" = "$GITHUB_SHA"
      - name: Replace bounded Integration claim currentness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start = '> #253 is the direct #252 claim/lease child.'
          end = '\n\n## Canonical architecture and evidence rules'
          start_index = text.index(start)
          end_index = text.index(end, start_index)
          replacement = '''> #253 is the direct #252 claim/lease child and remains Draft/unshipped. It owns `life-os.plugin-delivery-attempt-claim.v1`, Integration-owned application/repository/migration `0007`, a worker-visible UUIDv4 claim token whose SHA-256 digest alone is persisted, atomic due/pending/retry-budget acquisition, and finite 30–3600 second leases. Durable-bound RED `400e88163ca9d878806aaee11ef8ca2917ec33dc` proved migrated PostgreSQL accepted out-of-bound 29.999-second and 3600.001-second leases; repair `e25a96d902adc6d6a6422ca4bc114c5bf189f47f` enforces the same database invariant. Later hostile row-array RED `e7c2815030a18809876b9a795aa0fb3f7fe8a49b` / run `34222703786` exposed native Proxy detail; repair `62291129777a1809db9985d8e055a57073315624` completed run `34223014702` GREEN across hostile acceptance, real PostgreSQL, typecheck and the complete Integration suite.

> Fresh envelope review added revoked command/rows/row regressions at `adc0b2abfd96c686eadd469b78a202f90454c55a`. After a formatting-only harness correction, reality RED run `34224860775` / job `102056384487` failed all three new cases with native `TypeError: Cannot perform 'IsArray' on a revoked Proxy`; minimum repository repair `e762d491c1752f8545e426e4949ab1d091d13f22` moved only those shape checks into existing bounded input/evidence seams. Exact run `34225100874` / job `102057170771` completed GREEN: focused 9/9, real PostgreSQL 4/4, Integration typecheck, and complete Integration suite 67 passed / 2 skipped files with 418 passed / 3 skipped tests.

> Application trusted-context regression `469fabedeb593c5ec95fc705b9b3cbea117a5977` then produced reality RED run `34225421007` / job `102058345229`: the new revoked-context case failed with the same native `IsArray` escape while 11 retained focused tests passed. Minimum application repair `3d2dcf626f554427dbdfdcc23ced3fa5965ba1bd` bounds only that context shape check. Exact run `34225615055` / job `102058881497` completed GREEN on Ubuntu 24.04/PostgreSQL 16 with focused 12/12, real PostgreSQL 4/4, Integration typecheck, and complete Integration suite 67 passed / 2 skipped files with 419 passed / 3 skipped tests. Current #253 exact `03ec9d2938e04a394354d3fb4402d99103cc0803` removes only the purpose-complete verifier, is ahead-only of #252 exact `9ed7847d3106d9418e1ff6e04e45c1c7d84d0b0d`, and has no submitted approval or review thread. Durable admission/claim identity remains neither provider execution nor outbound-network authorization; `ContextualWisdomLab/EgressWeave` has no GitHub release, so LifeOS stays fail closed rather than consuming mutable sibling source.'''
          path.write_text(text[:start_index] + replacement + text[end_index:])
          PY
          git diff --check
          grep -F "Current #253 exact \`03ec9d2938e04a394354d3fb4402d99103cc0803\`" docs/product-technical-gap-baseline.md
      - name: Publish source-current baseline and retire writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/docs/product-gap-baseline-2026-08-20)" = "$GITHUB_SHA"
          rm .github/workflows/write-product-gap-baseline-claim-envelope-v41.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/product-technical-gap-baseline.md .github/workflows/write-product-gap-baseline-claim-envelope-v41.yml
          git diff --cached --check
          git commit -m "docs: refresh plugin claim envelope evidence"
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
