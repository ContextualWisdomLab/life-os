name: Production Deployment Reference

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'infra/deployment/**'
      - 'infra/kubernetes/**'
      - 'docs/operations/production-deployment.md'
      - 'docs/superpowers/plans/2026-08-04-production-deployment-reference.md'
      - 'docs/superpowers/specs/2026-08-04-production-deployment-reference-design.md'
      - 'product/capabilities.json'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'infra/deployment/**'
      - 'infra/kubernetes/**'
      - 'docs/operations/production-deployment.md'
      - 'product/capabilities.json'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-reference:
    name: Validate production reference
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify deployment contract with complete coverage
        run: pnpm --filter @life-os/production-deployment-contract test

      - name: Verify kubectl client
        run: kubectl version --client

      - name: Render reusable base
        run: |
          set -euo pipefail
          mkdir -p deployment-evidence
          kubectl kustomize infra/kubernetes/base \
            > deployment-evidence/life-os-base.yaml

      - name: Render digest-pinned production evidence
        run: |
          set -euo pipefail
          node infra/deployment/render-production-overlay.mjs \
            --images infra/kubernetes/overlays/production/image-digests.test.json \
            --output infra/kubernetes/overlays/production/kustomization.yaml
          kubectl kustomize infra/kubernetes/overlays/production \
            > deployment-evidence/life-os-production.yaml
          node infra/deployment/validate-rendered-manifest.mjs \
            deployment-evidence/life-os-production.yaml
          node infra/deployment/create-provenance.mjs \
            deployment-evidence/life-os-production.yaml \
            deployment-evidence/deployment-provenance.json \
            "${GITHUB_SHA}" \
            "${GITHUB_REPOSITORY}"
          sha256sum deployment-evidence/life-os-base.yaml \
            deployment-evidence/life-os-production.yaml \
            deployment-evidence/deployment-provenance.json \
            > deployment-evidence/SHA256SUMS

      - name: Upload bounded validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-reference-${{ github.sha }}
          path: deployment-evidence/
          if-no-files-found: error
          retention-days: 7

  publish-production-bundle:
    name: Publish protected production bundle
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
    needs: validate-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
    env:
      IMAGE_DIGESTS_JSON: ${{ vars.LIFE_OS_PRODUCTION_IMAGE_DIGESTS_JSON }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Require protected immutable image map
        run: |
          set -euo pipefail
          test -n "${IMAGE_DIGESTS_JSON}"
          umask 077
          printf '%s' "${IMAGE_DIGESTS_JSON}" \
            > "${RUNNER_TEMP}/life-os-image-digests.json"

      - name: Build and verify exact production bundle
        run: |
          set -euo pipefail
          mkdir -p deployment-bundle
          node infra/deployment/render-production-overlay.mjs \
            --images "${RUNNER_TEMP}/life-os-image-digests.json" \
            --output infra/kubernetes/overlays/production/kustomization.yaml
          kubectl kustomize infra/kubernetes/overlays/production \
            > deployment-bundle/life-os-production.yaml
          node infra/deployment/validate-rendered-manifest.mjs \
            deployment-bundle/life-os-production.yaml
          node infra/deployment/create-provenance.mjs \
            deployment-bundle/life-os-production.yaml \
            deployment-bundle/deployment-provenance.json \
            "${GITHUB_SHA}" \
            "${GITHUB_REPOSITORY}"
          sha256sum deployment-bundle/life-os-production.yaml \
            deployment-bundle/deployment-provenance.json \
            > deployment-bundle/SHA256SUMS

      - name: Upload protected production bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: life-os-production-${{ github.sha }}
          path: deployment-bundle/
          if-no-files-found: error
          retention-days: 7
