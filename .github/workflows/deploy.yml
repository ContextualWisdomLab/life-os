name: Deploy Production Reference

on:
  workflow_dispatch:
    inputs:
      web_image:
        description: Digest-pinned web image reference
        required: true
        type: string
      gateway_image:
        description: Digest-pinned gateway image reference
        required: true
        type: string
      web_origin:
        description: Exact public HTTPS origin allowed by gateway CORS
        required: true
        type: string
      run_migrations:
        description: Apply all forward-only service migrations before rollout
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: life-os-production-deployment
  cancel-in-progress: false

env:
  KUBECTL_VERSION: v1.36.2

jobs:
  validate:
    name: Validate immutable deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install verified kubectl
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="${RUNNER_TEMP}/kubectl"
          checksum="${RUNNER_TEMP}/kubectl.sha256"
          base_url="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${binary}" "${base_url}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${checksum}" "${base_url}.sha256"
          printf '%s  %s\n' "$(cat "${checksum}")" "${binary}" | sha256sum --check --strict
          sudo install --owner=root --group=root --mode=0755 "${binary}" /usr/local/bin/kubectl

      - name: Validate inputs and render overlay
        env:
          WEB_IMAGE: ${{ inputs.web_image }}
          GATEWAY_IMAGE: ${{ inputs.gateway_image }}
          WEB_ORIGIN: ${{ inputs.web_origin }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered_manifest="${RUNNER_TEMP}/life-os-production.yaml"
          python infra/kubernetes/render-production-manifest.py \
            --source-root infra/kubernetes \
            --render-root "${RUNNER_TEMP}/life-os-kubernetes" \
            --output "${rendered_manifest}"
          kubectl apply --dry-run=client --validate=false \
            --filename "${rendered_manifest}" >/dev/null

  deploy:
    name: Apply protected production rollout
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      WEB_IMAGE: ${{ inputs.web_image }}
      GATEWAY_IMAGE: ${{ inputs.gateway_image }}
      WEB_ORIGIN: ${{ inputs.web_origin }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install verified kubectl
        shell: bash
        run: |
          set -Eeuo pipefail
          binary="${RUNNER_TEMP}/kubectl"
          checksum="${RUNNER_TEMP}/kubectl.sha256"
          base_url="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${binary}" "${base_url}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "${checksum}" "${base_url}.sha256"
          printf '%s  %s\n' "$(cat "${checksum}")" "${binary}" | sha256sum --check --strict
          sudo install --owner=root --group=root --mode=0755 "${binary}" /usr/local/bin/kubectl

      - name: Render exact production manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python infra/kubernetes/render-production-manifest.py \
            --source-root infra/kubernetes \
            --render-root "${RUNNER_TEMP}/life-os-kubernetes" \
            --output "${RUNNER_TEMP}/life-os-production.yaml"

      - name: Configure ephemeral cluster credential
        env:
          LIFE_OS_KUBE_CONFIG_B64: ${{ secrets.LIFE_OS_KUBE_CONFIG_B64 }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${LIFE_OS_KUBE_CONFIG_B64}" ]] || {
            printf 'Required production environment secret LIFE_OS_KUBE_CONFIG_B64 is missing.\n' >&2
            exit 1
          }
          kubeconfig="${RUNNER_TEMP}/life-os-kubeconfig"
          printf '%s' "${LIFE_OS_KUBE_CONFIG_B64" | base64 --decode >"${kubeconfig}"
          chmod 0600 "${kubeconfig}"
          printf 'KUBECONFIG=%s\n' "${kubeconfig}" >>"${GITHUB_ENV}"

      - name: Apply forward-only migrations
        if: ${{ inputs.run_migrations }}
        env:
          LIFE_OS_MIGRATION_CONFIRMATION: apply-forward-only
          IDENTITY_DATABASE_URL: ${{ secrets.IDENTITY_DATABASE_URL }}
          PLANNING_DATABASE_URL: ${{ secrets.PLANNING_DATABASE_URL }}
          HABIT_DATABASE_URL: ${{ secrets.HABIT_DATABASE_URL }}
          AI_DATABASE_URL: ${{ secrets.AI_DATABASE_URL }}
          REVIEW_DATABASE_URL: ${{ secrets.REVIEW_DATABASE_URL }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash infra/kubernetes/run-migrations.sh

      - name: Prepare namespace and capture prior revisions
        id: capture
        shell: bash
        run: |
          set -Eeuo pipefail
          kubectl apply --server-side --field-manager=life-os-deployer \
            --filename infra/kubernetes/base/namespace.yaml

          capture_deployment() {
            local deployment_name="$1"
            local variable_prefix="$2"
            local resource_name revision
            resource_name="$(
              kubectl get deployment "${deployment_name}" \
                --namespace life-os \
                --ignore-not-found \
                --output=name
            )"
            if [[ -z "${resource_name}" ]]; then
              {
                printf '%s_EXISTED=false\n' "${variable_prefix}"
                printf '%s_PRIOR_REVISION=\n' "${variable_prefix}"
              } >>"${GITHUB_ENV}"
              return 0
            fi
            revision="$(
              kubectl get deployment "${deployment_name}" \
                --namespace life-os \
                --output=jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}'
            )"
            [[ "${revision}" =~ ^[0-9]+$ ]] || {
              printf 'Deployment %s has no valid prior revision.\n' "${deployment_name}" >&2
              return 1
            }
            {
              printf '%s_EXISTED=true\n' "${variable_prefix}"
              printf '%s_PRIOR_REVISION=%s\n' "${variable_prefix}" "${revision}"
            } >>"${GITHUB_ENV}"
          }

          capture_deployment life-os-web WEB
          capture_deployment life-os-gateway GATEWAY

      - name: Review and apply exact manifest
        id: apply
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered_manifest="${RUNNER_TEMP}/life-os-production.yaml"
          kubectl apply --server-side --dry-run=server --field-manager=life-os-deployer \
            --filename "${rendered_manifest}" >/dev/null
          diff_status=0
          kubectl diff --server-side --field-manager=life-os-deployer \
            --filename "${rendered_manifest}" || diff_status=$?
          ((diff_status <= 1)) || exit "${diff_status}"
          kubectl apply --server-side --field-manager=life-os-deployer \
            --filename "${rendered_manifest}"

      - name: Verify rollout or restore captured state
        if: ${{ always() && steps.capture.outcome == 'success' }}
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${APPLY_OUTCOME}" == 'success' ]] && \
            kubectl rollout status deployment/life-os-web --namespace life-os --timeout=10m && \
            kubectl rollout status deployment/life-os-gateway --namespace life-os --timeout=10m; then
            kubectl get deployment/life-os-web deployment/life-os-gateway \
              --namespace life-os \
              --output=custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,AVAILABLE:.status.availableReplicas,REVISION:.metadata.annotations.deployment\.kubernetes\.io/revision'
            exit 0
          fi

          restore_deployment() {
            local deployment_name="$1"
            local existed="$2"
            local prior_revision="$3"
            local current_revision remaining
            if [[ "${existed}" == 'true' ]]; then
              [[ "${prior_revision}" =~ ^[0-9]+$ ]] || return 1
              current_revision="$(
                kubectl get deployment "${deployment_name}" \
                  --namespace life-os \
                  --output=jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}'
              )"
              [[ "${current_revision}" =~ ^[0-9]+$ ]] || return 1
              if [[ "${current_revision}" != "${prior_revision}" ]]; then
                kubectl rollout undo "deployment/${deployment_name}" \
                  --namespace life-os \
                  --to-revision="${prior_revision}"
              fi
              kubectl rollout status "deployment/${deployment_name}" \
                --namespace life-os \
                --timeout=5m
              return 0
            fi
            kubectl delete "deployment/${deployment_name}" \
              --namespace life-os \
              --ignore-not-found \
              --wait=true \
              --timeout=5m
            remaining="$(
              kubectl get deployment "${deployment_name}" \
                --namespace life-os \
                --ignore-not-found \
                --output=name
            )"
            [[ -z "${remaining}" ]]
          }

          recovery_failed=0
          restore_deployment life-os-web "${WEB_EXISTED}" "${WEB_PRIOR_REVISION}" || \
            recovery_failed=1
          restore_deployment life-os-gateway "${GATEWAY_EXISTED}" \
            "${GATEWAY_PRIOR_REVISION}" || recovery_failed=1
          if ((recovery_failed != 0)); then
            printf 'Rollout or apply failed, and automatic workload-state recovery also failed.\n' >&2
            exit 2
          fi
          printf 'Rollout or apply failed; captured workload state was restored.\n' >&2
          exit 1
