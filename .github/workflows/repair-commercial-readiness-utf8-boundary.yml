name: Repair Commercial Readiness UTF-8 Boundary

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - .github/workflows/repair-commercial-readiness-utf8-boundary.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout triggering exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Guard single-writer exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Prove malformed UTF-8 regression is RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node --test packages/commercial-readiness/src/github-client-stream-boundary.test.mjs > /tmp/utf8-red.log 2>&1
          status=$?
          set -e
          cat /tmp/utf8-red.log
          test "$status" -ne 0
          grep -F "rejects malformed UTF-8 instead of normalizing untrusted GitHub evidence" /tmp/utf8-red.log
          grep -F "Missing expected rejection" /tmp/utf8-red.log
      - name: Apply minimum strict UTF-8 repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/commercial-readiness/src/github-client.mjs')
          text = path.read_text()
          old = "  return new TextDecoder().decode(merged);\n"
          new = """  try {\n    return new TextDecoder('utf-8', { fatal: true }).decode(merged);\n  } catch {\n    throw new Error('GitHub API response was invalid');\n  }\n"""
          if text.count(old) != 1:
              raise SystemExit('strict UTF-8 patch anchor was not unique')
          path.write_text(text.replace(old, new))
          PY
      - name: Format and prove focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          files=(
            packages/commercial-readiness/src/github-client.mjs
            packages/commercial-readiness/src/github-client-stream-boundary.test.mjs
          )
          pnpm exec prettier --write "${files[@]}"
          pnpm exec prettier --check "${files[@]}"
          node --test \
            packages/commercial-readiness/src/github-client-stream-boundary.test.mjs \
            packages/commercial-readiness/src/github-client.test.mjs \
            packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              packages/commercial-readiness/src/github-client.mjs|packages/commercial-readiness/src/github-client-stream-boundary.test.mjs) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done
      - name: Publish repair and retire writer
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/repair-commercial-readiness-utf8-boundary.yml
          rm "$workflow"

          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/commercial-readiness/src/github-client.mjs \
            packages/commercial-readiness/src/github-client-stream-boundary.test.mjs \
            "$workflow"
          git diff --cached --check
          git commit -m 'fix(commercial-readiness): reject malformed UTF-8 evidence'
          git push origin "HEAD:$GITHUB_REF_NAME"
