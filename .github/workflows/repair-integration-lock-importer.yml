name: Repair Integration lock importer

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: repair-integration-lock-importer
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/plugin-vault-postgres-driver-v1
          fetch-depth: 0

      - name: Apply importer-only repair
        shell: python
        run: |
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          source = path.read_text(encoding='utf-8')
          marker = '  apps/integration-service:\n'
          next_marker = '\n  apps/notification-service:\n'
          start = source.index(marker)
          end = source.index(next_marker, start)
          importer = source[start:end]

          if '\n      pg:\n' in importer or "\n      '@types/pg':\n" in importer:
              raise SystemExit('integration importer already contains PostgreSQL entries')

          dependency_anchor = """      '@nestjs/platform-express':
        specifier: ^11.1.6
        version: 11.1.28(@nestjs/common@11.1.28(reflect-metadata@0.2.2)(rxjs@7.8.2))(@nestjs/core@11.1.28)
      reflect-metadata:
"""
          dependency_replacement = """      '@nestjs/platform-express':
        specifier: ^11.1.6
        version: 11.1.28(@nestjs/common@11.1.28(reflect-metadata@0.2.2)(rxjs@7.8.2))(@nestjs/core@11.1.28)
      pg:
        specifier: ^8.22.0
        version: 8.22.0
      reflect-metadata:
"""
          type_anchor = """      '@types/node':
        specifier: ^24.3.0
        version: 24.13.3
      typescript:
"""
          type_replacement = """      '@types/node':
        specifier: ^24.3.0
        version: 24.13.3
      '@types/pg':
        specifier: ^8.20.0
        version: 8.20.3
      typescript:
"""

          if importer.count(dependency_anchor) != 1:
              raise SystemExit('runtime dependency anchor is not unique inside Integration importer')
          if importer.count(type_anchor) != 1:
              raise SystemExit('type dependency anchor is not unique inside Integration importer')

          repaired = importer.replace(dependency_anchor, dependency_replacement, 1)
          repaired = repaired.replace(type_anchor, type_replacement, 1)
          result = source[:start] + repaired + source[end:]
          if result.count("  apps/integration-service:\n") != 1:
              raise SystemExit('Integration importer cardinality changed')
          path.write_text(result, encoding='utf-8')

      - name: Prove bounded lock delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test "$(git diff --name-only)" = "pnpm-lock.yaml"
          test "$(git diff --numstat -- pnpm-lock.yaml)" = $'6\t0\tpnpm-lock.yaml'
          git diff -- pnpm-lock.yaml

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Verify frozen lock and focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-vault-postgres-driver.test.ts

      - name: Remove repair workflow and publish descendant
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/repair-integration-lock-importer.yml
          test "$(git diff --name-only)" = "pnpm-lock.yaml"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml .github/workflows/repair-integration-lock-importer.yml
          git commit -m 'fix(integration): align PostgreSQL frozen lock importer'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1
