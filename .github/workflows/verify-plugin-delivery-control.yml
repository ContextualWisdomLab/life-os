name: Verify plugin delivery control lifecycle

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-control-v1

permissions:
  contents: write

concurrency:
  group: verify-plugin-delivery-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_os_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_integration_test?sslmode=disable
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting and diff hygiene
        run: |
          pnpm exec prettier --single-quote --check \
            apps/integration-service/src/plugin-delivery-attempt-control.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-control.ts \
            apps/integration-service/src/plugin-delivery-attempt-control-repository.ts \
            apps/integration-service/src/plugin-delivery-attempt-control.integration.test.ts
          git diff --check HEAD^

      - name: Build Plugin SDK dependency
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Run delivery control capability acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-control.test.ts
          --no-file-parallelism

      - name: Capture pause and resume persistence failure once
        run: |
          set +e
          pnpm --filter @life-os/integration-service exec vitest run \
            src/plugin-delivery-attempt-control.integration.test.ts \
            -t 'durably pauses and resumes' \
            --no-file-parallelism > /tmp/plugin-delivery-control-pause.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .github/diagnostics
            tail -n 200 /tmp/plugin-delivery-control-pause.txt \
              | sed 's/postgresql:\/\/postgres:postgres@127\.0\.0\.1:5432\/life_os_integration_test?sslmode=disable/[REDACTED_TEST_DATABASE_URL]/g' \
              > .github/diagnostics/plugin-delivery-control-pause.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/diagnostics/plugin-delivery-control-pause.txt
            git commit -m 'test(integration): capture delivery control failure evidence'
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$status"
          fi

      - name: Run combined delivery control PostgreSQL acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-control.integration.test.ts
          --no-file-parallelism

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test
