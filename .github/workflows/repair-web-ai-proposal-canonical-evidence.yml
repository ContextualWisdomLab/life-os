name: Repair Web AI Proposal Canonical Evidence

on:
  push:
    branches:
      - test/web-ai-proposal-canonical-evidence-v1
    paths:
      - .github/workflows/repair-web-ai-proposal-canonical-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-web-ai-proposal-canonical-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Guard retained RED and exact owner head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0c01d96eab08cd66a16911b8da12df431859f2ee "$GITHUB_SHA"
          test -f apps/web/app/ai-proposal-client-core.ts
          test -f apps/web/app/ai-proposal-canonical-evidence.test.ts
          test -f .github/workflows/verify-web-ai-proposal-canonical-evidence.yml

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reproduce canonical producer-evidence RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter @life-os/web exec tsx --test app/ai-proposal-canonical-evidence.test.ts; then
            echo 'Expected canonical producer-evidence regression to fail before repair.' >&2
            exit 1
          fi

      - name: Apply minimum producer-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/ai-proposal-client-core.ts')
          source = path.read_text()

          uuid_helper = """/** Requires and canonicalizes one UUIDv4 value. */
          function requireUuid(value: unknown, message: string): string {
            if (typeof value !== 'string' || !UUID_V4_PATTERN.test(value)) {
              throw new Error(message);
            }
            return value.toLowerCase();
          }
          """
          producer_helper = uuid_helper + """
          /** Requires canonical producer-owned UUIDv4 evidence without rewriting it. */
          function requireProducerUuid(value: unknown, message: string): string {
            if (typeof value !== 'string' || !CANONICAL_UUID_V4_PATTERN.test(value)) {
              throw new Error(message);
            }
            return value;
          }
          """
          if source.count(uuid_helper) != 1:
            raise SystemExit('UUID helper anchor changed')
          source = source.replace(uuid_helper, producer_helper, 1)

          timestamp_before = """/** Requires and canonicalizes one RFC 3339 timestamp. */
          function requireTimestamp(value: unknown): string {
            if (typeof value !== 'string' || !RFC_3339_TIMESTAMP_PATTERN.test(value)) {
              throw new Error('AI service response is invalid');
            }
            const parsed = Date.parse(value);
            if (!Number.isFinite(parsed)) {
              throw new Error('AI service response is invalid');
            }
            return new Date(parsed).toISOString();
          }
          """
          timestamp_after = """/** Requires canonical producer-owned RFC 3339 UTC evidence without rewriting it. */
          function requireTimestamp(value: unknown): string {
            if (typeof value !== 'string' || !RFC_3339_TIMESTAMP_PATTERN.test(value)) {
              throw new Error('AI service response is invalid');
            }
            const parsed = Date.parse(value);
            if (!Number.isFinite(parsed) || new Date(parsed).toISOString() !== value) {
              throw new Error('AI service response is invalid');
            }
            return value;
          }
          """
          if source.count(timestamp_before) != 1:
            raise SystemExit('timestamp helper anchor changed')
          source = source.replace(timestamp_before, timestamp_after, 1)

          def producer_uuid_block(text: str, start: str, end: str) -> str:
            if text.count(start) != 1 or text.count(end) < 1:
              raise SystemExit(f'block anchor changed: {start}')
            prefix, rest = text.split(start, 1)
            block, suffix = rest.split(end, 1)
            if 'requireUuid(' not in block:
              raise SystemExit(f'no UUID normalization in block: {start}')
            block = block.replace('requireUuid(', 'requireProducerUuid(')
            return prefix + start + block + end + suffix

          source = producer_uuid_block(
            source,
            'export function parseAiSessionPrincipal',
            '/** Requires one supported method and exact canonical AI service path. */',
          )
          source = producer_uuid_block(
            source,
            'function parseProposal(value: unknown): Record<string, unknown> {',
            '/** Parses one proposal request echoed in immutable audit evidence. */',
          )
          source = producer_uuid_block(
            source,
            'function parseDecisionEvent(value: unknown): Record<string, unknown> {',
            '/** Validates one successful response according to method and route. */',
          )

          path.write_text(source)
          PY
          pnpm exec prettier --single-quote --write apps/web/app/ai-proposal-client-core.ts

      - name: Prove exact Web repair GREEN
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/web/app/ai-proposal-client-core.ts \
            apps/web/app/ai-proposal-canonical-evidence.test.ts \
            .github/workflows/verify-web-ai-proposal-canonical-evidence.yml
          pnpm --filter @life-os/web exec tsx --test app/ai-proposal-canonical-evidence.test.ts
          pnpm --filter @life-os/web typecheck
          pnpm --filter @life-os/web test

      - name: Guard bounded semantic delta and self-retire
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-web-ai-proposal-canonical-evidence.yml
          git add apps/web/app/ai-proposal-client-core.ts
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/repair-web-ai-proposal-canonical-evidence.yml apps/web/app/ai-proposal-client-core.ts | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check --cached

      - name: Publish ordinary semantic descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): preserve canonical AI producer evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
