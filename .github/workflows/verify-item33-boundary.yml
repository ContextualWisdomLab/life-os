name: Verify item 33 checkout-step boundary

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Reproduce final-step boundary contamination
        run: |
          set -euo pipefail
          node --test packages/commercial-readiness/src/workflow-external-checkout-path-contract.test.mjs
          node --check packages/commercial-readiness/src/workflow-external-checkout-path-contract.test.mjs
