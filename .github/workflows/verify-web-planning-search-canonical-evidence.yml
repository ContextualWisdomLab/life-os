name: Verify Web Planning Search Canonical Evidence

on:
  push:
    branches:
      - test/web-planning-search-canonical-evidence-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --check
          apps/web/app/planning-search-canonical-evidence.test.ts
          .github/workflows/verify-web-planning-search-canonical-evidence.yml

      - name: Run canonical-evidence regression
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/planning-search-canonical-evidence.test.ts

      - name: Typecheck Web
        run: pnpm --filter @life-os/web typecheck
