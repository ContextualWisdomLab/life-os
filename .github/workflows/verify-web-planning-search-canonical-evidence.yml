name: Verify Web Planning Search Canonical Evidence

on:
  push:
    branches:
      - test/web-planning-search-canonical-evidence-v1
    paths:
      - apps/web/app/planning-search-client.ts
      - apps/web/app/planning-search-canonical-evidence.test.ts
      - .github/workflows/verify-web-planning-search-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-web-planning-search-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact semantic publication
        shell: bash
        run: |
          set -euo pipefail
          semantic_publication='49d7b3f2511f768d6abcc56072b3c3b8129cbb03'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$semantic_publication" "$GITHUB_SHA"
          test ! -e .github/workflows/repair-web-planning-search-canonical-evidence.yml

          changed="$(git diff --name-only "$semantic_publication" "$GITHUB_SHA" | LC_ALL=C sort)"
          test "$changed" = '.github/workflows/verify-web-planning-search-canonical-evidence.yml'
          git diff --check "$semantic_publication" "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/app/planning-search-client.ts
          apps/web/app/planning-search-canonical-evidence.test.ts
          .github/workflows/verify-web-planning-search-canonical-evidence.yml

      - name: Run canonical-evidence regression
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/planning-search-canonical-evidence.test.ts

      - name: Typecheck Web
        run: pnpm --filter @life-os/web typecheck

      - name: Run complete Web suite
        run: pnpm --filter @life-os/web test
