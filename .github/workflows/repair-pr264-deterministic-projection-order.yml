name: Repair PR264 deterministic projection order

on:
  push:
    branches: [feat/habit-review-period-projection-v1]
    paths:
      - .github/workflows/repair-pr264-deterministic-projection-order.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable reproducible pnpm
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version | grep -Fx '10.15.0'

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm install --frozen-lockfile

      - name: Establish locale-sensitive ordering RED
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/habit-service/src/habit-review-projection.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const anchor = "  it('counts a scheduled opportunity at most once despite duplicate completion events', async () => {";
          if (!source.includes(anchor)) throw new Error('Regression anchor is missing');
          const regression = `  it('orders projection provenance independently of ambient locale collation', async () => {\n    const service = new HabitService(new InMemoryHabitRepository(), () => AS_OF);\n    for (const title of ['z', 'ä']) {\n      await service.createHabit(WORKSPACE_ID, {\n        title,\n        timezone: 'UTC',\n        startsOn: '2026-09-07',\n        recurrence: { kind: 'daily', interval: 1 },\n      });\n    }\n\n    const projection = await service.projectReviewWeek(\n      WORKSPACE_ID,\n      '2026-09-07',\n    );\n\n    expect(projection.habits.map((habit) => habit.title)).toEqual(['z', 'ä']);\n  });\n\n`;
          fs.writeFileSync(path, source.replace(anchor, regression + anchor));
          NODE
          pnpm exec prettier --single-quote --write apps/habit-service/src/habit-review-projection.test.ts
          set +e
          LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 pnpm --filter @life-os/habit-service test -- src/habit-review-projection.test.ts 2>&1 | tee /tmp/pr264-order-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Expected locale-sensitive ordering regression did not fail' >&2
            exit 1
          fi
          grep -F "orders projection provenance independently of ambient locale collation" /tmp/pr264-order-red.log
          grep -F "expected [ 'ä', 'z' ] to deeply equal [ 'z', 'ä' ]" /tmp/pr264-order-red.log

      - name: Apply locale-independent canonical ordering
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/habit-service/src/habit-domain.ts';
          let source = fs.readFileSync(path, 'utf8');
          const helperAnchor = 'function entityLookupKey(workspaceId: string, entityId: string): string {';
          if (!source.includes(helperAnchor)) throw new Error('Comparator helper anchor is missing');
          const helper = `/** Orders projection text by code units so content fingerprints never depend on host locale or ICU data. */\nfunction compareCanonicalText(left: string, right: string): number {\n  return left < right ? -1 : left > right ? 1 : 0;\n}\n\n`;
          source = source.replace(helperAnchor, helper + helperAnchor);
          const oldSort = `    entries.sort(\n      (left, right) =>\n        left.title.localeCompare(right.title) ||\n        left.habitId.localeCompare(right.habitId),\n    );`;
          const newSort = `    entries.sort(\n      (left, right) =>\n        compareCanonicalText(left.title, right.title) ||\n        compareCanonicalText(left.habitId, right.habitId),\n    );`;
          if (!source.includes(oldSort)) throw new Error('Projection ordering anchor is missing');
          source = source.replace(oldSort, newSort);
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --single-quote --write \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/habit-review-projection.test.ts

      - name: Verify focused and complete Habit quality
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --check \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/habit-review-projection.test.ts
          LANG=sv_SE.UTF-8 LC_ALL=sv_SE.UTF-8 pnpm --filter @life-os/habit-service test -- src/habit-review-projection.test.ts
          pnpm --filter @life-os/habit-service typecheck
          pnpm --filter @life-os/habit-service test
          pnpm --filter @life-os/habit-service build
          git diff --check

      - name: Publish bounded self-retired candidate
        shell: bash
        env:
          INPUT_SHA: ${{ github.sha }}
          BRANCH_NAME: feat/habit-review-period-projection-v1
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git diff --name-only HEAD | sort)
          printf 'Changed before retirement:\n%s\n' "${changed[*]}"
          expected_before=$(printf '%s\n' \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/habit-review-projection.test.ts | sort)
          actual_before=$(printf '%s\n' "${changed[@]}")
          test "$actual_before" = "$expected_before"

          rm .github/workflows/repair-pr264-deterministic-projection-order.yml
          git diff --check
          git config user.name 'life-os hourly maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            apps/habit-service/src/habit-domain.ts \
            apps/habit-service/src/habit-review-projection.test.ts \
            .github/workflows/repair-pr264-deterministic-projection-order.yml
          git commit -m 'fix(habit): canonicalize Review projection ordering'

          remote_head=$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | awk '{print $1}')
          test "$remote_head" = "$INPUT_SHA"
          git push origin "HEAD:${BRANCH_NAME}"
