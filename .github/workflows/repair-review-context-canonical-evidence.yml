name: Repair Review Context Canonical Evidence

on:
  push:
    branches:
      - test/review-context-canonical-evidence-v1
    paths:
      - .github/workflows/repair-review-context-canonical-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-review-context-canonical-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained RED ancestry and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "3352bb81df5cf9251b4dc451eae949630b170935" HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce canonical signed-evidence RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter @life-os/review-service exec vitest run src/review-context-canonical-evidence.test.ts; then
            echo 'Expected the retained byte-different signed-workspace regression to fail before repair.' >&2
            exit 1
          fi

      - name: Apply minimum canonical-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('apps/review-service/src/http-boundary.ts'); s=p.read_text(); old='    workspaceId = requireReviewWorkspaceId(headers.workspaceId);\\n  } catch {'; new='    workspaceId = requireReviewWorkspaceId(headers.workspaceId);\\n    if (workspaceId !== headers.workspaceId) {\\n      return invalidGatewayContext();\\n    }\\n  } catch {'; assert s.count(old) == 1; p.write_text(s.replace(old, new, 1))"
          python -c "from pathlib import Path; p=Path('apps/review-service/src/http-boundary.test.ts'); s=p.read_text(); old='          workspaceId: WORKSPACE_ID.toUpperCase(),'; new='          workspaceId: WORKSPACE_ID,'; assert s.count(old) == 1; p.write_text(s.replace(old, new, 1))"
          git rm .github/workflows/repair-review-context-canonical-evidence.yml
          pnpm exec prettier --single-quote --write apps/review-service/src/http-boundary.ts apps/review-service/src/http-boundary.test.ts

      - name: Verify minimum repair and complete Review contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check apps/review-service/src/http-boundary.ts apps/review-service/src/http-boundary.test.ts apps/review-service/src/review-context-canonical-evidence.test.ts
          pnpm --filter @life-os/review-service exec vitest run src/review-context-canonical-evidence.test.ts src/http-boundary.test.ts
          pnpm --filter @life-os/review-service typecheck
          pnpm --filter @life-os/review-service test
          git diff --check
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' '.github/workflows/repair-review-context-canonical-evidence.yml' 'apps/review-service/src/http-boundary.test.ts' 'apps/review-service/src/http-boundary.ts' | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary semantic repair descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(review): require canonical signed workspace evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
