name: Repair AI NIM Live Conformance

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/format-ai-nim-live-conformance.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-nim-live-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply reviewed deterministic repairs
        run: python3 .github/scripts/repair-ai-nim-live-conformance.py

      - name: Format repaired source files
        run: |
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts \
            apps/ai-service/src/proposal-quality-live-coverage.test.ts

      - name: Verify repaired AI service slice
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test

      - name: Commit verified repairs
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts \
            apps/ai-service/src/proposal-quality-live-coverage.test.ts
          git diff --cached --check
          git commit -m 'fix(ai): harden live conformance validation'
          git push origin HEAD:feat/ai-nim-live-conformance
