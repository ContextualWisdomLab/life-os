name: Format AI NIM Live Conformance

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/format-ai-nim-live-conformance.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-nim-live-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Repair deterministic verification findings
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          live_path = Path(
              'apps/ai-service/src/contextual-orchestrator-live-model.ts'
          )
          live = live_path.read_text(encoding='utf-8')
          old_response = """async function boundedResponseText(response: Response): Promise<string> {
            if (!response.ok || response.body === null) {
              return fail(
                response.status === 429 || response.status >= 500
                  ? 'provider_unavailable'
                  : 'orchestrator_unavailable',
              );
            }
          """.replace('          ', '')
          new_response = """async function boundedResponseText(response: Response): Promise<string> {
            if (!response.ok) {
              return fail(
                response.status === 429 || response.status >= 500
                  ? 'provider_unavailable'
                  : 'orchestrator_unavailable',
              );
            }
            if (response.body === null) {
              return fail('evaluation_failed');
            }
          """.replace('          ', '')
          if live.count(old_response) != 1:
              raise SystemExit(
                  'null response classification: expected one source block'
              )
          live = live.replace(old_response, new_response, 1)

          elapsed_marker = """      const elapsed = this.monotonicClock() - startedAt;
          """.replace('          ', '')
          elapsed_index = live.index(elapsed_marker)
          success_start = live.index(
              '      this.recordedObservations.push(\n', elapsed_index
          )
          outer_catch = live.index(
              "    } catch (error) {\n      const code =",
              success_start,
          )
          replacement = """      let draft: ProposalModelDraft;
            try {
              draft = parseContextualOrchestratorProposalCompletion(text);
            } catch (error) {
              if (error instanceof ProposalModelTransportError) {
                return fail('evaluation_failed');
              }
              throw error;
            }
            this.recordedObservations.push(
              observation(
                this.configuration.profile,
                observedMode,
                trace,
                parsePlanSource(orchestration?.plan_source),
                elapsed,
                parseUsage(envelope),
                null,
              ),
            );
            return draft;
          """.replace('          ', '')
          live = live[:success_start] + replacement + live[outer_catch:]
          live_path.write_text(live, encoding='utf-8')

          replace_once(
              'apps/ai-service/src/proposal-quality-live-conformance.ts',
              """  const timestamp = requireString(report.evaluatedAt, 64);
            if (new Date(timestamp).toISOString() !== timestamp) {
              return invalid();
            }
          """.replace('          ', ''),
              """  const timestamp = requireString(report.evaluatedAt, 64);
            let canonicalTimestamp: string;
            try {
              canonicalTimestamp = new Date(timestamp).toISOString();
            } catch {
              return invalid();
            }
            if (canonicalTimestamp !== timestamp) {
              return invalid();
            }
          """.replace('          ', ''),
              'timestamp validation sanitization',
          )

          replace_once(
              'apps/ai-service/src/proposal-quality-live-workflow.test.ts',
              '    expect(uses.length).toBeGreaterThanOrEqual(6);',
              '    expect(uses.length).toBeGreaterThanOrEqual(5);',
              'external action count',
          )
          replace_once(
              'apps/ai-service/src/proposal-quality-live-workflow.test.ts',
              """    expect(workflow).toContain(
              "CONTEXTUAL_ORCHESTRATOR_LIVE_URL: 'http://127.0.0.1:8765'",
            );
          """.replace('          ', ''),
              """    expect(workflow).toContain(
              "'CONTEXTUAL_ORCHESTRATOR_LIVE_URL': 'http://127.0.0.1:8765'",
            );
          """.replace('          ', ''),
              'loopback runtime configuration assertion',
          )

          replace_once(
              'apps/ai-service/src/contextual-orchestrator-live-model.test.ts',
              """      expect(fixture.model.observations().at(-1)?.failureCode).toBe(
              'evaluation_failed',
            );
          """.replace('          ', ''),
              """      expect(fixture.model.observations()).toHaveLength(1);
            expect(fixture.model.observations().at(-1)?.failureCode).toBe(
              'evaluation_failed',
            );
          """.replace('          ', ''),
              'single failure observation evidence',
          )
          PY

      - name: Format complete live-conformance slice
        run: |
          pnpm exec prettier --single-quote --write \
            .github/workflows/ai-proposal-live-conformance.yml \
            apps/ai-service/package.json \
            apps/ai-service/src/contextual-orchestrator-proposal-model.ts \
            apps/ai-service/src/contextual-orchestrator-proposal-contract.test.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-conformance.test.ts \
            apps/ai-service/src/proposal-quality-live-command.ts \
            apps/ai-service/src/proposal-quality-live-command.test.ts \
            apps/ai-service/src/proposal-quality-live-cli.ts \
            apps/ai-service/src/proposal-quality-live-cli.test.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts \
            docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md \
            docs/superpowers/plans/2026-08-06-ai-nim-live-conformance.md

      - name: Commit canonical corrections
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/ai-proposal-live-conformance.yml \
            apps/ai-service/package.json \
            apps/ai-service/src/contextual-orchestrator-proposal-model.ts \
            apps/ai-service/src/contextual-orchestrator-proposal-contract.test.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-conformance.test.ts \
            apps/ai-service/src/proposal-quality-live-command.ts \
            apps/ai-service/src/proposal-quality-live-command.test.ts \
            apps/ai-service/src/proposal-quality-live-cli.ts \
            apps/ai-service/src/proposal-quality-live-cli.test.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts \
            docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md \
            docs/superpowers/plans/2026-08-06-ai-nim-live-conformance.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'fix(ai): harden live conformance verification'
            git push origin HEAD:feat/ai-nim-live-conformance
          fi

      - name: Verify corrected AI service slice
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test
