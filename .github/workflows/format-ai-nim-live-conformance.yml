name: Repair AI NIM Live Conformance

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/format-ai-nim-live-conformance.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-nim-live-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply deterministic verification repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          live_path = Path(
              'apps/ai-service/src/contextual-orchestrator-live-model.ts'
          )
          live = live_path.read_text(encoding='utf-8')
          old_response = (
              'async function boundedResponseText(response: Response): Promise<string> {\n'
              '  if (!response.ok || response.body === null) {\n'
              '    return fail(\n'
              '      response.status === 429 || response.status >= 500\n'
              "        ? 'provider_unavailable'\n"
              "        : 'orchestrator_unavailable',\n"
              '    );\n'
              '  }\n'
          )
          new_response = (
              'async function boundedResponseText(response: Response): Promise<string> {\n'
              '  if (!response.ok) {\n'
              '    return fail(\n'
              '      response.status === 429 || response.status >= 500\n'
              "        ? 'provider_unavailable'\n"
              "        : 'orchestrator_unavailable',\n"
              '    );\n'
              '  }\n'
              '  if (response.body === null) {\n'
              "    return fail('evaluation_failed');\n"
              '  }\n'
          )
          if live.count(old_response) != 1:
              raise SystemExit(
                  'successful response without body classification: expected one block'
              )
          live = live.replace(old_response, new_response, 1)

          elapsed_marker = (
              '      const elapsed = this.monotonicClock() - startedAt;\n'
          )
          elapsed_index = live.index(elapsed_marker)
          success_start = live.index(
              '      this.recordedObservations.push(\n', elapsed_index
          )
          outer_catch = live.index(
              "    } catch (error) {\n      const code =",
              success_start,
          )
          replacement = (
              '      let draft: ProposalModelDraft;\n'
              '      try {\n'
              '        draft = parseContextualOrchestratorProposalCompletion(text);\n'
              '      } catch (error) {\n'
              '        if (error instanceof ProposalModelTransportError) {\n'
              "          return fail('evaluation_failed');\n"
              '        }\n'
              '        throw error;\n'
              '      }\n'
              '      this.recordedObservations.push(\n'
              '        observation(\n'
              '          this.configuration.profile,\n'
              '          observedMode,\n'
              '          trace,\n'
              '          parsePlanSource(orchestration?.plan_source),\n'
              '          elapsed,\n'
              '          parseUsage(envelope),\n'
              '          null,\n'
              '        ),\n'
              '      );\n'
              '      return draft;\n'
          )
          live = live[:success_start] + replacement + live[outer_catch:]
          live_path.write_text(live, encoding='utf-8')

          replace_once(
              'apps/ai-service/src/proposal-quality-live-conformance.ts',
              (
                  '  const timestamp = requireString(report.evaluatedAt, 64);\n'
                  '  if (new Date(timestamp).toISOString() !== timestamp) {\n'
                  '    return invalid();\n'
                  '  }\n'
              ),
              (
                  '  const timestamp = requireString(report.evaluatedAt, 64);\n'
                  '  let canonicalTimestamp: string;\n'
                  '  try {\n'
                  '    canonicalTimestamp = new Date(timestamp).toISOString();\n'
                  '  } catch {\n'
                  '    return invalid();\n'
                  '  }\n'
                  '  if (canonicalTimestamp !== timestamp) {\n'
                  '    return invalid();\n'
                  '  }\n'
              ),
              'timestamp validation sanitization',
          )

          workflow_test_path = Path(
              'apps/ai-service/src/proposal-quality-live-workflow.test.ts'
          )
          workflow_test = workflow_test_path.read_text(encoding='utf-8')
          replacements = [
              (
                  '    expect(uses.length).toBeGreaterThanOrEqual(6);',
                  '    expect(uses.length).toBeGreaterThanOrEqual(5);',
                  'external action count',
              ),
              (
                  "CONTEXTUAL_ORCHESTRATOR_LIVE_URL: 'http://127.0.0.1:8765'",
                  "'CONTEXTUAL_ORCHESTRATOR_LIVE_URL': 'http://127.0.0.1:8765'",
                  'loopback runtime configuration assertion',
              ),
          ]
          for old, new, label in replacements:
              if workflow_test.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match')
              workflow_test = workflow_test.replace(old, new, 1)

          dependency_anchor = (
              "    ).toContain('_contextual_orchestrator/requirements.lock');\n"
          )
          dependency_index = workflow_test.index(dependency_anchor)
          dependency_insert = (
              "    expect(\n"
              "      step('Install pinned contextual-orchestrator dependencies'),\n"
              "    ).not.toContain('--no-deps');\n"
              "    expect(\n"
              "      step('Install pinned contextual-orchestrator dependencies'),\n"
              "    ).not.toContain('./_contextual_orchestrator');\n"
          )
          workflow_test = (
              workflow_test[: dependency_index + len(dependency_anchor)]
              + dependency_insert
              + workflow_test[dependency_index + len(dependency_anchor) :]
          )

          server_anchor = (
              "    const server = step('Start the loopback contextual-orchestrator');\n"
          )
          server_index = workflow_test.index(server_anchor)
          server_insert = (
              "    expect(server).toContain(\n"
              "      'working-directory: _contextual_orchestrator',\n"
              "    );\n"
          )
          workflow_test = (
              workflow_test[: server_index + len(server_anchor)]
              + server_insert
              + workflow_test[server_index + len(server_anchor) :]
          )
          workflow_test_path.write_text(workflow_test, encoding='utf-8')

          model_test_path = Path(
              'apps/ai-service/src/contextual-orchestrator-live-model.test.ts'
          )
          model_test = model_test_path.read_text(encoding='utf-8')
          malformed_loop = model_test.index(
              '  for (const [index, nextResponse] of malformedResponses.entries()) {'
          )
          assertion = (
              '      expect(fixture.model.observations().at(-1)?.failureCode).toBe(\n'
              "        'evaluation_failed',\n"
              '      );\n'
          )
          assertion_index = model_test.index(assertion, malformed_loop)
          model_test = (
              model_test[:assertion_index]
              + '      expect(fixture.model.observations()).toHaveLength(1);\n'
              + model_test[assertion_index:]
          )
          model_test_path.write_text(model_test, encoding='utf-8')
          PY

      - name: Format repaired source files
        run: |
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts

      - name: Verify repaired AI service slice
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test

      - name: Commit verified repairs
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts
          git diff --cached --check
          git commit -m 'fix(ai): harden live conformance validation'
          git push origin HEAD:feat/ai-nim-live-conformance
