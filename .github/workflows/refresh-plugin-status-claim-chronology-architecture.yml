name: Refresh Plugin Status Claim Chronology Architecture

on:
  push:
    branches: [docs/canonical-product-architecture-mainline]

permissions:
  contents: write

concurrency:
  group: refresh-plugin-status-claim-chronology-architecture
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace bounded Plugin Integration currentness paragraph
        shell: python
        run: |
          from pathlib import Path

          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          start_marker = 'Issue #130 remains **Partial**. Protected main does not yet contain the Vault/PostgreSQL/delivery-origin/delivery-attempt active stack.'
          end_marker = '\n\n## 6. AI proposal boundary'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('expected one bounded Plugin Integration currentness region')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              'Issue #130 remains **Partial**. Protected main does not yet contain the Vault/PostgreSQL/delivery-origin/delivery-attempt active stack. #252 establishes durable admission, #253 deterministic finite worker claim/lease, #254 claim-bound bounded retry/backoff, #255 append-only sanitized outcome evidence, #256 durable pause/resume/dead-letter control evidence with non-decreasing chronology, and #257 exact pre-execution claim/grant/installation revocation fencing. #258 extends the active unshipped Integration lifecycle with a read-only, exact delivery/workspace/requesting-user-scoped durable status boundary that is reconstructable after repository/runtime restart. Earlier exact proof head `8855427b8fcfa3b364223e91cd088546df84d684`, run `34276065348`, job `102229247458`, completed GREEN after both application and PostgreSQL repository boundaries were repaired to reject durable status evidence updated after the trusted read instant.\n\n'
              'Fresh migration-parity review then found that the status repository could still certify hostile durable rows impossible under migration 0007: a claim beginning before `requested_at`, or a claim beginning after aggregate `updated_at`. Regression-only exact `a84c265afa07a54900afba1af148a9f51dfb6f94`, run `34278422118`, job `102237052398`, reached Ubuntu 24.04 and failed both focused tests because both impossible rows resolved to status snapshots instead of fixed persistence-evidence rejection. Minimum causal repair `6c29a685a457ad7d199a502e82c99711b39219c2` binds claim chronology back to the already-validated aggregate instants, enforcing `claim_started_at >= requested_at` and `updated_at >= claim_started_at` at the repository evidence boundary without changing schema, query scope or ownership. Exact run `34279136682`, job `102239393667`, completed GREEN: focused chronology 2/2, focused status 9/9, Integration typecheck, and complete Integration suite 420 passed / 45 environment-dependent skipped across 82 files (68 passed / 14 skipped). Current #258 exact `e9eec8f8dc99c80f2712d452a94c205db78bf3d5` removes only the purpose-complete chronology verifier from the proven head.\n\n'
              'The status contract remains credential-free, exposes only derived claim state, creates no new persistence owner or migration, and grants no provider-execution or outbound-network authority. Remaining LifeOS-owned delivery work is bounded provider execution/outcome integration and authenticated operator HTTP composition; outbound I/O remains fail closed until an immutable released/versioned canonical egress contract exists. No active LifeOS PR supplies complete host-authorized outbound HTTPS. Outbound authority must come only from an immutable released/versioned canonical egress contract; otherwise the network boundary remains fail closed. Durable origin/delivery/claim/retry/outcome/control/fence/status identity is not network authorization.'
          )
          path.write_text(text[:start] + replacement + text[end:])

      - name: Verify bounded documentation delta
        run: |
          git diff --check
          git diff -- ARCHITECTURE.md
          test -n "$(git status --short ARCHITECTURE.md)"

      - name: Fence concurrent branch movement and publish
        env:
          INPUT_SHA: ${{ github.sha }}
          BRANCH: docs/canonical-product-architecture-mainline
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          test "${remote_sha}" = "${INPUT_SHA}"
          git config user.name "LifeOS commercial maintainer"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/refresh-plugin-status-claim-chronology-architecture.yml
          git add ARCHITECTURE.md
          git commit -m "docs: record plugin claim chronology repair"
          git push origin "HEAD:${BRANCH}"
