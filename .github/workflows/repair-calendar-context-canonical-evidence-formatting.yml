name: Repair Calendar Context Canonical Evidence Formatting

on:
  push:
    branches:
      - test/calendar-context-canonical-evidence-v1
    paths:
      - .github/workflows/repair-calendar-context-canonical-evidence-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-calendar-context-canonical-evidence-formatting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained regression ancestry and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 500a290876d3e3b07622aa7e471b055c1184939b HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Require verifier workflow already canonical
        run: >-
          pnpm exec prettier --check
          .github/workflows/verify-calendar-context-canonical-evidence.yml

      - name: Prove focused formatting RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec prettier --single-quote --check \
            apps/integration-calendar-service/src/calendar-service-context.ts \
            apps/integration-calendar-service/src/calendar-service-context-canonical-evidence.test.ts; then
            echo 'Expected retained Calendar context evidence files to be noncanonical before repair.' >&2
            exit 1
          fi

      - name: Apply source-only formatter repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            apps/integration-calendar-service/src/calendar-service-context.ts \
            apps/integration-calendar-service/src/calendar-service-context-canonical-evidence.test.ts

      - name: Verify bounded source repair and retained behavior
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/integration-calendar-service/src/calendar-service-context.ts \
            apps/integration-calendar-service/src/calendar-service-context-canonical-evidence.test.ts \
            .github/workflows/verify-calendar-context-canonical-evidence.yml
          pnpm --filter @life-os/integration-calendar-service exec vitest run \
            src/calendar-service-context-canonical-evidence.test.ts
          pnpm --filter @life-os/integration-calendar-service typecheck
          git diff --check
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          test -n "${actual}"
          while IFS= read -r path; do
            case "${path}" in
              apps/integration-calendar-service/src/calendar-service-context.ts|apps/integration-calendar-service/src/calendar-service-context-canonical-evidence.test.ts) ;;
              *) echo "Unexpected formatter delta: ${path}" >&2; exit 1 ;;
            esac
          done <<< "${actual}"

      - name: Publish source-only ordinary descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/integration-calendar-service/src/calendar-service-context.ts \
            apps/integration-calendar-service/src/calendar-service-context-canonical-evidence.test.ts
          git commit -m 'style(calendar): format canonical context evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
