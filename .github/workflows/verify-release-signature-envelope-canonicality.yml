name: Verify Release Signature Envelope Canonicality

on:
  push:
    branches:
      - feat/release-signature-verification-v2

permissions:
  contents: read

concurrency:
  group: life-os-release-signature-envelope-canonicality
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Guard exact publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r remote_head _ < <(git ls-remote --refs origin "refs/heads/$GITHUB_REF_NAME")
          test "$remote_head" = "$GITHUB_SHA"
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check focused formatting
        run: >-
          pnpm exec prettier --check
          packages/commercial-readiness/src/release-signature-verification.mjs
          packages/commercial-readiness/src/release-signature-verification.test.mjs
          packages/commercial-readiness/src/release-signature-envelope-canonicality.test.mjs
      - name: Prove signature envelope key order is canonical
        run: >-
          node --test
          packages/commercial-readiness/src/release-signature-envelope-canonicality.test.mjs
      - name: Run complete Commercial Readiness suite
        run: pnpm --filter @life-os/commercial-readiness test
