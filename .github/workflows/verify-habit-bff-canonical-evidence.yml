name: Verify Habit BFF Canonical Evidence

on:
  push:
    branches:
      - feat/web-habit-bff-v1
    paths:
      - apps/web/app/habit-client.ts
      - apps/web/app/habit-client.test.ts
      - .github/workflows/verify-habit-bff-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-habit-bff-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact semantic publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0abc78ad85b69131df84696a9e9711af12f6d0cb "$GITHUB_SHA"
          test ! -e .github/workflows/repair-habit-bff-canonical-evidence.yml
          test ! -e .github/workflows/repair-habit-bff-verifier-harness.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/app/habit-client.ts
          apps/web/app/habit-client.test.ts
          .github/workflows/verify-habit-bff-canonical-evidence.yml

      - name: Reproduce canonical-evidence regressions
        run: pnpm --filter @life-os/web exec tsx --test app/habit-client.test.ts

      - name: Typecheck Web package
        run: pnpm --filter @life-os/web typecheck

      - name: Run complete Web suite
        run: pnpm --filter @life-os/web test
