name: Execute notification data-rights repair

on:
  push:
    branches:
      - feat/notification-data-rights-contributor-v2
    paths:
      - .github/workflows/execute-notification-data-rights-repair.yml

permissions: {}

concurrency:
  group: execute-notification-data-rights-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/notification-data-rights-contributor-v2
          fetch-depth: 0

      - name: Reconcile protected main and branch authority
        env:
          EXPECTED_PARENT: c1ac9a4207f125669b0ddb8a5904b2b34a9d0746
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/notification-data-rights-contributor-v2:refs/remotes/origin/feat/notification-data-rights-contributor-v2'
          test "$(git rev-parse origin/feat/notification-data-rights-contributor-v2)" = "$(git rev-parse HEAD)"
          git merge --no-edit --no-ff origin/main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack and install locked dependencies
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Materialize reviewed repair phases
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              '.github/workflows/repair-notification-data-rights.yml'
          ).read_text(encoding='utf-8')

          def run_step(name: str) -> str:
              marker = f"      - name: {name}\n"
              start = workflow.index(marker)
              run_start = workflow.index("        run: |\n", start)
              content_start = run_start + len("        run: |\n")
              next_step = workflow.find("\n      - name:", content_start)
              if next_step == -1:
                  next_step = len(workflow)
              lines = workflow[content_start:next_step].splitlines()
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          add_tests = run_step('Add failing regression evidence')
          behavior_start = add_tests.index("behavior_path = Path(\n")
          behavior_end = add_tests.index(
              'migration_contract = r"""',
              behavior_start,
          )
          add_tests = add_tests[:behavior_start] + add_tests[behavior_end:]

          harden_test_contract = r"""python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              'apps/notification-service/src/notification-data-rights-migration.test.ts'
          )
          tests = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r"expect\(sql\)\.toContain\(\s*[\"']set_config\('life_os\.notification_erasure_workspace'[\"']\s*,\s*\);",
              re.MULTILINE,
          )
          replacement = (
              "expect(sql).toMatch(\n"
              "      /set_config\\(\\s*'life_os\\.notification_erasure_workspace'/u,\n"
              "    );"
          )
          tests, replacements = pattern.subn(replacement, tests, count=1)
          if replacements != 1:
              raise SystemExit('unexpected transaction-local marker assertion')
          path.write_text(tests, encoding='utf-8')
          PY
          pnpm exec prettier --single-quote --write \
            apps/notification-service/src/notification-data-rights-migration.test.ts
          """

          verify_red = run_step(
              'Verify the regressions fail before implementation'
          )
          obsolete_grep = (
              "grep -F 'exports code-unit canonical evidence independent "
              "of key insertion order' \\\n"
              '  "$RUNNER_TEMP/notification-red.log"\n'
          )
          if verify_red.count(obsolete_grep) != 1:
              raise SystemExit('unexpected obsolete deterministic-test grep')
          verify_red = verify_red.replace(obsolete_grep, '', 1)

          implement = run_step(
              'Implement deterministic, least-privilege, nonblocking erasure'
          )
          sort_start = implement.index("old_sort = (\n")
          sort_end = implement.index(
              '\n\nold_helper = r"""',
              sort_start,
          )
          implement = implement[:sort_start] + implement[sort_end + 2:]

          phases = {
              '01-add-tests.sh': add_tests,
              '02-harden-test-contract.sh': harden_test_contract,
              '03-verify-red.sh': verify_red,
              '04-implement.sh': implement,
              '05-verify-focused.sh': run_step(
                  'Verify focused and package evidence'
              ),
              '06-verify-repository.sh': run_step(
                  'Verify current-main whole-repository gates'
              ),
          }
          output = Path('/tmp/notification-repair-phases')
          output.mkdir(mode=0o700)
          for name, content in phases.items():
              phase = output / name
              phase.write_text(content, encoding='utf-8')
              phase.chmod(0o700)
          PY

      - name: Execute test-first repair and verification
        run: |
          set -Eeuo pipefail
          for phase in /tmp/notification-repair-phases/*.sh; do
            printf 'repair_phase=%s\n' "$(basename "$phase")"
            bash "$phase"
          done

      - name: Commit production repair without workflow mutation
        run: |
          set -Eeuo pipefail
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'apps/notification-service/migrations/0002_data_rights_erasure.sql' \
            'apps/notification-service/src/notification-data-rights-migration.test.ts' \
            'apps/notification-service/src/notification-data-rights.integration.test.ts' \
            'apps/notification-service/src/notification-data-rights.ts' \
            'docs/operations/notification-persistence.md' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git add \
            apps/notification-service/migrations/0002_data_rights_erasure.sql \
            apps/notification-service/src/notification-data-rights-migration.test.ts \
            apps/notification-service/src/notification-data-rights.integration.test.ts \
            apps/notification-service/src/notification-data-rights.ts \
            docs/operations/notification-persistence.md
          git commit -m 'fix(notification): harden data-rights erasure authority'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/notification-data-rights-contributor-v2:refs/remotes/origin/feat/notification-data-rights-contributor-v2'
          test "$(git rev-parse origin/feat/notification-data-rights-contributor-v2)" = "${{ github.sha }}"
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/feat/notification-data-rights-contributor-v2
