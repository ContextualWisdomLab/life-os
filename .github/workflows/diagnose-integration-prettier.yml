name: Diagnose Integration Prettier

on:
  push:
    branches: [test/integration-service-quality-gates-v1]

permissions:
  contents: read

concurrency:
  group: diagnose-integration-prettier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install frozen dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Render canonical Prettier delta
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .verification
          pnpm exec prettier --single-quote --write \
            apps/integration-service/src/plugin-vault-secret-store-coverage.test.ts
          git diff -- \
            apps/integration-service/src/plugin-vault-secret-store-coverage.test.ts \
            | tee .verification/prettier.patch
          test -s .verification/prettier.patch

      - name: Upload canonical Prettier delta
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-prettier-${{ github.run_id }}
          path: .verification/prettier.patch
          if-no-files-found: error
          retention-days: 1
