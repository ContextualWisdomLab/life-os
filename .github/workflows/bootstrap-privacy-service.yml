name: Bootstrap Privacy Service Verification

on:
  push:
    branches:
      - feat/purpose-bound-pii-access
    paths:
      - '.github/workflows/bootstrap-privacy-service.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/purpose-bound-pii-access
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install and update the workspace lockfile
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Format the initial privacy slice
        run: |
          pnpm exec prettier --single-quote --write \
            apps/privacy-service/package.json \
            apps/privacy-service/tsconfig.json \
            apps/privacy-service/nest-cli.json \
            apps/privacy-service/vitest.config.ts \
            'apps/privacy-service/src/**/*.ts' \
            apps/privacy-service/migrations/0001_purpose_bound_privacy_access.sql \
            docs/research/2026-08-07-purpose-bound-pii-access-standards.md \
            docs/superpowers/specs/2026-08-07-purpose-bound-pii-access-design.md \
            docs/superpowers/plans/2026-08-07-purpose-bound-pii-access.md

      - name: Verify initial domain, token, and application contracts
        run: |
          pnpm --filter @life-os/privacy-service lint
          pnpm --filter @life-os/privacy-service test

      - name: Commit verified bootstrap and remove temporary workflow
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/bootstrap-privacy-service.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(privacy): verify initial service contracts'
          git push origin HEAD:feat/purpose-bound-pii-access
