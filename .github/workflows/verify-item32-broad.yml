name: Verify item 32 broad commercial readiness

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Run commercial-readiness contracts
        run: node --test packages/commercial-readiness/src/*.test.mjs
      - name: Verify changed-source syntax and whitespace
        run: |
          set -euo pipefail
          node --check packages/commercial-readiness/src/workflow-source-yaml-tag-contract.test.mjs
          git fetch --no-tags --depth=1 origin 7973277a4c97db6eaa071ff2726187f6b33009f5
          test "$(git rev-parse FETCH_HEAD)" = "7973277a4c97db6eaa071ff2726187f6b33009f5"
          git diff --check 7973277a4c97db6eaa071ff2726187f6b33009f5 HEAD
