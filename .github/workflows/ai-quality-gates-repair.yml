name: AI quality gates repair

on:
  push:
    branches: [chore/ai-service-quality-gates]

permissions:
  contents: write

concurrency:
  group: ai-quality-gates-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AI_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      AI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/ai-service-quality-gates
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed quality-gate implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/complete_ai_quality_gates.py
          python3 .github/scripts/complete_ai_coverage.py
          python3 .github/scripts/patch_ai_coverage_tests.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format reviewed sources
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            apps/ai-service/package.json \
            apps/ai-service/vitest.config.ts \
            "apps/ai-service/src/**/*.ts" \
            package.json \
            product/capabilities.json \
            CHANGELOG.md \
            docs/operations/ai-proposal-audit-assurance.md \
            docs/superpowers/specs/2026-08-04-ai-service-quality-gates-design.md \
            docs/superpowers/plans/2026-08-04-ai-service-quality-gates.md

      - name: Typecheck AI service
        run: pnpm --filter @life-os/ai-service typecheck

      - name: Run AI service quality gates
        run: pnpm --filter @life-os/ai-service test

      - name: Upload detailed AI coverage evidence
        if: always() && hashFiles('apps/ai-service/coverage/coverage-final.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-coverage-evidence
          path: |
            apps/ai-service/coverage/
            apps/ai-service/src/
            apps/ai-service/vitest.config.ts
          if-no-files-found: error
          retention-days: 3
          overwrite: true
