name: Repair Architecture Plugin Attempt Currentness

on:
  push:
    branches: [docs/canonical-product-architecture-mainline]

permissions:
  contents: write

concurrency:
  group: repair-architecture-plugin-attempt-currentness
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact architecture head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace only stale delivery-attempt evidence sentence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          old = ('Draft PR #252 proceeds in parallel from #245 and establishes Integration-owned durable delivery-attempt admission without depending on mutable #250/#251 transport. It introduces opaque `life-os.plugin-delivery-attempt.v1` work identity plus service-owned PostgreSQL migration/store, exact idempotency scope, bounded retry budget metadata, and a durable INSERT-time fence requiring both the exact active origin grant and active installation under matching workspace/user authority. The table intentionally stores no origin copy, credential, request payload, response body, or network authorization. Real PostgreSQL acceptance is committed but the current hosted RED/GREEN verifier is still pending.')
          new = ('Draft PR #252 proceeds in parallel from #245 and establishes Integration-owned durable delivery-attempt admission without depending on mutable #250/#251 transport. It introduces opaque `life-os.plugin-delivery-attempt.v1` work identity plus service-owned PostgreSQL migration/store, exact idempotency scope, bounded retry budget metadata, and a durable INSERT-time fence requiring both the exact active origin grant and active installation under matching workspace/user authority. The table intentionally stores no origin copy, credential, request payload, response body, or network authorization. Exact review-repair proof head `9e6e88e49e14d0b2d247e747df968e2494697666` completed hosted run `34209314512`, job `102006262067`, GREEN on Ubuntu 24.04/PostgreSQL 16 after replaying the timestamp, PostgreSQL/TLS target, IPv6 loopback and table-contract RED ancestors for their intended reasons, passing focused delivery-attempt acceptance, Integration typecheck and the complete Integration suite. Current #252 head `cbb3caaddf3ad8d84ef27a6c7ba9aa624bed972a` removes only that purpose-complete verifier; this remains active-PR evidence, not protected shipped truth.')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale #252 architecture paragraph, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/repair-architecture-plugin-attempt-currentness.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/repair-architecture-plugin-attempt-currentness.yml' 'ARCHITECTURE.md' | sort)"
          test "${changed}" = "${expected}"

      - name: Publish preservation-safe architecture repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md .github/workflows/repair-architecture-plugin-attempt-currentness.yml
          git commit -m 'docs: refresh plugin attempt architecture evidence'
          git push origin HEAD:docs/canonical-product-architecture-mainline
