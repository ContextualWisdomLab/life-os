name: Repair notification data-rights contributor

on:
  push:
    branches:
      - feat/notification-data-rights-contributor-v2
    paths:
      - .github/workflows/repair-notification-data-rights.yml

permissions: {}

concurrency:
  group: repair-notification-data-rights-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.before == 'a558ab896894906a081c7e34efe842676da5ffd6'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/notification-data-rights-contributor-v2
          fetch-depth: 0

      - name: Reconcile current protected main
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = 'a558ab896894906a081c7e34efe842676da5ffd6'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/notification-data-rights-contributor-v2:refs/remotes/origin/feat/notification-data-rights-contributor-v2'
          test "$(git rev-parse origin/main)" = '7c3fd32efbf9ebdcb4bac99980a3c8b6c893a89f'
          test "$(git rev-parse origin/feat/notification-data-rights-contributor-v2)" = "$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit --no-ff origin/main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack and install locked dependencies
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Add failing regression evidence
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          behavior_path = Path(
              'apps/notification-service/src/notification-data-rights.behavior.test.ts'
          )
          behavior = behavior_path.read_text(encoding='utf-8')
          start = behavior.index(
              "  it('exports bounded deterministic tenant evidence without secret hash columns'"
          )
          end = behavior.index(
              "  it('dispatches every contributor lifecycle operation with tenant-scoped parameters'"
          )
          replacement = r"""  it('exports code-unit canonical evidence independent of key insertion order', async () => {
            const nullPrototype = Object.assign(Object.create(null), { zeta: 'z' });
            const originalEvidence = {
              zeta: 'last',
              alpha: null,
              enabled: true,
              disabled: false,
              count: 1,
              nested: ['value'],
              nullPrototype,
              codeUnitOrder: { a: 1, Z: 2 },
            };
            const permutedEvidence = {
              codeUnitOrder: { Z: 2, a: 1 },
              nullPrototype,
              nested: ['value'],
              count: 1,
              disabled: false,
              enabled: true,
              alpha: null,
              zeta: 'last',
            };
            const client = new ScriptedClient([
              exportResult([originalEvidence], [], []),
              exportResult([permutedEvidence], [], []),
            ]);
            const contributor = new NotificationDataRightsContributor(client);

            const response = await contributor.handle(request('export'));
            const permutedResponse = await contributor.handle(request('export'));

            expect(response).toMatchObject({
              contractVersion: 'life-os.data-rights-contributor.v1',
              contributor: 'notification.service',
              operation: 'export',
              requestId: REQUEST_ID,
              schemaVersion: 'notification.data-rights.v1',
              recordCount: 1,
            });
            if (response.operation !== 'export') {
              throw new Error('Expected export response');
            }
            if (permutedResponse.operation !== 'export') {
              throw new Error('Expected permuted export response');
            }
            expect(response.sha256).toBe(
              '470db31688a72033957ff76442bc306f6e7202917b9342f6a958e765c1a4b0eb',
            );
            expect(permutedResponse.sha256).toBe(response.sha256);
            expect(client.calls).toHaveLength(2);
            for (const call of client.calls) {
              expect(call.values).toEqual([WORKSPACE_ID, 1_001]);
              expect(call.text).toContain(
                'ORDER BY created_at ASC, reminder_id ASC',
              );
              expect(call.text).toContain(
                'ORDER BY occurred_at ASC, outcome_id ASC',
              );
              expect(call.text).toContain(
                'ORDER BY delivered_at ASC, message_id ASC',
              );
              expect(call.text).not.toContain('claim_key_hash');
              expect(call.text).not.toContain('idempotency_key_hash');
            }
          });

          """
          behavior_path.write_text(
              behavior[:start] + replacement + behavior[end:],
              encoding='utf-8',
          )

          migration_contract = r"""import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { describe, expect, it } from 'vitest';

          const migrationPath = resolve(
            __dirname,
            '../migrations/0002_data_rights_erasure.sql',
          );

          async function migrationSql(): Promise<string> {
            return await readFile(migrationPath, 'utf8');
          }

          describe('Notification data-rights erasure database contract', () => {
            it('persists bounded UUIDv4 replay receipts with SHA-256 evidence', async () => {
              const sql = await migrationSql();

              expect(sql).toContain(
                'CREATE TABLE notification_service.data_rights_erasure_receipts',
              );
              for (const identifier of [
                'workspace_id',
                'idempotency_key',
                'request_id',
                'requested_by_user_id',
              ]) {
                expect(sql).toContain(`uuid_send(${identifier})`);
              }
              expect(sql).toContain('erased_records >= 0');
              expect(sql).toContain("receipt_sha256 ~ '^[0-9a-f]{64}$'");
              expect(sql).toContain('PRIMARY KEY (workspace_id, idempotency_key)');
            });

            it('serializes all erasures for one workspace and preserves replay authority', async () => {
              const sql = await migrationSql();

              expect(sql).toContain(
                'CREATE FUNCTION notification_service.erase_workspace_data(',
              );
              expect(sql).toContain('SECURITY DEFINER');
              expect(sql).toContain(
                'SET search_path = pg_catalog, notification_service',
              );
              expect(sql).toContain(
                "'notification.service:erase:' || target_workspace_id::text",
              );
              expect(sql).not.toMatch(
                /notification\.service:[\s\S]{0,120}target_idempotency_key::text/u,
              );
              expect(sql).toContain('IF FOUND THEN');
              expect(sql).toContain(
                'Notification erasure replay authority conflicts',
              );
              expect(sql).toContain('sha256(');
              expect(sql).toContain("'notification.service'");
            });

            it('uses an owner-bound transaction-local deletion marker without table-wide trigger locks', async () => {
              const sql = await migrationSql();

              expect(sql).toContain(
                "set_config('life_os.notification_erasure_workspace'",
              );
              expect(sql).toContain(
                "current_setting('life_os.notification_erasure_workspace', true)",
              );
              expect(sql).toContain(
                "'notification_service.erase_workspace_data(uuid,uuid,uuid,uuid)'::regprocedure",
              );
              expect(sql).toContain('current_user = erasure_function_owner');
              expect(sql).not.toContain('DISABLE TRIGGER');
              expect(sql).not.toContain('ENABLE TRIGGER');
              const inboxDelete = sql.indexOf(
                'DELETE FROM notification_service.inbox_messages',
              );
              const outcomeDelete = sql.indexOf(
                'DELETE FROM notification_service.reminder_outcomes',
              );
              const occurrenceDelete = sql.indexOf(
                'DELETE FROM notification_service.reminder_occurrences',
              );
              expect(inboxDelete).toBeGreaterThan(-1);
              expect(outcomeDelete).toBeGreaterThan(inboxDelete);
              expect(occurrenceDelete).toBeGreaterThan(outcomeDelete);
            });

            it('grants only the configured runtime role the bounded erasure surface', async () => {
              const sql = await migrationSql();

              expect(sql).toContain(
                "current_setting('life_os.notification_runtime_role', true)",
              );
              expect(sql).toContain(
                'REVOKE ALL ON FUNCTION notification_service.erase_workspace_data',
              );
              expect(sql).toMatch(
                /GRANT USAGE ON SCHEMA notification_service TO %I/u,
              );
              expect(sql).toMatch(
                /GRANT SELECT, INSERT ON TABLE notification_service\.data_rights_erasure_receipts TO %I/u,
              );
              expect(sql).toMatch(
                /GRANT EXECUTE ON FUNCTION notification_service\.erase_workspace_data\(uuid, uuid, uuid, uuid\) TO %I/u,
              );
              expect(sql).not.toMatch(/GRANT[\s\S]+TO PUBLIC/u);
            });
          });
          """
          Path(
              'apps/notification-service/src/notification-data-rights-migration.test.ts'
          ).write_text(migration_contract, encoding='utf-8')

          integration = r"""import { randomUUID } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          import { resolve } from 'node:path';
          import { Pool, type QueryResult } from 'pg';
          import {
            afterAll,
            afterEach,
            beforeAll,
            beforeEach,
            describe,
            expect,
            it,
          } from 'vitest';

          const DATABASE_URL = process.env.NOTIFICATION_DATABASE_URL;
          const describeWithPostgres = DATABASE_URL ? describe : describe.skip;
          let administrativePool: Pool;
          let runtimeRole = '';
          let unauthorizedRole = '';

          function requireDatabaseUrl(): string {
            if (!DATABASE_URL) {
              throw new Error(
                'NOTIFICATION_DATABASE_URL is required for integration tests',
              );
            }
            return DATABASE_URL;
          }

          function roleIdentifier(value: string): string {
            if (!/^[a-z_][a-z0-9_]{0,62}$/u.test(value)) {
              throw new Error('Generated PostgreSQL role identifier is invalid');
            }
            return `"${value}"`;
          }

          async function migration(name: string): Promise<string> {
            return await readFile(
              resolve(__dirname, '../migrations', name),
              'utf8',
            );
          }

          async function queryAsRole(
            role: string,
            text: string,
            values: readonly unknown[] = [],
            statementTimeoutMs = 5_000,
          ): Promise<QueryResult> {
            const client = await administrativePool.connect();
            try {
              await client.query('BEGIN');
              await client.query(`SET LOCAL ROLE ${roleIdentifier(role)}`);
              await client.query(
                `SET LOCAL statement_timeout = '${statementTimeoutMs}ms'`,
              );
              const result = await client.query(text, [...values]);
              await client.query('COMMIT');
              return result;
            } catch (error) {
              await client.query('ROLLBACK');
              throw error;
            } finally {
              client.release();
            }
          }

          async function applyMigrations(): Promise<void> {
            const client = await administrativePool.connect();
            try {
              await client.query(
                "SELECT set_config('life_os.notification_runtime_role', $1, false)",
                [runtimeRole],
              );
              await client.query(
                await migration('0001_durable_reminder_inbox.sql'),
              );
              await client.query(
                await migration('0002_data_rights_erasure.sql'),
              );
            } finally {
              client.release();
            }
          }

          async function seedWorkspace(
            workspaceId: string,
          ): Promise<Readonly<{
            reminderId: string;
            outcomeId: string;
            messageId: string;
          }>> {
            const reminderId = randomUUID();
            const outcomeId = randomUUID();
            const messageId = randomUUID();
            await administrativePool.query(
              `INSERT INTO notification_service.reminder_occurrences (
                 reminder_id, workspace_id, reminder_title, due_instant,
                 time_zone, daily_delivery_limit
               ) VALUES ($1, $2, 'Portable reminder', TIMESTAMPTZ '2026-08-12 00:00:00+00',
                         'Asia/Seoul', 4)`,
              [reminderId, workspaceId],
            );
            await administrativePool.query(
              `INSERT INTO notification_service.reminder_outcomes (
                 outcome_id, workspace_id, reminder_id, outcome_kind,
                 occurred_at, idempotency_key_hash, delivery_local_date
               ) VALUES ($1, $2, $3, 'delivered',
                         TIMESTAMPTZ '2026-08-12 00:01:00+00',
                         decode(repeat('ab', 32), 'hex'), DATE '2026-08-12')`,
              [outcomeId, workspaceId, reminderId],
            );
            await administrativePool.query(
              `INSERT INTO notification_service.inbox_messages (
                 message_id, workspace_id, reminder_id, message_title,
                 due_instant, time_zone, idempotency_key_hash, delivered_at
               ) VALUES ($1, $2, $3, 'Portable reminder',
                         TIMESTAMPTZ '2026-08-12 00:00:00+00', 'Asia/Seoul',
                         decode(repeat('cd', 32), 'hex'),
                         TIMESTAMPTZ '2026-08-12 00:01:00+00')`,
              [messageId, workspaceId, reminderId],
            );
            return { reminderId, outcomeId, messageId };
          }

          describeWithPostgres(
            'Notification data-rights PostgreSQL integration',
            () => {
              beforeAll(async () => {
                administrativePool = new Pool({
                  connectionString: requireDatabaseUrl(),
                  application_name:
                    'life-os-notification-data-rights-integration-admin',
                  max: 8,
                });
              });

              beforeEach(async () => {
                const suffix = randomUUID().replaceAll('-', '').slice(0, 12);
                runtimeRole = `life_notification_runtime_${suffix}`;
                unauthorizedRole = `life_notification_unauthorized_${suffix}`;
                await administrativePool.query(
                  'DROP SCHEMA IF EXISTS notification_service CASCADE',
                );
                await administrativePool.query(
                  `CREATE ROLE ${roleIdentifier(runtimeRole)} NOLOGIN`,
                );
                await administrativePool.query(
                  `CREATE ROLE ${roleIdentifier(unauthorizedRole)} NOLOGIN`,
                );
                await applyMigrations();
              });

              afterEach(async () => {
                await administrativePool.query(
                  'DROP SCHEMA IF EXISTS notification_service CASCADE',
                );
                await administrativePool.query(
                  `DROP ROLE IF EXISTS ${roleIdentifier(runtimeRole)}`,
                );
                await administrativePool.query(
                  `DROP ROLE IF EXISTS ${roleIdentifier(unauthorizedRole)}`,
                );
              });

              afterAll(async () => {
                await administrativePool.end();
              });

              it('grants the configured role and proves erase, replay, conflict, UUID, trigger, and FK behavior', async () => {
                const workspaceId = randomUUID();
                const preservedWorkspaceId = randomUUID();
                const requestedByUserId = randomUUID();
                const requestId = randomUUID();
                const idempotencyKey = randomUUID();
                const preserved = await seedWorkspace(preservedWorkspaceId);
                await seedWorkspace(workspaceId);

                const privileges = await administrativePool.query(
                  `SELECT
                     has_schema_privilege($1, 'notification_service', 'USAGE') AS schema_ready,
                     has_table_privilege(
                       $1,
                       'notification_service.data_rights_erasure_receipts',
                       'SELECT,INSERT'
                     ) AS receipt_ready,
                     has_function_privilege(
                       $1,
                       'notification_service.erase_workspace_data(uuid,uuid,uuid,uuid)',
                       'EXECUTE'
                     ) AS function_ready,
                     has_function_privilege(
                       $2,
                       'notification_service.erase_workspace_data(uuid,uuid,uuid,uuid)',
                       'EXECUTE'
                     ) AS unauthorized_function`,
                  [runtimeRole, unauthorizedRole],
                );
                expect(privileges.rows).toEqual([
                  {
                    schema_ready: true,
                    receipt_ready: true,
                    function_ready: true,
                    unauthorized_function: false,
                  },
                ]);

                const first = await queryAsRole(
                  runtimeRole,
                  `SELECT result_erased_records, result_receipt_sha256
                   FROM notification_service.erase_workspace_data($1, $2, $3, $4)`,
                  [workspaceId, requestedByUserId, requestId, idempotencyKey],
                );
                expect(first.rows).toEqual([
                  {
                    result_erased_records: 3,
                    result_receipt_sha256: expect.stringMatching(
                      /^[0-9a-f]{64}$/u,
                    ),
                  },
                ]);

                const replay = await queryAsRole(
                  runtimeRole,
                  `SELECT result_erased_records, result_receipt_sha256
                   FROM notification_service.erase_workspace_data($1, $2, $3, $4)`,
                  [workspaceId, requestedByUserId, requestId, idempotencyKey],
                );
                expect(replay.rows).toEqual(first.rows);

                await expect(
                  queryAsRole(
                    runtimeRole,
                    `SELECT *
                     FROM notification_service.erase_workspace_data($1, $2, $3, $4)`,
                    [
                      workspaceId,
                      requestedByUserId,
                      randomUUID(),
                      idempotencyKey,
                    ],
                  ),
                ).rejects.toMatchObject({ code: '23505' });

                await expect(
                  queryAsRole(
                    runtimeRole,
                    `SELECT *
                     FROM notification_service.erase_workspace_data($1, $2, $3, $4)`,
                    [
                      '00000000-0000-1000-8000-000000000001',
                      requestedByUserId,
                      randomUUID(),
                      randomUUID(),
                    ],
                  ),
                ).rejects.toMatchObject({ code: '22023' });

                await expect(
                  queryAsRole(
                    unauthorizedRole,
                    `SELECT *
                     FROM notification_service.erase_workspace_data($1, $2, $3, $4)`,
                    [
                      preservedWorkspaceId,
                      requestedByUserId,
                      randomUUID(),
                      randomUUID(),
                    ],
                  ),
                ).rejects.toMatchObject({ code: '42501' });

                const remaining = await administrativePool.query(
                  `SELECT
                     (SELECT count(*)::integer
                        FROM notification_service.reminder_occurrences
                       WHERE workspace_id = $1) AS target_occurrences,
                     (SELECT count(*)::integer
                        FROM notification_service.reminder_outcomes
                       WHERE workspace_id = $1) AS target_outcomes,
                     (SELECT count(*)::integer
                        FROM notification_service.inbox_messages
                       WHERE workspace_id = $1) AS target_messages,
                     (SELECT count(*)::integer
                        FROM notification_service.reminder_occurrences
                       WHERE workspace_id = $2) AS preserved_occurrences`,
                  [workspaceId, preservedWorkspaceId],
                );
                expect(remaining.rows).toEqual([
                  {
                    target_occurrences: 0,
                    target_outcomes: 0,
                    target_messages: 0,
                    preserved_occurrences: 1,
                  },
                ]);

                await expect(
                  administrativePool.query(
                    `DELETE FROM notification_service.reminder_outcomes
                     WHERE outcome_id = $1`,
                    [preserved.outcomeId],
                  ),
                ).rejects.toMatchObject({ code: '55000' });
              });

              it('does not acquire an ACCESS EXCLUSIVE table lock during owner-authorized erasure', async () => {
                const workspaceId = randomUUID();
                await seedWorkspace(workspaceId);
                const reader = await administrativePool.connect();
                try {
                  await reader.query('BEGIN');
                  await reader.query(
                    `SELECT outcome_id
                     FROM notification_service.reminder_outcomes
                     WHERE workspace_id = $1`,
                    [workspaceId],
                  );

                  await expect(
                    queryAsRole(
                      runtimeRole,
                      `SELECT *
                       FROM notification_service.erase_workspace_data($1, $2, $3, $4)`,
                      [
                        workspaceId,
                        randomUUID(),
                        randomUUID(),
                        randomUUID(),
                      ],
                      1_500,
                    ),
                  ).resolves.toMatchObject({
                    rows: [
                      {
                        result_erased_records: 3,
                        result_receipt_sha256: expect.stringMatching(
                          /^[0-9a-f]{64}$/u,
                        ),
                      },
                    ],
                  });
                } finally {
                  await reader.query('ROLLBACK');
                  reader.release();
                }
              });
            },
          );
          """
          Path(
              'apps/notification-service/src/notification-data-rights.integration.test.ts'
          ).write_text(integration, encoding='utf-8')
          PY

      - name: Verify the regressions fail before implementation
        run: |
          set -Eeuo pipefail
          set +e
          pnpm --filter @life-os/notification-service exec vitest run \
            src/notification-data-rights.behavior.test.ts \
            src/notification-data-rights-migration.test.ts \
            src/notification-data-rights.integration.test.ts \
            --no-file-parallelism >"$RUNNER_TEMP/notification-red.log" 2>&1
          status="$?"
          set -e
          cat "$RUNNER_TEMP/notification-red.log"
          test "$status" -ne 0
          grep -F 'exports code-unit canonical evidence independent of key insertion order' \
            "$RUNNER_TEMP/notification-red.log"
          grep -F 'grants only the configured runtime role the bounded erasure surface' \
            "$RUNNER_TEMP/notification-red.log"

      - name: Implement deterministic, least-privilege, nonblocking erasure
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source_path = Path(
              'apps/notification-service/src/notification-data-rights.ts'
          )
          source = source_path.read_text(encoding='utf-8')
          old_sort = (
              "    entries.sort(([left], [right]) => left.localeCompare(right));"
          )
          new_sort = """    entries.sort(([left], [right]) =>
              left < right ? -1 : 1,
            );"""
          if source.count(old_sort) != 1:
              raise SystemExit('unexpected canonical key-sort shape')
          source = source.replace(old_sort, new_sort, 1)

          old_helper = r"""/** Validates one JSON-safe value and returns the same value with a narrowed type. */
          function requireJsonValue(value: unknown): NotificationDataRightsJsonValue {
            canonicalJson(value);
            return value as NotificationDataRightsJsonValue;
          }

          """
          if source.count(old_helper) != 1:
              raise SystemExit('unexpected JSON-value helper shape')
          source = source.replace(old_helper, '', 1)

          data_pattern = re.compile(
              r"""    const data = Object\.freeze\(\{\n"""
              r"""\s+reminderOccurrences: requireJsonValue\(row\.reminder_occurrences\),\n"""
              r"""\s+reminderOutcomes: requireJsonValue\(row\.reminder_outcomes\),\n"""
              r"""\s+inboxMessages: requireJsonValue\(row\.inbox_messages\),\n"""
              r"""\s+\}\);\n"""
          )
          new_data = (
              "    const data = Object.freeze({\n"
              "      reminderOccurrences:\n"
              "        row.reminder_occurrences as readonly NotificationDataRightsJsonValue[],\n"
              "      reminderOutcomes:\n"
              "        row.reminder_outcomes as readonly NotificationDataRightsJsonValue[],\n"
              "      inboxMessages:\n"
              "        row.inbox_messages as readonly NotificationDataRightsJsonValue[],\n"
              "    });\n"
          )
          source, data_replacements = data_pattern.subn(new_data, source, count=1)
          if data_replacements != 1:
              raise SystemExit('unexpected export data shape')
          source_path.write_text(source, encoding='utf-8')

          migration_path = Path(
              'apps/notification-service/migrations/0002_data_rights_erasure.sql'
          )
          migration = migration_path.read_text(encoding='utf-8')

          lock_start = migration.index("  PERFORM pg_advisory_xact_lock(\n")
          lock_end = migration.index("\n\n  SELECT\n", lock_start)
          current_lock = migration[lock_start:lock_end]
          if "target_idempotency_key::text" not in current_lock:
              raise SystemExit('unexpected notification advisory-lock shape')
          new_lock = textwrap.dedent(
              """\
              PERFORM pg_advisory_xact_lock(
                hashtextextended(
                  'notification.service:erase:' || target_workspace_id::text,
                  0
                )
              );"""
          )
          migration = migration[:lock_start] + "  " + new_lock + migration[lock_end:]

          delete_start = migration.index(
              "  DELETE FROM notification_service.inbox_messages\n"
          )
          occurrence_start = migration.index(
              "  DELETE FROM notification_service.reminder_occurrences\n",
              delete_start,
          )
          current_delete = migration[delete_start:occurrence_start]
          if "DISABLE TRIGGER reminder_outcomes_row_mutation_guard" not in current_delete:
              raise SystemExit('unexpected notification trigger-bypass shape')
          new_delete = textwrap.dedent(
              """\
              DELETE FROM notification_service.inbox_messages
              WHERE workspace_id = target_workspace_id;
              GET DIAGNOSTICS deleted_inbox_messages = ROW_COUNT;

              -- The append-only trigger accepts this workspace only while the owner-executed
              -- SECURITY DEFINER function is active. The marker is transaction-local and an
              -- ordinary runtime role cannot satisfy the independent current_user owner check.
              PERFORM set_config(
                'life_os.notification_erasure_workspace',
                target_workspace_id::text,
                true
              );

              DELETE FROM notification_service.reminder_outcomes
              WHERE workspace_id = target_workspace_id;
              GET DIAGNOSTICS deleted_reminder_outcomes = ROW_COUNT;

              PERFORM set_config(
                'life_os.notification_erasure_workspace',
                '',
                true
              );

              """
          )
          indented_delete = "\n".join(
              f"  {line}" if line else ""
              for line in new_delete.splitlines()
          )
          migration = (
              migration[:delete_start]
              + indented_delete
              + "\n"
              + migration[occurrence_start:]
          )

          revoke_start = migration.index(
              "REVOKE ALL ON FUNCTION notification_service.erase_workspace_data("
          )
          comment_start = migration.index(
              "COMMENT ON FUNCTION notification_service.erase_workspace_data(",
              revoke_start,
          )
          hardening = textwrap.dedent(
              """\
              CREATE OR REPLACE FUNCTION notification_service.reject_reminder_outcome_mutation()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $$
              DECLARE
                authorized_workspace text;
                erasure_function_owner name;
              BEGIN
                IF TG_OP = 'DELETE' THEN
                  authorized_workspace := current_setting(
                    'life_os.notification_erasure_workspace',
                    true
                  );
                  SELECT pg_get_userbyid(proowner)
                  INTO erasure_function_owner
                  FROM pg_proc
                  WHERE oid =
                    'notification_service.erase_workspace_data(uuid,uuid,uuid,uuid)'::regprocedure;

                  IF current_user = erasure_function_owner
                    AND authorized_workspace = OLD.workspace_id::text
                  THEN
                    RETURN OLD;
                  END IF;
                END IF;

                RAISE EXCEPTION 'reminder outcomes are immutable'
                  USING ERRCODE = '55000';
              END;
              $$;

              REVOKE ALL ON FUNCTION notification_service.erase_workspace_data(
                uuid,
                uuid,
                uuid,
                uuid
              ) FROM PUBLIC;

              DO $grant_notification_runtime$
              DECLARE
                runtime_role_name text := NULLIF(
                  current_setting('life_os.notification_runtime_role', true),
                  ''
                );
              BEGIN
                IF runtime_role_name IS NULL
                  OR runtime_role_name !~ '^[a-z_][a-z0-9_]{0,62}$'
                THEN
                  RAISE EXCEPTION USING
                    ERRCODE = '22023',
                    MESSAGE = 'Notification runtime role configuration is invalid';
                END IF;

                IF NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = runtime_role_name
                ) THEN
                  RAISE EXCEPTION USING
                    ERRCODE = '42704',
                    MESSAGE = 'Notification runtime role does not exist';
                END IF;

                EXECUTE format(
                  'GRANT USAGE ON SCHEMA notification_service TO %I',
                  runtime_role_name
                );
                EXECUTE format(
                  'GRANT SELECT, INSERT ON TABLE notification_service.data_rights_erasure_receipts TO %I',
                  runtime_role_name
                );
                EXECUTE format(
                  'GRANT EXECUTE ON FUNCTION notification_service.erase_workspace_data(uuid, uuid, uuid, uuid) TO %I',
                  runtime_role_name
                );
              END;
              $grant_notification_runtime$;

              """
          )
          migration = (
              migration[:revoke_start]
              + hardening
              + migration[comment_start:]
          )
          migration_path.write_text(migration, encoding='utf-8')

          docs_path = Path('docs/operations/notification-persistence.md')
          docs = docs_path.read_text(encoding='utf-8')
          migration_sentence = (
              "Apply `apps/notification-service/migrations/"
              "0001_durable_reminder_inbox.sql` before starting a runtime that "
              "uses `PostgresReminderRepository`."
          )
          replacement_sentence = (
              "Apply `apps/notification-service/migrations/"
              "0001_durable_reminder_inbox.sql` and then "
              "`0002_data_rights_erasure.sql` before starting a runtime that "
              "exposes the Notification data-rights contributor."
          )
          if docs.count(migration_sentence) != 1:
              raise SystemExit('unexpected notification migration documentation')
          docs = docs.replace(migration_sentence, replacement_sentence, 1)
          operations_anchor = (
              "Run the migration through the normal release migration job using a "
              "role with schema DDL rights. The application role should receive only "
              "the table and sequence privileges required by the repository. Do not "
              "grant the application role ownership of the schema or the "
              "mutation-guard function.\n"
          )
          operations_replacement = operations_anchor + r"""
          Before applying `0002_data_rights_erasure.sql`, the same migration session
          must set the reviewed runtime role name in the transaction-independent
          PostgreSQL setting `life_os.notification_runtime_role`. The migration
          fails closed when the setting is missing, malformed, or names a role that
          does not exist. It revokes public function access and grants that exact
          role only schema `USAGE`, receipt `SELECT`/`INSERT`, and `EXECUTE` on the
          owner-controlled erasure function. Never set the value from request data.

          The erasure function serializes requests by workspace, not by idempotency
          key. It authorizes immutable outcome deletion with a transaction-local
          workspace marker plus an independent function-owner check; it never
          disables a trigger or takes an `ACCESS EXCLUSIVE` lock merely to erase one
          tenant. Direct deletion remains rejected even if an ordinary runtime
          session writes the custom setting.
          """
          if docs.count(operations_anchor) != 1:
              raise SystemExit('unexpected notification operations anchor')
          docs = docs.replace(operations_anchor, operations_replacement, 1)
          docs_path.write_text(docs, encoding='utf-8')
          PY

          pnpm exec prettier --single-quote --write \
            apps/notification-service/src/notification-data-rights.ts \
            apps/notification-service/src/notification-data-rights.behavior.test.ts \
            apps/notification-service/src/notification-data-rights-migration.test.ts \
            apps/notification-service/src/notification-data-rights.integration.test.ts \
            docs/operations/notification-persistence.md

      - name: Verify focused and package evidence
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/notification-service exec vitest run \
            src/notification-data-rights.behavior.test.ts \
            src/notification-data-rights-migration.test.ts \
            src/notification-data-rights.integration.test.ts \
            --no-file-parallelism
          pnpm --filter @life-os/notification-service run lint
          pnpm --filter @life-os/notification-service run typecheck
          pnpm --filter @life-os/notification-service run test
          pnpm --filter @life-os/notification-service run build

      - name: Verify current-main whole-repository gates
        run: |
          set -Eeuo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config --quiet
          git diff --check

      - name: Commit verified repair and remove temporary workflow
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/repair-notification-data-rights.yml
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-notification-data-rights.yml' \
            'apps/notification-service/migrations/0002_data_rights_erasure.sql' \
            'apps/notification-service/src/notification-data-rights-migration.test.ts' \
            'apps/notification-service/src/notification-data-rights.behavior.test.ts' \
            'apps/notification-service/src/notification-data-rights.integration.test.ts' \
            'apps/notification-service/src/notification-data-rights.ts' \
            'docs/operations/notification-persistence.md' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git add \
            apps/notification-service/migrations/0002_data_rights_erasure.sql \
            apps/notification-service/src/notification-data-rights-migration.test.ts \
            apps/notification-service/src/notification-data-rights.behavior.test.ts \
            apps/notification-service/src/notification-data-rights.integration.test.ts \
            apps/notification-service/src/notification-data-rights.ts \
            docs/operations/notification-persistence.md
          git commit -m 'fix(notification): harden data-rights erasure authority'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/notification-data-rights-contributor-v2:refs/remotes/origin/feat/notification-data-rights-contributor-v2'
          test "$(git rev-parse origin/main)" = '7c3fd32efbf9ebdcb4bac99980a3c8b6c893a89f'
          test "$(git rev-parse origin/feat/notification-data-rights-contributor-v2)" = "${{ github.sha }}"
          git push origin HEAD:refs/heads/feat/notification-data-rights-contributor-v2
