name: Repair notification data-rights coverage

on:
  push:
    branches:
      - feat/notification-data-rights-contributor-v2
    paths:
      - .github/workflows/repair-notification-data-rights.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-notification-data-rights
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notification-data-rights-contributor-v2
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Remove unreachable comparator equality branch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/notification-service/src/notification-data-rights.ts')
          source = path.read_text()
          before = """    entries.sort(([left], [right]) => {\n      if (left < right) {\n        return -1;\n      }\n      if (left > right) {\n        return 1;\n      }\n      return 0;\n    });"""
          after = """    entries.sort(([left], [right]) => (left < right ? -1 : 1));"""
          if source.count(before) != 1:
              raise SystemExit('expected comparator block not found exactly once')
          path.write_text(source.replace(before, after))
          PY
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/notification-service typecheck
      - run: pnpm --dir apps/notification-service test
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/notification-service/src/notification-data-rights.ts
          git diff --cached --check
          git commit -m "fix(notification): remove unreachable canonical JSON branch"
          git push origin HEAD:feat/notification-data-rights-contributor-v2
