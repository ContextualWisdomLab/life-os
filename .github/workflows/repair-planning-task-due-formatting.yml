name: Repair Planning Task Due Formatting

on:
  push:
    branches:
      - feat/planning-task-due-authority-v1
    paths:
      - .github/workflows/repair-planning-task-due-formatting.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout triggering exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Guard single-writer exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Apply canonical focused formatting
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/planning-service/src/main.ts
            apps/planning-service/src/planning-domain.ts
            apps/planning-service/src/planning-runtime.ts
            apps/planning-service/src/task-due-authority.ts
            apps/planning-service/src/task-due-authority-postgres.integration.test.ts
            apps/planning-service/migrations/README.md
          )
          pnpm exec prettier --single-quote --write "${files[@]}"
          pnpm exec prettier --single-quote --check "${files[@]}"
          git diff --check

          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              apps/planning-service/src/main.ts|\
              apps/planning-service/src/planning-domain.ts|\
              apps/planning-service/src/planning-runtime.ts|\
              apps/planning-service/src/task-due-authority.ts|\
              apps/planning-service/src/task-due-authority-postgres.integration.test.ts|\
              apps/planning-service/migrations/README.md)
                ;;
              *)
                echo "Unexpected formatter delta: $path" >&2
                exit 1
                ;;
            esac
          done
      - name: Publish formatting repair and retire writer
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/repair-planning-task-due-formatting.yml
          rm "$workflow"

          git fetch origin "$GITHUB_REF_NAME" --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/planning-service/src/main.ts \
            apps/planning-service/src/planning-domain.ts \
            apps/planning-service/src/planning-runtime.ts \
            apps/planning-service/src/task-due-authority.ts \
            apps/planning-service/src/task-due-authority-postgres.integration.test.ts \
            apps/planning-service/migrations/README.md \
            "$workflow"
          git diff --cached --check
          git commit -m 'style(planning): apply canonical due authority formatting'
          git push origin "HEAD:$GITHUB_REF_NAME"
