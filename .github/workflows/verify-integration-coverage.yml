name: Verify Integration coverage

on:
  push:
    branches: [test/integration-service-quality-gates-v1]

permissions:
  contents: write

concurrency:
  group: verify-integration-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://life_os:life_os@127.0.0.1:5432/life_os_integration?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_integration
          POSTGRES_USER: life_os
          POSTGRES_PASSWORD: life_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os -d life_os_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Generate canonical lockfile delta
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile
          git diff --check

      - name: Build exact candidate and run coverage gate
        id: coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git diff --quiet -- pnpm-lock.yaml; then
            git add pnpm-lock.yaml
            git commit -m 'chore(integration): refresh coverage lockfile'
          fi

          pnpm install --frozen-lockfile
          pnpm exec prettier --single-quote --write \
            apps/integration-service/package.json \
            apps/integration-service/vitest.config.ts \
            apps/integration-service/src/plugin-delivery-attempt-execution-fence-repository.ts \
            apps/integration-service/src/plugin-delivery-attempt-execution-fence-repository.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-retry-repository.ts \
            apps/integration-service/src/plugin-delivery-attempt-retry-repository.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-status-repository.ts \
            apps/integration-service/src/plugin-delivery-attempt-status-repository-coverage.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-stored-instant-coverage.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-test-database.test.ts \
            apps/integration-service/src/plugin-operator-replay-postgres.integration.test.ts \
            .github/workflows/verify-integration-coverage.yml
          git diff --check
          if ! git diff --quiet; then
            git add \
              pnpm-lock.yaml \
              apps/integration-service/package.json \
              apps/integration-service/vitest.config.ts \
              apps/integration-service/src/plugin-delivery-attempt-execution-fence-repository.ts \
              apps/integration-service/src/plugin-delivery-attempt-execution-fence-repository.test.ts \
              apps/integration-service/src/plugin-delivery-attempt-retry-repository.ts \
              apps/integration-service/src/plugin-delivery-attempt-retry-repository.test.ts \
              apps/integration-service/src/plugin-delivery-attempt-status-repository.ts \
              apps/integration-service/src/plugin-delivery-attempt-status-repository-coverage.test.ts \
              apps/integration-service/src/plugin-delivery-attempt-stored-instant-coverage.test.ts \
              apps/integration-service/src/plugin-delivery-attempt-test-database.test.ts \
              apps/integration-service/src/plugin-operator-replay-postgres.integration.test.ts \
              .github/workflows/verify-integration-coverage.yml
            git commit -m 'style(integration): canonicalize coverage-owned files'
          fi

          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=${candidate_sha}" >> "$GITHUB_OUTPUT"
          echo "Exact candidate: ${candidate_sha}"

          pnpm --filter @life-os/plugin-sdk build
          pnpm --filter @life-os/integration-service typecheck

          mkdir -p .verification
          set +e
          set -o pipefail
          pnpm --filter @life-os/integration-service test:coverage 2>&1 | tee .verification/integration-coverage.log
          coverage_status=${PIPESTATUS[0]}
          set -e
          echo "coverage_status=${coverage_status}" >> "$GITHUB_OUTPUT"

          remote_sha="$(git ls-remote origin refs/heads/test/integration-service-quality-gates-v1 | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Remote branch moved from workflow input ${GITHUB_SHA} to ${remote_sha}; refusing publication." >&2
            exit 1
          fi
          if [ "$candidate_sha" != "$GITHUB_SHA" ]; then
            git push origin HEAD:refs/heads/test/integration-service-quality-gates-v1
          fi

          exit "$coverage_status"

      - name: Upload exact coverage diagnostics
        if: always() && steps.coverage.outputs.coverage_status != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-coverage-${{ github.run_id }}
          path: |
            .verification/integration-coverage.log
            apps/integration-service/coverage/coverage-final.json
            apps/integration-service/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Retire purpose-complete verifier
        if: steps.coverage.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin refs/heads/test/integration-service-quality-gates-v1 | cut -f1)"
          candidate_sha="${{ steps.coverage.outputs.candidate_sha }}"
          if [ "$remote_sha" != "$candidate_sha" ]; then
            echo "Remote branch moved from verified candidate ${candidate_sha} to ${remote_sha}; refusing retirement." >&2
            exit 1
          fi
          git rm .github/workflows/verify-integration-coverage.yml
          git commit -m 'ci(integration): retire coverage verifier'
          git push origin HEAD:refs/heads/test/integration-service-quality-gates-v1
