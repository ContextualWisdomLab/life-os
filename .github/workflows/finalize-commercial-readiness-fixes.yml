name: Finalize commercial readiness fixes

on:
  push:
    branches:
      - "feat/commercial-readiness-loop"

permissions:
  contents: write

concurrency:
  group: harden-commercial-readiness-review-gate
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Apply reviewed fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path_value, old, new):
              path = Path(path_value)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          policy_path = Path('product/commercial-readiness-policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          policy['required_review_actors'] = ['coderabbitai']
          ordered_policy = {
              'schema': policy['schema'],
              'default_branch': policy['default_branch'],
              'readiness_issue_marker': policy['readiness_issue_marker'],
              'readiness_issue_title': policy['readiness_issue_title'],
              'trusted_author_associations': policy['trusted_author_associations'],
              'required_review_actors': policy['required_review_actors'],
              'required_workflows': policy['required_workflows'],
              'required_statuses': policy['required_statuses'],
              'artifact_retention_days': policy['artifact_retention_days'],
              'merge_method': policy['merge_method'],
          }
          policy_path.write_text(json.dumps(ordered_policy, indent=2) + '\n', encoding='utf-8')

          replace_once(
              'packages/commercial-readiness/src/schema.mjs',
              "const REQUIRED_COMMIT_STATUSES = Object.freeze(['CodeRabbit']);\nconst ALLOWED_EVIDENCE_KINDS = new Set([",
              "const REQUIRED_COMMIT_STATUSES = Object.freeze(['CodeRabbit']);\nconst REQUIRED_REVIEW_ACTORS = Object.freeze(['coderabbitai']);\nconst ALLOWED_EVIDENCE_KINDS = new Set([",
          )
          replace_once(
              'packages/commercial-readiness/src/schema.mjs',
              "  if (associations.some((association) => !TRUSTED_AUTHOR_ASSOCIATIONS.has(association))) {\n    failPolicy();\n  }\n  const workflows = uniqueStrings(value.required_workflows, 'invalid required workflows');",
              "  if (associations.some((association) => !TRUSTED_AUTHOR_ASSOCIATIONS.has(association))) {\n    failPolicy();\n  }\n  const reviewActors = uniqueStrings(\n    value.required_review_actors,\n    'invalid required review actors'\n  ).map((actor) => {\n    if (!/^[A-Za-z0-9][A-Za-z0-9-]{0,38}(?:\\[bot\\])?$/.test(actor)) {\n      failPolicy('invalid required review actor');\n    }\n    return actor.toLowerCase();\n  });\n  if (new Set(reviewActors).size !== reviewActors.length) {\n    failPolicy('duplicate required review actor');\n  }\n  for (const required of REQUIRED_REVIEW_ACTORS) {\n    if (!reviewActors.includes(required)) {\n      failPolicy(`required review actor missing: ${required}`);\n    }\n  }\n  const workflows = uniqueStrings(value.required_workflows, 'invalid required workflows');",
          )
          replace_once(
              'packages/commercial-readiness/src/schema.mjs',
              "    trusted_author_associations: Object.freeze(associations),\n    required_workflows: Object.freeze(workflows),",
              "    trusted_author_associations: Object.freeze(associations),\n    required_review_actors: Object.freeze(reviewActors),\n    required_workflows: Object.freeze(workflows),",
          )
          replace_once(
              'packages/commercial-readiness/src/schema.mjs',
              "const SNAPSHOT_SHA_PATTERN = /^[0-9a-f]{40}$/i;",
              "const SNAPSHOT_SHA_PATTERN = /^[0-9a-f]{40}$/i;\nconst SNAPSHOT_COLLECTION_LIMIT = 1000;",
          )
          replace_once(
              'packages/commercial-readiness/src/schema.mjs',
