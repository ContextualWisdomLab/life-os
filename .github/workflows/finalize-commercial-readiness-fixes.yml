              "function validateSnapshotReview(value) {\n  const allowed = new Set(['actor', 'state', 'submitted_at', 'commit_sha']);\n  if (!exactKeys(value, allowed)) failSnapshot('invalid review');\n  const submittedAt = value.submitted_at;\n  if (submittedAt !== null && !Number.isFinite(Date.parse(submittedAt))) {\n    failSnapshot('invalid review timestamp');\n  }\n  const commitSha = snapshotString(value.commit_sha, 'invalid review commit SHA', 40);\n  if (!SNAPSHOT_SHA_PATTERN.test(commitSha)) failSnapshot('invalid review commit SHA');\n  return Object.freeze({\n    actor: snapshotString(value.actor, 'invalid review actor', 100),\n    state: snapshotString(value.state, 'invalid review state', 50),\n    submitted_at: submittedAt,\n    commit_sha: commitSha.toLowerCase()\n  });\n}",
          )
          schema_path = Path('packages/commercial-readiness/src/schema.mjs')
          schema_text = schema_path.read_text(encoding='utf-8')
          for old, new in [
              ('value.reviews.length > 100', 'value.reviews.length > SNAPSHOT_COLLECTION_LIMIT'),
              ('value.workflows.length > 100', 'value.workflows.length > SNAPSHOT_COLLECTION_LIMIT'),
              ('value.statuses.length > 100', 'value.statuses.length > SNAPSHOT_COLLECTION_LIMIT'),
              ('value.pull_requests.length > 100', 'value.pull_requests.length > SNAPSHOT_COLLECTION_LIMIT'),
              ('value.issues.length > 100', 'value.issues.length > SNAPSHOT_COLLECTION_LIMIT'),
          ]:
              if schema_text.count(old) != 1:
                  raise SystemExit(f'schema.mjs: expected one {old!r}')
              schema_text = schema_text.replace(old, new)
          schema_path.write_text(schema_text, encoding='utf-8')

          Path('packages/commercial-readiness/src/pr-gate.mjs').write_text("""const SHA_PATTERN = /^[0-9a-f]{40}$/i;
const SUCCESS = 'success';
const DECISIVE_REVIEW_STATES = new Set(['APPROVED', 'CHANGES_REQUESTED']);
const COMPLETED_REVIEW_STATES = new Set([
  'APPROVED',
  'CHANGES_REQUESTED',
  'COMMENTED'
]);

function normalizedActor(value) {
  return typeof value === 'string' ? value.toLowerCase() : '';
}

function latestReviewsByActor(reviews) {
  const latest = new Map();
  for (const review of Array.isArray(reviews) ? reviews : []) {
    if (!review || !DECISIVE_REVIEW_STATES.has(review.state)) continue;
    const actor = normalizedActor(review.actor);
    if (!actor) continue;
    const timestamp = Date.parse(review.submitted_at ?? '') || 0;
    const current = latest.get(actor);
    if (!current || timestamp >= current.timestamp) {
      latest.set(actor, { state: review.state, timestamp });
    }
  }
  return latest;
}

function reviewEvidence(pr, requiredActor) {
  const normalizedRequiredActor = normalizedActor(requiredActor);
  const named = (Array.isArray(pr.reviews) ? pr.reviews : []).filter(
    (item) =>
      normalizedActor(item?.actor) === normalizedRequiredActor &&
      COMPLETED_REVIEW_STATES.has(item?.state)
  );
  if (named.length === 0) {
    return { blocker: `missing-review:${normalizedRequiredActor}` };
  }
  const currentHead = typeof pr.head_sha === 'string' ? pr.head_sha.toLowerCase() : '';
  const matchingHead = named.filter(
    (item) =>
      typeof item?.commit_sha === 'string' &&
      item.commit_sha.toLowerCase() === currentHead
  );
  return matchingHead.length > 0
    ? {}
    : { blocker: `stale-review:${normalizedRequiredActor}` };
}

function workflowEvidence(pr, requiredName) {
  const named = (Array.isArray(pr.workflows) ? pr.workflows : []).filter(
    (item) => item?.name === requiredName
  );
  if (named.length === 0) return { blocker: `missing-workflow:${requiredName}` };
  const matchingHead = named.filter((item) => item.head_sha === pr.head_sha);
  if (matchingHead.length === 0) return { blocker: 'stale-check-evidence' };
  const successful = matchingHead.some(
    (item) => item.status === 'completed' && item.conclusion === SUCCESS
  );
  return successful ? {} : { blocker: `workflow-not-successful:${requiredName}` };
}

function statusEvidence(pr, requiredContext) {
  const named = (Array.isArray(pr.statuses) ? pr.statuses : []).filter(
    (item) => item?.context === requiredContext
  );
  if (named.length === 0) return { blocker: `missing-status:${requiredContext}` };
  const matchingHead = named.filter((item) => item.sha === pr.head_sha);
  if (matchingHead.length === 0) return { blocker: 'stale-check-evidence' };
  return matchingHead.some((item) => item.state === SUCCESS)
    ? {}
    : { blocker: `status-not-successful:${requiredContext}` };
}

export function evaluatePullRequestForMerge(pr, policy) {
  const blockers = [];
  if (!pr || typeof pr !== 'object') {
    return { eligible: false, blockers: ['invalid-pr'] };
  }
  if (pr.state !== 'open') blockers.push('not-open');
  if (pr.draft === true) blockers.push('draft');
  if (pr.repository !== pr.head_repo) blockers.push('fork');
  if (!policy.trusted_author_associations.includes(pr.author_association)) {
    blockers.push('untrusted-author');
  }
  if (pr.base_ref !== policy.default_branch) blockers.push('wrong-base');
  if (!SHA_PATTERN.test(pr.head_sha ?? '')) blockers.push('invalid-head');
  if (
    pr.mergeable !== true ||
    ['dirty', 'blocked', 'unknown'].includes(pr.mergeable_state)
  ) {
    blockers.push('merge-conflict');
  }
  if (pr.behind_by !== 0 || pr.mergeable_state === 'behind') {
    blockers.push('base-out-of-date');
  }
  if (!Number.isSafeInteger(pr.unresolved_threads)) {
    blockers.push('review-thread-state-unknown');
  } else if (pr.unresolved_threads > 0) {
    blockers.push('unresolved-review-thread');
  }

  for (const review of latestReviewsByActor(pr.reviews).values()) {
    if (review.state === 'CHANGES_REQUESTED') {
      blockers.push('changes-requested');
      break;
    }
  }

  for (const actor of policy.required_review_actors) {
    const evidence = reviewEvidence(pr, actor);
    if (evidence.blocker) blockers.push(evidence.blocker);
  }
  for (const workflow of policy.required_workflows) {
    const evidence = workflowEvidence(pr, workflow);
    if (evidence.blocker) blockers.push(evidence.blocker);
  }
  for (const context of policy.required_statuses) {
    const evidence = statusEvidence(pr, context);
    if (evidence.blocker) blockers.push(evidence.blocker);
  }

  const unique = [...new Set(blockers)];
  return { eligible: unique.length === 0, blockers: unique };
}
""", encoding='utf-8')

          Path('packages/commercial-readiness/src/pr-gate.test.mjs').write_text("""import assert from 'node:assert/strict';
import { describe, it } from 'node:test';
import { evaluatePullRequestForMerge } from './pr-gate.mjs';

const HEAD_SHA = 'a'.repeat(40);

function policy(overrides = {}) {
  return {
    default_branch: 'main',
    trusted_author_associations: ['OWNER', 'MEMBER', 'COLLABORATOR'],
    required_review_actors: ['coderabbitai'],
    required_workflows: [
      'CI',
      'SAST Semgrep',
      'Security Scan',
      'AppGuardrail',
      'Commercial Readiness'
    ],
    required_statuses: ['CodeRabbit'],
    merge_method: 'squash',
    ...overrides
  };
}

function codeRabbitReview(overrides = {}) {
  return {
    actor: 'coderabbitai',
    state: 'COMMENTED',
    submitted_at: '2026-08-03T06:05:00Z',
    commit_sha: HEAD_SHA,
    ...overrides
  };
}

function pullRequest(overrides = {}) {
  return {
    number: 42,
    title: 'feat: safe change',
    state: 'open',
    draft: false,
    mergeable: true,
    mergeable_state: 'clean',
    base_ref: 'main',
    head_sha: HEAD_SHA,
    head_repo: 'ContextualWisdomLab/life-os',
    repository: 'ContextualWisdomLab/life-os',
    author_association: 'MEMBER',
    behind_by: 0,
    reviews: [
      {
        actor: 'reviewer-a',
        state: 'APPROVED',
        submitted_at: '2026-08-03T06:00:00Z',
        commit_sha: HEAD_SHA
      },
      codeRabbitReview()
    ],
    unresolved_threads: 0,
    workflows: [
      { name: 'CI', status: 'completed', conclusion: 'success', head_sha: HEAD_SHA },
      { name: 'SAST Semgrep', status: 'completed', conclusion: 'success', head_sha: HEAD_SHA },
      { name: 'Security Scan', status: 'completed', conclusion: 'success', head_sha: HEAD_SHA },
      { name: 'AppGuardrail', status: 'completed', conclusion: 'success', head_sha: HEAD_SHA },
      { name: 'Commercial Readiness', status: 'completed', conclusion: 'success', head_sha: HEAD_SHA }
    ],
    statuses: [{ context: 'CodeRabbit', state: 'success', sha: HEAD_SHA }],
    ...overrides
  };
}

describe('evaluatePullRequestForMerge', () => {
  it('accepts only a current, trusted, same-repository PR with every gate successful', () => {
    assert.deepEqual(evaluatePullRequestForMerge(pullRequest(), policy()), {
      eligible: true,
      blockers: []
    });
  });

  it('rejects every unsafe or incomplete merge condition', () => {
    const cases = [
      [pullRequest({ draft: true }), 'draft'],
      [pullRequest({ head_repo: 'fork/life-os' }), 'fork'],
      [pullRequest({ author_association: 'CONTRIBUTOR' }), 'untrusted-author'],
      [pullRequest({ mergeable: false, mergeable_state: 'dirty' }), 'merge-conflict'],
      [pullRequest({ mergeable_state: 'behind', behind_by: 1 }), 'base-out-of-date'],
      [pullRequest({ base_ref: 'develop' }), 'wrong-base'],
      [pullRequest({ unresolved_threads: 1 }), 'unresolved-review-thread'],
      [
        pullRequest({
          reviews: [
            {
              actor: 'reviewer-a',
              state: 'CHANGES_REQUESTED',
              submitted_at: '2026-08-03T06:00:00Z',
              commit_sha: HEAD_SHA
            },
            codeRabbitReview()
          ]
        }),
        'changes-requested'
      ],
      [
        pullRequest({
          reviews: pullRequest().reviews.filter((item) => item.actor !== 'coderabbitai')
        }),
        'missing-review:coderabbitai'
      ],
      [
        pullRequest({
          reviews: [
            pullRequest().reviews[0],
            codeRabbitReview({ commit_sha: 'b'.repeat(40) })
          ]
        }),
        'stale-review:coderabbitai'
      ],
      [
        pullRequest({
          workflows: pullRequest().workflows.filter((item) => item.name !== 'AppGuardrail')
        }),
        'missing-workflow:AppGuardrail'
      ],
      [
        pullRequest({
          workflows: pullRequest().workflows.map((item) =>
            item.name === 'CI' ? { ...item, status: 'queued', conclusion: null } : item
          )
        }),
        'workflow-not-successful:CI'
      ],
      [
        pullRequest({
          workflows: pullRequest().workflows.map((item) =>
            item.name === 'CI'
              ? { ...item, status: 'completed', conclusion: 'cancelled' }
              : item
          )
        }),
        'workflow-not-successful:CI'
      ],
      [pullRequest({ statuses: [] }), 'missing-status:CodeRabbit'],
      [
        pullRequest({
          statuses: [{ context: 'CodeRabbit', state: 'pending', sha: HEAD_SHA }]
        }),
        'status-not-successful:CodeRabbit'
      ],
      [
        pullRequest({
          head_sha: 'b'.repeat(40),
          workflows: pullRequest().workflows,
          statuses: pullRequest().statuses
        }),
        'stale-review:coderabbitai'
      ]
    ];
    for (const [candidate, blocker] of cases) {
      const result = evaluatePullRequestForMerge(candidate, policy());
      assert.equal(result.eligible, false, blocker);
      assert.ok(result.blockers.includes(blocker), `${blocker}: ${result.blockers.join(', ')}`);
    }
  });

  it('requires a completed CodeRabbit review on the exact current head', () => {
    assert.equal(evaluatePullRequestForMerge(pullRequest(), policy()).eligible, true);
    const stale = evaluatePullRequestForMerge(
      pullRequest({
        reviews: [
          pullRequest().reviews[0],
          codeRabbitReview({ commit_sha: 'c'.repeat(40) })
        ]
      }),
      policy()
    );
    assert.deepEqual(stale.blockers, ['stale-review:coderabbitai']);
  });

  it('uses only the latest decisive review per actor', () => {
    const approvedAfterChanges = pullRequest({
      reviews: [
        {
          actor: 'reviewer-a',
          state: 'CHANGES_REQUESTED',
          submitted_at: '2026-08-03T05:00:00Z',
          commit_sha: HEAD_SHA
        },
        {
          actor: 'reviewer-a',
          state: 'APPROVED',
          submitted_at: '2026-08-03T06:00:00Z',
          commit_sha: HEAD_SHA
        },
        codeRabbitReview()
      ]
    });
    assert.equal(evaluatePullRequestForMerge(approvedAfterChanges, policy()).eligible, true);
  });

  it('does not let a non-decisive comment clear requested changes', () => {
    const commentedAfterChanges = pullRequest({
      reviews: [
        {
          actor: 'reviewer-a',
          state: 'CHANGES_REQUESTED',
          submitted_at: '2026-08-03T05:00:00Z',
          commit_sha: HEAD_SHA
        },
        {
          actor: 'reviewer-a',
          state: 'COMMENTED',
          submitted_at: '2026-08-03T06:00:00Z',
          commit_sha: HEAD_SHA
        },
        codeRabbitReview()
      ]
    });
    const result = evaluatePullRequestForMerge(commentedAfterChanges, policy());
    assert.equal(result.eligible, false);
    assert.ok(result.blockers.includes('changes-requested'));
  });

  it('never treats skipped, neutral, stale, timed-out, or action-required workflows as passing', () => {
    for (const conclusion of [
      'skipped',
      'neutral',
      'stale',
      'timed_out',
      'action_required',
      null
    ]) {
      const candidate = pullRequest({
        workflows: pullRequest().workflows.map((item) =>
          item.name === 'CI' ? { ...item, conclusion } : item
        )
      });
      assert.equal(evaluatePullRequestForMerge(candidate, policy()).eligible, false);
    }
  });
});
