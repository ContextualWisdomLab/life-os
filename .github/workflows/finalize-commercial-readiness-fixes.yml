name: Prepare commercial readiness review fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prepare-commercial-readiness-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'feat/commercial-readiness-loop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply security review fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          render_path = Path('packages/commercial-readiness/src/render.test.mjs')
          render_text = render_path.read_text(encoding='utf-8')
          marker = "const SCRIPT_TAG = ['<', 'script', '>'].join('');\n"
          if marker not in render_text:
              anchor = "const GITHUB_TOKEN_PREFIX = ['g', 'h', 'p', '_'].join('');\n"
              if render_text.count(anchor) != 1:
                  raise SystemExit('render.test.mjs: token-prefix anchor changed')
              render_text = render_text.replace(anchor, anchor + marker)

          replacements = {
              "title: `evil ](javascript:alert(1)) <script> ${SYNTHETIC_OPENAI_TOKEN} @ContextualWisdomLab/security`,":
                  "title: `evil ](javascript:alert(1)) ${SCRIPT_TAG} ${SYNTHETIC_OPENAI_TOKEN} @ContextualWisdomLab/security`,",
              "`name *x* <script> ${SYNTHETIC_GITHUB_TOKEN} @example-team`":
                  "`name *x* ${SCRIPT_TAG} ${SYNTHETIC_GITHUB_TOKEN} @example-team`",
              "value.includes('<script>')": "value.includes(SCRIPT_TAG)",
              "markdown.includes('<script>')": "markdown.includes(SCRIPT_TAG)",
          }
          for old, new in replacements.items():
              if old in render_text:
                  if render_text.count(old) != 1:
                      raise SystemExit(f'render.test.mjs: ambiguous replacement: {old}')
                  render_text = render_text.replace(old, new)
              elif new not in render_text:
                  raise SystemExit(f'render.test.mjs: expected text missing: {old}')
          render_path.write_text(render_text, encoding='utf-8')

          workflow_path = Path('.github/workflows/commercial-readiness.yml')
          workflow_text = workflow_path.read_text(encoding='utf-8')
          old_permissions = "      contents: write\n      issues: read\n      pull-requests: write\n      statuses: read"
          new_permissions = (
              "      # GitHub's merge endpoint requires Contents: write; other scopes stay read-only.\n"
              "      contents: write\n"
              "      issues: read\n"
              "      statuses: read"
          )
          if old_permissions in workflow_text:
              if workflow_text.count(old_permissions) != 1:
                  raise SystemExit('commercial-readiness.yml: ambiguous drain permissions')
              workflow_text = workflow_text.replace(old_permissions, new_permissions)
          elif new_permissions not in workflow_text:
              raise SystemExit('commercial-readiness.yml: drain permissions changed')
          workflow_path.write_text(workflow_text, encoding='utf-8')
          PY

      - name: Format repository
        run: pnpm format

      - name: Verify formatting and commercial readiness tests
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm --filter @life-os/commercial-readiness test
          git diff --check

      - name: Package reviewed changes
        run: |
          set -euo pipefail
          git diff --binary > review-fixes.patch
          git diff --name-only > review-fixes-files.txt
          test -s review-fixes.patch
          test -s review-fixes-files.txt

      - name: Upload reviewed changes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-readiness-review-fixes-${{ github.event.pull_request.head.sha }}
          path: |
            review-fixes.patch
            review-fixes-files.txt
          if-no-files-found: error
          retention-days: 1
