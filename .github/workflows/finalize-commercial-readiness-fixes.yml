name: Prepare commercial readiness review fixes

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: prepare-commercial-readiness-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'feat/commercial-readiness-loop'
      && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply review and regression fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_value, old, new):
              path = Path(path_value)
              text = path.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: ambiguous replacement: {old}')
                  path.write_text(text.replace(old, new), encoding='utf-8')
              elif new not in text:
                  raise SystemExit(f'{path}: expected text missing: {old}')

          render_path = Path('packages/commercial-readiness/src/render.test.mjs')
          render_text = render_path.read_text(encoding='utf-8')
          marker = "const SCRIPT_TAG = ['<', 'script', '>'].join('');\n"
          if marker not in render_text:
              anchor = "const GITHUB_TOKEN_PREFIX = ['g', 'h', 'p', '_'].join('');\n"
              if render_text.count(anchor) != 1:
                  raise SystemExit('render.test.mjs: token-prefix anchor changed')
              render_text = render_text.replace(anchor, anchor + marker)
              render_path.write_text(render_text, encoding='utf-8')

          replace_once(
              render_path,
              "title: `evil ](javascript:alert(1)) <script> ${SYNTHETIC_OPENAI_TOKEN} @ContextualWisdomLab/security`,",
              "title: `evil ](javascript:alert(1)) ${SCRIPT_TAG} ${SYNTHETIC_OPENAI_TOKEN} @ContextualWisdomLab/security`,",
          )
          replace_once(
              render_path,
              "`name *x* <script> ${SYNTHETIC_GITHUB_TOKEN} @example-team`",
              "`name *x* ${SCRIPT_TAG} ${SYNTHETIC_GITHUB_TOKEN} @example-team`",
          )
          replace_once(render_path, "value.includes('<script>')", 'value.includes(SCRIPT_TAG)')
          replace_once(render_path, "markdown.includes('<script>')", 'markdown.includes(SCRIPT_TAG)')
          replace_once(
              render_path,
              'assert.match(value, /\\[redacted\\]/);',
              "assert.equal(value.includes('\\\\[redacted\\\\]'), true);",
          )

          client_test = Path('packages/commercial-readiness/src/github-client.test.mjs')
          replace_once(
              client_test,
              "path.includes('/repos/o/r/issues?') && path.includes('page=1')",
              "path.includes('/repos/o/r/issues?') && path.endsWith('&page=1')",
          )
          replace_once(
              client_test,
              "path.includes('/repos/o/r/issues?') && path.includes('page=2')",
              "path.includes('/repos/o/r/issues?') && path.endsWith('&page=2')",
          )

          workflow_path = Path('.github/workflows/commercial-readiness.yml')
          workflow_text = workflow_path.read_text(encoding='utf-8')
          old_permissions = "      contents: write\n      issues: read\n      pull-requests: write\n      statuses: read"
          new_permissions = (
              "      # GitHub's merge endpoint requires Contents: write; other scopes stay read-only.\n"
              "      contents: write\n"
              "      issues: read\n"
              "      statuses: read"
          )
          if old_permissions in workflow_text:
              if workflow_text.count(old_permissions) != 1:
                  raise SystemExit('commercial-readiness.yml: ambiguous drain permissions')
              workflow_text = workflow_text.replace(old_permissions, new_permissions)
              workflow_path.write_text(workflow_text, encoding='utf-8')
          elif new_permissions not in workflow_text:
              raise SystemExit('commercial-readiness.yml: drain permissions changed')
          PY

      - name: Format CI-governed files only
        run: |
          set -euo pipefail
          pnpm format
          python3 - <<'PY'
          import json
          import shlex
          import subprocess
          from pathlib import Path

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          command = shlex.split(package['scripts']['format:check'])
          allowed = set(command[3:])
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          for path in changed:
              if path not in allowed:
                  subprocess.run(['git', 'checkout', '--', path], check=True)
          PY

      - name: Validate repository
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config --quiet
          git diff --check

      - name: Remove generated build state
        run: |
          set -euo pipefail
          git checkout -- apps/web/tsconfig.json 2>/dev/null || true
          rm -f apps/web/tsconfig.tsbuildinfo pnpm-lock.yaml
          git diff --check

      - name: Package validated files
        run: |
          set -euo pipefail
          git diff --name-only > review-fixes-files.txt
          test -s review-fixes-files.txt
          tar -czf review-fixes-files.tar.gz -T review-fixes-files.txt

      - name: Upload validated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-readiness-review-fixes-${{ github.event.pull_request.head.sha }}
          path: |
            review-fixes-files.tar.gz
            review-fixes-files.txt
          if-no-files-found: error
          retention-days: 1
