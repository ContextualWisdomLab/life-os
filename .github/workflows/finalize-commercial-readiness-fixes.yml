name: Apply commercial readiness review fixes

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-commercial-readiness-review-fixes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.head.ref == 'feat/commercial-readiness-loop'
      && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply review and regression fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_value, old, new):
              path = Path(path_value)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          render_path = Path('packages/commercial-readiness/src/render.test.mjs')
          render_text = render_path.read_text(encoding='utf-8')
          marker = "const SCRIPT_TAG = ['<', 'script', '>'].join('');\n"
          if marker not in render_text:
              anchor = "const GITHUB_TOKEN_PREFIX = ['g', 'h', 'p', '_'].join('');\n"
              if render_text.count(anchor) != 1:
                  raise SystemExit('render.test.mjs: token-prefix anchor changed')
              render_text = render_text.replace(anchor, anchor + marker)
          replacements = {
              "title: `evil ](javascript:alert(1)) <script> ${SYNTHETIC_OPENAI_TOKEN} @ContextualWisdomLab/security`,":
                  "title: `evil ](javascript:alert(1)) ${SCRIPT_TAG} ${SYNTHETIC_OPENAI_TOKEN} @ContextualWisdomLab/security`,",
              "`name *x* <script> ${SYNTHETIC_GITHUB_TOKEN} @example-team`":
                  "`name *x* ${SCRIPT_TAG} ${SYNTHETIC_GITHUB_TOKEN} @example-team`",
              "value.includes('<script>')": "value.includes(SCRIPT_TAG)",
              "markdown.includes('<script>')": "markdown.includes(SCRIPT_TAG)",
              "assert.match(value, /\\[redacted\\]/);":
                  "assert.equal(value.includes('\\\\[redacted\\\\]'), true);",
          }
          for old, new in replacements.items():
              if old in render_text:
                  if render_text.count(old) != 1:
                      raise SystemExit(f'render.test.mjs: ambiguous replacement: {old}')
                  render_text = render_text.replace(old, new)
              elif new not in render_text:
                  raise SystemExit(f'render.test.mjs: expected text missing: {old}')
          render_path.write_text(render_text, encoding='utf-8')

          client_test_path = Path('packages/commercial-readiness/src/github-client.test.mjs')
          client_test = client_test_path.read_text(encoding='utf-8')
          for old, new in [
              ("path.includes('page=1')", "path.includes('&page=1')"),
              ("path.includes('page=2')", "path.includes('&page=2')"),
          ]:
              if old in client_test:
                  if client_test.count(old) != 1:
                      raise SystemExit(f'github-client.test.mjs: ambiguous replacement: {old}')
                  client_test = client_test.replace(old, new)
              elif new not in client_test:
                  raise SystemExit(f'github-client.test.mjs: expected text missing: {old}')
          client_test_path.write_text(client_test, encoding='utf-8')

          workflow_path = Path('.github/workflows/commercial-readiness.yml')
          workflow_text = workflow_path.read_text(encoding='utf-8')
          old_permissions = "      contents: write\n      issues: read\n      pull-requests: write\n      statuses: read"
          new_permissions = (
              "      # GitHub's merge endpoint requires Contents: write; other scopes stay read-only.\n"
              "      contents: write\n"
              "      issues: read\n"
              "      statuses: read"
          )
          if old_permissions in workflow_text:
              if workflow_text.count(old_permissions) != 1:
                  raise SystemExit('commercial-readiness.yml: ambiguous drain permissions')
              workflow_text = workflow_text.replace(old_permissions, new_permissions)
          elif new_permissions not in workflow_text:
              raise SystemExit('commercial-readiness.yml: drain permissions changed')
          workflow_path.write_text(workflow_text, encoding='utf-8')

          Path('.github/workflows/finalize-commercial-readiness-fixes.yml').unlink()
          Path('.github/workflows/run-finalizer-on-pr.yml').unlink(missing_ok=True)
          PY

      - name: Format repository
        run: pnpm format

      - name: Validate repository
        run: |
          set -euo pipefail
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          docker compose config --quiet
          git diff --check

      - name: Commit validated fixes
        run: |
          set -euo pipefail
          git config user.name "LifeOS maintenance automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix: apply commercial readiness review fixes"
          git push origin HEAD:feat/commercial-readiness-loop
