name: Repair Review Optional Reflection Exactness

on:
  push:
    branches:
      - feat/web-review-bff-v1
    paths:
      - .github/workflows/repair-review-optional-reflection-exactness.yml

permissions:
  contents: write

concurrency:
  group: repair-review-optional-reflection-exactness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Guard exact owner head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          test -f apps/web/app/review-client.ts
          test -f .github/workflows/repair-review-optional-reflection-exactness.yml

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reproduce exactOptionalPropertyTypes RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(pnpm --filter @life-os/web typecheck 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F "app/review-client.ts" >/dev/null
          printf '%s\n' "$output" | grep -F "reflection" >/dev/null
          printf '%s\n' "$output" | grep -F "exactOptionalPropertyTypes" >/dev/null

      - name: Apply minimum optional-property repair
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/web/app/review-client.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = `  return Object.freeze({\n    periodStartDate: requireLocalDate(value.periodStartDate, true),\n    idempotencyKey: requireUuid(value.idempotencyKey),\n    completedStepCount,\n    totalStepCount,\n    plannedItemCount,\n    completedItemCount,\n    habitCompletionCount,\n    reflection: requireReflection(value.reflection),\n    completedAt: requireInstant(value.completedAt),\n  });`;
          const after = `  const reflection = requireReflection(value.reflection);\n  return Object.freeze({\n    periodStartDate: requireLocalDate(value.periodStartDate, true),\n    idempotencyKey: requireUuid(value.idempotencyKey),\n    completedStepCount,\n    totalStepCount,\n    plannedItemCount,\n    completedItemCount,\n    habitCompletionCount,\n    ...(reflection === undefined ? {} : { reflection }),\n    completedAt: requireInstant(value.completedAt),\n  });`;
          const count = source.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected one Review completion object, found ${count}`);
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
          pnpm exec prettier --single-quote --write apps/web/app/review-client.ts

      - name: Prove owner typecheck GREEN
        run: pnpm --filter @life-os/web typecheck

      - name: Run focused Review BFF suite
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/review-client.test.ts
          app/review-client-canonical-evidence.test.ts
          app/api/reviews/routes.test.ts

      - name: Run complete Web suite
        run: pnpm --filter @life-os/web test

      - name: Guard bounded owner delta and self-retire
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check apps/web/app/review-client.ts
          git rm .github/workflows/repair-review-optional-reflection-exactness.yml
          git add apps/web/app/review-client.ts
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' .github/workflows/repair-review-optional-reflection-exactness.yml apps/web/app/review-client.ts | LC_ALL=C sort)"
          test "$changed" = "$expected"
          git diff --check --cached

      - name: Publish ordinary owner descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): omit absent Review reflection property'
          git push origin "HEAD:${GITHUB_REF_NAME}"
