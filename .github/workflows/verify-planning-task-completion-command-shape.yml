name: Verify planning task completion command shape

on:
  push:
    branches:
      - feat/planning-task-completion-http-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Run hostile command-shape regression
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          --no-file-parallelism
          src/task-completion-command-shape-hostile.test.ts
