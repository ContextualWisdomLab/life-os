name: Verify PR 279 item 43

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Verify provenance run authority contract
        run: node --test packages/commercial-readiness/src/appguardrail-provenance-run-contract.test.mjs

      - name: Verify full commercial-readiness contract suite
        run: node --test packages/commercial-readiness/src/*.test.mjs

      - name: Verify new contract syntax
        run: node --check packages/commercial-readiness/src/appguardrail-provenance-run-contract.test.mjs

      - name: Verify source hygiene
        run: git diff --check HEAD^ HEAD
