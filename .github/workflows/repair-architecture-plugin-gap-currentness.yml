name: Repair Architecture Plugin Gap Currentness

on:
  push:
    branches:
      - docs/canonical-product-architecture-mainline

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Repair bounded successor statement and self-retire
        shell: bash
        run: |
          set -euo pipefail
          branch='docs/canonical-product-architecture-mainline'
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"

          python - <<'PY'
          from pathlib import Path

          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          old = '#252 establishes admission only; worker claim/lease, bounded retry/backoff, append-only sanitized outcomes, dead-letter/pause/resume, per-attempt revocation fencing, operator-visible status and restart/recovery remain successor work.'
          new = '#252 establishes durable admission and #253 adds deterministic finite worker claim/lease; bounded retry/backoff, append-only sanitized outcomes, dead-letter/pause/resume, per-attempt revocation fencing, operator-visible status and restart/recovery remain successor work.'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one stale #130 successor statement')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          git diff --check
          rm .github/workflows/repair-architecture-plugin-gap-currentness.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md .github/workflows/repair-architecture-plugin-gap-currentness.yml
          git commit -m 'docs(architecture): align plugin successor gap'

          git fetch origin "${branch}"
          remote_head="$(git rev-parse "origin/${branch}")"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:${branch}"
