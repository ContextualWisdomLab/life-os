name: Verify PR267 hostile completion evidence

on:
  push:
    branches:
      - feat/planning-task-completion-transition-v1

permissions:
  contents: read

concurrency:
  group: verify-pr267-hostile-completion-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hostile-completion-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose focused formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/planning-service/src/task-completion.ts \
            apps/planning-service/src/task-completion.test.ts \
            apps/planning-service/src/task-completion-hostile-evidence.test.ts
          git diff -- \
            apps/planning-service/src/task-completion.ts \
            apps/planning-service/src/task-completion.test.ts \
            apps/planning-service/src/task-completion-hostile-evidence.test.ts
          git diff --exit-code -- \
            apps/planning-service/src/task-completion.ts \
            apps/planning-service/src/task-completion.test.ts \
            apps/planning-service/src/task-completion-hostile-evidence.test.ts

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Execute hostile completion evidence regression
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/task-completion-hostile-evidence.test.ts
          src/task-completion.test.ts

      - name: Build Planning
        run: pnpm --filter @life-os/planning-service build
