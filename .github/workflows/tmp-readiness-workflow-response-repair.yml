name: Temporary Readiness Workflow Response Repair

on:
  push:
    branches: [fix/actions-draft-queue-pressure-v1]

permissions:
  contents: write

concurrency:
  group: tmp-readiness-workflow-response-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Verify single-writer lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/actions-draft-queue-pressure-v1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fix/actions-draft-queue-pressure-v1)"

      - name: Apply minimal workflow-run pagination repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/commercial-readiness/src/github-client.mjs')
          text = path.read_text()
          start = text.index('async function collectWorkflowRuns(')
          end = text.index('\n/**\n * Count unresolved GitHub review threads', start)
          replacement = r'''async function collectWorkflowRuns(
            client,
            repository,
            headSha,
            pullRequestNumber,
          ) {
            for (const pageSize of [API_PAGE_SIZE, FALLBACK_API_PAGE_SIZE]) {
              const values = [];
              const seenRunIds = new Set();
              let expectedTotal = null;
              let firstPageAnchor = null;
              let collectionComplete = false;
              let pagesRead = 0;
              const pageLimit = Math.ceil(MAX_API_ITEMS / pageSize);
              try {
                for (let page = 1; page <= pageLimit; page += 1) {
                  const payload = await client.requestJson(
                    `/repos/${repository}/actions/runs?head_sha=${encodeURIComponent(
                      headSha,
                    )}&event=pull_request&per_page=${pageSize}&page=${page}`,
                  );
                  const pageValues = payload?.workflow_runs;
                  if (
                    !Array.isArray(pageValues) ||
                    pageValues.length > pageSize ||
                    !Number.isSafeInteger(payload?.total_count) ||
                    payload.total_count < 0
                  ) {
                    throw new Error('GitHub workflow run response was invalid');
                  }
                  if (expectedTotal === null) {
                    expectedTotal = payload.total_count;
                  } else if (payload.total_count !== expectedTotal) {
                    throw new Error(
                      'GitHub workflow run response changed during pagination',
                    );
                  }
                  for (const run of pageValues) {
                    if (!Number.isSafeInteger(run?.id) || run.id <= 0) {
                      throw new Error('GitHub workflow run response was invalid');
                    }
                    if (seenRunIds.has(run.id)) {
                      throw new Error(
                        'GitHub workflow run response changed during pagination',
                      );
                    }
                    seenRunIds.add(run.id);
                  }
                  if (page === 1) {
                    firstPageAnchor = pageValues.map((run) => ({
                      id: run.id,
                      name: run?.name ?? null,
                      status: run?.status ?? null,
                      conclusion: run?.conclusion ?? null,
                      head_sha: run?.head_sha ?? null,
                      run_attempt: run?.run_attempt ?? null,
                      updated_at: run?.updated_at ?? null,
                      pull_requests: (Array.isArray(run?.pull_requests)
                        ? run.pull_requests
                        : []
                      ).map((pullRequest) => pullRequest?.number ?? null),
                    }));
                  }
                  values.push(...pageValues);
                  pagesRead = page;
                  if (values.length > MAX_API_ITEMS) {
                    throw new Error(
                      'GitHub workflow run response exceeded the item limit',
                    );
                  }
                  if (values.length > expectedTotal) {
                    throw new Error(
                      'GitHub workflow run response changed during pagination',
                    );
                  }
                  if (values.length === expectedTotal) {
                    collectionComplete = true;
                    break;
                  }
                  if (pageValues.length < pageSize) {
                    throw new Error(
                      'GitHub workflow run response changed during pagination',
                    );
                  }
                }
                if (!collectionComplete) {
                  throw new Error(
                    'GitHub workflow run response exceeded the page limit',
                  );
                }
                if (pagesRead > 1) {
                  const confirmation = await client.requestJson(
                    `/repos/${repository}/actions/runs?head_sha=${encodeURIComponent(
                      headSha,
                    )}&event=pull_request&per_page=${pageSize}&page=1`,
                  );
                  const confirmationValues = confirmation?.workflow_runs;
                  if (
                    !Array.isArray(confirmationValues) ||
                    confirmationValues.length > pageSize ||
                    confirmation?.total_count !== expectedTotal ||
                    confirmationValues.some(
                      (run) => !Number.isSafeInteger(run?.id) || run.id <= 0,
                    )
                  ) {
                    throw new Error(
                      'GitHub workflow run response changed during pagination',
                    );
                  }
                  const confirmationAnchor = confirmationValues.map((run) => ({
                    id: run.id,
                    name: run?.name ?? null,
                    status: run?.status ?? null,
                    conclusion: run?.conclusion ?? null,
                    head_sha: run?.head_sha ?? null,
                    run_attempt: run?.run_attempt ?? null,
                    updated_at: run?.updated_at ?? null,
                    pull_requests: (Array.isArray(run?.pull_requests)
                      ? run.pull_requests
                      : []
                    ).map((pullRequest) => pullRequest?.number ?? null),
                  }));
                  if (
                    JSON.stringify(confirmationAnchor) !==
                    JSON.stringify(firstPageAnchor)
                  ) {
                    throw new Error(
                      'GitHub workflow run response changed during pagination',
                    );
                  }
                }
                return values.filter((run) =>
                  workflowRunBelongsToPullRequest(run, pullRequestNumber),
                );
              } catch (error) {
                if (
                  error !== RESPONSE_SIZE_ERROR ||
                  pageSize === FALLBACK_API_PAGE_SIZE
                ) {
                  throw error;
                }
              }
            }
            throw new Error('GitHub workflow pagination fallback invariant failed');
          }
          '''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node --test packages/commercial-readiness/src/github-client-workflow-response-boundary.test.mjs
          pnpm --filter @life-os/commercial-readiness test
          pnpm --filter @life-os/commercial-readiness typecheck
          pnpm --filter @life-os/commercial-readiness build
          pnpm exec prettier --single-quote --check packages/commercial-readiness/src/github-client.mjs packages/commercial-readiness/src/github-client-workflow-response-boundary.test.mjs
          git diff --check

      - name: Publish ordinary descendant and retire writer
        shell: bash
        env:
          BRANCH: fix/actions-draft-queue-pressure-v1
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-readiness-workflow-response-repair.yml
          git add packages/commercial-readiness/src/github-client.mjs packages/commercial-readiness/src/github-client-workflow-response-boundary.test.mjs
          git diff --cached --check
          git config user.name 'life-os hourly maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(readiness): bound workflow-run response pagination'
          parent="${{ github.sha }}"
          git fetch origin "$BRANCH"
          test "$(git rev-parse origin/$BRANCH)" = "$parent"
          git push origin "HEAD:$BRANCH"
