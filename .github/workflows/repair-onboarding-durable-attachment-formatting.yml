name: Repair Onboarding Durable Attachment Formatting

on:
  push:
    branches:
      - test/onboarding-durable-attachment-v1
    paths:
      - .github/workflows/repair-onboarding-durable-attachment-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-onboarding-durable-attachment-formatting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: test/onboarding-durable-attachment-v1

      - name: Require current predecessor authority
        shell: bash
        run: |
          set -euo pipefail
          predecessor='c44110e256f4dd0bc8729b222506c03ea8fce709'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$predecessor" HEAD
          remote_head="$(git ls-remote --refs origin refs/heads/test/onboarding-durable-attachment-v1 | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Canonicalize RED spec
        run: pnpm exec prettier --single-quote --write apps/web/e2e/onboarding-durable-attachment-red.spec.ts

      - name: Prove bounded formatter repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/web/e2e/onboarding-durable-attachment-red.spec.ts \
            .github/workflows/verify-onboarding-durable-attachment-red.yml
          rm .github/workflows/repair-onboarding-durable-attachment-formatting.yml
          git diff --check
          git status --short

      - name: Publish ordinary formatter descendant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/onboarding-durable-attachment-red.spec.ts \
            .github/workflows/repair-onboarding-durable-attachment-formatting.yml
          git commit -m 'style(onboarding): format durable attachment RED'
          git push origin HEAD:test/onboarding-durable-attachment-v1
