name: Repair Integration Context Canonical Evidence Formatting

on:
  push:
    branches:
      - test/integration-operator-context-canonical-evidence-v1
    paths:
      - .github/workflows/repair-integration-context-canonical-evidence-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-integration-context-canonical-evidence-formatting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained regression ancestry and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "485596934ab18a2998f694bd2c8c4ee9782912c8" HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove focused formatting RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec prettier --single-quote --check \
            apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts \
            apps/integration-service/src/integration-event-context-canonical-evidence.test.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/main.ts; then
            echo 'Expected retained Integration canonical-evidence files to be noncanonical before repair.' >&2
            exit 1
          fi

      - name: Apply complete bounded formatter repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts \
            apps/integration-service/src/integration-event-context-canonical-evidence.test.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/main.ts
          git rm .github/workflows/repair-integration-context-canonical-evidence-formatting.yml

      - name: Verify bounded repair and retained package contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts \
            apps/integration-service/src/integration-event-context-canonical-evidence.test.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/main.ts
          pnpm --filter @life-os/integration-service typecheck
          git diff --check
          source_delta="$(git diff --name-only HEAD -- \
            apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts \
            apps/integration-service/src/integration-event-context-canonical-evidence.test.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/main.ts | LC_ALL=C sort)"
          test -n "${source_delta}"
          allowed_sources="$(printf '%s\n' \
            'apps/integration-service/src/integration-event-context-canonical-evidence.test.ts' \
            'apps/integration-service/src/main.ts' \
            'apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts' \
            'apps/integration-service/src/plugin-operator-context.ts' | LC_ALL=C sort)"
          unexpected_sources="$(comm -23 \
            <(printf '%s\n' "${source_delta}") \
            <(printf '%s\n' "${allowed_sources}"))"
          test -z "${unexpected_sources}"
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-integration-context-canonical-evidence-formatting.yml' \
            ${source_delta} | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary formatter descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/integration-service/src/plugin-operator-context-canonical-evidence.test.ts \
            apps/integration-service/src/integration-event-context-canonical-evidence.test.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/main.ts
          git commit -m 'style(integration): format canonical evidence boundary'
          git push origin "HEAD:${GITHUB_REF_NAME}"
