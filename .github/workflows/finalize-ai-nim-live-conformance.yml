name: Finalize AI NIM Live Conformance Evidence

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/finalize-ai-nim-live-conformance.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-nim-live-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Register live conformance capability evidence
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('product/capabilities.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          capability = next(
              (
                  item
                  for item in document['capabilities']
                  if item['id'] == 'ai.auditable-proposals'
              ),
              None,
          )
          if capability is None:
              raise SystemExit('ai.auditable-proposals capability is missing')

          capability['tracking_issue'] = 116
          additions = [
              {
                  'maturity': 'usable',
                  'kind': 'workflow',
                  'mode': 'exists',
                  'path': '.github/workflows/ai-proposal-live-conformance.yml',
              },
              {
                  'maturity': 'production',
                  'kind': 'test',
                  'mode': 'exists',
                  'path': 'apps/ai-service/src/proposal-quality-live-workflow.test.ts',
              },
              {
                  'maturity': 'production',
                  'kind': 'documentation',
                  'mode': 'exists',
                  'path': 'docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md',
              },
          ]
          existing = {item['path'] for item in capability['evidence']}
          capability['evidence'].extend(
              item for item in additions if item['path'] not in existing
          )
          path.write_text(
              json.dumps(document, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Format architecture and capability evidence
        run: |
          pnpm exec prettier --single-quote --write \
            AGENTS.md \
            CLAUDE.md \
            ARCHITECTURE.md \
            CHANGELOG.md \
            apps/ai-service/package.json \
            product/capabilities.json \
            docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md \
            docs/superpowers/plans/2026-08-06-ai-nim-live-conformance.md

      - name: Verify documentation and readiness contracts
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/commercial-readiness test

      - name: Commit verified evidence
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            AGENTS.md \
            CLAUDE.md \
            ARCHITECTURE.md \
            CHANGELOG.md \
            apps/ai-service/package.json \
            product/capabilities.json \
            docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md \
            docs/superpowers/plans/2026-08-06-ai-nim-live-conformance.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No evidence changes required.'
          else
            git commit -m 'docs(ai): finalize live conformance architecture evidence'
            git push origin HEAD:feat/ai-nim-live-conformance
          fi
