name: Prove Plugin Delivery Origin Operator RED

on:
  push:
    branches: [feat/plugin-delivery-origin-operator-v1]

permissions:
  contents: read

concurrency:
  group: prove-plugin-delivery-origin-operator-red-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused delivery-origin operator contract
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-operator-delivery-origin.test.ts
