name: Write Product Gap Baseline Claim Lease

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish bounded currentness replacement
        shell: bash
        env:
          REPLACEMENT_B64: 
        run: |
          set -euo pipefail
          branch='docs/product-gap-baseline-2026-08-20'
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"

          python -c 'import base64,os; from pathlib import Path; p=Path("docs/product-technical-gap-baseline.md"); t=p.read_text(encoding="utf-8"); s="> **Currentness override — 2026-09-08 Integration delivery authority.**"; a=t.index(s); b=t.index("## Canonical architecture and evidence rules",a); r=base64.b64decode(os.environ["REPLACEMENT_B64"]).decode("utf-8"); p.write_text(t[:a]+r+"\n\n"+t[b:],encoding="utf-8")'

          git diff --check
          rm .github/workflows/write-product-gap-baseline-claim-lease.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md .github/workflows/write-product-gap-baseline-claim-lease.yml
          git commit -m 'docs(lifeos): record plugin claim lease evidence'

          git fetch origin "${branch}"
          remote_head="$(git rev-parse "origin/${branch}")"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:${branch}"
