name: Verify Web Project BFF Current Parent

on:
  push:
    branches:
      - feat/web-project-bff-v2
    paths:
      - .github/workflows/verify-web-project-bff-current-parent.yml
      - apps/web/app/planning-goal-client.ts
      - apps/web/app/planning-goal-canonical-evidence-regression.test.ts
      - apps/web/app/planning-project-client.test.ts
      - apps/web/app/planning-project-not-found.test.ts
      - apps/web/app/api/planning/goals/project-routes.test.ts
      - apps/web/package.json

permissions:
  contents: read

concurrency:
  group: verify-web-project-bff-current-parent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard settled Goal parent adoption
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r remote_head _ < <(git ls-remote --refs origin "refs/heads/$GITHUB_REF_NAME")
          test "$remote_head" = "$GITHUB_SHA"
          read -r parent_head _ < <(git ls-remote --refs origin refs/heads/feat/web-goal-bff-v1)
          test "$parent_head" = "1d2f72ee5e38896eb76198e55dac8a5ca491ba98"
          git merge-base --is-ancestor \
            1d2f72ee5e38896eb76198e55dac8a5ca491ba98 \
            HEAD
          git merge-base --is-ancestor \
            78eb00a3d513965b5dfc2bb38ade2dffa3fb630a \
            HEAD
          test ! -e .github/workflows/repair-web-project-parent-restack.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Check adopted Web formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/package.json
          apps/web/app/planning-goal-client.ts
          apps/web/app/planning-goal-canonical-evidence-regression.test.ts
          apps/web/app/planning-project-client.test.ts
          apps/web/app/planning-project-not-found.test.ts
          apps/web/app/api/planning/goals/project-routes.test.ts

      - name: Typecheck Web
        run: pnpm --filter @life-os/web typecheck

      - name: Prove Goal and Project boundary contracts
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/planning-goal-client.test.ts
          app/planning-goal-canonical-evidence-regression.test.ts
          app/planning-project-client.test.ts
          app/planning-project-not-found.test.ts
          app/api/planning/goals/project-routes.test.ts

      - name: Run complete Web unit suite
        run: pnpm --filter @life-os/web test

      - name: Check diff hygiene
        run: git diff --check
