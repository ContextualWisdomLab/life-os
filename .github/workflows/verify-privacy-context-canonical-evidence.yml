name: Verify Privacy Canonical Signed Evidence

on:
  push:
    branches:
      - test/privacy-context-canonical-evidence-v1
    paths:
      - apps/privacy-service/src/privacy-service-context.ts
      - apps/privacy-service/src/privacy-service-context-canonical-evidence.test.ts
      - apps/privacy-service/src/privacy-access-token.ts
      - apps/privacy-service/src/privacy-access-token-canonical-evidence.test.ts
      - .github/workflows/verify-privacy-context-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-privacy-context-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/privacy-service/src/privacy-service-context.ts
          apps/privacy-service/src/privacy-service-context-canonical-evidence.test.ts
          apps/privacy-service/src/privacy-access-token.ts
          apps/privacy-service/src/privacy-access-token-canonical-evidence.test.ts

      - name: Reproduce Privacy canonical signed-evidence regressions
        run: >-
          pnpm --filter @life-os/privacy-service exec vitest run
          src/privacy-service-context-canonical-evidence.test.ts
          src/privacy-access-token-canonical-evidence.test.ts

      - name: Typecheck Privacy package
        run: pnpm --filter @life-os/privacy-service typecheck
