name: Review service formatting repair

on:
  push:
    branches:
      - feat/review-guided-loop

permissions:
  contents: write

concurrency:
  group: review-service-format-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message != 'style(review): persist canonical formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/review-guided-loop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Persist canonical formatting and strict lint gate
        run: |
          pnpm exec prettier --single-quote --write \
            apps/review-service/src/http-boundary.test.ts \
            apps/review-service/src/main.test.ts \
            apps/review-service/src/postgres-review-repository.test.ts \
            apps/review-service/src/review-domain.ts \
            apps/review-service/src/review-service.integration.test.ts
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/review-service/package.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.scripts.lint = 'tsc --noEmit && prettier --single-quote --check package.json migrations/README.md src/**/*.ts ../../docs/superpowers/plans/2026-08-04-guided-review-service-slice.md';
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          pnpm exec prettier --single-quote --write apps/review-service/package.json
          rm .github/workflows/review-service-format-once.yml

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 1
          git commit -m "style(review): persist canonical formatting"
          git push origin HEAD:feat/review-guided-loop
