name: Refresh LifeOS Integration architecture currentness

on:
  push:
    branches:
      - docs/canonical-product-architecture-mainline

permissions:
  contents: write

concurrency:
  group: refresh-lifeos-integration-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Replace bounded Integration currentness and retire writer
        env:
          WRITER_PATH: .github/workflows/refresh-lifeos-integration-architecture.yml
          TARGET_PATH: ARCHITECTURE.md
          BRANCH_NAME: docs/canonical-product-architecture-mainline
          INPUT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('ARCHITECTURE.md')
          text = target.read_text()
          old = "Remaining LifeOS-owned delivery work is bounded provider execution/outcome integration, operator-visible status and restart/recovery acceptance."
          new = """#258 extends the active unshipped Integration lifecycle with a read-only, exact delivery/workspace/requesting-user-scoped durable status boundary that is reconstructable after repository/runtime restart. Exact proof head `8855427b8fcfa3b364223e91cd088546df84d684`, run `34276065348`, job `102229247458`, completed GREEN on Ubuntu 24.04/PostgreSQL 16.15 after both application and PostgreSQL repository chronology boundaries were repaired to reject durable status evidence updated after the trusted read instant. Focused status/restart acceptance passed 2 files / 10 tests, Integration typecheck passed, and the complete Integration suite passed 460 tests with 3 environment-dependent skips across 81 files (79 passed / 2 skipped). Current #258 exact `33d15c0d40806bb6a76f291dd265690f94c34186` removes only the purpose-complete verifier. The status contract remains credential-free, exposes only derived claim state, creates no new persistence owner or migration, and grants no provider-execution or outbound-network authority. Remaining LifeOS-owned delivery work is bounded provider execution/outcome integration and authenticated operator HTTP composition; outbound I/O remains fail closed until an immutable released/versioned canonical egress contract exists."""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Integration currentness target, found {count}')
          target.write_text(text.replace(old, new, 1))
          Path('.github/workflows/refresh-lifeos-integration-architecture.yml').unlink()
          PY
          git diff --check
          git diff -- "$TARGET_PATH" "$WRITER_PATH"

      - name: Publish only if branch head is unchanged
        env:
          BRANCH_NAME: docs/canonical-product-architecture-mainline
          INPUT_SHA: ${{ github.sha }}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "$remote_head" = "$INPUT_SHA"
          git config user.name "LifeOS documentation writer"
          git config user.email "actions@users.noreply.github.com"
          git add ARCHITECTURE.md .github/workflows/refresh-lifeos-integration-architecture.yml
          git commit -m "docs: refresh plugin delivery status architecture"
          git push origin "HEAD:${BRANCH_NAME}"
