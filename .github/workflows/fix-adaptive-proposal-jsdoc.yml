name: Fix adaptive proposal JSDoc

on:
  push:
    branches:
      - agent/quality-cost-auto-default
    paths:
      - scripts/fix_adaptive_proposal_jsdoc.mjs
      - .github/workflows/fix-adaptive-proposal-jsdoc.yml

permissions:
  contents: write

concurrency:
  group: fix-adaptive-proposal-jsdoc
  cancel-in-progress: true

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply bounded JSDoc correction
        run: node scripts/fix_adaptive_proposal_jsdoc.mjs

      - name: Verify AI service
        run: |
          pnpm --filter @life-os/ai-service typecheck
          pnpm --filter @life-os/ai-service test
          pnpm --filter @life-os/ai-service build

      - name: Publish verified repair and remove one-shot files
        run: |
          rm scripts/fix_adaptive_proposal_jsdoc.mjs
          rm .github/workflows/fix-adaptive-proposal-jsdoc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "docs(ai): explain adaptive proposal request contract"
          git push origin HEAD:agent/quality-cost-auto-default
