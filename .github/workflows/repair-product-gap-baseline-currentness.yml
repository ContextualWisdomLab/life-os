name: Repair product gap baseline Integration currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: lifeos-product-gap-baseline-currentness
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact docs head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/product-gap-baseline-2026-08-20
          fetch-depth: 0

      - name: Verify bounded docs lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_parent='05d3ab38c77f9b3e8e836a67f394b96d8a2dfedc'
          test "$(git rev-parse HEAD~1)" = "$expected_parent"
          test "$(git diff --name-only "$expected_parent"...HEAD)" = '.github/workflows/repair-product-gap-baseline-currentness.yml'

      - name: Insert preservation-safe Integration currentness override
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          marker = '#### Currentness override — 2026-09-08 credential replay publication'
          if marker in text:
              raise SystemExit('currentness override already present')
          anchor = '### #210 — reproducible release candidate'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one #210 anchor, found {text.count(anchor)}')

          addition = '''#### Currentness override — 2026-09-08 credential replay publication

The historical #130 evidence above remains audit history. The authoritative active-stack override is now #205 → #235 → #241 → #242 → #243 → #244 → #245. Parent #244 remains exact `f0b91869f306b1b7d0d5759307acf347e413aa06`, open Draft/mergeable on #243. Concrete successor #245 is exact `497bad35c0d7d53febd980aed6393c2433c25318`, open Draft/mergeable and ahead-only of #244. The importer-only frozen-lock repair and real PostgreSQL 17.10 verified-TLS acceptance are published; DNS hostnames remain certificate-identity-bound while IPv4/IPv6 literal database authorities fail closed before acquisition.

#245 also repairs the Plugin credential replay durable-acceptance gap. An existing binding can no longer return active metadata merely because its durable identity matches: replay must prove through the `PluginSecretStore` provider boundary that the opaque secret reference still contains canonical immutable binding evidence and the exact incoming secret bytes. `PluginVaultSecretStore` performs bounded KV v2 GET validation and constant-time secret comparison. Missing, malformed, or conflicting provider evidence fails closed. Secret bytes and secret digests remain outside LifeOS durable metadata.

Hosted repair evidence is explicit rather than promoted beyond scope. Run `34156755735`, job `101850074109`, proved plugin-sdk build, Integration typecheck and the complete Integration suite GREEN with 56 passed/4 skipped test files and 365 passed/16 skipped tests before a publication-only harness defect. Final run `34156840579`, job `101850321540`, repaired that delta gate and completed frozen install, reviewed repair application, build/typecheck/full Integration suite, bounded-delta validation, one-shot self-removal and normal publication GREEN. Bot child `497bad35...` is the resulting product head and the temporary writer is absent from its tree.

That evidence is not real Vault-server acceptance and does not make the stacked branch repository-wide GREEN. Exact published #245 currently has no repository workflow runs of its own and no independent approval/thread authority. The next #130 buyer gap is real Vault-backed create/exact replay/revocation over migrated PostgreSQL, restart/failure/cleanup and recovery evidence, followed by connect-time SSRF/DNS-rebinding-safe outbound HTTPS, redirect/proxy policy, signing/idempotency, durable attempt/outcome/retry/dead-letter recovery, revocation fencing, operator recovery, and buyer-visible delivery state.

'''
          path.write_text(text.replace(anchor, addition + anchor, 1))
          PY

      - name: Validate docs-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          test "$(git diff --name-only | sort)" = 'docs/product-technical-gap-baseline.md'
          grep -F 'Currentness override — 2026-09-08 credential replay publication' docs/product-technical-gap-baseline.md >/dev/null
          grep -F '497bad35c0d7d53febd980aed6393c2433c25318' docs/product-technical-gap-baseline.md >/dev/null

      - name: Publish docs currentness and remove one-shot writer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/repair-product-gap-baseline-currentness.yml
          actual_paths=$(git status --short | awk '{print $2}' | sort)
          expected_paths=$(printf '%s\n' '.github/workflows/repair-product-gap-baseline-currentness.yml' 'docs/product-technical-gap-baseline.md' | sort)
          test "$actual_paths" = "$expected_paths"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record Integration credential replay currentness'
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
