name: Repair product gap baseline currentness

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: repair-product-gap-baseline-currentness-${{ github.repository }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact documentation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs/product-gap-baseline-2026-08-20
          fetch-depth: 2

      - name: Publish exact Integration quality evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/product-technical-gap-baseline.md';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace('**Baseline date:** 2026-09-08 (KST)  ', '**Baseline date:** 2026-09-10 (KST)');

          const start = '<!-- life-os-currentness:#260:start -->';
          const end = '<!-- life-os-currentness:#260:end -->';
          const startIndex = source.indexOf(start);
          const endIndex = source.indexOf(end);
          if (startIndex < 0 || endIndex < 0 || endIndex <= startIndex) {
            throw new Error('Expected bounded Integration currentness markers exactly once');
          }
          if (source.indexOf(start, startIndex + start.length) !== -1 || source.indexOf(end, endIndex + end.length) !== -1) {
            throw new Error('Duplicate Integration currentness markers');
          }

          const block = [
            '<!-- life-os-currentness:#260:start -->',
            '> **#260 authenticated status performance — exact active-PR GREEN, still unshipped.** #260 is the direct #259 performance-acceptance descendant. The first production-faithful k6 run `34293875857`, job `102286121337`, failed the unchanged buyer-path gate at **p95 21.7 ms**. The minimum causal repair reduced successful replay/status processing from three sequential PostgreSQL invocations to one Integration-owned replay function plus the scoped status read without caching, sample exclusion, threshold relaxation, cross-service SQL or weaker TLS. Exact proof `a24862ee07b6522f37f60f17013b09f546c923f2`, run `34296446935`, job `102294001154`, completed 1,000/1,000 signed requests at 10 VUs, 3,000/3,000 checks, zero HTTP failures and **p95 15.27 ms**. Current #260 exact `a81c8f243eaedb5f7efddc8a6c208083c8c256e3` removes only the purpose verifier. This is active-PR evidence, not protected-main or release authority.',
            '>',
            '> **#261 Integration production quality — exact current-head GREEN, still unshipped.** #261 directly owns the permanent production coverage and documentation gates. Reality work converged at source proof `2e0fcde61fcb53b09b5f888a85cf4b00db9b18b9`, run `34394729533`, job `102611491182`: **221/221 suites; 642 tests passed, 0 failed, 3 pending; 7,218/7,218 statements, 2,655/2,655 branches, 496/496 functions and 7,218/7,218 lines — 100% in every V8 production dimension.** Retained artifact `10121100682` has SHA-256 `8f62304d641c6573da6e384a860d78372933380f7fd2d0ae90877e6e369a650e`. The permanent AST production-docstring contract is part of the full suite; standalone proof `1d822dbd1b24e25eb06425f8af46e27196da8f89`, run `34380229364`, job `102563065069`, recorded **31 production files / 611 required declarations / 611 documented / 0 missing**.',
            '>',
            '> The security repair underneath that GREEN remains material acceptance evidence. Regression `8bc0a29f1d6b211a1eca59646d1d3cce1e6fcf59`, run `34393399929`, job `102607049583`, proved that a concurrent durable credential winner could regain stale installation/binding authority after asynchronous provider verification. Minimum causal repair `0ba989d34e60f3fa6c634210da331efa34cf2131` revalidates active installation identity and exact durable binding after provider I/O without changing schema, SQL ownership, egress authority, provider policy or coverage thresholds. Revoked-Proxy/Promise-assimilation hostile evidence is also retained in the same #261 quality lineage.',
            '>',
            '> Current #261 exact `26b878fae3159bd690a6ef3131c0fc03a91f31c7` is an ahead-only CHANGELOG descendant of that source proof. Exact current-head run `34396155776`, job `102616279223`, completed SUCCESS across exact checkout, frozen install, canonical source verification, Plugin SDK build, Integration typecheck, the unchanged full 100% coverage gate, bounded diagnostic upload and cleanup. Artifact `10121634768`, SHA-256 `b9591c259ee4cf80f86d098f108d0601f0a33103395e2c0af86f9b9b29c7b51c`, is bound to exact `26b878...`. Draft/mergeable and exact-head GREEN remain active-PR evidence only; independent approval, required-workflow authority, normal merge and release are separate gates.',
            '>',
            '> Durable replay/delivery/status/credential identity still grants no provider-execution or outbound-network authority. LifeOS may consume only an immutable released/versioned canonical egress contract and otherwise remains fail closed; copied sibling source, cross-service SQL and mutable dependency are not accepted substitutes.',
            '<!-- life-os-currentness:#260:end -->',
          ].join('\n');

          source = `${source.slice(0, startIndex)}${block}${source.slice(endIndex + end.length)}`;
          fs.writeFileSync(path, source);
          NODE

      - name: Verify bounded documentation delta
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('docs/product-technical-gap-baseline.md', 'utf8');
          const required = [
            '**Baseline date:** 2026-09-10 (KST)',
            '26b878fae3159bd690a6ef3131c0fc03a91f31c7',
            '7,218/7,218 statements',
            '2,655/2,655 branches',
            '611 required declarations / 611 documented / 0 missing',
            'p95 15.27 ms',
            '8bc0a29f1d6b211a1eca59646d1d3cce1e6fcf59',
          ];
          for (const needle of required) {
            if (!source.includes(needle)) throw new Error(`Missing baseline evidence: ${needle}`);
          }
          const start = '<!-- life-os-currentness:#260:start -->';
          const end = '<!-- life-os-currentness:#260:end -->';
          if (source.split(start).length !== 2 || source.split(end).length !== 2) {
            throw new Error('Currentness block must remain uniquely bounded');
          }
          NODE
          git diff --check
          git diff -- docs/product-technical-gap-baseline.md

      - name: Retire writer and publish exact documentation descendant
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-product-gap-baseline-currentness.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md .github/workflows/repair-product-gap-baseline-currentness.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo '::error::Documentation repair produced no retained delta.'
            exit 1
          fi
          git commit -m 'docs: publish current Integration quality evidence'
          remote_head="$(git ls-remote origin refs/heads/docs/product-gap-baseline-2026-08-20 | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Branch moved during verification: expected $GITHUB_SHA, found $remote_head"
            exit 1
          fi
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
