name: Final Exact-Head AI Live Conformance Gate

on:
  push:
    branches:
      - feat/ai-nim-live-conformance
    paths:
      - '.github/workflows/finalize-ai-live-review-gate.yml'
      - '.github/workflows/ai-proposal-live-conformance.yml'
      - 'AGENTS.md'
      - 'apps/ai-service/src/contextual-orchestrator-live-model.ts'
      - 'apps/ai-service/src/contextual-orchestrator-proposal-model.ts'
      - 'apps/ai-service/src/proposal-quality-live-command.ts'
      - 'apps/ai-service/src/proposal-quality-live-conformance.ts'

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: final-ai-live-conformance-review-gate
  cancel-in-progress: false

jobs:
  verify-clean-resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout latest feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-nim-live-conformance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply reviewed corrections when still pending
        run: |
          set -Eeuo pipefail
          if grep -Fq 'baseline!.quality.rates' apps/ai-service/src/proposal-quality-live-conformance.ts; then
            test -f .github/scripts/apply-ai-live-review-fixes.py
            test -f .github/scripts/augment-ai-live-review-fixes.py
            python3 .github/scripts/apply-ai-live-review-fixes.py
            python3 .github/scripts/augment-ai-live-review-fixes.py
            sed -i \
              's/JSON.stringify(await noProviderReport())/JSON.stringify(await validReport())/' \
              apps/ai-service/src/proposal-quality-live-final-coverage.test.ts
          fi

      - name: Format exact reviewed source and evidence
        run: |
          pnpm exec prettier --single-quote --write \
            AGENTS.md \
            CLAUDE.md \
            ARCHITECTURE.md \
            CHANGELOG.md \
            product/capabilities.json \
            .github/workflows/ai-proposal-live-conformance.yml \
            apps/ai-service/package.json \
            apps/ai-service/src/contextual-orchestrator-live-model.ts \
            apps/ai-service/src/contextual-orchestrator-live-model.test.ts \
            apps/ai-service/src/contextual-orchestrator-proposal-model.ts \
            apps/ai-service/src/contextual-orchestrator-proposal-contract.test.ts \
            apps/ai-service/src/proposal-quality-live-command.ts \
            apps/ai-service/src/proposal-quality-live-command.test.ts \
            apps/ai-service/src/proposal-quality-live-conformance.ts \
            apps/ai-service/src/proposal-quality-live-conformance.test.ts \
            apps/ai-service/src/proposal-quality-live-coverage.test.ts \
            apps/ai-service/src/proposal-quality-live-final-coverage.test.ts \
            apps/ai-service/src/proposal-quality-live-null-baseline.test.ts \
            apps/ai-service/src/proposal-quality-live-validation-regression.test.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts \
            docs/superpowers/plans/2026-08-06-ai-nim-live-conformance.md \
            docs/superpowers/specs/2026-08-06-ai-nim-live-conformance-design.md

      - name: Verify complete AI and readiness evidence
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test
          pnpm --filter @life-os/ai-service build
          pnpm --filter @life-os/commercial-readiness test

      - name: Remove all temporary write-capable repair assets
        run: |
          rm -f \
            .github/workflows/apply-ai-live-review-fixes.yml \
            .github/workflows/apply-ai-live-review-fixes-v2.yml \
            .github/workflows/apply-ai-live-review-fixes-v3.yml \
            .github/workflows/apply-ai-live-review-fixes-v4.yml \
            .github/workflows/finalize-ai-live-review-gate.yml \
            .github/scripts/apply-ai-live-review-fixes.py \
            .github/scripts/augment-ai-live-review-fixes.py

      - name: Commit and push only the verified clean head
        id: publish
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'fix(ai): complete exact-head live conformance review gate'
            git push origin HEAD:feat/ai-nim-live-conformance
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve addressed review threads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for thread_id in \
            PRRT_kwDOTq3wqs6W7zrL \
            PRRT_kwDOTq3wqs6W7zrO \
            PRRT_kwDOTq3wqs6W7zrU \
            PRRT_kwDOTq3wqs6W7zrW \
            PRRT_kwDOTq3wqs6W7zrZ \
            PRRT_kwDOTq3wqs6W7zra \
            PRRT_kwDOTq3wqs6W7zre \
            PRRT_kwDOTq3wqs6W7zrj \
            PRRT_kwDOTq3wqs6W7zrm; do
            gh api graphql \
              -f query='mutation($threadId:ID!){resolveReviewThread(input:{threadId:$threadId}){thread{id isResolved}}}' \
              -f threadId="$thread_id" >/dev/null
          done

      - name: Request exact-head CodeRabbit review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            repos/ContextualWisdomLab/life-os/issues/117/comments \
            -f body='@coderabbitai review' >/dev/null
