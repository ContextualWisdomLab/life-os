name: Repair Planning completion facts data-rights boundary

on:
  push:
    branches:
      - feat/planning-task-completion-history-v1
    paths:
      - .github/workflows/repair-planning-completion-data-rights-v2.yml

permissions:
  contents: write

concurrency:
  group: planning-task-completion-history-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
      TARGET_BRANCH: feat/planning-task-completion-history-v1
      EXPECTED_BASE_SHA: 44305a6572c463cd5e633412793f656b795aafb1
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify owner ancestry before repair
        run: |
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" HEAD
          test "$(git ls-remote origin refs/heads/${TARGET_BRANCH} | cut -f1)" = "$GITHUB_SHA"

      - name: Add data-rights reality regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/planning-service/tests/postgres-data-rights.integration.test.ts')
          text = path.read_text()
          old = "    '0004_data_rights_erasure_receipts.sql',\n"
          new = old + "    '0005_task_completion_chronology.sql',\n    '0006_validate_task_completion_chronology.sql',\n    '0007_task_completion_facts.sql',\n"
          if text.count(old) != 1 or '0007_task_completion_facts.sql' in text:
              raise SystemExit('migration fixture anchor mismatch')
          text = text.replace(old, new)
          old = "  await pool.query(\n    `INSERT INTO planning.today_aggregates\n"
          new = "  await pool.query(\n    `INSERT INTO planning.task_completion_facts\n       (workspace_id, task_id, completed_at)\n     VALUES ($1, $2, TIMESTAMPTZ '2026-08-10T12:00:00.000Z')`,\n    [WORKSPACE_ID, taskId],\n  );\n" + old
          if text.count(old) != 1 or 'INSERT INTO planning.task_completion_facts' in text:
              raise SystemExit('completion fact seed anchor mismatch')
          text = text.replace(old, new)
          text = text.replace("schemaVersion: 'planning.data-rights.v1'", "schemaVersion: 'planning.data-rights.v2'")
          text = text.replace('recordCount: 5,', 'recordCount: 6,')
          old = "      expect(exported.sha256).toMatch(/^[0-9a-f]{64}$/u);\n"
          new = old + "      expect(exported.data).toMatchObject({\n        taskCompletionFacts: [\n          {\n            taskId: '77777777-7777-4777-8777-777777777777',\n            completedAt: '2026-08-10T12:00:00.000Z',\n          },\n        ],\n      });\n"
          if text.count(old) != 1 or 'taskCompletionFacts:' in text:
              raise SystemExit('export assertion anchor mismatch')
          text = text.replace(old, new)
          text = text.replace('erasedRecords: 5,', 'erasedRecords: 6,')
          old = "             (SELECT count(*) FROM planning.tasks WHERE workspace_id = $1) +\n             (SELECT count(*) FROM planning.today_aggregates WHERE workspace_id = $1) +\n"
          new = "             (SELECT count(*) FROM planning.tasks WHERE workspace_id = $1) +\n             (SELECT count(*) FROM planning.task_completion_facts WHERE workspace_id = $1) +\n             (SELECT count(*) FROM planning.today_aggregates WHERE workspace_id = $1) +\n"
          if text.count(old) != 1:
              raise SystemExit('remaining count anchor mismatch')
          path.write_text(text.replace(old, new))
          PY
          pnpm exec prettier --write apps/planning-service/tests/postgres-data-rights.integration.test.ts

      - name: Prove old contributor omits completion facts
        run: |
          set +e
          pnpm --filter @life-os/planning-service exec vitest run tests/postgres-data-rights.integration.test.ts --no-file-parallelism > /tmp/data-rights-red.log 2>&1
          status=$?
          set -e
          cat /tmp/data-rights-red.log
          test "$status" -ne 0
          grep -q 'planning.data-rights.v1' /tmp/data-rights-red.log

      - name: Apply service-owned data-rights repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/planning-service/src/planning-data-rights.ts')
          text = path.read_text()
          text = text.replace("const EXPORT_SCHEMA_VERSION = 'planning.data-rights.v1' as const;", "const EXPORT_SCHEMA_VERSION = 'planning.data-rights.v2' as const;")
          old = "interface PlanningTaskExportRow extends PlanningGoalExportRow {\n  project_id: unknown;\n  status: unknown;\n  completed_at: unknown;\n}\n"
          new = old + "interface PlanningTaskCompletionFactExportRow {\n  completion_sequence: unknown;\n  task_id: unknown;\n  completed_at: unknown;\n}\n"
          if text.count(old) != 1:
              raise SystemExit('task export interface anchor mismatch')
          text = text.replace(old, new)
          old = "  'planning.today_aggregates',\n  'planning.tasks',\n"
          new = "  'planning.today_aggregates',\n  'planning.task_completion_facts',\n  'planning.tasks',\n"
          if text.count(old) != 1:
              raise SystemExit('erasure list anchor mismatch')
          text = text.replace(old, new)
          old = "  'planning.tasks': `WITH deleted AS (\n     DELETE FROM planning.tasks\n"
          new = "  'planning.task_completion_facts': `WITH deleted AS (\n     DELETE FROM planning.task_completion_facts\n     WHERE workspace_id = $1\n     RETURNING 1\n   )\n   SELECT count(*)::integer AS record_count FROM deleted`,\n" + old
          if text.count(old) != 1:
              raise SystemExit('erasure SQL anchor mismatch')
          text = text.replace(old, new)
          old = "      const [goals, projects, tasks, todayAggregates, todayIdempotency] =\n        await Promise.all([\n"
          new = "      const [\n        goals,\n        projects,\n        tasks,\n        taskCompletionFacts,\n        todayAggregates,\n        todayIdempotency,\n      ] = await Promise.all([\n"
          if text.count(old) != 1:
              raise SystemExit('export destructure anchor mismatch')
          text = text.replace(old, new)
          old = "          collectExportRows<TodayAggregateExportRow>(\n"
          new = "          collectExportRows<PlanningTaskCompletionFactExportRow>(\n            transaction,\n            `SELECT completion_sequence::text, task_id, completed_at\n             FROM planning.task_completion_facts\n             WHERE workspace_id = $1\n             ORDER BY completed_at ASC, task_id ASC, completion_sequence ASC\n             LIMIT $2 OFFSET $3`,\n            workspaceId,\n          ),\n" + old
          if text.count(old) != 1:
              raise SystemExit('completion export query anchor mismatch')
          text = text.replace(old, new)
          old = "        todayAggregates: normalizeExportRows(todayAggregates, (row) => ({\n"
          new = "        taskCompletionFacts: normalizeExportRows(taskCompletionFacts, (row) => ({\n          completionSequence: requireString(\n            row.completion_sequence,\n            'taskCompletionFact.completion_sequence',\n          ),\n          taskId: requireUuidV4(row.task_id, 'taskCompletionFact.task_id'),\n          completedAt: requireString(\n            requireTimestamp(row.completed_at, 'taskCompletionFact.completed_at'),\n            'taskCompletionFact.completed_at',\n          ),\n        })),\n" + old
          if text.count(old) != 1:
              raise SystemExit('completion export data anchor mismatch')
          text = text.replace(old, new)
          old = "        tasks.length +\n        todayAggregates.length +\n"
          new = "        tasks.length +\n        taskCompletionFacts.length +\n        todayAggregates.length +\n"
          if text.count(old) != 1:
              raise SystemExit('record count anchor mismatch')
          text = text.replace(old, new)
          old = "         (SELECT count(*) FROM planning.tasks WHERE workspace_id = $1) +\n         (SELECT count(*) FROM planning.today_aggregates WHERE workspace_id = $1) +\n"
          new = "         (SELECT count(*) FROM planning.tasks WHERE workspace_id = $1) +\n         (SELECT count(*) FROM planning.task_completion_facts WHERE workspace_id = $1) +\n         (SELECT count(*) FROM planning.today_aggregates WHERE workspace_id = $1) +\n"
          if text.count(old) != 1:
              raise SystemExit('verify erased anchor mismatch')
          path.write_text(text.replace(old, new))

          fixture = Path('apps/planning-service/src/planning-data-rights-controller-authority.test.ts')
          fixture_text = fixture.read_text()
          if fixture_text.count("schemaVersion: 'planning.data-rights.v1',") != 1:
              raise SystemExit('typed controller fixture anchor mismatch')
          fixture.write_text(fixture_text.replace("schemaVersion: 'planning.data-rights.v1',", "schemaVersion: 'planning.data-rights.v2',"))
          PY
          pnpm exec prettier --write apps/planning-service/src/planning-data-rights.ts apps/planning-service/src/planning-data-rights-controller-authority.test.ts

      - name: Run data-rights GREEN
        run: pnpm --filter @life-os/planning-service exec vitest run tests/postgres-data-rights.integration.test.ts --no-file-parallelism

      - name: Run completion-history GREEN
        run: pnpm --filter @life-os/planning-service exec vitest run src/task-completion-history.integration.test.ts --no-file-parallelism

      - name: Run complete Planning suite with normal file parallelism
        run: pnpm --filter @life-os/planning-service exec vitest run --passWithNoTests

      - name: Typecheck Planning
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Format check and build
        run: |
          pnpm exec prettier --check apps/planning-service/src/planning-data-rights.ts apps/planning-service/src/planning-data-rights-controller-authority.test.ts apps/planning-service/tests/postgres-data-rights.integration.test.ts
          pnpm --filter @life-os/planning-service build

      - name: Retire writer and verify diff
        run: |
          rm .github/workflows/repair-planning-completion-data-rights-v2.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' '.github/workflows/repair-planning-completion-data-rights-v2.yml' 'apps/planning-service/src/planning-data-rights.ts' 'apps/planning-service/src/planning-data-rights-controller-authority.test.ts' 'apps/planning-service/tests/postgres-data-rights.integration.test.ts' | sort)"

      - name: Verify exact remote ownership
        run: test "$(git ls-remote origin refs/heads/${TARGET_BRANCH} | cut -f1)" = "$GITHUB_SHA"

      - name: Publish ordinary descendant
        run: |
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add -A
          git commit -m 'fix(planning): include completion facts in data rights'
          git push origin "HEAD:${TARGET_BRANCH}"
