name: Verify Plugin Operator Replay SQL Snapshot

on:
  push:
    branches:
      - perf/plugin-delivery-status-k6-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Check focused formatting
        run: pnpm exec prettier --check apps/integration-service/src/plugin-operator-replay.ts apps/integration-service/src/plugin-operator-replay.test.ts
      - name: Run hostile replay SQL evidence regression
        run: pnpm --filter @life-os/integration-service test -- plugin-operator-replay.test.ts
      - name: Typecheck Integration
        run: pnpm --filter @life-os/integration-service typecheck
