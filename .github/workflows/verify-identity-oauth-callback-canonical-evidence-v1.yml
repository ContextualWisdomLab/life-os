name: Verify Identity OAuth Callback Canonical Evidence

on:
  push:
    branches:
      - test/identity-oauth-callback-canonical-evidence-v1

permissions:
  contents: read

concurrency:
  group: verify-identity-oauth-callback-canonical-evidence-v1
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: pnpm exec prettier --single-quote --check apps/identity-service/src/oauth-callback-canonical-evidence.test.ts

      - name: Run exact OAuth callback evidence regression
        run: pnpm --filter @life-os/identity-service exec vitest run src/oauth-callback-canonical-evidence.test.ts

      - name: Typecheck Identity service
        run: pnpm --filter @life-os/identity-service typecheck

      - name: Run complete Identity service suite
        run: pnpm --filter @life-os/identity-service test
