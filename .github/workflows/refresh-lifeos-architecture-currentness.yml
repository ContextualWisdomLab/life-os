name: Refresh LifeOS architecture currentness

on:
  push:
    branches:
      - docs/canonical-product-architecture-mainline

permissions:
  contents: write

concurrency:
  group: refresh-lifeos-architecture-currentness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Refuse stale branch publication
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/docs/canonical-product-architecture-mainline | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Replace bounded Plugin terminal currentness block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ARCHITECTURE.md')
          text = path.read_text()
          start_marker = 'Draft PR #255 is the direct #254 child'
          end_marker = '## 6. AI proposal boundary'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''Draft PR #255 is the direct #254 child and owns append-only sanitized retry/exhaustion outcome evidence. Migration `0009_plugin_delivery_attempt_outcome_record.sql` keeps provider payloads, response bodies, credentials, origin URI and network authority out of the ledger. Its retained PostgreSQL lineage repairs missing-table admission, claim binding, direct forged INSERT, and UPDATE/DELETE/TRUNCATE immutability. Current #255 exact `e201b649cdea7d50ee2b856ac98a01d2b6c1368e` removes only its purpose verifier and remains active-PR evidence rather than protected shipped truth.\n\nDraft PR #256 is the direct #255 child and owns Integration-controlled pause/resume/dead-letter transitions plus a source-bound append-only `life-os.plugin-delivery-attempt-control.v1` evidence ledger. Pause cannot steal an active worker claim; resume retains retry identity; dead-letter is admitted only after real durable `attempt_limit` exhaustion and preserves the terminal instant. Direct forged inserts and UPDATE/DELETE/TRUNCATE mutation of accepted control evidence fail closed. Initial real-PostgreSQL durable-control RED `5d50c56ae714b7ca620f3c4b790002bcdf83aa8d` / run `34255006068` / job `102158492416` established the missing lifecycle; repaired exact `a576d3fd85e1f1d0845ed10200d1849b04c8f1b2` / run `34256983815` / job `102165175608` completed GREEN across focused control acceptance, Integration typecheck and the complete Integration suite.\n\nFresh review found that `control_sequence` could advance while the accepted control timestamp moved backward, producing durable sequence evidence with contradictory chronology. Real PostgreSQL RED `8f25181033b44d89dd08ed965d8d258410629e58` / run `34261784625` / job `102181270911` failed specifically at the backdated-resume regression after environment setup, frozen install, formatting/diff hygiene and Plugin SDK build passed. Forward migration `0011_plugin_delivery_attempt_control_chronology_guard.sql` adds only the missing non-decreasing `NEW.updated_at >= OLD.updated_at` transition invariant. Exact proof `c98734fcf50bfc197141aed6469fcf1e0adffcd6` / run `34261947610` / job `102181894242` completed GREEN across the real chronology regression, Integration typecheck and the complete Integration suite. Current #256 exact `0c6221e1fe32bf6594784219a7bd710ad0c1a993` removes only the purpose-complete chronology verifier.\n\nIssue #130 remains **Partial**. Protected main does not yet contain the Vault/PostgreSQL/delivery-origin/delivery-attempt active stack. #252 establishes durable admission, #253 deterministic finite worker claim/lease, #254 claim-bound bounded retry/backoff, #255 append-only sanitized outcome evidence, and #256 durable pause/resume/dead-letter control evidence with non-decreasing chronology. The next LifeOS-owned execution boundary is a per-attempt revocation fence immediately before execution, followed by operator-visible status, restart/recovery and bounded provider execution. No active LifeOS PR supplies complete host-authorized outbound HTTPS. Outbound authority must come only from an immutable released/versioned canonical egress contract; otherwise the network boundary remains fail closed. Durable origin/delivery/claim/retry/outcome/control identity is not network authorization.\n\n'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm .github/workflows/refresh-lifeos-architecture-currentness.yml
          git diff --check

      - name: Publish bounded source-current update and retire writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LifeOS Maintainer'
          git config user.email 'actions@users.noreply.github.com'
          git add ARCHITECTURE.md .github/workflows/refresh-lifeos-architecture-currentness.yml
          git commit -m 'docs: refresh Plugin delivery architecture currentness'
          git push origin HEAD:docs/canonical-product-architecture-mainline
