name: Verify plugin delivery status k6

on:
  push:
    branches:
      - perf/plugin-delivery-status-k6-v1

permissions:
  contents: read

concurrency:
  group: verify-plugin-delivery-status-k6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status_p95:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      INTEGRATION_DATABASE_URL: postgresql://life_os:life_os@postgres.performance.test:5432/life_os_integration
      INTEGRATION_OPERATOR_CONTEXT_SECRET: performance-context-secret-value-32-bytes-minimum
      INTEGRATION_PLUGIN_VAULT_ORIGIN: https://vault.performance.example.test
      INTEGRATION_PLUGIN_VAULT_TOKEN: performance-vault-fixture-token
      INTEGRATION_PLUGIN_VAULT_MOUNT: secret
      INTEGRATION_SERVICE_PORT: '4107'
      LIFEOS_PERF_TLS_PROXY_PORT: '4443'
      LIFEOS_PERF_BASE_URL: https://127.0.0.1:4443
      LIFEOS_PERF_ITERATIONS: '1000'
      LIFEOS_PERF_VUS: '10'
      LIFEOS_PERF_AUTHORITY_FILE: /tmp/plugin-delivery-status-authority.json
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tmp/integration-postgres-ca.crt
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact verifier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
        with:
          k6-version: '2.2.0'

      - name: Install and verify Integration source
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @life-os/plugin-sdk build
          pnpm --filter @life-os/integration-service typecheck
          pnpm --filter @life-os/integration-service build
          env -u INTEGRATION_DATABASE_URL \
            pnpm --filter @life-os/integration-service test
          pnpm exec prettier --single-quote --check \
            .github/workflows/verify-plugin-delivery-status-k6.yml \
            apps/integration-service/src/plugin-operator-replay.ts \
            apps/integration-service/src/plugin-operator-replay.test.ts \
            apps/integration-service/src/plugin-operator-replay-postgres.integration.test.ts \
            apps/integration-service/perf/generate-plugin-delivery-status-authority.mjs \
            apps/integration-service/perf/plugin-delivery-attempt-status.k6.js \
            apps/integration-service/perf/profile-plugin-delivery-status.mjs

      - name: Configure verified-TLS PostgreSQL fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          hostname=postgres.performance.test
          ca_key=/tmp/integration-postgres-ca.key
          ca_cert="$PGSSLROOTCERT"
          server_key=/tmp/integration-postgres-server.key
          server_csr=/tmp/integration-postgres-server.csr
          server_cert=/tmp/integration-postgres-server.crt
          server_ext=/tmp/integration-postgres-server.ext

          mapfile -t postgres_containers < <(
            docker ps --filter publish=5432 --format '{{.ID}}'
          )
          test "${#postgres_containers[@]}" -eq 1
          postgres_container="${postgres_containers[0]}"

          openssl genrsa -out "$ca_key" 2048
          openssl req -x509 -new -sha256 -days 1 \
            -key "$ca_key" \
            -subj '/CN=LifeOS Integration CI PostgreSQL CA' \
            -out "$ca_cert"
          openssl genrsa -out "$server_key" 2048
          openssl req -new -sha256 \
            -key "$server_key" \
            -subj "/CN=$hostname" \
            -out "$server_csr"
          printf 'subjectAltName=DNS:%s\nextendedKeyUsage=serverAuth\n' "$hostname" >"$server_ext"
          openssl x509 -req -sha256 -days 1 \
            -in "$server_csr" \
            -CA "$ca_cert" \
            -CAkey "$ca_key" \
            -CAcreateserial \
            -extfile "$server_ext" \
            -out "$server_cert"
          chmod 0600 "$server_key"

          docker cp "$server_cert" "$postgres_container:/var/lib/postgresql/server.crt"
          docker cp "$server_key" "$postgres_container:/var/lib/postgresql/server.key"
          docker exec --user root "$postgres_container" \
            chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
          docker exec --user root "$postgres_container" \
            chmod 0644 /var/lib/postgresql/server.crt
          docker exec --user root "$postgres_container" \
            chmod 0600 /var/lib/postgresql/server.key
          docker exec "$postgres_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE life_os LOGIN PASSWORD 'life_os'" \
            -c "CREATE DATABASE life_os_integration OWNER life_os"
          docker exec "$postgres_container" psql -U postgres -d life_os_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl = 'on'" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'"
          docker restart "$postgres_container" >/dev/null

          ready=0
          for _ in $(seq 1 30); do
            if docker exec "$postgres_container" pg_isready -U postgres -d life_os_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          printf '127.0.0.1 %s\n' "$hostname" | sudo tee -a /etc/hosts >/dev/null
          printf 'NODE_EXTRA_CA_CERTS=%s\n' "$ca_cert" >>"$GITHUB_ENV"

          rm -f \
            "$ca_key" \
            "$server_key" \
            "$server_csr" \
            "$server_ext" \
            "${ca_cert}.srl"

      - name: Migrate and verify Integration-owned PostgreSQL
        shell: bash
        run: |
          set -Eeuo pipefail
          for migration in apps/integration-service/migrations/*.sql; do
            psql "$INTEGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql "$INTEGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc \
            'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()' |
            grep -Fx t
          INTEGRATION_DATABASE_URL="${INTEGRATION_DATABASE_URL}?sslmode=verify-full" \
            pnpm --filter @life-os/integration-service exec vitest run \
              src/plugin-operator-replay-postgres.integration.test.ts \
              --no-file-parallelism
          psql "$INTEGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f apps/integration-service/perf/seed-plugin-delivery-attempt-status.sql

      - name: Measure authenticated HTTPS status path without warm-up exclusion
        shell: bash
        run: |
          set -Eeuo pipefail
          service_log=/tmp/integration-service.log
          proxy_log=/tmp/integration-https-proxy.log
          http_ca_key=/tmp/integration-http-ca.key
          http_ca_cert=/tmp/integration-http-ca.crt
          http_server_key=/tmp/integration-http-server.key
          http_server_csr=/tmp/integration-http-server.csr
          http_server_cert=/tmp/integration-http-server.crt
          http_server_ext=/tmp/integration-http-server.ext

          cleanup() {
            status=$?
            trap - EXIT
            if [ -n "${proxy_pid:-}" ]; then
              kill "$proxy_pid" 2>/dev/null || true
              wait "$proxy_pid" 2>/dev/null || true
            fi
            if [ -n "${service_pid:-}" ]; then
              kill "$service_pid" 2>/dev/null || true
              wait "$service_pid" 2>/dev/null || true
            fi
            if [ "$status" -ne 0 ]; then
              cat "$service_log" || true
              cat "$proxy_log" || true
            fi
            rm -f \
              "$LIFEOS_PERF_AUTHORITY_FILE" \
              "$http_ca_key" \
              "$http_ca_cert" \
              "$http_server_key" \
              "$http_server_csr" \
              "$http_server_cert" \
              "$http_server_ext" \
              "${http_ca_cert}.srl"
            exit "$status"
          }
          trap cleanup EXIT

          openssl genrsa -out "$http_ca_key" 2048
          openssl req -x509 -new -sha256 -days 1 \
            -key "$http_ca_key" \
            -subj '/CN=LifeOS Integration CI HTTPS CA' \
            -out "$http_ca_cert"
          openssl genrsa -out "$http_server_key" 2048
          openssl req -new -sha256 \
            -key "$http_server_key" \
            -subj '/CN=127.0.0.1' \
            -out "$http_server_csr"
          printf 'subjectAltName=IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' >"$http_server_ext"
          openssl x509 -req -sha256 -days 1 \
            -in "$http_server_csr" \
            -CA "$http_ca_cert" \
            -CAkey "$http_ca_key" \
            -CAcreateserial \
            -extfile "$http_server_ext" \
            -out "$http_server_cert"
          chmod 0600 "$http_server_key"

          node apps/integration-service/dist/server.js >"$service_log" 2>&1 &
          service_pid=$!

          HTTP_SERVER_KEY="$http_server_key" \
          HTTP_SERVER_CERT="$http_server_cert" \
          node --input-type=module >"$proxy_log" 2>&1 <<'NODE' &
          import { readFileSync } from 'node:fs';
          import { request } from 'node:http';
          import { createServer } from 'node:https';

          const targetPort = Number(process.env.INTEGRATION_SERVICE_PORT);
          const listenPort = Number(process.env.LIFEOS_PERF_TLS_PROXY_PORT);
          const server = createServer(
            {
              key: readFileSync(process.env.HTTP_SERVER_KEY),
              cert: readFileSync(process.env.HTTP_SERVER_CERT),
            },
            (requestFromClient, responseToClient) => {
              const upstream = request(
                {
                  hostname: '127.0.0.1',
                  port: targetPort,
                  method: requestFromClient.method,
                  path: requestFromClient.url,
                  headers: requestFromClient.headers,
                },
                (upstreamResponse) => {
                  responseToClient.writeHead(
                    upstreamResponse.statusCode ?? 502,
                    upstreamResponse.headers,
                  );
                  upstreamResponse.pipe(responseToClient);
                },
              );
              upstream.on('error', () => {
                if (!responseToClient.headersSent) {
                  responseToClient.writeHead(502);
                }
                responseToClient.end();
              });
              requestFromClient.pipe(upstream);
            },
          );

          server.listen(listenPort, '127.0.0.1');
          process.once('SIGTERM', () => server.close(() => process.exit(0)));
          NODE
          proxy_pid=$!

          ready=0
          for _ in $(seq 1 30); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --cacert "$http_ca_cert" \
              --max-time 1 \
              "$LIFEOS_PERF_BASE_URL/v1/plugins/delivery-attempts/33333333-3333-4333-8333-333333333333" || true)
            if [ "$code" = '401' ]; then
              ready=1
              break
            fi
            if ! kill -0 "$service_pid" 2>/dev/null || ! kill -0 "$proxy_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

          node apps/integration-service/perf/generate-plugin-delivery-status-authority.mjs \
            "$LIFEOS_PERF_AUTHORITY_FILE"

          acceptance_status=0
          set +e
          SSL_CERT_FILE="$http_ca_cert" \
            k6 run apps/integration-service/perf/plugin-delivery-attempt-status.k6.js
          acceptance_status=$?
          set -e

          node apps/integration-service/perf/profile-plugin-delivery-status.mjs
          exit "$acceptance_status"
