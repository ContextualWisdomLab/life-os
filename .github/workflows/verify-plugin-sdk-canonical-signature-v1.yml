name: Verify Plugin SDK Canonical Delivery Signature

on:
  push:
    branches:
      - test/plugin-sdk-canonical-signature-v1

permissions:
  contents: read

concurrency:
  group: verify-plugin-sdk-canonical-signature-v1
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: pnpm exec prettier --single-quote --check packages/plugin-sdk/src/canonical-signature-evidence.test.ts

      - name: Run canonical delivery signature regression
        run: pnpm --filter @life-os/plugin-sdk exec vitest run src/canonical-signature-evidence.test.ts

      - name: Typecheck plugin SDK
        run: pnpm --filter @life-os/plugin-sdk typecheck
