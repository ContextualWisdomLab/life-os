name: Repair PR249 docstring gate formatting

on:
  push:
    branches: [fix/qs-6-16-0-v1]
    paths:
      - .github/workflows/repair-pr249-docstring-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-pr249-docstring-gate-formatting
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Canonicalize and verify the docstring gate
        shell: bash
        run: |
          set -Eeuo pipefail
          target='packages/commercial-readiness/src/production-docstring-coverage.test.mjs'
          pnpm exec prettier --single-quote --write "$target"
          pnpm format:check
          pnpm --filter @life-os/commercial-readiness lint
          pnpm --filter @life-os/commercial-readiness test
          pnpm --filter @life-os/commercial-readiness build
          node --test "$target"
          git diff --check

      - name: Publish bounded self-retired repair
        shell: bash
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          target='packages/commercial-readiness/src/production-docstring-coverage.test.mjs'
          workflow='.github/workflows/repair-pr249-docstring-formatting.yml'

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              "$target") ;;
              *) echo "unexpected formatter delta: $path" >&2; exit 1 ;;
            esac
          done

          rm "$workflow"
          git add "$target" "$workflow"

          git config user.name 'life-os-maintainer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): format Commercial Readiness docstring gate'

          git fetch origin fix/qs-6-16-0-v1
          remote_head="$(git rev-parse origin/fix/qs-6-16-0-v1)"
          test "$remote_head" = "$INPUT_SHA"
          git push origin HEAD:fix/qs-6-16-0-v1
