name: Repair PR211 documentation formatting

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]
    paths:
      - .github/workflows/repair-pr211-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-pr211-documentation-formatting
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --frozen-lockfile

      - name: Canonicalize checked documentation and verify repository formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write README.md CHANGELOG.md
          pnpm format:check
          git diff --check

      - name: Publish bounded self-retired repair
        shell: bash
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/repair-pr211-formatting.yml'

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              README.md|CHANGELOG.md) ;;
              *) echo "unexpected formatter delta: $path" >&2; exit 1 ;;
            esac
          done

          if [ "${#changed[@]}" -eq 0 ]; then
            echo '::error::hosted format RED was not reproduced by checked documentation targets'
            exit 1
          fi

          rm "$workflow"
          git add README.md CHANGELOG.md "$workflow"

          git config user.name 'life-os-maintainer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(docs): canonicalize checked documentation formatting'

          git fetch origin docs/product-gap-baseline-2026-08-20
          remote_head="$(git rev-parse origin/docs/product-gap-baseline-2026-08-20)"
          test "$remote_head" = "$INPUT_SHA"
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
