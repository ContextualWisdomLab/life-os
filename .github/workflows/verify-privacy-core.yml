name: Verify Privacy Core Contracts

on:
  push:
    branches:
      - feat/purpose-bound-pii-access
    paths:
      - '.github/workflows/verify-privacy-core.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/purpose-bound-pii-access
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install and refresh workspace lockfile
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Apply deterministic core corrections
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('apps/privacy-service/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['lint'] = (
              'tsc --noEmit && prettier --single-quote --check '
              'package.json tsconfig.json vitest.config.ts "src/**/*.ts" '
              '../../docs/research/2026-08-07-purpose-bound-pii-access-standards.md '
              '../../docs/superpowers/specs/2026-08-07-purpose-bound-pii-access-design.md '
              '../../docs/superpowers/plans/2026-08-07-purpose-bound-pii-access.md'
          )
          package_path.write_text(
              json.dumps(package, indent=2) + '\n',
              encoding='utf-8',
          )

          domain_path = Path('apps/privacy-service/src/privacy-access-domain.ts')
          domain = domain_path.read_text(encoding='utf-8')
          domain = domain.replace(
              'const SHA_256_PATTERN = /^[0-9a-f]{64}$/u;\n',
              '',
          )
          domain = domain.replace(
              'const MAXIMUM_REASON_BYTES = 2_048;',
              'const MAXIMUM_REASON_BYTES = 1_024;',
          )
          domain = domain.replace(
              '  return POLICY_RULES.find((rule) => rule.purpose === purpose) ?? invalid();',
              '  return POLICY_RULES.find((rule) => rule.purpose === purpose)!;',
          )
          old_digest = """  const digest = createHmac('sha256', key)
    .update(`${label}\\u0000${value}`, 'utf8')
    .digest('hex');
  return SHA_256_PATTERN.test(digest) ? digest : invalid();"""
          new_digest = """  return createHmac('sha256', key)
    .update(`${label}\\u0000${value}`, 'utf8')
    .digest('hex');"""
          domain = domain.replace(old_digest, new_digest)
          domain_path.write_text(domain, encoding='utf-8')

          coverage_path = Path(
              'apps/privacy-service/src/privacy-access-coverage.test.ts'
          )
          coverage = coverage_path.read_text(encoding='utf-8')
          if 'PRIVACY_ACCESS_POLICY_DIGEST' not in coverage.split(
              "from './privacy-access-domain';", 1
          )[0]:
              coverage = coverage.replace(
                  '  PrivacyAccessValidationError,\n  evaluatePrivacyAccessRequest,',
                  '  PRIVACY_ACCESS_POLICY_DIGEST,\n'
                  '  PRIVACY_ACCESS_POLICY_REVISION_ID,\n'
                  '  PrivacyAccessValidationError,\n'
                  '  evaluatePrivacyAccessRequest,',
                  1,
              )
          coverage = coverage.replace(
              "    policyRevisionId: '7a25c6b5-9fd7-45f3-9bd9-180dbc668c92',\n"
              "    policyDigest:\n"
              "      '8a96ff5f4f4d2f18ba31f38b1db20f99afc1a9018a1a12cf6e230ddf47e7d106',",
              '    policyRevisionId: PRIVACY_ACCESS_POLICY_REVISION_ID,\n'
              '    policyDigest: PRIVACY_ACCESS_POLICY_DIGEST,',
          )
          coverage_path.write_text(coverage, encoding='utf-8')
          PY

      - name: Format core package and documentation
        run: |
          pnpm exec prettier --single-quote --write \
            apps/privacy-service/package.json \
            apps/privacy-service/tsconfig.json \
            apps/privacy-service/nest-cli.json \
            apps/privacy-service/vitest.config.ts \
            'apps/privacy-service/src/**/*.ts' \
            docs/research/2026-08-07-purpose-bound-pii-access-standards.md \
            docs/superpowers/specs/2026-08-07-purpose-bound-pii-access-design.md \
            docs/superpowers/plans/2026-08-07-purpose-bound-pii-access.md

      - name: Verify core privacy package
        run: |
          pnpm --filter @life-os/privacy-service lint
          pnpm --filter @life-os/privacy-service test

      - name: Commit verified core and remove temporary workflows
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/bootstrap-privacy-service.yml \
            .github/workflows/repair-initial-privacy-contracts.yml \
            .github/workflows/verify-privacy-core.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(privacy): verify core access contracts'
          git push origin HEAD:feat/purpose-bound-pii-access
