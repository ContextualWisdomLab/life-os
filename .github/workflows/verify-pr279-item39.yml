name: Verify PR279 Item39

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Verify provenance condition contract
        run: node --test packages/commercial-readiness/src/appguardrail-provenance-condition-contract.test.mjs

      - name: Verify syntax and diff hygiene
        run: |
          node --check packages/commercial-readiness/src/appguardrail-provenance-condition-contract.test.mjs
          git diff --check HEAD^
