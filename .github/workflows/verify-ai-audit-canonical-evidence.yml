name: Verify AI Audit Canonical Evidence

on:
  push:
    branches:
      - test/ai-audit-canonical-durable-evidence-v1
    paths:
      - apps/ai-service/src/proposal-audit-canonical-evidence.test.ts
      - apps/ai-service/src/postgres-proposal-audit-canonical-evidence.test.ts
      - apps/ai-service/src/proposal-audit-domain.ts
      - apps/ai-service/src/postgres-proposal-audit-repository.ts
      - .github/workflows/verify-ai-audit-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-ai-audit-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/ai-service/src/proposal-audit-canonical-evidence.test.ts
          apps/ai-service/src/postgres-proposal-audit-canonical-evidence.test.ts
          apps/ai-service/src/proposal-audit-domain.ts
          apps/ai-service/src/postgres-proposal-audit-repository.ts

      - name: Reproduce immutable audit-evidence regressions
        run: >-
          pnpm --filter @life-os/ai-service exec vitest run
          src/proposal-audit-canonical-evidence.test.ts
          src/postgres-proposal-audit-canonical-evidence.test.ts

      - name: Typecheck AI service
        run: pnpm --filter @life-os/ai-service typecheck
