name: Repair architecture plugin retry currentness

on:
  push:
    branches:
      - docs/canonical-product-architecture-mainline

permissions:
  contents: write

concurrency:
  group: repair-architecture-plugin-retry-currentness
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply bounded repair and self-retire
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin refs/heads/docs/canonical-product-architecture-mainline | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          python3 .github/scripts/repair-architecture-plugin-retry-currentness.py
          git diff --check
          rm .github/scripts/repair-architecture-plugin-retry-currentness.py
          rm .github/workflows/repair-architecture-plugin-retry-currentness.yml
          git diff --check
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add ARCHITECTURE.md .github/scripts/repair-architecture-plugin-retry-currentness.py .github/workflows/repair-architecture-plugin-retry-currentness.yml
          git commit -m 'docs(architecture): record plugin retry lifecycle authority'
          remote_head="$(git ls-remote origin refs/heads/docs/canonical-product-architecture-mainline | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/docs/canonical-product-architecture-mainline
