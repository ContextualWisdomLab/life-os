name: AI gateway exact optional property repair

on:
  push:
    branches:
      - feat/ai-authenticated-gateway-context

permissions: {}

concurrency:
  group: ai-gateway-exact-optional-property-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ai-authenticated-gateway-context
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Omit absent optional properties
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('apps/web/app/ai-proposal-client-core.ts'): [
                  (
                      "  if (method === 'GET') return { method, path, cookie };\n",
                      "  if (method === 'GET') {\n"
                      "    return {\n"
                      "      method,\n"
                      "      path,\n"
                      "      ...(cookie === undefined ? {} : { cookie }),\n"
                      "    };\n"
                      "  }\n",
                  ),
                  (
                      "  return { method, path, body, cookie };\n",
                      "  return {\n"
                      "    method,\n"
                      "    path,\n"
                      "    body,\n"
                      "    ...(cookie === undefined ? {} : { cookie }),\n"
                      "  };\n",
                  ),
              ],
              Path('apps/web/app/ai-proposal-client.test.ts'): [
                  (
                      "    body: payload,\n",
                      "    ...(payload === undefined ? {} : { body: payload }),\n",
                  ),
              ],
              Path('apps/web/app/ai-proposal-scope-regression.test.ts'): [
                  (
                      "    body: payload,\n",
                      "    ...(payload === undefined ? {} : { body: payload }),\n",
                  ),
              ],
              Path('apps/web/app/api/ai/proposals/routes.test.ts'): [
                  (
                      "    body: payload,\n",
                      "    ...(payload === undefined ? {} : { body: payload }),\n",
                  ),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Format and verify web package
        run: |
          pnpm exec prettier --single-quote --write \
            apps/web/app/ai-proposal-client-core.ts \
            apps/web/app/ai-proposal-client.test.ts \
            apps/web/app/ai-proposal-scope-regression.test.ts \
            apps/web/app/api/ai/proposals/routes.test.ts
          pnpm --filter @life-os/web lint
          pnpm --filter @life-os/web test

      - name: Commit non-workflow repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f pnpm-lock.yaml
          git add \
            apps/web/app/ai-proposal-client-core.ts \
            apps/web/app/ai-proposal-client.test.ts \
            apps/web/app/ai-proposal-scope-regression.test.ts \
            apps/web/app/api/ai/proposals/routes.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): omit absent optional request properties'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-authenticated-gateway-context
