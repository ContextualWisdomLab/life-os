name: Repair Commercial Readiness formatting v2

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1

permissions:
  contents: write

concurrency:
  group: commercial-readiness-format-repair-v2
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/actions-draft-queue-pressure-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply bounded Prettier repair and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            packages/commercial-readiness/src/pr-gate.mjs \
            CHANGELOG.md
          rm .github/workflows/repair-commercial-readiness-format-v2.yml

          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/repair-commercial-readiness-format-v2.yml \
            CHANGELOG.md \
            packages/commercial-readiness/src/pr-gate.mjs | sort)"
          test "$actual" = "$expected"
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/repair-commercial-readiness-format-v2.yml \
            CHANGELOG.md \
            packages/commercial-readiness/src/pr-gate.mjs
          git commit -m 'style(commercial-readiness): restore canonical formatting'
          git push origin HEAD:fix/actions-draft-queue-pressure-v1
