name: Repair Plugin Delivery Status HTTP Formatting

on:
  push:
    branches: [feat/plugin-delivery-attempt-status-http-v1]

permissions:
  contents: write

concurrency:
  group: repair-plugin-delivery-status-http-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact input head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded formatting repair and retire purpose workflows
        run: |
          pnpm exec prettier --write \
            apps/integration-service/src/plugin-delivery-attempt-status-http.integration.test.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/plugin-operator-application.ts \
            apps/integration-service/src/main.ts \
            apps/integration-service/src/plugin-vault-operator-composition.ts \
            apps/integration-service/src/plugin-vault-hosted-runtime.ts
          pnpm exec prettier --check \
            apps/integration-service/src/plugin-delivery-attempt-status-http.integration.test.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/plugin-operator-application.ts \
            apps/integration-service/src/main.ts \
            apps/integration-service/src/plugin-vault-operator-composition.ts \
            apps/integration-service/src/plugin-vault-hosted-runtime.ts
          rm .github/workflows/repair-plugin-delivery-status-http-format.yml
          rm .github/workflows/verify-plugin-delivery-status-http.yml
          changed="$(git diff --name-only | sort)"
          allowed="$(printf '%s\n' \
            .github/workflows/repair-plugin-delivery-status-http-format.yml \
            .github/workflows/verify-plugin-delivery-status-http.yml \
            apps/integration-service/src/main.ts \
            apps/integration-service/src/plugin-delivery-attempt-status-http.integration.test.ts \
            apps/integration-service/src/plugin-operator-application.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/plugin-vault-hosted-runtime.ts \
            apps/integration-service/src/plugin-vault-operator-composition.ts | sort)"
          test "$changed" = "$allowed"
          git diff --check

      - name: Create exact candidate before verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/repair-plugin-delivery-status-http-format.yml \
            .github/workflows/verify-plugin-delivery-status-http.yml \
            apps/integration-service/src/main.ts \
            apps/integration-service/src/plugin-delivery-attempt-status-http.integration.test.ts \
            apps/integration-service/src/plugin-operator-application.ts \
            apps/integration-service/src/plugin-operator-context.ts \
            apps/integration-service/src/plugin-vault-hosted-runtime.ts \
            apps/integration-service/src/plugin-vault-operator-composition.ts
          git commit -m "style(integration): format delivery status HTTP slice"
          echo "VERIFIED_CANDIDATE_SHA=$(git rev-parse HEAD)"
          git show --check --stat --oneline HEAD

      - name: Build Plugin SDK
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Run focused status acceptance on exact candidate
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-status-http.integration.test.ts
          src/plugin-vault-hosted-runtime.test.ts

      - name: Typecheck Integration on exact candidate
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration suite on exact candidate
        run: pnpm --filter @life-os/integration-service test

      - name: Publish only the verified candidate
        env:
          BRANCH: feat/plugin-delivery-attempt-status-http-v1
        run: |
          candidate="$(git rev-parse HEAD)"
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain)"
          git push origin "${candidate}:$BRANCH"
          echo "PUBLISHED_VERIFIED_CANDIDATE_SHA=${candidate}"