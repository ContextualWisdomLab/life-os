                    () => outcomeId,
                    () => 'numeric-claim-key',
                  ).claim(workspaceId, reminderId),
                ).rejects.toBeInstanceOf(NotificationPersistenceError);
              });

              it('counts delivered outcomes""".replace('              ', ''),
              'unit claim test',
          )
          unit = unit.replace(
              "      '2026-08-04T12:00:01.000Z',\n      idempotencyKey,\n    );",
              "      '2026-08-04T12:00:01.000Z',\n      claimKey,\n      idempotencyKey,\n    );",
              1,
          )
          unit = unit.replace(
