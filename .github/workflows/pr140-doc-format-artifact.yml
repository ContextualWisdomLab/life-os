name: PR140 canonical doc format artifact

on:
  push:
    branches:
      - docs/canonical-product-architecture-baseline-v2

permissions:
  contents: read

concurrency:
  group: pr140-canonical-doc-format-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize Prettier output
        run: pnpm exec prettier --single-quote --write AGENTS.md CLAUDE.md ARCHITECTURE.md

      - name: Upload formatted canonical docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr140-canonical-doc-format-${{ github.sha }}
          path: |
            AGENTS.md
            CLAUDE.md
            ARCHITECTURE.md
          if-no-files-found: error
          retention-days: 1
