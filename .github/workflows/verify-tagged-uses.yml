name: Verify tagged uses semantics

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Execute checkout through an explicit YAML string tag
        uses: !!str actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
      - name: Reproduce source-verification YAML-tag bypass
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const sourcePath = 'packages/commercial-readiness/src/workflow-source-yaml-alias-contract.test.mjs';
          const probePath = 'packages/commercial-readiness/src/workflow-source-yaml-tag-red.test.mjs';
          const source = readFileSync(sourcePath, 'utf8');
          const hostileTest = [
            '',
            "test('explicit YAML tags cannot hide checkout authority from source verification', () => {",
            '  const hostile = [',
            "    'jobs:',",
            "    '  validate:',",
            "    '    steps:',",
            "    '      - uses: actions/checkout@reviewed-sha',",
            "    '        with:',",
            "    '          persist-credentials: false',",
            "    '          ref: reviewed-contributor-sha',",
            "    '      - name: Hidden tagged checkout',",
            "    '        uses: !!str actions/checkout@reviewed-sha',",
            "    '        with:',",
            "    '          persist-credentials: false',",
            "    '          ref: refs/heads/main',",
            "  ].join('\\n');",
            '  assert.throws(',
            "    () => assertDirectStepAuthority(hostile, 'validate'),",
            '    /YAML tag authority/u,',
            '  );',
            '});',
            '',
          ].join('\n');
          writeFileSync(probePath, source + hostileTest, 'utf8');
          const result = spawnSync(process.execPath, ['--test', probePath], { stdio: 'inherit' });
          rmSync(probePath, { force: true });
          process.exit(result.status ?? 1);
          NODE
