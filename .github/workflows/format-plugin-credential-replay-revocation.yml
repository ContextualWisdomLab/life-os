name: Format Plugin credential replay revocation repair

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: write

concurrency:
  group: integration-plugin-credential-replay-revocation-format
  cancel-in-progress: false

jobs:
  format_and_verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact failed-format head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/plugin-vault-postgres-driver-v1
          fetch-depth: 0

      - name: Verify exact failed-format lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          failed_format_head='cb22617f3b9673eba1390fb353587c3d7a0c492c'
          test "$(git rev-parse HEAD^)" = "$failed_format_head"
          test "$(git diff --name-only HEAD^...HEAD)" = '.github/workflows/format-plugin-credential-replay-revocation.yml'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply minimal canonical formatting and verify behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --write \
            apps/integration-service/src/plugin-credential.ts \
            apps/integration-service/src/plugin-credential-replay-secret.test.ts
          pnpm exec prettier --check \
            apps/integration-service/src/plugin-credential.ts \
            apps/integration-service/src/plugin-credential-replay-secret.test.ts
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-credential-replay-secret.test.ts
          pnpm --filter @life-os/plugin-sdk build
          pnpm --filter @life-os/integration-service typecheck
          pnpm --filter @life-os/integration-service test

      - name: Publish formatting-only descendant and remove writer
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/format-plugin-credential-replay-revocation.yml
          actual_paths=$(git diff --name-only | sort)
          expected_paths=$(cat <<'EOF'
          .github/workflows/format-plugin-credential-replay-revocation.yml
          apps/integration-service/src/plugin-credential-replay-secret.test.ts
          apps/integration-service/src/plugin-credential.ts
          EOF
          )
          test "$actual_paths" = "$(printf '%s\n' "$expected_paths" | sort)"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(integration): format replay revocation fence'
          git push origin HEAD:feat/plugin-vault-postgres-driver-v1
