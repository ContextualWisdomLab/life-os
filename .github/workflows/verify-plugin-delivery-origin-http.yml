name: Verify Plugin Delivery Origin HTTP

on:
  push:
    branches: [feat/plugin-delivery-origin-http-v1]

permissions:
  contents: write

concurrency:
  group: verify-plugin-delivery-origin-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/integration-service/src/main.ts
          apps/integration-service/src/plugin-delivery-origin-http.integration.test.ts

      - name: Build Plugin SDK runtime dependency
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Prove exact parent HTTP RED
        shell: bash
        env:
          PARENT_SHA: be4a209d56efe928c61d9d6cc3ce43a830fa2986
        run: |
          set -euo pipefail
          git show "${PARENT_SHA}:apps/integration-service/src/main.ts" > apps/integration-service/src/main.ts
          set +e
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-origin-http.integration.test.ts
          red_status=$?
          set -e
          git checkout "${GITHUB_SHA}" -- apps/integration-service/src/main.ts
          if [ "${red_status}" -eq 0 ]; then
            echo "Expected exact parent ${PARENT_SHA} to fail the delivery-origin HTTP regression" >&2
            exit 1
          fi

      - name: Run focused delivery-origin HTTP GREEN
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-origin-http.integration.test.ts

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test

      - name: Retire purpose-complete verification writer
        shell: bash
        env:
          TARGET_BRANCH: feat/plugin-delivery-origin-http-v1
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-plugin-delivery-origin-http.yml
          actual="$(git diff --cached --name-only)"
          test "$actual" = ".github/workflows/verify-plugin-delivery-origin-http.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(integration): retire delivery-origin HTTP verifier"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
