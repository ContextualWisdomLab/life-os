name: Verify Plugin Delivery Origin HTTP

on:
  push:
    branches: [feat/plugin-delivery-origin-http-v1]

permissions:
  contents: write

concurrency:
  group: verify-plugin-delivery-origin-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-repair-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Plugin SDK runtime dependency
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Prove exact #250 transport RED
        shell: bash
        env:
          BASE_SHA: be4a209d56efe928c61d9d6cc3ce43a830fa2986
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:apps/integration-service/src/main.ts" > apps/integration-service/src/main.ts
          set +e
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-origin-http.integration.test.ts
          red_status=$?
          set -e
          git checkout "${GITHUB_SHA}" -- apps/integration-service/src/main.ts
          if [ "${red_status}" -eq 0 ]; then
            echo "Expected exact #250 ${BASE_SHA} to fail the HTTP transport regression" >&2
            exit 1
          fi

      - name: Prove current raw-route alias RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm --filter @life-os/integration-service exec vitest run src/plugin-delivery-origin-http.integration.test.ts
          red_status=$?
          set -e
          if [ "${red_status}" -eq 0 ]; then
            echo "Expected current pre-repair source to accept the encoded route alias and fail the regression" >&2
            exit 1
          fi

      - name: Apply minimum raw-route causal repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/integration-service/src/main.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "  Post,\n  type ArgumentsHost,",
                  "  Post,\n  Req,\n  type ArgumentsHost,",
              ),
              (
                  "interface IntegrationHttpRequest {\n  readonly originalUrl?: string;\n  readonly url?: string;\n}",
                  "interface IntegrationHttpRequest {\n  readonly method?: string;\n  readonly originalUrl?: string;\n  readonly url?: string;\n}",
              ),
              (
                  "/**\n * Verifies short-lived tenant authority bound to the exact event-preparation",
                  "/** Rejects transport aliases before decoded route parameters can become signed authority. */\nfunction requireExactPluginOperatorHttpPath(\n  request: IntegrationHttpRequest,\n  method: 'GET' | 'POST',\n  expectedPath: string,\n): void {\n  const rawUrl = request.originalUrl ?? request.url;\n  if (request.method !== method || rawUrl !== expectedPath) {\n    return invalidPluginOperatorContext();\n  }\n}\n\n/**\n * Verifies short-lived tenant authority bound to the exact event-preparation",
              ),
              (
                  "  async grantDeliveryOrigin(\n    @Param('installationId') installationId: string,",
                  "  async grantDeliveryOrigin(\n    @Req() request: IntegrationHttpRequest,\n    @Param('installationId') installationId: string,",
              ),
              (
                  "    try {\n      return await operator.grantDeliveryOrigin(\n",
                  "    try {\n      const path = `/v1/plugins/installations/${installationId}/delivery-origins`;\n      requireExactPluginOperatorHttpPath(request, 'POST', path);\n      return await operator.grantDeliveryOrigin(\n",
              ),
              (
                  "  async getDeliveryOrigin(\n    @Param('installationId') installationId: string,",
                  "  async getDeliveryOrigin(\n    @Req() request: IntegrationHttpRequest,\n    @Param('installationId') installationId: string,",
              ),
              (
                  "    try {\n      const record = await operator.getDeliveryOrigin(\n",
                  "    try {\n      const path = `/v1/plugins/installations/${installationId}/delivery-origins/${grantId}`;\n      requireExactPluginOperatorHttpPath(request, 'GET', path);\n      const record = await operator.getDeliveryOrigin(\n",
              ),
              (
                  "  async revokeDeliveryOrigin(\n    @Param('installationId') installationId: string,",
                  "  async revokeDeliveryOrigin(\n    @Req() request: IntegrationHttpRequest,\n    @Param('installationId') installationId: string,",
              ),
              (
                  "    try {\n      return await operator.revokeDeliveryOrigin(\n",
                  "    try {\n      const path = `/v1/plugins/installations/${installationId}/delivery-origins/${grantId}/revoke`;\n      requireExactPluginOperatorHttpPath(request, 'POST', path);\n      return await operator.revokeDeliveryOrigin(\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source target, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Canonicalize repaired TypeScript
        run: >-
          pnpm exec prettier --single-quote --write
          apps/integration-service/src/main.ts
          apps/integration-service/src/plugin-delivery-origin-http.integration.test.ts

      - name: Verify repaired source diff hygiene
        run: git diff --check

      - name: Run focused delivery-origin HTTP GREEN
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-origin-http.integration.test.ts

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test

      - name: Publish repaired source and retire writer
        shell: bash
        env:
          TARGET_BRANCH: feat/plugin-delivery-origin-http-v1
        run: |
          set -euo pipefail
          git add apps/integration-service/src/main.ts apps/integration-service/src/plugin-delivery-origin-http.integration.test.ts
          git rm .github/workflows/verify-plugin-delivery-origin-http.yml
          mapfile -t actual < <(git diff --cached --name-only | sort)
          for changed in "${actual[@]}"; do
            case "${changed}" in
              .github/workflows/verify-plugin-delivery-origin-http.yml|apps/integration-service/src/main.ts|apps/integration-service/src/plugin-delivery-origin-http.integration.test.ts) ;;
              *) echo "Unexpected staged path: ${changed}" >&2; exit 1 ;;
            esac
          done
          printf '%s\n' "${actual[@]}" | grep -Fx '.github/workflows/verify-plugin-delivery-origin-http.yml'
          printf '%s\n' "${actual[@]}" | grep -Fx 'apps/integration-service/src/main.ts'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(integration): bind delivery-origin signatures to raw route"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
