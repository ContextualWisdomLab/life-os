name: Repair Plugin Delivery Attempt Review Formatting

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-lifecycle-v1

permissions:
  contents: write

concurrency:
  group: repair-plugin-delivery-attempt-review-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact contributor head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply bounded canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            apps/integration-service/src/plugin-delivery-attempt-test-database.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-migration.integration.test.ts
          pnpm exec prettier --single-quote --check \
            apps/integration-service/src/plugin-delivery-attempt.ts \
            apps/integration-service/src/plugin-delivery-attempt.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-repository.ts \
            apps/integration-service/src/plugin-delivery-attempt-repository.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-test-database.ts \
            apps/integration-service/src/plugin-delivery-attempt-test-database.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-migration.integration.test.ts
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            apps/integration-service/src/plugin-delivery-attempt-migration.integration.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-test-database.test.ts | sort)"
          if [ "${changed}" != "${expected}" ]; then
            echo "Unexpected formatting delta:" >&2
            printf '%s\n' "${changed}" >&2
            exit 1
          fi

      - name: Publish ordinary formatting descendant and self-retire
        shell: bash
        env:
          BRANCH: feat/plugin-delivery-attempt-lifecycle-v1
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | cut -f1)"
          if [ "${remote_sha}" != "${GITHUB_SHA}" ]; then
            echo "Branch moved from ${GITHUB_SHA} to ${remote_sha}; refusing stale publish." >&2
            exit 1
          fi
          rm .github/workflows/repair-plugin-delivery-attempt-review-format.yml
          git diff --check
          git add \
            apps/integration-service/src/plugin-delivery-attempt-test-database.test.ts \
            apps/integration-service/src/plugin-delivery-attempt-migration.integration.test.ts \
            .github/workflows/repair-plugin-delivery-attempt-review-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(integration): canonicalize delivery review tests'
          git push origin "HEAD:${BRANCH}"
