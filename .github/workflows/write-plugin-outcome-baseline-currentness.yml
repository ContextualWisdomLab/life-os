name: Write plugin outcome baseline currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: write-plugin-outcome-baseline-currentness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Replace only Integration currentness block
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start = '> **Currentness override — 2026-09-08 Integration delivery authority.**'
          end = '> Durable origin/delivery/claim/retry identity is not outbound-network authority.'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('bounded Integration currentness markers are not unique')
          a = text.index(start)
          b = text.index(end, a)
          b = text.index('\n', b) + 1
          replacement = '''> **Currentness override — 2026-09-09 Integration delivery authority.** Protected `main` remains `193a87ef54c3fe6dcda4755bce4d6bc81e3a0297`. Integration #252 remains Draft/unshipped exact `9ed7847d3106d9418e1ff6e04e45c1c7d84d0b0d`; its hostile durable-evidence proof head `ec2353a003c15c9f464b5d5d2454d3593427d768` completed run `34213508199` / job `102019765395` GREEN, and CHANGELOG descendant `fe51a79c1e19cc7fb14e5296f04b3f91b41bf535` completed run `34213937828` / job `102021136219` GREEN before the purpose verifier was retired.\n\n> #253 is the direct #252 claim/lease child and remains Draft/unshipped exact `8252575a510254883cb62c44198cb665daa0d0b5`. Its retained lineage owns deterministic finite 30–3600 second worker claims with token digest-only persistence and atomic due/retry-budget acquisition.\n\n> #254 is the direct #253 retry/backoff child and remains Draft/unshipped exact `edc79d1291025b8787a9ccf16c39a10df4157023`. Exact proof head `ca22c71e4f2ec11de6539df79632376d4134f90a`, run `34237354956`, job `102098403313`, completed GREEN on Ubuntu 24.04/PostgreSQL 16 across frozen install, formatting/diff hygiene, Plugin SDK build, focused retry acceptance, real PostgreSQL retry/exhaustion acceptance, Integration typecheck and the complete Integration suite.\n\n> #255 is the direct #254 append-only outcome-ledger child and remains Draft/unshipped exact `102b4b9360897c69c598d2a34397412ac1c36f51`. After the original missing-ledger RED and the claim-identity/chronology repair, fresh persistence review isolated direct forged INSERT as a stronger durable-evidence gap. The first hosted forgery verifier failed only at formatting, so it was not promoted to product RED; bounded formatter run `34250184593` / job `102142321111` canonicalized only the regression and self-retired. Meaningful regression exact `f113c09dd6f818471051f74440708363bf289103`, run `34250512787`, job `102143453765`, then passed exact checkout, PostgreSQL initialization, frozen install, formatting/diff hygiene and Plugin SDK build before failing at real PostgreSQL outcome acceptance, proving that a syntactically valid direct INSERT could fabricate immutable-looking outcome evidence without consuming a claim. Minimum migration-only repair `885163b16c0904a07bb217725e7ab4e71671aac6` adds a `BEFORE INSERT` source-transition guard that requires trigger-nested emission plus exact post-consumption delivery/attempt/outcome/time/lifecycle evidence. Exact run `34250976172`, job `102145020949`, completed GREEN across original + forgery real-PostgreSQL acceptance, Integration typecheck and the complete Integration suite. Current #255 removes only the now-purpose-complete verifier after that proven head.\n\n> Durable origin/delivery/claim/retry/outcome identity is not outbound-network authority. Fresh `ContextualWisdomLab/EgressWeave` release inventory remains empty, so a later executor remains fail closed rather than consuming mutable sibling source.\n'''
          path.write_text(text[:a] + replacement + text[b:])
          PY
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "docs/product-technical-gap-baseline.md "

      - name: Retire writer and publish ordinary descendant
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "${remote_head}" = "${EXPECTED_HEAD}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/write-plugin-outcome-baseline-currentness.yml
          git commit -m 'docs: record plugin outcome source-transition proof'
          git push origin "HEAD:${BRANCH_NAME}"
