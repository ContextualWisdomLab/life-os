name: Repair Identity OIDC Nonce Formatting

on:
  push:
    branches:
      - test/identity-oidc-nonce-exact-v1
    paths:
      - .github/workflows/repair-identity-oidc-nonce-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-identity-oidc-nonce-formatting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained regression ancestry and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "46cbf0a01b5c499b679d59d946977a537d799519" HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove focused formatting RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec prettier --single-quote --check \
            apps/identity-service/src/tests/oauth-provider-response-nonce-exact.test.ts \
            .github/workflows/verify-identity-oidc-nonce-exact.yml; then
            echo 'Expected retained Identity OIDC nonce evidence files to remain noncanonical before repair.' >&2
            exit 1
          fi

      - name: Apply bounded formatter repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            apps/identity-service/src/tests/oauth-provider-response-nonce-exact.test.ts \
            .github/workflows/verify-identity-oidc-nonce-exact.yml
          git rm .github/workflows/repair-identity-oidc-nonce-formatting.yml

      - name: Verify bounded repair and Identity contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --check \
            apps/identity-service/src/tests/oauth-provider-response-nonce-exact.test.ts \
            .github/workflows/verify-identity-oidc-nonce-exact.yml
          pnpm --filter @life-os/identity-service typecheck
          git diff --check
          source_delta="$(git diff --name-only HEAD -- \
            apps/identity-service/src/tests/oauth-provider-response-nonce-exact.test.ts \
            .github/workflows/verify-identity-oidc-nonce-exact.yml | LC_ALL=C sort)"
          test -n "${source_delta}"
          allowed_sources="$(printf '%s\n' \
            '.github/workflows/verify-identity-oidc-nonce-exact.yml' \
            'apps/identity-service/src/tests/oauth-provider-response-nonce-exact.test.ts' | LC_ALL=C sort)"
          unexpected_sources="$(comm -23 \
            <(printf '%s\n' "${source_delta}") \
            <(printf '%s\n' "${allowed_sources}"))"
          test -z "${unexpected_sources}"
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-identity-oidc-nonce-formatting.yml' \
            ${source_delta} | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/identity-service/src/tests/oauth-provider-response-nonce-exact.test.ts \
            .github/workflows/verify-identity-oidc-nonce-exact.yml
          git commit -m 'style(identity): canonicalize OIDC nonce evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
