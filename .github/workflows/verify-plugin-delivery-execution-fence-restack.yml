name: Verify Plugin Delivery Execution Fence Restack

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-execution-fence-v1

permissions:
  contents: read

concurrency:
  group: life-os-plugin-delivery-execution-fence-restack
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_integration
          POSTGRES_USER: life_os
          POSTGRES_PASSWORD: life_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U life_os -d life_os_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgresql://life_os:life_os_test@127.0.0.1:5432/life_os_integration?sslmode=disable
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Guard current exact publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r remote_head _ < <(git ls-remote --refs origin "refs/heads/$GITHUB_REF_NAME")
          test "$remote_head" = "$GITHUB_SHA"
          test ! -e .github/workflows/repair-plugin-delivery-execution-fence-formatting.yml
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Build Plugin SDK runtime entry
        run: pnpm --filter @life-os/plugin-sdk build
      - name: Check execution-fence formatting
        run: >-
          pnpm exec prettier --check
          apps/integration-service/src/plugin-delivery-attempt-execution-fence-repository.ts
          apps/integration-service/src/plugin-delivery-attempt-execution-fence.integration.test.ts
          apps/integration-service/src/plugin-delivery-attempt-execution-fence.test.ts
          apps/integration-service/src/plugin-delivery-attempt-execution-fence.ts
      - name: Check diff hygiene
        run: git diff --check HEAD^
      - name: Run adopted control acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-outcome.integration.test.ts
          src/plugin-delivery-attempt-outcome-forgery.integration.test.ts
          src/plugin-delivery-attempt-control.test.ts
          src/plugin-delivery-attempt-control.integration.test.ts
          src/plugin-delivery-attempt-control-chronology.integration.test.ts
          --no-file-parallelism
      - name: Run execution-fence acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-execution-fence.test.ts
          src/plugin-delivery-attempt-execution-fence.integration.test.ts
          --no-file-parallelism
      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck
      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test
