name: AI quality format repair

on:
  push:
    branches:
      - chore/ai-service-quality-gates

permissions: {}

jobs:
  repair:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/ai-service-quality-gates
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Prettier formatting
        run: pnpm exec prettier --single-quote --write product/capabilities.json

      - name: Commit formatted source and remove repair workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/ai-quality-format-repair.yml
          git add product/capabilities.json .github/workflows/ai-quality-format-repair.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style: format AI capability evidence'
          git push origin HEAD:chore/ai-service-quality-gates
