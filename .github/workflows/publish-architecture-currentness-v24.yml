name: Publish architecture currentness v24

on:
  push:
    branches:
      - docs/canonical-product-architecture-mainline

permissions:
  contents: write

concurrency:
  group: publish-architecture-currentness-v24
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: 'Replace bounded #260 architecture block'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('ARCHITECTURE.md')
          text = path.read_text(encoding='utf-8')
          start = '<!-- life-os-architecture-currentness:#260:start -->'
          end = '<!-- life-os-architecture-currentness:#260:end -->'
          block = '\n'.join([
              start,
              'Draft PR #260 is the direct #259 performance-acceptance descendant and remains active-PR evidence rather than protected shipped truth. The first production-faithful hosted k6 proof, run `34293875857` / job `102286121337`, completed 1,000/1,000 signed status requests with 3,000/3,000 checks and zero HTTP failures but missed the unchanged buyer-path gate at p95 21.7 ms. The successful path was doing three sequential PostgreSQL invocations: durable replay expiry cleanup, replay insert/conflict, then the scoped status read. The minimum Integration-owned repair collapses replay consumption to one database invocation through `plugin_integration.consume_plugin_operator_context_replay(...)`, preserves exactly one current replay winner, bounds winner-only opportunistic expiry cleanup to 32 other rows with the existing expiry index plus `FOR UPDATE SKIP LOCKED`, and leaves the scoped status read, service-owned persistence, verified TLS, credential-free response and no-cross-service-SQL boundary intact.',
              '',
              'Exact proof head `a24862ee07b6522f37f60f17013b09f546c923f2`, run `34296446935`, job `102294001154`, completed GREEN on Ubuntu 24.04/PostgreSQL 16/k6 2.2.0: Integration typecheck/build and canonical formatting passed; the complete Integration unit suite passed 423 tests with 48 environment-dependent skips across 84 files; focused real-PostgreSQL replay acceptance passed 3/3 under peer-verified TLS; and the actual hosted executable completed all 1,000 measured requests at 10 VUs with no warm-up exclusion, 3,000/3,000 checks, zero HTTP failures and p95 15.27 ms under the unchanged p95 < 20 ms gate. Current #260 exact `a81c8f243eaedb5f7efddc8a6c208083c8c256e3` removes only the purpose-complete verifier after that terminal GREEN.',
              '',
              'This performance repair does not move provider-execution, credential or outbound-network authority into LifeOS. Durable replay/delivery/status identity remains insufficient to authorize DNS/IP/redirect/proxy/connect behavior; provider HTTPS stays fail closed until an immutable released/versioned canonical egress contract can be consumed. The active candidate also lacks an owned coverage-percentage artifact, so 100% Test/Edge Coverage is not claimed.',
              end,
          ])

          if start in text or end in text:
              pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end), re.S)
              if len(pattern.findall(text)) != 1:
                  raise SystemExit('expected exactly one existing #260 architecture block')
              text = pattern.sub(block, text)
          else:
              anchors = list(re.finditer(r'\n## 6\.', text))
              if len(anchors) != 1:
                  raise SystemExit('expected exactly one section 6 anchor')
              pos = anchors[0].start()
              text = text[:pos] + '\n\n' + block + '\n' + text[pos:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify bounded publication and retire writer
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          grep -Fq 'p95 15.27 ms' ARCHITECTURE.md
          grep -Fq 'a24862ee07b6522f37f60f17013b09f546c923f2' ARCHITECTURE.md
          grep -Fq 'a81c8f243eaedb5f7efddc8a6c208083c8c256e3' ARCHITECTURE.md
          git rm .github/workflows/publish-architecture-currentness-v24.yml
          mapfile -t changed < <(git diff --name-only HEAD)
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' \
            '.github/workflows/publish-architecture-currentness-v24.yml' \
            'ARCHITECTURE.md' | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed

      - name: Publish only if writer input is still branch head
        shell: bash
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git fetch origin docs/canonical-product-architecture-mainline
          test "$(git rev-parse origin/docs/canonical-product-architecture-mainline)" = "$INPUT_SHA"
          git config user.name 'LifeOS commercial-development writer'
          git config user.email 'actions@users.noreply.github.com'
          git add ARCHITECTURE.md
          git commit -m 'docs: record #260 performance acceptance in architecture'
          git push origin HEAD:docs/canonical-product-architecture-mainline
