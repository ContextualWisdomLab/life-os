name: Verify Today Canonical Evidence

on:
  push:
    branches:
      - test/web-today-canonical-evidence-v1
    paths:
      - apps/web/app/today-sync-client.ts
      - apps/web/app/today-sync-client-review-regression.test.ts
      - apps/web/app/today-if-match-strong-comparison-regression.test.ts
      - apps/web/app/today-workspace-sync.ts
      - apps/web/app/today-workspace-sync.test.ts
      - apps/planning-service/src/today-http.ts
      - apps/planning-service/src/today-sync.ts
      - apps/planning-service/src/today-if-match-strong-comparison-regression.test.ts
      - docs/operations/durable-today-synchronization.md
      - .github/workflows/verify-today-canonical-evidence.yml
      - .github/workflows/repair-today-canonical-evidence-formatting.yml
      - .github/workflows/repair-today-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-today-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Require exact workflow-free semantic publication
        shell: bash
        run: |
          set -euo pipefail
          semantic_publication="0c7a915fa7e2b9dbb1b849914cf02c61d2fdb274"
          remote_ref="refs/remotes/origin/test/web-today-canonical-evidence-v1"

          test ! -e .github/workflows/repair-today-canonical-evidence-formatting.yml
          test ! -e .github/workflows/repair-today-canonical-evidence.yml
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          git fetch --no-tags origin \
            refs/heads/test/web-today-canonical-evidence-v1:"$remote_ref"
          test "$(git rev-parse "$remote_ref")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$semantic_publication" HEAD

          mapfile -t post_publication_paths < <(
            git diff --name-only "$semantic_publication"...HEAD
          )
          test "${#post_publication_paths[@]}" -eq 1
          test "${post_publication_paths[0]}" = ".github/workflows/verify-today-canonical-evidence.yml"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/app/today-sync-client.ts
          apps/web/app/today-sync-client-review-regression.test.ts
          apps/web/app/today-if-match-strong-comparison-regression.test.ts
          apps/web/app/today-workspace-sync.ts
          apps/web/app/today-workspace-sync.test.ts
          apps/planning-service/src/today-http.ts
          apps/planning-service/src/today-sync.ts
          apps/planning-service/src/today-if-match-strong-comparison-regression.test.ts
          docs/operations/durable-today-synchronization.md
          .github/workflows/verify-today-canonical-evidence.yml

      - name: Reproduce Web canonical-evidence regressions
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/today-sync-client-review-regression.test.ts
          app/today-if-match-strong-comparison-regression.test.ts
          app/today-workspace-sync.test.ts

      - name: Reproduce Planning strong-If-Match regressions
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/today-if-match-strong-comparison-regression.test.ts

      - name: Typecheck Web package
        run: pnpm --filter @life-os/web typecheck

      - name: Typecheck Planning package
        run: pnpm --filter @life-os/planning-service typecheck

      - name: Run complete Web suite
        run: pnpm --filter @life-os/web test

      - name: Run complete Planning suite
        run: pnpm --filter @life-os/planning-service test
