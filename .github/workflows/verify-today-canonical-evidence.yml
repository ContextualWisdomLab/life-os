name: Verify Today Canonical Evidence

on:
  push:
    branches:
      - test/web-today-canonical-evidence-v1
    paths:
      - apps/web/app/today-sync-client.ts
      - apps/web/app/today-sync-client-review-regression.test.ts
      - apps/web/app/today-if-match-strong-comparison-regression.test.ts
      - apps/web/app/today-workspace-sync.ts
      - apps/web/app/today-workspace-sync.test.ts
      - apps/planning-service/src/today-http.ts
      - apps/planning-service/src/today-sync.ts
      - apps/planning-service/src/today-if-match-strong-comparison-regression.test.ts
      - .github/workflows/verify-today-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-today-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/app/today-sync-client.ts
          apps/web/app/today-sync-client-review-regression.test.ts
          apps/web/app/today-if-match-strong-comparison-regression.test.ts
          apps/web/app/today-workspace-sync.ts
          apps/web/app/today-workspace-sync.test.ts
          apps/planning-service/src/today-http.ts
          apps/planning-service/src/today-sync.ts
          apps/planning-service/src/today-if-match-strong-comparison-regression.test.ts

      - name: Reproduce Web canonical-evidence regressions
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/today-sync-client-review-regression.test.ts
          app/today-if-match-strong-comparison-regression.test.ts
          app/today-workspace-sync.test.ts

      - name: Reproduce Planning strong-If-Match regressions
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/today-if-match-strong-comparison-regression.test.ts

      - name: Typecheck Web package
        run: pnpm --filter @life-os/web typecheck

      - name: Typecheck Planning package
        run: pnpm --filter @life-os/planning-service typecheck
