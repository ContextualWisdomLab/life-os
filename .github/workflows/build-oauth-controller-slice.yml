name: Build OAuth controller slice

on:
  push:
    branches:
      - feat/oauth-http-controllers

permissions:
  contents: write

concurrency:
  group: build-oauth-controller-slice
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDENTITY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Generate production controller slice
        run: |
          set -euo pipefail
          cat > apps/identity-service/src/oauth-http-controller.ts <<'EOF'
          import {
            Controller,
            Get,
            Headers,
            Inject,
            Post,
            Res,
          } from '@nestjs/common';
          import type { IdentityProvider } from './identity-domain';
          import { problemDetails } from './oauth-http-boundary';
          import { OAuthHttpApplication } from './oauth-http-application';

          export const OAUTH_HTTP_APPLICATION = Symbol('OAUTH_HTTP_APPLICATION');

          interface MutableHttpResponse {
            status(statusCode: number): MutableHttpResponse;
            setHeader(name: string, value: string): void;
            type(contentType: string): MutableHttpResponse;
            send(body?: unknown): MutableHttpResponse;
          }

          interface ProblemMapping {
            status: number;
            title: string;
            code: string;
          }

          const INVALID_REQUEST_MESSAGES = new Set([
            'Cookie header is invalid',
            'Cookie name is invalid',
            'OAuth provider is not supported',
          ]);

          function errorMessage(error: unknown): string {
            return error instanceof Error ? error.message : '';
          }

          function mapStartError(error: unknown): ProblemMapping {
            if (INVALID_REQUEST_MESSAGES.has(errorMessage(error))) {
              return {
                status: 400,
                title: 'Invalid authorization request',
                code: 'invalid_authorization_request',
              };
            }
            return {
              status: 503,
              title: 'Identity service is unavailable',
              code: 'identity_service_unavailable',
            };
          }

          function mapSessionError(error: unknown): ProblemMapping {
            if (errorMessage(error) === 'Session is invalid or expired') {
              return {
                status: 401,
                title: 'Authentication is required',
                code: 'authentication_required',
              };
            }
            if (INVALID_REQUEST_MESSAGES.has(errorMessage(error))) {
              return {
                status: 400,
                title: 'Invalid session request',
                code: 'invalid_session_request',
              };
            }
            return {
              status: 503,
              title: 'Identity service is unavailable',
              code: 'identity_service_unavailable',
            };
          }

          function sendProblem(
            response: MutableHttpResponse,
            mapping: ProblemMapping,
          ): void {
            response.status(mapping.status);
            response.type('application/problem+json');
            response.send(
              problemDetails(mapping.status, mapping.title, mapping.code),
            );
          }

          @Controller()
          export class OAuthHttpController {
            constructor(
              @Inject(OAUTH_HTTP_APPLICATION)
              private readonly application: OAuthHttpApplication,
            ) {}

            @Get('v1/auth/google/start')
            async startGoogle(
              @Headers('cookie') cookieHeader: string | undefined,
              @Res() response: MutableHttpResponse,
            ): Promise<void> {
              await this.startAuthorization('google', cookieHeader, response);
            }

            @Get('v1/auth/github/start')
            async startGitHub(
              @Headers('cookie') cookieHeader: string | undefined,
              @Res() response: MutableHttpResponse,
            ): Promise<void> {
              await this.startAuthorization('github', cookieHeader, response);
            }

            @Get('v1/session')
            async session(
              @Headers('cookie') cookieHeader: string | undefined,
              @Res() response: MutableHttpResponse,
            ): Promise<void> {
              response.setHeader('Cache-Control', 'no-store');
              try {
                const result = await this.application.introspectSession(cookieHeader);
                response.status(result.statusCode);
                response.type('application/json');
                response.send(result.body);
              } catch (error) {
                sendProblem(response, mapSessionError(error));
              }
            }

            @Post('v1/auth/logout')
            async logout(
              @Headers('cookie') cookieHeader: string | undefined,
              @Res() response: MutableHttpResponse,
            ): Promise<void> {
              response.setHeader('Cache-Control', 'no-store');
              try {
                const result = await this.application.logout(cookieHeader);
                response.setHeader('Set-Cookie', result.setCookie);
                response.status(result.statusCode);
                response.send();
              } catch (error) {
                sendProblem(response, mapSessionError(error));
              }
            }

            private async startAuthorization(
              provider: IdentityProvider,
              cookieHeader: string | undefined,
              response: MutableHttpResponse,
            ): Promise<void> {
              response.setHeader('Cache-Control', 'no-store');
              try {
                const result = await this.application.beginAuthorization(
                  provider,
                  cookieHeader,
                );
                if (result.setCookie) {
                  response.setHeader('Set-Cookie', result.setCookie);
                }
                response.setHeader('Location', result.location);
                response.status(result.statusCode);
                response.send();
              } catch (error) {
                sendProblem(response, mapStartError(error));
              }
            }
          }
          EOF

          cat > apps/identity-service/src/identity-runtime.ts <<'EOF'
          import type { OnApplicationShutdown } from '@nestjs/common';
          import { Pool, type PoolConfig } from 'pg';
          import {
            OAuthTransactionService,
            SessionService,
          } from './auth-security';
          import { OAuthHttpApplication } from './oauth-http-application';
          import {
            PostgresOAuthTransactionRepository,
            PostgresSessionRepository,
            type SqlClient,
            type SqlQueryResult,
          } from './postgres-security-repositories';
          import { AesGcmSecretBox } from './secret-box';

          const MAXIMUM_CONFIGURATION_LENGTH = 8 * 1024;
          const MAXIMUM_KEY_VERSIONS = 8;
          const KEY_VERSION_PATTERN = /^[A-Za-z][A-Za-z0-9._-]{0,31}$/;
          const ENCODED_KEY_PATTERN = /^[A-Za-z0-9+/_-]+={0,2}$/;

          type RuntimeEnvironment = Readonly<
            Record<string, string | undefined>
          >;

          class NodePostgresSqlClient implements SqlClient {
            constructor(private readonly pool: Pool) {}

            async query<Row>(
              text: string,
              values: readonly unknown[] = [],
            ): Promise<SqlQueryResult<Row>> {
              const result = await this.pool.query(text, [...values]);
              return {
                rows: result.rows as Row[],
                rowCount: result.rowCount,
              };
            }
          }

          function requireConfiguration(
            environment: RuntimeEnvironment,
            name: string,
          ): string {
            const value = environment[name]?.trim();
            if (!value || value.length > MAXIMUM_CONFIGURATION_LENGTH) {
              throw new Error(`Required identity configuration is missing: ${name}`);
            }
            return value;
          }

          function requireDatabaseUrl(value: string): string {
            const parsed = new URL(value);
            if (
              parsed.protocol !== 'postgres:' &&
              parsed.protocol !== 'postgresql:'
            ) {
              throw new Error('Identity database URL must use PostgreSQL');
            }
            return value;
          }

          function requireBoundedInteger(
            value: string | undefined,
            defaultValue: number,
            minimum: number,
            maximum: number,
            message: string,
          ): number {
            if (value === undefined || value.trim() === '') {
              return defaultValue;
            }
            const parsed = Number(value);
            if (
              !Number.isSafeInteger(parsed) ||
              parsed < minimum ||
              parsed > maximum
            ) {
              throw new Error(message);
            }
            return parsed;
          }

          function decodeSecretKey(encoded: unknown): Buffer {
            if (
              typeof encoded !== 'string' ||
              !ENCODED_KEY_PATTERN.test(encoded) ||
              encoded.length > 128
            ) {
              throw new Error('OAuth encryption keys are invalid');
            }
            const key = Buffer.from(encoded, 'base64');
            if (key.length !== 32) {
              throw new Error('OAuth encryption keys must decode to 32 bytes');
            }
            return key;
          }

          function parseSecretKeys(value: string): Readonly<Record<string, Buffer>> {
            let parsed: unknown;
            try {
              parsed = JSON.parse(value);
            } catch {
              throw new Error('OAuth encryption key configuration is invalid');
            }
            if (
              !parsed ||
              typeof parsed !== 'object' ||
              Array.isArray(parsed)
            ) {
              throw new Error('OAuth encryption key configuration is invalid');
            }
            const entries = Object.entries(parsed);
            if (
              entries.length === 0 ||
              entries.length > MAXIMUM_KEY_VERSIONS
            ) {
              throw new Error('OAuth encryption key configuration is invalid');
            }
            return Object.freeze(
              Object.fromEntries(
                entries.map(([version, encoded]) => {
                  if (!KEY_VERSION_PATTERN.test(version)) {
                    throw new Error('OAuth encryption key version is invalid');
                  }
                  return [version, decodeSecretKey(encoded)];
                }),
              ),
            );
          }

          function createPoolConfiguration(
            environment: RuntimeEnvironment,
          ): PoolConfig {
            return {
              connectionString: requireDatabaseUrl(
                requireConfiguration(environment, 'IDENTITY_DATABASE_URL'),
              ),
              application_name: 'life-os-identity-service',
              max: requireBoundedInteger(
                environment.IDENTITY_DATABASE_POOL_MAX,
                10,
                1,
                32,
                'Identity database pool size is invalid',
              ),
              connectionTimeoutMillis: requireBoundedInteger(
                environment.IDENTITY_DATABASE_CONNECT_TIMEOUT_MS,
                5_000,
                100,
                30_000,
                'Identity database connection timeout is invalid',
              ),
              idleTimeoutMillis: requireBoundedInteger(
                environment.IDENTITY_DATABASE_IDLE_TIMEOUT_MS,
                30_000,
                1_000,
                300_000,
                'Identity database idle timeout is invalid',
              ),
            };
          }

          export class IdentityRuntime implements OnApplicationShutdown {
            private closed = false;

            constructor(
              private readonly pool: Pool,
              readonly application: OAuthHttpApplication,
            ) {}

            async close(): Promise<void> {
              if (this.closed) {
                return;
              }
              this.closed = true;
              await this.pool.end();
            }

            async onApplicationShutdown(): Promise<void> {
              await this.close();
            }
          }

          export function createIdentityRuntime(
            environment: RuntimeEnvironment = process.env,
          ): IdentityRuntime {
            const currentKeyVersion = requireConfiguration(
              environment,
              'IDENTITY_OAUTH_KEY_VERSION',
            );
            if (!KEY_VERSION_PATTERN.test(currentKeyVersion)) {
              throw new Error('OAuth encryption key version is invalid');
            }
            const keys = parseSecretKeys(
              requireConfiguration(environment, 'IDENTITY_OAUTH_KEYS'),
            );
            const secretBox = new AesGcmSecretBox({
              currentKeyVersion,
              keys,
            });
            const pool = new Pool(createPoolConfiguration(environment));
            const sqlClient = new NodePostgresSqlClient(pool);
            const transactions = new OAuthTransactionService(
              new PostgresOAuthTransactionRepository(sqlClient, secretBox),
            );
            const sessions = new SessionService(
              new PostgresSessionRepository(sqlClient),
            );
            const application = new OAuthHttpApplication(
              transactions,
              sessions,
              {
                providers: {
                  google: {
                    clientId: requireConfiguration(
                      environment,
                      'IDENTITY_GOOGLE_CLIENT_ID',
                    ),
                    redirectUri: requireConfiguration(
                      environment,
                      'IDENTITY_GOOGLE_REDIRECT_URI',
                    ),
                  },
                  github: {
                    clientId: requireConfiguration(
                      environment,
                      'IDENTITY_GITHUB_CLIENT_ID',
                    ),
                    redirectUri: requireConfiguration(
                      environment,
                      'IDENTITY_GITHUB_REDIRECT_URI',
                    ),
                  },
                },
                webOrigin: requireConfiguration(
                  environment,
                  'LIFE_OS_WEB_ORIGIN',
                ),
              },
            );
            return new IdentityRuntime(pool, application);
          }
          EOF

          cat > apps/identity-service/src/oauth-http-controller.test.ts <<'EOF'
          import 'reflect-metadata';
          import { PATH_METADATA } from '@nestjs/common/constants';
          import { describe, expect, it, vi } from 'vitest';
          import { OAuthHttpApplication } from './oauth-http-application';
          import { OAuthHttpController } from './oauth-http-controller';

          class TestResponse {
            statusCode = 0;
            contentType = '';
            readonly headers = new Map<string, string>();
            body: unknown;

            status(statusCode: number): TestResponse {
              this.statusCode = statusCode;
              return this;
            }

            setHeader(name: string, value: string): void {
              this.headers.set(name.toLowerCase(), value);
            }

            type(contentType: string): TestResponse {
              this.contentType = contentType;
              return this;
            }

            send(body?: unknown): TestResponse {
              this.body = body;
              return this;
            }
          }

          function application(
            overrides: Partial<OAuthHttpApplication>,
          ): OAuthHttpApplication {
            return overrides as OAuthHttpApplication;
          }

          describe('OAuthHttpController', () => {
            it('publishes the fixed authorization, session, and logout routes', () => {
              expect(
                Reflect.getMetadata(
                  PATH_METADATA,
                  OAuthHttpController.prototype.startGoogle,
                ),
              ).toBe('v1/auth/google/start');
              expect(
                Reflect.getMetadata(
                  PATH_METADATA,
                  OAuthHttpController.prototype.startGitHub,
                ),
              ).toBe('v1/auth/github/start');
              expect(
                Reflect.getMetadata(
                  PATH_METADATA,
                  OAuthHttpController.prototype.session,
                ),
              ).toBe('v1/session');
              expect(
                Reflect.getMetadata(
                  PATH_METADATA,
                  OAuthHttpController.prototype.logout,
                ),
              ).toBe('v1/auth/logout');
            });

            it('starts Google authorization with a no-store redirect and secure cookie', async () => {
              const beginAuthorization = vi.fn().mockResolvedValue({
                statusCode: 303,
                location: 'https://accounts.google.com/o/oauth2/v2/auth?state=opaque',
                setCookie: 'life_os_oauth_browser=opaque; Secure; HttpOnly',
              });
              const controller = new OAuthHttpController(
                application({ beginAuthorization }),
              );
              const response = new TestResponse();

              await controller.startGoogle(undefined, response);

              expect(beginAuthorization).toHaveBeenCalledWith('google', undefined);
              expect(response.statusCode).toBe(303);
              expect(response.headers.get('cache-control')).toBe('no-store');
              expect(response.headers.get('location')).toContain(
                'https://accounts.google.com/',
              );
              expect(response.headers.get('set-cookie')).toContain('Secure');
              expect(response.body).toBeUndefined();
            });

            it('returns token-free session JSON and an idempotent logout response', async () => {
              const introspectSession = vi.fn().mockResolvedValue({
                statusCode: 200,
                body: {
                  sessionId: 'a4e1055f-3ff1-4501-8d4e-ab98915de4bf',
                  userId: '4c2e89dd-c566-49d3-a1bf-5778db353e73',
                  workspaceId: '1a97f0d7-58af-4593-85da-130d9179ae83',
                  createdAt: '2026-08-03T10:00:00.000Z',
                  expiresAt: '2026-09-02T10:00:00.000Z',
                },
              });
              const logout = vi.fn().mockResolvedValue({
                statusCode: 204,
                setCookie:
                  'life_os_session=deleted; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax',
              });
              const controller = new OAuthHttpController(
                application({ introspectSession, logout }),
              );
              const sessionResponse = new TestResponse();
              const logoutResponse = new TestResponse();

              await controller.session('life_os_session=opaque', sessionResponse);
              await controller.logout('life_os_session=opaque', logoutResponse);

              expect(sessionResponse.statusCode).toBe(200);
              expect(sessionResponse.contentType).toBe('application/json');
              expect(JSON.stringify(sessionResponse.body)).not.toContain('opaque');
              expect(logoutResponse.statusCode).toBe(204);
              expect(logoutResponse.headers.get('set-cookie')).toContain('Max-Age=0');
            });

            it('maps credential-bearing internal errors to stable problem bodies', async () => {
              const beginAuthorization = vi
                .fn()
                .mockRejectedValue(new Error('database password=secret-token'));
              const introspectSession = vi
                .fn()
                .mockRejectedValue(new Error('Session is invalid or expired'));
              const controller = new OAuthHttpController(
                application({ beginAuthorization, introspectSession }),
              );
              const startResponse = new TestResponse();
              const sessionResponse = new TestResponse();

              await controller.startGitHub(undefined, startResponse);
              await controller.session(undefined, sessionResponse);

              expect(startResponse.statusCode).toBe(503);
              expect(startResponse.contentType).toBe('application/problem+json');
              expect(JSON.stringify(startResponse.body)).not.toContain('secret-token');
              expect(sessionResponse.statusCode).toBe(401);
              expect(sessionResponse.body).toEqual({
                type: 'about:blank',
                title: 'Authentication is required',
                status: 401,
                code: 'authentication_required',
              });
            });
          });
          EOF

          cat > apps/identity-service/src/identity-runtime.test.ts <<'EOF'
          import { describe, expect, it } from 'vitest';
          import { createIdentityRuntime } from './identity-runtime';

          const KEY = Buffer.alloc(32, 7).toString('base64');

          function environment(
            overrides: Record<string, string | undefined> = {},
          ): Record<string, string | undefined> {
            return {
              IDENTITY_DATABASE_URL:
                'postgresql://identity:password@127.0.0.1:5432/life_os',
              IDENTITY_OAUTH_KEY_VERSION: 'version_one',
              IDENTITY_OAUTH_KEYS: JSON.stringify({ version_one: KEY }),
              IDENTITY_GOOGLE_CLIENT_ID: 'google-client',
              IDENTITY_GOOGLE_REDIRECT_URI:
                'https://identity.example.test/v1/auth/google/callback',
              IDENTITY_GITHUB_CLIENT_ID: 'github-client',
              IDENTITY_GITHUB_REDIRECT_URI:
                'https://identity.example.test/v1/auth/github/callback',
              LIFE_OS_WEB_ORIGIN: 'https://app.example.test',
              ...overrides,
            };
          }

          describe('createIdentityRuntime', () => {
            it('builds PostgreSQL-backed OAuth services from bounded secure configuration', async () => {
              const runtime = createIdentityRuntime(environment());
              expect(runtime.application.postLoginRedirect()).toBe(
                'https://app.example.test/auth/complete',
              );
              await runtime.close();
              await runtime.close();
            });

            it.each([
              ['IDENTITY_DATABASE_URL', undefined],
              ['IDENTITY_OAUTH_KEY_VERSION', undefined],
              ['IDENTITY_OAUTH_KEYS', undefined],
              ['IDENTITY_GOOGLE_CLIENT_ID', undefined],
              ['IDENTITY_GOOGLE_REDIRECT_URI', undefined],
              ['IDENTITY_GITHUB_CLIENT_ID', undefined],
              ['IDENTITY_GITHUB_REDIRECT_URI', undefined],
              ['LIFE_OS_WEB_ORIGIN', undefined],
            ])('fails startup when %s is missing', (name, value) => {
              expect(() =>
                createIdentityRuntime(environment({ [name]: value })),
              ).toThrow('Required identity configuration is missing');
            });

            it('rejects weak, malformed, unknown-version, and oversized configuration', () => {
              expect(() =>
                createIdentityRuntime(
                  environment({
                    IDENTITY_DATABASE_URL: 'https://database.example.test',
                  }),
                ),
              ).toThrow('must use PostgreSQL');
              expect(() =>
                createIdentityRuntime(
                  environment({ IDENTITY_OAUTH_KEYS: '{not-json' }),
                ),
              ).toThrow('key configuration is invalid');
              expect(() =>
                createIdentityRuntime(
                  environment({
                    IDENTITY_OAUTH_KEYS: JSON.stringify({
                      version_one: Buffer.alloc(16).toString('base64'),
                    }),
                  }),
                ),
              ).toThrow('must decode to 32 bytes');
              expect(() =>
                createIdentityRuntime(
                  environment({ IDENTITY_OAUTH_KEY_VERSION: 'version_two' }),
                ),
              ).toThrow('Current encryption key version is not configured');
              expect(() =>
                createIdentityRuntime(
                  environment({ IDENTITY_DATABASE_POOL_MAX: '33' }),
                ),
              ).toThrow('pool size is invalid');
            });
          });
          EOF

          cat > apps/identity-service/src/main.ts <<'EOF'
          import 'reflect-metadata';
          import { Controller, Get, Module } from '@nestjs/common';
          import { NestFactory } from '@nestjs/core';
          import {
            createIdentityRuntime,
            IdentityRuntime,
          } from './identity-runtime';
          import {
            OAUTH_HTTP_APPLICATION,
            OAuthHttpController,
          } from './oauth-http-controller';

          const IDENTITY_RUNTIME = Symbol('IDENTITY_RUNTIME');

          @Controller()
          class HealthController {
            @Get('health')
            health(): { status: 'ok'; service: 'identity-service' } {
              return { status: 'ok', service: 'identity-service' };
            }
          }

          @Module({
            controllers: [HealthController, OAuthHttpController],
            providers: [
              {
                provide: IDENTITY_RUNTIME,
                useFactory: (): IdentityRuntime =>
                  createIdentityRuntime(process.env),
              },
              {
                provide: OAUTH_HTTP_APPLICATION,
                inject: [IDENTITY_RUNTIME],
                useFactory: (runtime: IdentityRuntime) => runtime.application,
              },
            ],
          })
          class AppModule {}

          async function bootstrap(): Promise<void> {
            const app = await NestFactory.create(AppModule);
            app.enableShutdownHooks();
            await app.listen(
              Number(process.env.IDENTITY_SERVICE_PORT ?? 4101),
              '0.0.0.0',
            );
          }

          void bootstrap();
          EOF

          cat > docs/superpowers/plans/2026-08-03-oauth-controller-wiring-slice.md <<'EOF'
          # OAuth Controller and Runtime Wiring Slice

          ## Goal

          Expose the already-reviewed OAuth browser boundary through production NestJS routes and compose it with PostgreSQL-backed transaction and session repositories using fail-closed runtime configuration.

          ## Included

          - fixed Google and GitHub authorization-start endpoints
          - token-free session introspection and idempotent logout endpoints
          - explicit no-store responses, secure cookie forwarding, and RFC 9457-compatible generic error mapping
          - startup composition for PostgreSQL repositories, AES-256-GCM OAuth secret protection, provider client configuration, and fixed web origin
          - bounded database pool and timeout configuration
          - deterministic pool shutdown through NestJS lifecycle hooks
          - route, response, error-redaction, configuration, and lifecycle tests

          ## Security boundary

          The controller never accepts a caller-selected redirect target, never serializes exception details, and never returns OAuth or application bearer material. Production startup fails when database, encryption-key, provider, redirect, or secure web-origin configuration is absent or invalid.

          ## Follow-up

          The next reviewable slice should add provider callback controllers and orchestration over a bounded fixed-endpoint HTTP transport, beginning with Google token exchange and JWKS signature verification before account provisioning and session issuance.
          EOF

          python3 - <<'PY'
          import json
          from pathlib import Path

          identity_package_path = Path('apps/identity-service/package.json')
          identity_package = json.loads(identity_package_path.read_text(encoding='utf-8'))
          pg_version = identity_package['devDependencies'].pop('pg')
          identity_package['dependencies']['pg'] = pg_version
          identity_package['dependencies'] = dict(
              sorted(identity_package['dependencies'].items())
          )
          identity_package_path.write_text(
              json.dumps(identity_package, indent=2) + '\n', encoding='utf-8'
          )

          root_package_path = Path('package.json')
          root_package = json.loads(root_package_path.read_text(encoding='utf-8'))
          additions = [
              'apps/identity-service/package.json',
              'apps/identity-service/src/main.ts',
              'apps/identity-service/src/oauth-http-controller.ts',
              'apps/identity-service/src/oauth-http-controller.test.ts',
              'apps/identity-service/src/identity-runtime.ts',
              'apps/identity-service/src/identity-runtime.test.ts',
