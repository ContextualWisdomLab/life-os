name: Verify Review BFF Canonical Evidence

on:
  push:
    branches:
      - feat/web-review-bff-v1
    paths:
      - apps/web/app/review-client.ts
      - apps/web/app/review-client.test.ts
      - apps/web/app/review-client-canonical-evidence.test.ts
      - apps/web/app/api/reviews/routes.test.ts
      - .github/workflows/verify-review-bff-canonical-evidence.yml

permissions:
  contents: read

concurrency:
  group: verify-review-bff-canonical-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact semantic publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          git merge-base --is-ancestor 5d6f22b33c58e73d4481cd8380e824db9fbf77f1 "$GITHUB_SHA"
          test ! -e .github/workflows/repair-review-optional-reflection-exactness.yml
          test ! -e .github/workflows/repair-review-bff-canonical-evidence-formatting.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/app/review-client.ts
          apps/web/app/review-client.test.ts
          apps/web/app/review-client-canonical-evidence.test.ts
          apps/web/app/api/reviews/routes.test.ts
          .github/workflows/verify-review-bff-canonical-evidence.yml

      - name: Reproduce Review evidence boundary
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/review-client.test.ts
          app/review-client-canonical-evidence.test.ts
          app/api/reviews/routes.test.ts

      - name: Typecheck Web package
        run: pnpm --filter @life-os/web typecheck

      - name: Run complete Web suite
        run: pnpm --filter @life-os/web test

      - name: Check exact diff hygiene
        run: git diff --check HEAD^
