name: Update plugin delivery attempt status changelog

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-status-v1

permissions:
  contents: write

concurrency:
  group: update-plugin-delivery-attempt-status-changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Update bounded changelog entry and retire writer
        shell: bash
        run: |
          set -euo pipefail
          target='CHANGELOG.md'
          workflow='.github/workflows/update-plugin-delivery-attempt-status-changelog.yml'
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '### Added\n\n'
          entry = '- Added an exact tenant/user-scoped, restart-recoverable plugin delivery status authority over Integration-owned persistence; operator evidence is credential-free, does not materialize claim-token digests, and grants no outbound execution authority.\n'
          if entry in text:
              raise SystemExit('status changelog entry already present')
          if text.count(marker) != 1:
              raise SystemExit('expected one Unreleased Added marker')
          path.write_text(text.replace(marker, marker + entry, 1))
          PY
          changed="$(git diff --name-only)"
          if [[ "$changed" != "$target" ]]; then
            echo "Unexpected changelog delta: $changed" >&2
            exit 1
          fi
          git diff --check
          git rm "$workflow"
          git add "$target"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(changelog): record durable delivery status authority'
          git fetch origin refs/heads/feat/plugin-delivery-attempt-status-v1
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_head" != "${GITHUB_SHA}" ]]; then
            echo "Branch advanced from ${GITHUB_SHA} to ${remote_head}; refusing stale publication" >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/feat/plugin-delivery-attempt-status-v1
