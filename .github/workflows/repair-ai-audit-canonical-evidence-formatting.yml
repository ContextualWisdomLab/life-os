name: Repair AI Audit Canonical Evidence Formatting

on:
  push:
    branches:
      - test/ai-audit-canonical-durable-evidence-v1
    paths:
      - .github/workflows/repair-ai-audit-canonical-evidence-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-ai-audit-canonical-evidence-formatting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Guard exact single-writer candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r remote_head _ < <(git ls-remote --refs origin "refs/heads/$GITHUB_REF_NAME")
          test "$remote_head" = "$GITHUB_SHA"
          test -f .github/workflows/repair-ai-audit-canonical-evidence-formatting.yml
          test -f .github/workflows/verify-ai-audit-canonical-evidence.yml

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Repair proven regression formatting
        run: >-
          pnpm exec prettier --single-quote --write
          apps/ai-service/src/proposal-audit-canonical-evidence.test.ts
          apps/ai-service/src/postgres-proposal-audit-canonical-evidence.test.ts

      - name: Check focused formatting and AI typecheck
        run: |
          pnpm exec prettier --single-quote --check \
            apps/ai-service/src/proposal-audit-canonical-evidence.test.ts \
            apps/ai-service/src/postgres-proposal-audit-canonical-evidence.test.ts \
            apps/ai-service/src/proposal-audit-domain.ts \
            apps/ai-service/src/postgres-proposal-audit-repository.ts
          pnpm --filter @life-os/ai-service typecheck

      - name: Guard bounded formatter delta and retire writer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-ai-audit-canonical-evidence-formatting.yml
          git add \
            apps/ai-service/src/proposal-audit-canonical-evidence.test.ts \
            apps/ai-service/src/postgres-proposal-audit-canonical-evidence.test.ts
          allowed="$(printf '%s\n' \
            .github/workflows/repair-ai-audit-canonical-evidence-formatting.yml \
            apps/ai-service/src/postgres-proposal-audit-canonical-evidence.test.ts \
            apps/ai-service/src/proposal-audit-canonical-evidence.test.ts | sort)"
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | sort)"
          test "$changed" = "$allowed"
          git diff --check --cached

      - name: Publish ordinary non-force formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(ai): format audit evidence regressions"
          read -r remote_head _ < <(git ls-remote --refs origin "refs/heads/$GITHUB_REF_NAME")
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
