name: Temporary PostgreSQL auth-env contract verifier

on:
  push:
    branches:
      - fix/postgres-ci-init-contract-v1

permissions:
  contents: read

concurrency:
  group: tmp-postgres-auth-env-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused PostgreSQL service contract
        run: >-
          pnpm --filter @life-os/commercial-development-agent exec vitest run
          src/postgres-ci-service-contract.test.mjs --no-file-parallelism
