name: Repair PR249 Commercial Readiness docstrings

on:
  push:
    branches:
      - fix/qs-6-16-0-v1
    paths:
      - .github/workflows/repair-pr249-docstrings.yml

permissions:
  contents: write

concurrency:
  group: repair-pr249-commercial-readiness-docstrings
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Add substantive production JSDoc
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { basename, resolve } from 'node:path';
          import * as ts from 'typescript';

          const directory = resolve('packages/commercial-readiness/src');
          const descriptions = new Map(Object.entries({
            'audit.mjs:ensureInsideRoot': 'Rejects lexical evidence paths that escape the repository root before any filesystem access occurs.',
            'audit.mjs:ensureResolvedInsideRoot': 'Rechecks real paths after metadata validation so symlink or mount indirection cannot move evidence outside the audited repository.',
            'audit.mjs:evaluateEvidence': 'Evaluates one bounded evidence probe while collapsing filesystem failures into credential-free readiness states.',
            'audit.mjs:observedMaturity': 'Advances observed maturity only when every evidence item required through that level is satisfied.',
            'audit.mjs:transitiveDependents': 'Measures downstream capability coupling without mutating the manifest so dependency blast radius can affect prioritization.',
            'audit.mjs:gapPriority': 'Orders capability gaps deterministically from configured impact, risk, dependency blast radius, maturity distance, and effort.',
            'audit.mjs:missingEvidenceForTarget': 'Returns the unique unsatisfied evidence paths required to reach a capability target without treating prose claims as proof.',
            'buyer-gap-cli.mjs:invalidCommand': 'Uses one stable credential-free failure for malformed CLI input instead of reflecting attacker-controlled arguments.',
            'buyer-gap-cli.mjs:readJson': 'Reads only bounded regular JSON files so symlinks and oversized evidence cannot enter the buyer-gap audit boundary.',
            'buyer-gap-cli.mjs:writeAtomic': 'Publishes generated evidence through a mode-0600 temporary file and rename so readers never observe a partial report.',
            'buyer-gap-cli.mjs:main': 'Binds the fixed CLI surface to one audit execution and emits only aggregate readiness counts.',
            'buyer-gaps.mjs:isPlainObject': 'Restricts policy objects to ordinary record shapes before exact-key validation, excluding arrays and custom prototypes.',
            'buyer-gaps.mjs:exactKeys': 'Rejects unexpected policy fields so remote or stale data cannot silently extend the trusted schema.',
            'buyer-gaps.mjs:failRegistry': 'Centralizes stable registry validation errors without echoing untrusted policy values.',
            'buyer-gaps.mjs:failSnapshot': 'Centralizes stable live-snapshot validation errors without leaking raw GitHub response detail.',
            'buyer-gaps.mjs:normalizeGapId': 'Normalizes only bounded canonical gap identifiers before they can own issue-state evidence.',
            'buyer-gaps.mjs:normalizeIssueNumber': 'Accepts only positive safe-integer issue identities before linking live GitHub state to policy.',
            'buyer-gaps.mjs:manifestCapabilityIds': 'Builds the allowed capability identity set from a structurally valid manifest before registry links are accepted.',
            'buyer-gaps.mjs:normalizeLabel': 'Normalizes bounded issue labels and rejects control characters before labels influence resolution policy.',
            'buyer-gaps.mjs:normalizeIssueEvidence': 'Projects one issue into the exact bounded state shape used by canonical buyer-gap reconciliation.',
            'buyer-gaps.mjs:projectedLabels': 'Keeps only bounded well-formed live labels so malformed remote label data cannot create resolution authority.',
            'buyer-gaps.mjs:resolutionFor': 'Recognizes only explicit completed, not-planned, or duplicate evidence as a canonical gap resolution.',
            'buyer-gaps.mjs:gapEvidence': 'Builds the credential-free canonical gap projection shared by unresolved, resolved, and unknown collections.',
            'cli.mjs:invalidCommand': 'Uses one stable credential-free error for commands outside the fixed Commercial Readiness CLI surface.',
            'cli.mjs:parseArguments': 'Parses only command-specific flags and bounded values so CLI input cannot smuggle an undeclared execution mode.',
            'cli.mjs:requireOptions': 'Fails closed when an execution path is missing a required bounded option rather than relying on downstream defaults.',
            'cli.mjs:readJsonFile': 'Reads only bounded regular JSON files so symlinks and oversized local evidence cannot enter readiness evaluation.',
            'cli.mjs:readTextFile': 'Reads only bounded regular text files before generated report content is published to GitHub.',
            'cli.mjs:writeAtomic': 'Publishes local evidence through a mode-0600 temporary file and rename so interrupted writes cannot create partial authority.',
            'cli.mjs:writeJson': 'Serializes evidence deterministically with a terminal newline through the atomic writer.',
            'cli.mjs:githubClientFromEnvironment': 'Acquires GitHub authority only from the runtime token boundary rather than from user-controlled CLI arguments.',
            'cli.mjs:loadPolicy': 'Validates repository policy before any command can use it to interpret checks, evidence, or merge authority.',
            'cli.mjs:commandSnapshot': 'Collects and validates one read-only repository snapshot bound to the caller-supplied exact commit.',
            'cli.mjs:commandAudit': 'Evaluates capability evidence only after manifest, snapshot, and policy inputs have crossed their validation boundaries.',
            'cli.mjs:commandPublish': 'Publishes only a bounded generated readiness body through the canonical issue synchronization path.',
            'cli.mjs:assertMergeExecutionContext': 'Restricts merge-capable execution to scheduled or explicit manual runs on the protected default branch.',
            'cli.mjs:commandDrain': 'Re-collects pull-request evidence around each merge decision so an exact head cannot gain authority from stale eligibility.',
            'cli.mjs:main': 'Dispatches only the declared Commercial Readiness commands and leaves every unknown command fail closed.',
            'github-client.mjs:assertRepository': 'Restricts repository identifiers to owner/name syntax before they are interpolated into GitHub API paths.',
            'github-client.mjs:readBoundedText': 'Streams GitHub responses through a hard byte ceiling and cancels overflow before untrusted payloads are fully buffered.',
            'github-client.mjs:GitHubApiClient': 'Owns the bounded GitHub transport: fixed HTTPS origin, explicit timeout, response-size ceiling, and credential-bearing headers.',
            'github-client.mjs:GitHubApiClient.constructor': 'Validates credential, transport, timeout, and byte-limit configuration before any network authority is retained.',
            'github-client.mjs:requestJson': 'Allows only relative GitHub API paths, disables redirects, bounds response bytes and time, and rejects non-JSON evidence fail closed.',
            'github-client.mjs:findReadinessIssues': 'Selects only open non-PR issues carrying the exact readiness marker so unrelated issue text cannot become canonical state.',
            'github-client.mjs:syncReadinessIssue': 'Maintains one marker-owned readiness issue and retires only duplicate automation issues after the canonical update succeeds.',
            'github-client.mjs:normalizeReview': 'Projects remote reviews to the minimal actor, state, and timestamp evidence used by merge policy.',
            'github-client.mjs:collectPaginatedArray': 'Collects bounded REST array pages completely and fails when shape or page count exceeds the evidence contract.',
            'github-client.mjs:collectWorkflowRuns': 'Collects bounded pull-request workflow history while honoring GitHub total-count evidence instead of assuming one page is complete.',
            'github-client.mjs:unresolvedThreadCount': 'Counts unresolved review threads through bounded GraphQL pagination so omitted pages cannot manufacture merge eligibility.',
            'github-client.mjs:runIsNewer': 'Chooses workflow evidence deterministically by run identity, attempt, and update time when duplicate names exist.',
            'github-client.mjs:latestWorkflowRuns': 'Reduces workflow history to one newest record per workflow without promoting a stale head to current evidence.',
            'github-client.mjs:statusIsNewer': 'Orders duplicate commit-status evidence by immutable status identity and creation time.',
            'github-client.mjs:latestStatuses': 'Keeps only newest statuses bound to the exact pull-request head before merge policy is evaluated.',
            'github-client.mjs:collectOnePullRequest': 'Builds merge evidence from fresh PR detail, reviews, workflows, statuses, threads, and a file-free base/head comparison.',
            'github-client.mjs:collectRepositorySnapshot': 'Collects a read-only exact-commit view of open pull requests and issues using bounded GitHub evidence paths.',
            'github-client.mjs:mergeEligiblePullRequests': 'Re-collects candidate state and exact head immediately before each merge so earlier eligibility cannot survive branch movement.',
            'github-client.mjs:mergePullRequestThroughApi': 'Submits only an exact-head squash merge, binding GitHub execution to the SHA already admitted by policy.',
            'pr-gate.mjs:latestReviewsByActor': 'Retains only each actor\'s latest decisive review so stale approvals cannot override newer requested changes.',
            'pr-gate.mjs:workflowEvidence': 'Requires a successful named workflow on the exact current head; missing, stale, or nonterminal evidence remains a blocker.',
            'pr-gate.mjs:statusEvidence': 'Requires a successful named commit status on the exact current head and rejects stale status authority.',
            'pr-gate.mjs:evaluatePullRequestForMerge': 'Computes fail-closed merge eligibility from repository provenance, base freshness, review threads, reviews, workflows, and statuses.',
            'render.mjs:sanitizeUntrustedText': 'Redacts credential-shaped data, neutralizes control characters and Markdown syntax, and bounds untrusted text before issue rendering.',
            'render.mjs:issueLink': 'Creates an issue reference only for a positive safe-integer identity so malformed external values cannot become Markdown links.',
            'schema.mjs:failManifest': 'Centralizes stable manifest validation errors without echoing untrusted capability content.',
            'schema.mjs:failPolicy': 'Centralizes stable manifest validation errors without reflecting untrusted merge-policy values.',
            'schema.mjs:isPlainObject': 'Restricts schema records to plain objects before exact structural validation, excluding arrays and custom prototypes.',
            'schema.mjs:requiredString': 'Normalizes required bounded text through a caller-selected validation boundary before policy logic consumes it.',
            'schema.mjs:score': 'Accepts only the configured one-to-five integer scale used by deterministic commercial gap prioritization.',
            'schema.mjs:positiveIssueOrNull': 'Normalizes optional tracking authority to either a positive safe issue identity or explicit absence.',
            'schema.mjs:validateRelativePath': 'Rejects absolute, traversal, backslash, and control-character evidence paths before filesystem probing.',
            'schema.mjs:isDocumentationPath': 'Classifies only repository documentation locations that are allowed to satisfy documentation evidence.',
            'schema.mjs:isTestPath': 'Classifies conventional test locations so implementation prose cannot masquerade as test evidence.',
            'schema.mjs:validateEvidence': 'Validates evidence kind, maturity, path, probe mode, and byte ceiling before evidence can affect capability maturity.',
            'schema.mjs:detectDependencyProblems': 'Rejects unknown capability dependencies and cycles before dependency blast radius can influence prioritization.',
            'schema.mjs:validateCapabilityManifest': 'Validates and freezes the complete capability manifest, including evidence contracts and acyclic dependency ownership.',
            'schema.mjs:uniqueStrings': 'Requires bounded unique policy lists so duplicated workflow or status names cannot distort gate interpretation.',
            'schema.mjs:validateCommercialReadinessPolicy': 'Validates and freezes merge policy while requiring the repository security workflows, CodeRabbit status, bounded retention, and squash semantics.',
            'schema.mjs:failSnapshot': 'Centralizes stable repository-snapshot errors without leaking malformed GitHub evidence.',
            'schema.mjs:exactKeys': 'Rejects undeclared snapshot fields so remote payload expansion cannot silently become merge authority.',
            'schema.mjs:snapshotString': 'Normalizes bounded snapshot text and rejects control characters before remote evidence is retained.',
            'schema.mjs:snapshotExternalNumber': 'Accepts only positive safe external identities for pull requests and issues.',
            'schema.mjs:validateSnapshotReview': 'Validates the minimal review projection and requires parseable timestamps before review evidence is trusted.',
            'schema.mjs:validateSnapshotWorkflow': 'Validates workflow identity, exact head SHA, attempt, timing, status, and conclusion before gate evaluation.',
            'schema.mjs:validateSnapshotStatus': 'Validates commit-status context and exact SHA binding before status evidence can satisfy policy.',
            'schema.mjs:validateSnapshotPullRequest': 'Validates the bounded pull-request evidence projection before any field can contribute to merge eligibility.',
            'schema.mjs:validateSnapshotIssue': 'Validates bounded issue identity, state, title, and labels for readiness reporting without importing arbitrary API fields.',
            'schema.mjs:validateGitHubSnapshot': 'Validates and freezes the exact-commit repository snapshot used by audit and merge-drain commands.',
            'workflow-registry.mjs:invalid': 'Uses stable registry errors so malformed Actions evidence cannot leak raw remote payload detail.',
            'workflow-registry.mjs:requireRepository': 'Restricts workflow-registry repository identity before it is interpolated into GitHub API paths.',
            'workflow-registry.mjs:requireSha': 'Requires a full hexadecimal commit identity before workflow evidence can claim exact-head provenance.',
            'workflow-registry.mjs:requireGeneratedAt': 'Requires a canonical ISO timestamp so retained workflow evidence has unambiguous temporal provenance.',
            'workflow-registry.mjs:requireWorkflowPath': 'Rejects traversal, escapes, controls, and malformed repository workflow paths before path identity becomes authority.',
            'workflow-registry.mjs:requireWorkflowRecord': 'Normalizes only bounded Actions workflow identity records before classifying repository ownership.',
            'workflow-registry.mjs:sortById': 'Orders workflow identity evidence deterministically so snapshot output remains reproducible.',
            'workflow-registry.mjs:collectWorkflowRegistry': 'Collects the complete bounded Actions workflow registry and fails if total-count evidence changes or pagination truncates.'
          }));

          function hasJSDoc(node, sourceFile) {
            const leadingTrivia = sourceFile.text.slice(node.getFullStart(), node.getStart(sourceFile));
            return /\/\*\*[\s\S]*?\*\/\s*$/u.test(leadingTrivia);
          }
          function documentationOwner(node) {
            if (ts.isVariableDeclaration(node) && ts.isVariableDeclarationList(node.parent) && ts.isVariableStatement(node.parent.parent)) return node.parent.parent;
            return node;
          }
          function hasCallableInitializer(node) {
            return node.initializer !== undefined && (ts.isArrowFunction(node.initializer) || ts.isFunctionExpression(node.initializer));
          }
          function requiresJSDoc(node) {
            return ts.isFunctionDeclaration(node) || ts.isClassDeclaration(node) || ts.isMethodDeclaration(node) || ts.isConstructorDeclaration(node) || (ts.isVariableDeclaration(node) && hasCallableInitializer(node)) || (ts.isPropertyDeclaration(node) && hasCallableInitializer(node));
          }
          function isProductionDeclarationScope(node, sourceFile) {
            const owner = documentationOwner(node);
            return owner.parent === sourceFile || ts.isClassDeclaration(node.parent);
          }
          function declarationName(node) {
            if (ts.isConstructorDeclaration(node)) return ts.isClassDeclaration(node.parent) && node.parent.name ? `${node.parent.name.text}.constructor` : 'constructor';
            if (ts.isFunctionDeclaration(node) || ts.isClassDeclaration(node) || ts.isMethodDeclaration(node) || ts.isVariableDeclaration(node) || ts.isPropertyDeclaration(node)) return node.name?.getText() ?? ts.SyntaxKind[node.kind];
            return ts.SyntaxKind[node.kind];
          }

          const files = (await readdir(directory)).filter((file) => file.endsWith('.mjs') && !file.endsWith('.test.mjs')).sort();
          const plans = [];
          const unknown = [];
          for (const file of files) {
            const path = resolve(directory, file);
            const source = await readFile(path, 'utf8');
            const sourceFile = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.JS);
            const insertions = [];
            function visit(node) {
              if (requiresJSDoc(node) && isProductionDeclarationScope(node, sourceFile)) {
                const owner = documentationOwner(node);
                if (!hasJSDoc(owner, sourceFile)) {
                  const name = declarationName(node);
                  const key = `${basename(file)}:${name}`;
                  const description = descriptions.get(key);
                  if (!description) unknown.push(key);
                  else {
                    const position = owner.getStart(sourceFile);
                    const lineStart = source.lastIndexOf('\n', position - 1) + 1;
                    const indent = source.slice(lineStart, position).match(/^\s*/u)?.[0] ?? '';
                    insertions.push({ position, text: `${indent}/** ${description} */\n` });
                  }
                }
              }
              ts.forEachChild(node, visit);
            }
            visit(sourceFile);
            plans.push({ path, source, insertions });
          }
          if (unknown.length > 0) throw new Error(`Unmapped production declarations: ${unknown.sort().join(', ')}`);
          let inserted = 0;
          for (const plan of plans) {
            let output = plan.source;
            for (const insertion of plan.insertions.sort((left, right) => right.position - left.position)) {
              output = `${output.slice(0, insertion.position)}${insertion.text}${output.slice(insertion.position)}`;
              inserted += 1;
            }
            if (output !== plan.source) await writeFile(plan.path, output);
          }
          if (inserted === 0) throw new Error('No missing production docstrings were found; refusing a no-op repair');
          console.log(`Inserted ${inserted} substantive production JSDoc blocks`);
          NODE

      - name: Record the permanent quality contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text()
          marker = '### Added\n\n'
          entry = '- Commercial Readiness now has an AST-backed 100% production-docstring contract covering top-level callable/class declarations and class members, with adjacent substantive JSDoc required across every production `.mjs` module.\n'
          if entry not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG Added section not found')
              path.write_text(text.replace(marker, marker + entry, 1))
          PY

      - name: Canonicalize bounded repair targets
        run: pnpm exec prettier --write 'packages/commercial-readiness/src/*.mjs' CHANGELOG.md package.json

      - name: Verify permanent docstring and package gates
        shell: bash
        run: |
          pnpm format:check
          pnpm --filter @life-os/commercial-readiness lint
          pnpm --filter @life-os/commercial-readiness typecheck
          pnpm --filter @life-os/commercial-readiness test
          pnpm --filter @life-os/commercial-readiness build
          node --test packages/commercial-readiness/src/production-docstring-coverage.test.mjs
          git diff --check

      - name: Publish self-retired exact candidate
        shell: bash
        env:
          BRANCH: fix/qs-6-16-0-v1
        run: |
          set -euo pipefail
          rm .github/workflows/repair-pr249-docstrings.yml
          test ! -e .github/workflows/repair-pr249-docstrings.yml
          git diff --check
          git config user.name 'life-os-maintainer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/commercial-readiness/src CHANGELOG.md package.json .github/workflows/repair-pr249-docstrings.yml
          git commit -m 'docs(quality): reach 100% Commercial Readiness docstrings'
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            echo "Remote head moved from writer input ${GITHUB_SHA} to ${remote_head}; refusing push" >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/${BRANCH}"
