name: Repair Product Gap Integration Currentness

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: repair-product-gap-integration-currentness
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact documentation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Replace only the volatile Integration currentness paragraph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start = '> **Currentness override — 2026-09-08 Integration delivery authority.**'
          end = '\n\n## Canonical architecture and evidence rules'
          if text.count(start) != 1:
              raise SystemExit(f'expected exactly one Integration currentness marker, found {text.count(start)}')
          start_index = text.index(start)
          end_index = text.index(end, start_index)
          replacement = '''> **Currentness override — 2026-09-08 Integration delivery authority.** Integration parent #245 remains workflow-free exact `39ebec99d907356a99a1a15528a3a1df713472ed`; #250 is non-force current at `2fef9decf5053c7abf2443ec8e5cae4278e7baac`; #251 is non-force current at `5067f870bdaa9a026411298a2233d4d053708b5a`; #252 remains an independent durable-attempt slice directly on #245. Dependency-rejection RED was proven on `987f0a8ca1ffb132146eee784bf3a3f281801f58` by run `34202494161` / job `101984290407`; minimum repair `c6330c06b6372b2bcdbebf08b16e51a4339d300a` then passed exact run `34203636724` / job `101987958062`. Fresh review defects in timestamp persistence, destructive PostgreSQL target/TLS policy, bracketed IPv6 loopback and the persistence-contract declaration retain RED ancestors `8ef43e183968a6713c0cf76da9a27a6400472ba0`, `9f2d9b7717ea39e0c2a71df4b0bd49bc4253ce9f`, `87b247ff8043470f1807286f5b3a4f84a14237a8`, and `c77d0a38c48caa7e02e50a9dac6a44b9ba6f4cd2`, with causal repairs `5bfdee3d5fbb6fb22027d240279b9cc708aeb3cf`, `aca4c3bb69b6b76a6ceff790da3c08e304fe56ab`, `da94bb6b96391fcc3c66f3b4460979f62e6c964f`, `f6ba35dbc7c3fd630880489fe59e2aeb78bbe1e3c`, and `171f15ed75be0331b37e2912ba42e2d37f201003`. After bounded formatting repair, harness-only proof head `9e6e88e49e14d0b2d247e747df968e2494697666` completed run `34209314512` / job `102006262067` GREEN on Ubuntu 24.04/PostgreSQL 16: all four preserved REDs failed for their intended reasons, canonical bounded TypeScript and diff hygiene passed, focused delivery-attempt acceptance passed, Integration typecheck passed, and the complete Integration suite passed. All four CodeRabbit repair threads are resolved. Current exact #252 head `cbb3caaddf3ad8d84ef27a6c7ba9aa624bed972a` is the ordinary one-commit descendant that removes only the purpose-complete verifier; no production, test or migration source changed. #252 remains Draft and unshipped pending prerequisite integration, applicable repository/security authority and independent approval. Neither durable origin nor attempt identity grants outbound HTTPS or connect-time egress authority, which must come from an immutable released/versioned canonical owner contract.'''
          updated = text[:start_index] + replacement + text[end_index:]
          path.write_text(updated)
          PY
          rm .github/workflows/repair-product-gap-integration-currentness.yml
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/repair-product-gap-integration-currentness.yml' 'docs/product-technical-gap-baseline.md' | sort)"
          test "${changed}" = "${expected}"

      - name: Publish preservation-safe currentness repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md .github/workflows/repair-product-gap-integration-currentness.yml
          git commit -m 'docs: refresh Integration currentness evidence'
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
