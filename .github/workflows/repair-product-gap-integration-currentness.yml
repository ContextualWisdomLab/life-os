name: Repair Integration baseline currentness

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: repair-product-gap-integration-currentness-${{ github.repository }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: docs/product-gap-baseline-2026-08-20
          fetch-depth: 1

      - name: Replace bounded Integration currentness
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'docs/product-technical-gap-baseline.md';
          const source = fs.readFileSync(path, 'utf8');
          const startMarker = 'Concrete successor #245 is currently exact `0a6fe7b25664bc893a4ebeb9647d830b59202fc2`';
          const endMarker = '\n\n### #210 — reproducible release candidate';
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('bounded stale Integration block was not found');
          if (source.indexOf(startMarker, start + 1) >= 0) throw new Error('stale Integration marker is not unique');
          const replacement = `Concrete successor #245 is now exact \`c94caf3f6e468a59ab1ab3b7b7ffd51b6e9a8f7e\`, open Draft/mergeable on #244. Its non-force lineage keeps the Integration-owned node-postgres/default-entrypoint runtime, exact service-owned PostgreSQL authority, verified-TLS configuration separated from the URI, finite connection/statement/query lifetimes, bounded credential-free startup and idle-error evidence, exact provider-backed credential replay, and post-I/O revalidation of both installation and credential-binding authority. Plaintext provider material remains behind the Vault adapter and never becomes durable LifeOS metadata.\n\nReal composed acceptance is no longer an open source/fixture gap. Exact ancestor \`21b5c206decf1ca6a9b337811a56bddce39ff730\` completed hosted run \`34166380591\` over concrete Vault KV v2 plus migrated Integration-owned PostgreSQL across installation → credential create → exact replay → installation-revocation fencing → runtime restart → credential revocation → idempotent cleanup. The purpose-complete proof workflow was removed by normal descendant \`430a19b08d512d0b9ea1eb1aaf78268da1f9e9d7\`; current descendant \`c94caf3...\` retains the production acceptance test and \`docs/operations/plugin-vault-postgres-acceptance.md\`. This ancestor GREEN is not current-head repository/review authority and is not protected-main shipped truth.\n\nThe remaining #130 network boundary is deliberately separate from origin-grant identity. LifeOS must not copy mutable EgressWeave source or treat a manifest/origin grant as connect-time network authorization; the canonical egress owner currently has no immutable GitHub release for consumption. Until a released/versioned owner contract exists, the independent LifeOS-owned next slice is durable delivery attempt/outcome/idempotency/retry/dead-letter/recovery persistence and buyer-visible recovery state without granting outbound network authority.`;
          fs.writeFileSync(path, source.slice(0, start) + replacement + source.slice(end), 'utf8');
          NODE
          git diff --check
          grep -Fq 'Concrete successor #245 is now exact `c94caf3f6e468a59ab1ab3b7b7ffd51b6e9a8f7e`' docs/product-technical-gap-baseline.md
          grep -Fq 'Exact ancestor `21b5c206decf1ca6a9b337811a56bddce39ff730` completed hosted run `34166380591`' docs/product-technical-gap-baseline.md
          ! grep -Fq 'That evidence is not real Vault-server acceptance' docs/product-technical-gap-baseline.md

      - name: Publish Integration currentness and retire writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/repair-product-gap-integration-currentness.yml
          git add docs/product-technical-gap-baseline.md .github/workflows/repair-product-gap-integration-currentness.yml
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::Integration currentness repair produced no retained delta'; exit 1; }
          git commit -m 'docs: align Integration buyer-gap evidence'
          git push origin HEAD:docs/product-gap-baseline-2026-08-20
