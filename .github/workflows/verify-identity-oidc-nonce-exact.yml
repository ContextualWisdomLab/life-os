name: Verify Identity OIDC Nonce Exactness

on:
  push:
    branches:
      - test/identity-oidc-nonce-exact-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require exact local and remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          test ! -e .github/workflows/repair-identity-oidc-nonce-formatting.yml

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --check
          apps/identity-service/src/tests/oauth-provider-response-nonce-exact.test.ts
          .github/workflows/verify-identity-oidc-nonce-exact.yml

      - name: Run exact-nonce regression
        run: >-
          pnpm --filter @life-os/identity-service exec vitest run
          src/tests/oauth-provider-response-nonce-exact.test.ts

      - name: Typecheck Identity
        run: pnpm --filter @life-os/identity-service typecheck

      - name: Run complete Identity suite
        run: pnpm --filter @life-os/identity-service test
