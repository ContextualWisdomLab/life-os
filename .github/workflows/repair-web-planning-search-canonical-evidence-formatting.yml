name: Repair Web Planning Search Canonical Evidence Formatting

on:
  push:
    branches:
      - test/web-planning-search-canonical-evidence-v1
    paths:
      - .github/workflows/repair-web-planning-search-canonical-evidence-formatting.yml

permissions:
  contents: write

concurrency:
  group: repair-web-planning-search-canonical-evidence-formatting-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Require retained regression ancestry and exact remote input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "8e61e0506f12dba930817bf825458823c29cb3e1" HEAD
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove focused formatting RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm exec prettier --check \
            apps/web/app/planning-search-canonical-evidence.test.ts \
            .github/workflows/verify-web-planning-search-canonical-evidence.yml; then
            echo 'Expected retained Web Planning Search evidence files to be noncanonical before repair.' >&2
            exit 1
          fi

      - name: Apply bounded formatter repair
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            apps/web/app/planning-search-canonical-evidence.test.ts \
            .github/workflows/verify-web-planning-search-canonical-evidence.yml
          git rm .github/workflows/repair-web-planning-search-canonical-evidence-formatting.yml

      - name: Verify bounded repair and retained Web contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --check \
            apps/web/app/planning-search-canonical-evidence.test.ts \
            .github/workflows/verify-web-planning-search-canonical-evidence.yml
          pnpm --filter @life-os/web typecheck
          git diff --check
          source_delta="$(git diff --name-only HEAD -- \
            apps/web/app/planning-search-canonical-evidence.test.ts \
            .github/workflows/verify-web-planning-search-canonical-evidence.yml | LC_ALL=C sort)"
          test -n "${source_delta}"
          allowed_sources="$(printf '%s\n' \
            '.github/workflows/verify-web-planning-search-canonical-evidence.yml' \
            'apps/web/app/planning-search-canonical-evidence.test.ts' | LC_ALL=C sort)"
          unexpected_sources="$(comm -23 \
            <(printf '%s\n' "${source_delta}") \
            <(printf '%s\n' "${allowed_sources}"))"
          test -z "${unexpected_sources}"
          actual="$(git diff --name-only HEAD | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-web-planning-search-canonical-evidence-formatting.yml' \
            ${source_delta} | LC_ALL=C sort)"
          test "${actual}" = "${expected}"

      - name: Publish ordinary formatter descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git add -A
          staged="$(git diff --cached --name-only "$GITHUB_SHA" | LC_ALL=C sort)"
          allowed="$(printf '%s\n' \
            '.github/workflows/repair-web-planning-search-canonical-evidence-formatting.yml' \
            '.github/workflows/verify-web-planning-search-canonical-evidence.yml' \
            'apps/web/app/planning-search-canonical-evidence.test.ts' | LC_ALL=C sort)"
          unexpected="$(comm -23 <(printf '%s\n' "$staged") <(printf '%s\n' "$allowed"))"
          test -z "$unexpected"
          test -n "$staged"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(web): format planning search evidence regression'
          git push origin "HEAD:${GITHUB_REF_NAME}"
