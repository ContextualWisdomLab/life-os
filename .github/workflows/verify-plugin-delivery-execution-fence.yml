name: Verify plugin delivery execution fence

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-execution-fence-v1

permissions:
  contents: read

concurrency:
  group: verify-plugin-delivery-execution-fence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check execution-fence regression formatting and diff hygiene
        run: |
          pnpm exec prettier --single-quote --check \
            apps/integration-service/src/plugin-delivery-attempt-execution-fence.test.ts
          git diff --check HEAD^

      - name: Build Plugin SDK dependency
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Run execution-fence capability acceptance
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-execution-fence.test.ts
          --no-file-parallelism

      - name: Typecheck Integration service
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration service suite
        run: pnpm --filter @life-os/integration-service test
