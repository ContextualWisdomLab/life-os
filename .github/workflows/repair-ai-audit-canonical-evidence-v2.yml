name: Repair AI Audit Canonical Evidence V2

on:
  push:
    branches:
      - test/ai-audit-canonical-durable-evidence-v1
    paths:
      - .github/workflows/repair-ai-audit-canonical-evidence-v2.yml

permissions:
  contents: write

concurrency:
  group: repair-ai-audit-canonical-evidence-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Guard exact hosted RED ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          git merge-base --is-ancestor 0637449b637c7be07ef27a6c47e7f65419f3196d "$GITHUB_SHA"
          intervening="$(git diff --name-only 0637449b637c7be07ef27a6c47e7f65419f3196d "$GITHUB_SHA" | LC_ALL=C sort)"
          test "$intervening" = ".github/workflows/repair-ai-audit-canonical-evidence-v2.yml"
          test -f .github/workflows/verify-ai-audit-canonical-evidence.yml
          test -f .github/workflows/repair-ai-audit-canonical-evidence-v2.yml

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconfirm focused assertion RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter @life-os/ai-service exec vitest run \
            src/proposal-audit-canonical-evidence.test.ts \
            src/postgres-proposal-audit-canonical-evidence.test.ts; then
            echo 'Expected immutable audit-evidence regressions to remain RED before repair.' >&2
            exit 1
          fi

      - name: Apply minimum persisted-evidence canonicality repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('apps/ai-service/src/proposal-audit-domain.ts')
          text = path.read_text()

          request_marker = '/** Revalidates one proposal request and maps generator failures to audit validation. */'
          helpers = '''/** Requires persisted UUID evidence to already use canonical lowercase spelling. */
          function requireCanonicalUuidV4(value: unknown): string {
            const canonical = requireUuidV4(value);
            if (value !== canonical) {
              return invalid();
            }
            return canonical;
          }

          /** Requires persisted digest evidence to already use lowercase hexadecimal spelling. */
          function requireCanonicalDigest(value: unknown): string {
            const canonical = requireDigest(value);
            if (value !== canonical) {
              return invalid();
            }
            return canonical;
          }

          /** Requires persisted string timestamps to already equal canonical UTC spelling. */
          function requireCanonicalTimestamp(value: unknown): string {
            const canonical = requireTimestamp(value);
            if (typeof value === 'string' && value !== canonical) {
              return invalid();
            }
            return canonical;
          }

          '''
          if text.count(request_marker) != 1:
            raise SystemExit('expected one request-validation marker')
          text = text.replace(request_marker, helpers + request_marker, 1)

          operation_marker = '/** Projects one validated operation into deterministic digest field order. */'
          persisted_proposal = '''/** Revalidates immutable proposal evidence without accepting representation aliases. */
          function validatePersistedProposal(value: unknown): AuditableProposal {
            const record = requireRecord(value);
            const proposal = validateProposal(value);
            requireCanonicalUuidV4(record.proposalId);
            requireCanonicalUuidV4(record.workspaceId);
            requireCanonicalTimestamp(record.createdAt);
            if (Array.isArray(record.operations)) {
              for (const operation of record.operations) {
                const operationRecord = requireRecord(operation);
                if (Object.hasOwn(operationRecord, 'targetId')) {
                  requireCanonicalUuidV4(operationRecord.targetId);
                }
              }
            }
            return proposal;
          }

          '''
          if text.count(operation_marker) != 1:
            raise SystemExit('expected one operation-projection marker')
          text = text.replace(operation_marker, persisted_proposal + operation_marker, 1)

          audit_marker = '/** Validates persisted proposal evidence and verifies both canonical digests. */'
          decision_create_marker = '/** Creates one validated append-only proposal decision event. */'
          if text.count(audit_marker) != 1 or text.count(decision_create_marker) != 1:
            raise SystemExit('expected one audit-validation segment')
          audit_start = text.index(audit_marker)
          audit_end = text.index(decision_create_marker, audit_start)
          audit_segment = text[audit_start:audit_end]
          audit_replacements = {
              'proposal: validateProposal(record.proposal),': 'proposal: validatePersistedProposal(record.proposal),',
              'recordedAt: requireTimestamp(record.recordedAt),': 'recordedAt: requireCanonicalTimestamp(record.recordedAt),',
              'verified.requestDigest !== requireDigest(record.requestDigest)': 'verified.requestDigest !== requireCanonicalDigest(record.requestDigest)',
              'verified.contentDigest !== requireDigest(record.contentDigest)': 'verified.contentDigest !== requireCanonicalDigest(record.contentDigest)',
          }
          for old, new in audit_replacements.items():
            if audit_segment.count(old) != 1:
              raise SystemExit(f'expected one audit validator occurrence: {old}')
            audit_segment = audit_segment.replace(old, new, 1)
          text = text[:audit_start] + audit_segment + text[audit_end:]

          decision_marker = '/** Validates an untrusted or persisted decision event. */'
          decision_index = text.index(decision_marker)
          prefix = text[:decision_index]
          suffix = text[decision_index:]
          replacements = {
              'id: requireUuidV4(record.id),': 'id: requireCanonicalUuidV4(record.id),',
              'workspaceId: requireUuidV4(record.workspaceId),': 'workspaceId: requireCanonicalUuidV4(record.workspaceId),',
              'proposalId: requireUuidV4(record.proposalId),': 'proposalId: requireCanonicalUuidV4(record.proposalId),',
              'proposalContentDigest: requireDigest(record.proposalContentDigest),': 'proposalContentDigest: requireCanonicalDigest(record.proposalContentDigest),',
              'actorId: requireUuidV4(record.actorId),': 'actorId: requireCanonicalUuidV4(record.actorId),',
              'idempotencyKey: requireUuidV4(record.idempotencyKey),': 'idempotencyKey: requireCanonicalUuidV4(record.idempotencyKey),',
              'decidedAt: requireTimestamp(record.decidedAt),': 'decidedAt: requireCanonicalTimestamp(record.decidedAt),',
              'recordedAt: requireTimestamp(record.recordedAt),': 'recordedAt: requireCanonicalTimestamp(record.recordedAt),',
          }
          for old, new in replacements.items():
            if suffix.count(old) != 1:
              raise SystemExit(f'expected one persisted-decision validator occurrence: {old}')
            suffix = suffix.replace(old, new, 1)
          path.write_text(prefix + suffix)
          PY
          pnpm exec prettier --write apps/ai-service/src/proposal-audit-domain.ts

      - name: Prove focused GREEN
        run: >-
          pnpm --filter @life-os/ai-service exec vitest run
          src/proposal-audit-canonical-evidence.test.ts
          src/postgres-proposal-audit-canonical-evidence.test.ts

      - name: Typecheck AI service
        run: pnpm --filter @life-os/ai-service typecheck

      - name: Run complete AI service suite
        run: pnpm --filter @life-os/ai-service test

      - name: Guard bounded product delta and retire writer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-ai-audit-canonical-evidence-v2.yml
          git add apps/ai-service/src/proposal-audit-domain.ts
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-ai-audit-canonical-evidence-v2.yml' \
            'apps/ai-service/src/proposal-audit-domain.ts' | LC_ALL=C sort)"
          test "${changed}" = "${expected}"
          git diff --check --cached

      - name: Publish ordinary GREEN descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ai): preserve canonical audit evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
