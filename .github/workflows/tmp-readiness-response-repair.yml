name: Temporary Readiness Response-Bound Repair

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1

permissions:
  contents: write

concurrency:
  group: tmp-readiness-response-bound-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply minimum response-bound repair
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/commercial-readiness/src/github-client.mjs';
          let source = fs.readFileSync(path, 'utf8');

          function replaceOnce(before, after, label) {
            const first = source.indexOf(before);
            if (first < 0 || source.indexOf(before, first + 1) >= 0) {
              throw new Error(`Expected exactly one ${label} seam`);
            }
            source = `${source.slice(0, first)}${after}${source.slice(first + before.length)}`;
          }

          replaceOnce(
            'const API_PAGE_SIZE = 100;\nconst MAX_API_PAGES = 10;',
            "const API_PAGE_SIZE = 100;\nconst FALLBACK_API_PAGE_SIZE = 50;\nconst MAX_API_PAGES = 10;\nconst MAX_API_ITEMS = API_PAGE_SIZE * MAX_API_PAGES;\nconst RESPONSE_SIZE_ERROR = new Error(\n  'GitHub API response exceeded the size limit',\n);",
            'pagination constant',
          );

          replaceOnce(
            "    throw new Error('GitHub API response exceeded the size limit');\n  }\n  if (!response.body) return '';",
            "    throw RESPONSE_SIZE_ERROR;\n  }\n  if (!response.body) return '';",
            'declared-size rejection',
          );

          replaceOnce(
            "    if (bytes > maxBytes) {\n      await reader.cancel();\n      throw new Error('GitHub API response exceeded the size limit');\n    }",
            "    if (bytes > maxBytes) {\n      // Cleanup cannot replace the already-established response-size classification.\n      try {\n        void reader.cancel().catch(() => {});\n      } catch {\n        // A synchronous cancellation failure is also non-authoritative cleanup detail.\n      }\n      throw RESPONSE_SIZE_ERROR;\n    }",
            'stream-size rejection',
          );

          const start = source.indexOf('async function collectPaginatedArray(\n');
          const marker = '/**\n * Check whether one pull-request-triggered workflow run belongs to the evaluated PR.';
          const end = source.indexOf(marker, start);
          if (start < 0 || end < 0 || source.indexOf('async function collectPaginatedArray(\n', start + 1) >= 0) {
            throw new Error('Expected exactly one paginated-array collector seam');
          }

          const replacement = `async function collectPaginatedArray(
            client,
            path,
            errorMessage,
            stabilityErrorMessage = null,
          ) {
            const separator = path.includes('?') ? '&' : '?';
            for (const pageSize of [API_PAGE_SIZE, FALLBACK_API_PAGE_SIZE]) {
              const values = [];
              const pageLimit = Math.ceil(MAX_API_ITEMS / pageSize);
              let firstPage = null;
              let pagesRead = 0;
              try {
                for (let page = 1; page <= pageLimit; page += 1) {
                  const payload = await client.requestJson(
                    \`${'${path}'}${'${separator}'}per_page=${'${pageSize}'}&page=${'${page}'}\`,
                  );
                  if (!Array.isArray(payload) || payload.length > pageSize) {
                    throw new Error(errorMessage);
                  }
                  if (page === 1) firstPage = payload;
                  values.push(...payload);
                  if (values.length > MAX_API_ITEMS) {
                    throw new Error(\`${'${errorMessage}'} exceeded the item limit\`);
                  }
                  pagesRead = page;
                  if (payload.length < pageSize) {
                    if (stabilityErrorMessage && pagesRead > 1) {
                      const confirmation = await client.requestJson(
                        \`${'${path}'}${'${separator}'}per_page=${'${pageSize}'}&page=1\`,
                      );
                      if (
                        !Array.isArray(confirmation) ||
                        confirmation.length > pageSize ||
                        JSON.stringify(confirmation) !== JSON.stringify(firstPage)
                      ) {
                        throw new Error(stabilityErrorMessage);
                      }
                    }
                    return values;
                  }
                }
                throw new Error(\`${'${errorMessage}'} exceeded the page limit\`);
              } catch (error) {
                if (
                  error !== RESPONSE_SIZE_ERROR ||
                  pageSize === FALLBACK_API_PAGE_SIZE
                ) {
                  throw error;
                }
              }
            }
            throw new Error('GitHub pagination fallback invariant failed');
          }

          `;

          source = `${source.slice(0, start)}${replacement}${source.slice(end)}`;
          fs.writeFileSync(path, source);
          NODE
      - name: Canonicalize touched source and regressions
        run: >-
          pnpm exec prettier --write
          packages/commercial-readiness/src/github-client.mjs
          packages/commercial-readiness/src/github-client-page-size.test.mjs
          packages/commercial-readiness/src/github-client-stream-boundary.test.mjs
      - name: Verify focused RED repairs
        run: >-
          pnpm --filter @life-os/commercial-readiness exec node --test
          src/github-client-stream-boundary.test.mjs
          src/github-client-page-size.test.mjs
      - name: Verify complete Commercial Readiness package
        run: |
          pnpm --filter @life-os/commercial-readiness test
          pnpm --filter @life-os/commercial-readiness typecheck
          pnpm --filter @life-os/commercial-readiness build
      - name: Verify canonical formatting and diff hygiene
        run: |
          pnpm exec prettier --check packages/commercial-readiness/src/github-client.mjs packages/commercial-readiness/src/github-client-page-size.test.mjs packages/commercial-readiness/src/github-client-stream-boundary.test.mjs
          git diff --check
      - name: Retire purpose-complete workflows
        run: |
          git rm .github/workflows/tmp-readiness-stream-red.yml
          git rm .github/workflows/tmp-readiness-response-repair.yml
      - name: Publish only from unchanged remote head
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/commercial-readiness/src/github-client.mjs packages/commercial-readiness/src/github-client-page-size.test.mjs packages/commercial-readiness/src/github-client-stream-boundary.test.mjs
          git diff --cached --check
          git commit -m 'fix(readiness): preserve bounded GitHub response evidence'
          git fetch origin fix/actions-draft-queue-pressure-v1
          test "$(git rev-parse origin/fix/actions-draft-queue-pressure-v1)" = "${GITHUB_SHA}"
          git push origin HEAD:fix/actions-draft-queue-pressure-v1
