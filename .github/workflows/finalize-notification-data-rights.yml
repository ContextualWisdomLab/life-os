name: Finalize notification data-rights repair

on:
  push:
    branches:
      - feat/notification-data-rights-contributor-v2
    paths:
      - .github/workflows/finalize-notification-data-rights.yml

permissions: {}

concurrency:
  group: finalize-notification-data-rights-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: write
    env:
      NOTIFICATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/notification-data-rights-contributor-v2
          fetch-depth: 0

      - name: Reconcile protected main and branch authority
        env:
          EXPECTED_PARENT: 2a021b4c173bde3590e79eb634c87811928fccd6
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/notification-data-rights-contributor-v2:refs/remotes/origin/feat/notification-data-rights-contributor-v2'
          test "$(git rev-parse origin/feat/notification-data-rights-contributor-v2)" = "$(git rev-parse HEAD)"
          git merge --no-edit --no-ff origin/main

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install locked dependencies
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Materialize reviewed test-first repair
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path(
              '.github/workflows/repair-notification-data-rights.yml'
          ).read_text(encoding='utf-8')

          def run_step(name: str) -> str:
              marker = f"      - name: {name}\n"
              start = workflow.index(marker)
              run_start = workflow.index("        run: |\n", start)
              content_start = run_start + len("        run: |\n")
              next_step = workflow.find("\n      - name:", content_start)
              if next_step == -1:
                  next_step = len(workflow)
              lines = workflow[content_start:next_step].splitlines()
              return "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in lines
              ) + "\n"

          add_tests = run_step('Add failing regression evidence')
          behavior_start = add_tests.index("behavior_path = Path(\n")
          behavior_end = add_tests.index(
              'migration_contract = r"""',
              behavior_start,
          )
          add_tests = add_tests[:behavior_start] + add_tests[behavior_end:]

          replacements = [
              (
                  re.compile(
                      r"expect\(sql\)\.toContain\(\s*[\"']set_config\('life_os\.notification_erasure_workspace'[\"']\s*,\s*\);",
                      re.MULTILINE,
                  ),
                  "expect(sql).toMatch(\n"
                  "              /set_config\\(\\s*'life_os\\.notification_erasure_workspace'/u,\n"
                  "            );",
                  'transaction-local marker',
              ),
              (
                  re.compile(
                      r"expect\(sql\)\.toContain\(\s*[\"']current_setting\('life_os\.notification_erasure_workspace', true\)[\"']\s*,\s*\);",
                      re.MULTILINE,
                  ),
                  "expect(sql).toMatch(\n"
                  "              /current_setting\\(\\s*'life_os\\.notification_erasure_workspace',\\s*true\\s*\\)/u,\n"
                  "            );",
                  'owner-bound marker',
              ),
          ]
          for pattern, replacement, label in replacements:
              add_tests, count = pattern.subn(
                  lambda _match, value=replacement: value,
                  add_tests,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f'unexpected {label} assertion')

          verify_red = run_step(
              'Verify the regressions fail before implementation'
          )
          obsolete_grep = (
              "grep -F 'exports code-unit canonical evidence independent "
              "of key insertion order' \\\n"
              '  "$RUNNER_TEMP/notification-red.log"\n'
          )
          if verify_red.count(obsolete_grep) != 1:
              raise SystemExit('unexpected obsolete deterministic-test grep')
          verify_red = verify_red.replace(obsolete_grep, '', 1)

          implement = run_step(
              'Implement deterministic, least-privilege, nonblocking erasure'
          )
          source_start = implement.index("source_path = Path(\n")
          source_end = implement.index(
              "\nmigration_path = Path(\n",
              source_start,
          )
          source_patch = r'''source_path = Path(
              'apps/notification-service/src/notification-data-rights.ts'
          )
          source = source_path.read_text(encoding='utf-8')
          comparator_pattern = re.compile(
              r"    entries\.sort\(\(\[left\], \[right\]\) => \{\n"
              r"(?:      .*\n)+?"
              r"    \}\);",
          )
          source, comparator_replacements = comparator_pattern.subn(
              "    entries.sort(([left], [right]) =>\n"
              "      left < right ? -1 : 1,\n"
              "    );",
              source,
              count=1,
          )
          if comparator_replacements != 1:
            raise SystemExit('unexpected canonical comparator shape')
          source_path.write_text(source, encoding='utf-8')
          '''
          implement = (
              implement[:source_start]
              + source_patch
              + implement[source_end + 1:]
          )

          focused = run_step('Verify focused and package evidence')
          command = (
              '  src/notification-data-rights.integration.test.ts \\\n'
              '  --no-file-parallelism\n'
          )
          replacement = (
              '  src/notification-data-rights.integration.test.ts \\\n'
              '  --no-file-parallelism --coverage.enabled=false\n'
          )
          if focused.count(command) != 1:
              raise SystemExit('unexpected focused verification command')
          focused = focused.replace(command, replacement, 1)

          phases = {
              '01-add-tests.sh': add_tests,
              '02-verify-red.sh': verify_red,
              '03-implement.sh': implement,
              '04-verify-focused.sh': focused,
              '05-verify-repository.sh': run_step(
                  'Verify current-main whole-repository gates'
              ),
          }
          output = Path('/tmp/notification-finalization')
          output.mkdir(mode=0o700)
          for name, content in phases.items():
              phase = output / name
              phase.write_text(content, encoding='utf-8')
              phase.chmod(0o700)
          PY

      - name: Execute repair and all validation gates
        run: |
          set -Eeuo pipefail
          for phase in /tmp/notification-finalization/*.sh; do
            printf 'notification_phase=%s\n' "$(basename "$phase")"
            bash "$phase"
          done

      - name: Commit only verified production evidence
        run: |
          set -Eeuo pipefail
          git diff --check
          actual="$(git status --short | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            'apps/notification-service/migrations/0002_data_rights_erasure.sql' \
            'apps/notification-service/src/notification-data-rights-migration.test.ts' \
            'apps/notification-service/src/notification-data-rights.integration.test.ts' \
            'apps/notification-service/src/notification-data-rights.ts' \
            'docs/operations/notification-persistence.md' \
            | LC_ALL=C sort)"
          test "$actual" = "$expected"
          git add \
            apps/notification-service/migrations/0002_data_rights_erasure.sql \
            apps/notification-service/src/notification-data-rights-migration.test.ts \
            apps/notification-service/src/notification-data-rights.integration.test.ts \
            apps/notification-service/src/notification-data-rights.ts \
            docs/operations/notification-persistence.md
          git commit -m 'fix(notification): harden data-rights erasure authority'
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/feat/notification-data-rights-contributor-v2:refs/remotes/origin/feat/notification-data-rights-contributor-v2'
          test "$(git rev-parse origin/feat/notification-data-rights-contributor-v2)" = "${{ github.sha }}"
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:refs/heads/feat/notification-data-rights-contributor-v2
