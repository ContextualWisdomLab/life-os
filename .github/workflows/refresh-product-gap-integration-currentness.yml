name: Refresh product gap Integration currentness

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: refresh-product-gap-integration-currentness
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Replace bounded Integration currentness block
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start = '<!-- life-os-currentness:#260:start -->'
          end = '<!-- life-os-currentness:#260:end -->'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('Integration currentness markers are not unique')
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          replacement = (
              '<!-- life-os-currentness:#260:start -->\n'
              '> **#260 authenticated status performance — exact active-PR GREEN, still unshipped.** #260 is the direct #259 performance-acceptance descendant. The first production-faithful k6 run `34293875857`, job `102286121337`, failed the unchanged buyer-path gate at **p95 21.7 ms**. The minimum causal repair reduced successful replay/status processing from three sequential PostgreSQL invocations to one Integration-owned replay function plus the scoped status read without caching, sample exclusion, threshold relaxation, cross-service SQL or weaker TLS. Exact proof `a24862ee07b6522f37f60f17013b09f546c923f2`, run `34296446935`, job `102294001154`, completed 1,000/1,000 signed requests at 10 VUs, 3,000/3,000 checks, zero HTTP failures and **p95 15.27 ms**. Current #260 exact `a81c8f243eaedb5f7efddc8a6c208083c8c256e3` removes only the purpose verifier. This is active-PR evidence, not protected-main or release authority.\n'
              '>\n'
              '> **#261 Integration production coverage — exact terminal RED improving, still unshipped.** #261 directly owns `@vitest/coverage-v8`, `test:coverage`, production `src/**/*.ts` inclusion and unchanged **100% statements / branches / functions / lines** thresholds. Exact formatter candidate `0bc6bfd2265004a94da62e2be15bf14e74331fca`, produced by run `34303982800`, job `102316721609`, completed frozen install, canonical formatting, Plugin SDK build, Integration typecheck and the PostgreSQL-backed suite with **84 test files passed / 2 skipped; 488 tests passed / 3 skipped**. V8 advanced to **92.06% statements, 86.93% branches, 95.91% functions, 92.06% lines**; the unchanged 100% gates correctly remained RED. The three skips are separately provisioned acceptance and are not counted as coverage evidence.\n'
              '>\n'
              '> That terminal artifact identified reachable calendar-invalid stored-instant round-trip branches in execution-fence, retry and status persistence. #261 now carries hostile durable-evidence regressions for those branches. It also proved retry `requireStoredUuid()` was dead duplicate validation after exact equality to already validated canonical command UUIDs; current exact `8d962e4d58b71221fdf327a10800c2659e16602c` removes only that unreachable parser and reuses the already proven command identities. Run `34304833904`, job `102319253032`, is queued; queued evidence is neither RED nor GREEN, so no percentage newer than `0bc6bfd...` is claimed.\n'
              '>\n'
              '> Durable replay/delivery/status identity still grants no provider-execution or outbound-network authority. `ContextualWisdomLab/EgressWeave` has no immutable released/versioned contract consumable by LifeOS, so provider HTTPS remains fail closed.\n'
              '<!-- life-os-currentness:#260:end -->'
          )
          path.write_text(before + replacement + after)
          PY
          git diff --check
          test "$(git diff --name-only)" = 'docs/product-technical-gap-baseline.md'

      - name: Publish bounded currentness and retire writer
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin refs/heads/docs/product-gap-baseline-2026-08-20 | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Writer input moved from ${GITHUB_SHA} to ${remote_sha}; refusing publication." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/refresh-product-gap-integration-currentness.yml
          git commit -m 'docs: refresh Integration coverage currentness'
          git push origin HEAD:refs/heads/docs/product-gap-baseline-2026-08-20
