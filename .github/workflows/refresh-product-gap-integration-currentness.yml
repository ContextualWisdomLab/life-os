name: Refresh product gap Integration currentness

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: refresh-product-gap-integration-currentness
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Replace bounded Integration currentness block
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start = '<!-- life-os-currentness:#260:start -->'
          end = '<!-- life-os-currentness:#260:end -->'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('Integration currentness markers are not unique')
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          replacement = '''<!-- life-os-currentness:#260:start -->
> **#260 authenticated status performance — exact active-PR GREEN, still unshipped.** #260 is the direct #259 performance-acceptance descendant and remains Draft/unshipped. The first production-faithful k6 run `34293875857`, job `102286121337`, completed all 1,000 signed status requests with 3,000/3,000 functional checks and 0 HTTP failures but failed the unchanged buyer-path gate at **p95 21.7 ms**. Profiling found three sequential PostgreSQL invocations on the successful path. The minimum causal repair reduced replay consumption to one Integration-owned PostgreSQL function invocation without caching, sample exclusion, threshold relaxation, cross-service SQL or weaker TLS. Exact proof head `a24862ee07b6522f37f60f17013b09f546c923f2`, run `34296446935`, job `102294001154`, completed GREEN on Ubuntu 24.04/PostgreSQL 16/k6 2.2.0: 1,000/1,000 measured requests at 10 VUs, 3,000/3,000 checks, 0 HTTP failures and **p95 15.27 ms**. Current #260 exact `a81c8f243eaedb5f7efddc8a6c208083c8c256e3` removes only the purpose-complete verifier. This is active-PR evidence, not protected-main or release authority.
>
> **#261 Integration production coverage — exact terminal RED improving, still unshipped.** #261 is the direct #260 descendant and owns `@vitest/coverage-v8`, `test:coverage`, production `src/**/*.ts` inclusion and unchanged **100% statements / branches / functions / lines** thresholds. After earlier build-order and PostgreSQL-isolation harness repairs, exact `20e8af0edd8cb2044cf18c21ba510cddd924a8ac`, run `34298516686`, job `102300245764`, established the first valid database-enabled RED at **89.38% statements, 81.15% branches, 93.85% functions, 89.38% lines**. Causal edge tests then exposed and repaired ambiguous one-row durable evidence in execution-fence/retry stores, native status dependency/revoked-object error leakage, and a vacuous canonical-UUID fixture without lowering thresholds or excluding production source. Exact formatter candidate `0bc6bfd2265004a94da62e2be15bf14e74331fca`, produced by run `34303982800`, job `102316721609`, completed the full PostgreSQL-backed suite with **488 passed / 3 separately provisioned skips** and advanced V8 to **92.06% statements, 86.93% branches, 95.91% functions, 92.06% lines**. The 100% gate therefore remains correctly RED and 100% Test/Edge Coverage is not claimed.
>
> Fresh source review of that artifact identified three reachable stored-instant canonicality branches: execution-fence `checked_at`, retry `updated_at`, and status `requested_at` could receive calendar-invalid strings that match the ISO wire shape and must fail closed on unchanged round-trip validation. Current #261 exact `5abfde5df14fe10ce8414eacb06a355b61467b2c` adds explicit hostile durable-evidence regression coverage for those boundaries and includes the new test in the canonical formatter/verifier set. Run `34304550832`, job `102318407831`, is pending execution; pending evidence is neither RED nor GREEN and no percentage newer than the exact `0bc6bfd...` terminal result is claimed here.
>
> Durable replay, delivery and status identity still grants no provider-execution or outbound-network authority. `ContextualWisdomLab/EgressWeave` has no immutable released/versioned contract consumable by LifeOS, so provider HTTPS remains fail closed. #260/#261 do not change that boundary.
<!-- life-os-currentness:#260:end -->'''
          path.write_text(before + replacement + after)
          PY
          git diff --check
          test "$(git diff --name-only)" = 'docs/product-technical-gap-baseline.md'

      - name: Publish only if writer input is unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_sha="$(git ls-remote origin refs/heads/docs/product-gap-baseline-2026-08-20 | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "Writer input moved from ${GITHUB_SHA} to ${remote_sha}; refusing publication." >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/refresh-product-gap-integration-currentness.yml
          git commit -m 'docs: refresh Integration coverage currentness'
          git push origin HEAD:refs/heads/docs/product-gap-baseline-2026-08-20
