name: Verify item 34 source job boundary

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pin Git default branch naming
        run: git config --global init.defaultBranch main

      - name: Checkout exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source-verification repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --version
          cd packages/commercial-readiness
          node --test src/*.test.mjs
          node --check src/source-verification-workflow.test.mjs
          git diff --check
