name: Repair Web Project BFF Parent Restack

on:
  push:
    branches:
      - feat/web-project-bff-v2
    paths:
      - .github/workflows/repair-web-project-parent-restack.yml

permissions:
  contents: write

concurrency:
  group: repair-web-project-parent-restack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact child head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact child and settled parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git fetch --no-tags origin refs/heads/feat/web-goal-bff-v1
          parent_sha="$(git rev-parse FETCH_HEAD)"
          test "$parent_sha" = "1d2f72ee5e38896eb76198e55dac8a5ca491ba98"
          echo "PARENT_SHA=$parent_sha" >> "$GITHUB_ENV"

      - name: Merge settled parent without discarding either Web contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          set +e
          git merge --no-ff --no-commit "$PARENT_SHA"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U | sort)"
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                apps/web/app/planning-goal-client.ts|apps/web/package.json)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected semantic-restack conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          fi

          node <<'NODE'
          const fs = require('node:fs');

          const clientPath = 'apps/web/app/planning-goal-client.ts';
          let client = fs.readFileSync(clientPath, 'utf8');
          function ensureReplacement(oldText, newText) {
            if (client.includes(newText)) return;
            const count = client.split(oldText).length - 1;
            if (count !== 1) {
              throw new Error(`Expected exactly one canonical-restack target, found ${count}: ${oldText}`);
            }
            client = client.replace(oldText, newText);
          }
          ensureReplacement(
            '/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;',
            '/^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;',
          );
          ensureReplacement('  return value.toLowerCase();', '  return value;');
          ensureReplacement(
            '/** Requires a valid RFC 3339 timestamp and emits one canonical UTC instant. */',
            '/** Requires Planning timestamp evidence to already be canonical UTC ISO-8601 text. */',
          );
          ensureReplacement(
            '  if (!Number.isFinite(parsed)) {',
            [
              '  if (',
              '    !Number.isFinite(parsed) ||',
              '    new Date(parsed).toISOString() !== value',
              '  ) {',
            ].join('\n'),
          );
          ensureReplacement('  return new Date(parsed).toISOString();', '  return value;');
          fs.writeFileSync(clientPath, client);

          const packagePath = 'apps/web/package.json';
          let pkg = fs.readFileSync(packagePath, 'utf8');
          const canonicalTest = 'app/planning-goal-canonical-evidence-regression.test.ts';
          if (!pkg.includes(canonicalTest)) {
            const marker = 'app/planning-goal-client.test.ts';
            const count = pkg.split(marker).length - 1;
            if (count !== 1) {
              throw new Error(`Expected one Goal test marker, found ${count}`);
            }
            pkg = pkg.replace(marker, `${marker} ${canonicalTest}`);
          }
          fs.writeFileSync(packagePath, pkg);
          NODE

          git add apps/web/app/planning-goal-client.ts apps/web/package.json
          git add apps/web/app/planning-goal-canonical-evidence-regression.test.ts
          git rm .github/workflows/repair-web-project-parent-restack.yml

          allowed="$(printf '%s\n' \
            .github/workflows/repair-web-project-parent-restack.yml \
            apps/web/app/planning-goal-canonical-evidence-regression.test.ts \
            apps/web/app/planning-goal-client.ts \
            apps/web/package.json | sort)"
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | sort)"
          test "$changed" = "$allowed"
          git diff --check --cached

      - name: Install frozen workspace
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Repair proven child formatting
        run: >-
          pnpm exec prettier --single-quote --write
          apps/web/app/planning-project-client.test.ts
          apps/web/app/api/planning/goals/project-routes.test.ts

      - name: Guard bounded restack and formatting delta
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/web/app/planning-project-client.test.ts \
            apps/web/app/api/planning/goals/project-routes.test.ts
          allowed="$(printf '%s\n' \
            .github/workflows/repair-web-project-parent-restack.yml \
            apps/web/app/api/planning/goals/project-routes.test.ts \
            apps/web/app/planning-goal-canonical-evidence-regression.test.ts \
            apps/web/app/planning-goal-client.ts \
            apps/web/app/planning-project-client.test.ts \
            apps/web/package.json | sort)"
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | sort)"
          test "$changed" = "$allowed"
          git diff --check --cached

      - name: Check merged Web formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/package.json
          apps/web/app/planning-goal-client.ts
          apps/web/app/planning-goal-canonical-evidence-regression.test.ts
          apps/web/app/planning-project-client.test.ts
          apps/web/app/planning-project-not-found.test.ts
          apps/web/app/api/planning/goals/project-routes.test.ts

      - name: Typecheck Web
        run: pnpm --filter @life-os/web typecheck

      - name: Prove Goal and Project boundary contracts
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/planning-goal-client.test.ts
          app/planning-goal-canonical-evidence-regression.test.ts
          app/planning-project-client.test.ts
          app/planning-project-not-found.test.ts
          app/api/planning/goals/project-routes.test.ts

      - name: Run complete Web unit suite
        run: pnpm --filter @life-os/web test

      - name: Publish ordinary non-force semantic restack
        shell: bash
        run: |
          set -euo pipefail
          git diff --check --cached
          git commit -m "chore(web): adopt settled Goal BFF parent"
          parents="$(git show -s --format=%P HEAD)"
          first_parent="$(printf '%s' "$parents" | awk '{print $1}')"
          second_parent="$(printf '%s' "$parents" | awk '{print $2}')"
          test "$first_parent" = "$GITHUB_SHA"
          test "$second_parent" = "$PARENT_SHA"

          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:$GITHUB_REF_NAME"
