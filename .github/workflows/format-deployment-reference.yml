name: Format Production Deployment Reference

on:
  push:
    branches:
      - feat/production-deployment-reference
    paths:
      - '.github/workflows/format-deployment-reference.yml'
      - 'infra/deployment/**'
      - 'infra/kubernetes/base/workloads-*.yaml'

permissions:
  contents: write

concurrency:
  group: format-production-deployment-reference
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/production-deployment-reference
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply trusted registry aliases and format sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_names = (
              'web',
              'gateway',
              'identity-service',
              'planning-service',
              'habit-service',
              'review-service',
              'ai-service',
              'integration-calendar-service',
              'integration-service',
          )
          workload_paths = (
              Path('infra/kubernetes/base/workloads-public.yaml'),
              Path('infra/kubernetes/base/workloads-core.yaml'),
              Path('infra/kubernetes/base/workloads-integrations.yaml'),
          )
          for workload_path in workload_paths:
              content = workload_path.read_text(encoding='utf-8')
              for service_name in service_names:
                  content = content.replace(
                      f'image: life-os/{service_name}:local',
                      f'image: ghcr.io/contextualwisdomlab/life-os-{service_name}:local',
                  )
              workload_path.write_text(content, encoding='utf-8')

          test_path = Path(
              'infra/deployment/tests/deployment-contract.test.mjs',
          )
          test_content = test_path.read_text(encoding='utf-8')
          test_content = test_content.replace(
              '`life-os/${serviceName}:local`',
              '`ghcr.io/contextualwisdomlab/life-os-${serviceName}:local`',
          )
          test_content = test_content.replace(
              '/^\\s+- name: life-os\\//gm',
              '/^\\s+- name: ghcr.io\\/contextualwisdomlab\\/life-os-/gm',
          )
          test_path.write_text(test_content, encoding='utf-8')
          PY
          pnpm exec prettier --single-quote --write \
            infra/deployment/render-production-overlay.mjs \
            infra/deployment/validate-rendered-manifest.mjs \
            infra/deployment/create-provenance.mjs \
            infra/deployment/tests/deployment-contract.test.mjs
          git rm .github/workflows/format-deployment-reference.yml

      - name: Commit formatted and hardened sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            infra/deployment/render-production-overlay.mjs \
            infra/deployment/validate-rendered-manifest.mjs \
            infra/deployment/create-provenance.mjs \
            infra/deployment/tests/deployment-contract.test.mjs \
            infra/kubernetes/base/workloads-public.yaml \
            infra/kubernetes/base/workloads-core.yaml \
            infra/kubernetes/base/workloads-integrations.yaml \
            .github/workflows/format-deployment-reference.yml
          git diff --cached --check
          git commit -m 'fix(deploy): format helpers and trust registry aliases'
          git push origin HEAD:feat/production-deployment-reference
