name: Format Production Deployment Reference

on:
  push:
    branches:
      - feat/production-deployment-reference
    paths:
      - '.github/workflows/format-deployment-reference.yml'
      - 'infra/deployment/**'

permissions:
  contents: read

concurrency:
  group: format-production-deployment-reference
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format deployment helper sources
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            infra/deployment/render-production-overlay.mjs \
            infra/deployment/validate-rendered-manifest.mjs \
            infra/deployment/create-provenance.mjs \
            infra/deployment/tests/deployment-contract.test.mjs

      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formatted-production-deployment-reference
          path: |
            infra/deployment/render-production-overlay.mjs
            infra/deployment/validate-rendered-manifest.mjs
            infra/deployment/create-provenance.mjs
            infra/deployment/tests/deployment-contract.test.mjs
          if-no-files-found: error
          retention-days: 1
