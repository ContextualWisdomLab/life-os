name: Format Production Deployment Reference

on:
  push:
    branches:
      - feat/production-deployment-reference
    paths:
      - '.github/workflows/format-deployment-reference.yml'
      - 'infra/deployment/**'

permissions:
  contents: write

concurrency:
  group: format-production-deployment-reference
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/production-deployment-reference
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format deployment helper sources
        run: |
          set -euo pipefail
          pnpm exec prettier --single-quote --write \
            infra/deployment/render-production-overlay.mjs \
            infra/deployment/validate-rendered-manifest.mjs \
            infra/deployment/create-provenance.mjs \
            infra/deployment/tests/deployment-contract.test.mjs
          git rm .github/workflows/format-deployment-reference.yml

      - name: Commit formatted sources and remove formatter
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            infra/deployment/render-production-overlay.mjs \
            infra/deployment/validate-rendered-manifest.mjs \
            infra/deployment/create-provenance.mjs \
            infra/deployment/tests/deployment-contract.test.mjs \
            .github/workflows/format-deployment-reference.yml
          git diff --cached --check
          git commit -m 'chore(deploy): format production deployment helpers'
          git push origin HEAD:feat/production-deployment-reference
