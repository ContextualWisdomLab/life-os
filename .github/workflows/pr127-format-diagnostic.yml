name: PR 127 format diagnostic

on:
  push:
    branches:
      - feat/durable-today-sync

permissions:
  contents: read

jobs:
  format_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Enable Corepack
        run: corepack enable
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Emit canonical Prettier patch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/web/app/today-sync-client.ts
            apps/web/app/today-sync-client.test.ts
            apps/web/app/today-workspace-sync.ts
          )
          pnpm exec prettier --single-quote --write "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo 'No formatting drift remains.'
            exit 0
          fi
          echo '::group::PRETTIER_PATCH'
          git diff -- "${files[@]}"
          echo '::endgroup::'
          exit 1
