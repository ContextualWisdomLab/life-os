name: Verify Commercial Readiness Docstring Repair

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1

permissions:
  contents: read

concurrency:
  group: verify-commercial-readiness-docstring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact owner head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard semantic publication and exact remote head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor c6961c7b2f8b3ce8321327621ae4c60ee5d948b5 "$GITHUB_SHA"
          test ! -e .github/workflows/repair-commercial-readiness-docstring.yml
          mapfile -t changed_paths < <(git diff --name-only c6961c7b2f8b3ce8321327621ae4c60ee5d948b5 "$GITHUB_SHA")
          test "${#changed_paths[@]}" -eq 1
          test "${changed_paths[0]}" = ".github/workflows/verify-commercial-readiness-docstring-repair.yml"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove Commercial Readiness exact-head GREEN
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @life-os/commercial-readiness typecheck
          pnpm --filter @life-os/commercial-readiness test
          git diff --check
