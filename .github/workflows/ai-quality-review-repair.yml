name: AI quality review repair

on:
  push:
    branches:
      - chore/ai-service-quality-gates

permissions: {}

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chore/ai-service-quality-gates
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Strengthen redaction evidence and commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/ai-service/src/quality-coverage.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "    expect(JSON.stringify(logger.mock.calls)).not.toContain('password=secret');\n"
          new = """    const loggedOutput = logger.mock.calls
      .flat()
      .flatMap((value) =>
        value instanceof Error
          ? [value.name, value.message, value.stack ?? '']
          : [typeof value === 'string' ? value : JSON.stringify(value)],
      )
      .join('\\n');
    expect(loggedOutput).not.toContain('password=secret');
"""
          if text.count(old) != 1:
              raise SystemExit('redaction assertion pattern mismatch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --single-quote --write apps/ai-service/src/quality-coverage.test.ts
          pnpm --filter @life-os/ai-service test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/ai-service/src/quality-coverage.test.ts
          git diff --cached --check
          git commit -m 'test(ai): inspect error details in redaction evidence'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:chore/ai-service-quality-gates
