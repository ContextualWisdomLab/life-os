name: Refresh LifeOS Integration baseline currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: refresh-lifeos-integration-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Replace bounded Integration currentness and retire writer
        env:
          WRITER_PATH: .github/workflows/refresh-lifeos-integration-baseline.yml
          TARGET_PATH: docs/product-technical-gap-baseline.md
          BRANCH_NAME: docs/product-gap-baseline-2026-08-20
          INPUT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('docs/product-technical-gap-baseline.md')
          text = target.read_text()
          old = "Remaining LifeOS-owned delivery work is bounded provider execution/outcome integration, operator-visible status and restart/recovery acceptance."
          new = """#258 is the direct #257 child and remains Draft/unshipped. Exact proof head `8855427b8fcfa3b364223e91cd088546df84d684`, run `34276065348`, job `102229247458`, completed GREEN on Ubuntu 24.04/PostgreSQL 16.15 after two chronology reviews: application evidence and PostgreSQL repository evidence both now reject a durable `updated_at` later than the trusted status-read instant. Focused status/restart acceptance passed 2 files / 10 tests, Integration typecheck passed, and the complete Integration suite passed 460 tests with 3 environment-dependent skips across 81 files (79 passed / 2 skipped). Current #258 exact `33d15c0d40806bb6a76f291dd265690f94c34186` removes only the purpose-complete verifier. The read remains exact delivery/workspace/requesting-user scoped, credential-free and restart-recoverable; it exposes derived claim state rather than claim token/digest and grants no provider-execution or outbound-network authority. Remaining LifeOS-owned delivery work is bounded provider execution/outcome integration and authenticated operator HTTP composition; outbound I/O must continue to fail closed until an immutable released/versioned canonical egress contract is available."""
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Integration currentness target, found {count}')
          target.write_text(text.replace(old, new, 1))
          Path('.github/workflows/refresh-lifeos-integration-baseline.yml').unlink()
          PY
          git diff --check
          git diff -- "$TARGET_PATH" "$WRITER_PATH"

      - name: Publish only if branch head is unchanged
        env:
          BRANCH_NAME: docs/product-gap-baseline-2026-08-20
          INPUT_SHA: ${{ github.sha }}
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH_NAME}" | cut -f1)"
          test "$remote_head" = "$INPUT_SHA"
          git config user.name "LifeOS documentation writer"
          git config user.email "actions@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md .github/workflows/refresh-lifeos-integration-baseline.yml
          git commit -m "docs: refresh plugin delivery status currentness"
          git push origin "HEAD:${BRANCH_NAME}"
