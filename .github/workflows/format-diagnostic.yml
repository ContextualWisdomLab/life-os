name: Format Diagnostic

on:
  push:
    branches:
      - feat/ai-nim-live-conformance

permissions:
  contents: read

concurrency:
  group: format-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Format diagnostic files
        run: |
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/proposal-quality-live-conformance-review.test.ts \
            apps/ai-service/src/proposal-quality-live-workflow.test.ts

      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-live-conformance-tests
          path: |
            apps/ai-service/src/proposal-quality-live-conformance-review.test.ts
            apps/ai-service/src/proposal-quality-live-workflow.test.ts
          if-no-files-found: error
          retention-days: 1
