name: AI Audit Formatting Diagnostic

on:
  push:
    branches:
      - feat/ai-proposal-audit-api

permissions:
  contents: read

concurrency:
  group: ai-audit-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format failing files
        run: >-
          pnpm exec prettier --single-quote --write
          apps/ai-service/src/main.ts
          apps/ai-service/src/proposal-audit-application.ts
          apps/ai-service/src/proposal-audit-application.test.ts
          apps/ai-service/src/ai-runtime.ts
          apps/ai-service/src/ai-runtime.test.ts
          apps/ai-service/src/proposal-audit-http.integration.test.ts
          docs/superpowers/plans/2026-08-04-ai-proposal-audit-api-slice.md
      - name: Package formatted sources
        run: >-
          tar -czf formatted-ai-audit.tar.gz
          apps/ai-service/src/main.ts
          apps/ai-service/src/proposal-audit-application.ts
          apps/ai-service/src/proposal-audit-application.test.ts
          apps/ai-service/src/ai-runtime.ts
          apps/ai-service/src/ai-runtime.test.ts
          apps/ai-service/src/proposal-audit-http.integration.test.ts
          docs/superpowers/plans/2026-08-04-ai-proposal-audit-api-slice.md
      - name: Upload formatted sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: formatted-ai-audit-${{ github.sha }}
          path: formatted-ai-audit.tar.gz
          retention-days: 1
          if-no-files-found: error
