name: AI Audit Formatting Diagnostic

on:
  push:
    branches:
      - feat/ai-proposal-audit-api

permissions:
  contents: write

concurrency:
  group: ai-audit-format-write
  cancel-in-progress: false

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ai-proposal-audit-api
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format failing files and remove diagnostic workflow
        run: |
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/main.ts \
            apps/ai-service/src/proposal-audit-application.ts \
            apps/ai-service/src/proposal-audit-application.test.ts \
            apps/ai-service/src/ai-runtime.ts \
            apps/ai-service/src/ai-runtime.test.ts \
            apps/ai-service/src/proposal-audit-http.integration.test.ts \
            docs/superpowers/plans/2026-08-04-ai-proposal-audit-api-slice.md
          rm .github/workflows/format-diagnostic.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/format-diagnostic.yml \
            apps/ai-service/src/main.ts \
            apps/ai-service/src/proposal-audit-application.ts \
            apps/ai-service/src/proposal-audit-application.test.ts \
            apps/ai-service/src/ai-runtime.ts \
            apps/ai-service/src/ai-runtime.test.ts \
            apps/ai-service/src/proposal-audit-http.integration.test.ts \
            docs/superpowers/plans/2026-08-04-ai-proposal-audit-api-slice.md
          git commit -m "style(ai): format proposal audit API"
          git push origin HEAD:feat/ai-proposal-audit-api
