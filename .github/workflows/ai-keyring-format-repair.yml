name: AI keyring format repair

on:
  push:
    branches:
      - feat/ai-gateway-key-rotation

permissions: {}

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ai-gateway-key-rotation
          fetch-depth: 0
          persist-credentials: false

      - name: Format and commit keyring evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prettier --single-quote --write \
            apps/ai-service/src/ai-gateway-keyring.ts \
            apps/ai-service/src/ai-gateway-keyring.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/ai-service/src/ai-gateway-keyring.ts \
            apps/ai-service/src/ai-gateway-keyring.test.ts
          git diff --cached --check
          git commit -m 'style(ai): format gateway keyring evidence'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-gateway-key-rotation
