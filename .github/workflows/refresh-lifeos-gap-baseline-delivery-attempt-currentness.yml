name: Refresh LifeOS delivery-attempt currentness

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]

permissions:
  contents: write

concurrency:
  group: refresh-lifeos-delivery-attempt-currentness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-and-retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact documentation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refresh bounded Integration currentness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '> **Currentness override — 2026-09-08 Integration delivery authority.**'
          end_marker = '\n\n## Canonical architecture and evidence rules'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('baseline currentness markers are not unique')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''> **Currentness override — 2026-09-08 Integration delivery authority.** Draft #250 is exact `be4a209d56efe928c61d9d6cc3ce43a830fa2986`, stacked on #245. Hosted verifier run `34182864012`, job `101925292293`, passed canonical formatting, focused delivery-origin contract, Integration typecheck, Plugin SDK build, and the complete Integration suite on predecessor `2459058f2b84c19d9bc74604474483a64bec93ef`; its retention descendant removes only the purpose-complete verifier. Draft #251 is stacked exactly on #250 and current at `5641005c5ed0193b6206848f9c4c807050271ef7`. Hosted run `34186936889`, job `101937064591`, proved the exact parent lacks the HTTP routes, proved the pre-repair percent-encoded raw-route/HMAC alias defect, then passed the minimum raw-method/raw-URL binding repair with focused real-HTTP GREEN 2 files / 4 tests, Integration typecheck, and the complete Integration suite at 59 files / 376 tests with 5 files / 17 environment-dependent tests skipped. The successful run ordinary-pushed the retained source and removed only its purpose-complete verifier. Draft #252 is a separate durable delivery-attempt admission slice based directly on #245. Run `34189756254`, job `101945221002`, on `41e8df4a3dbd42795adea4209e8d452294322f1e` acquired a real Ubuntu 24.04 runner, passed frozen install, Plugin SDK build and both committed RED proofs, then canonicalized only the five owned TypeScript files and ordinary-pushed formatting descendant `3e0c8b93bacb8b306c9aa05df41722645f6ee716`; semantic GREEN steps were intentionally skipped. Fresh review found the remaining verifier defect: that workflow relied on its own `GITHUB_TOKEN` push to start the required successor run, but GitHub suppresses recursive workflow triggering for such pushes. Minimum harness repair `db74bfe09f4c90adfc8b62acab5736d80edd94d3` removes self-format/self-trigger reliance and requires check-only canonical formatting, focused application/repository/real-PostgreSQL GREEN, Integration typecheck and the complete Integration suite before verifier retirement. Exact-head run `34193116872`, job `101955068900`, is queued on `db74bfe...`; queue state is not GREEN. Neither #250, #251 nor #252 authorizes outbound HTTPS; durable origin or attempt identity remains distinct from connect-time egress authorization, which must consume immutable released owner authority rather than copied mutable sibling source.'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          git diff --check

      - name: Publish currentness and retire writer
        shell: bash
        env:
          TARGET_BRANCH: docs/product-gap-baseline-2026-08-20
        run: |
          set -euo pipefail
          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/refresh-lifeos-gap-baseline-delivery-attempt-currentness.yml
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/refresh-lifeos-gap-baseline-delivery-attempt-currentness.yml' 'docs/product-technical-gap-baseline.md' | sort)"
          test "${actual}" = "${expected}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(product): refresh delivery-attempt currentness"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
