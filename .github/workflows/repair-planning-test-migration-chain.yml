name: Repair Planning PostgreSQL fixture migration chain

on:
  push:
    branches: [feat/planning-task-completion-chronology-v1]
    paths:
      - .github/workflows/repair-planning-test-migration-chain.yml

permissions:
  contents: write

concurrency:
  group: repair-planning-test-migration-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_test
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: life_os_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Prove fixture schema drift against real PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          files=(
            apps/planning-service/src/postgres-planning-repository.integration.test.ts
            apps/planning-service/tests/postgres-data-rights.integration.test.ts
            apps/planning-service/tests/postgres-today-lock-order.integration.test.ts
          )
          red=0
          for file in "${files[@]}"; do
            psql "$PLANNING_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS planning CASCADE' >/dev/null
            mapfile -t migrations < <(grep -oE "'000[0-9]_[^']+\.sql'" "$file" | tr -d "'")
            for migration in "${migrations[@]}"; do
              psql "$PLANNING_DATABASE_URL" -v ON_ERROR_STOP=1 -f "apps/planning-service/migrations/$migration" >/dev/null
            done
            state="$(psql "$PLANNING_DATABASE_URL" -Atc "SELECT COALESCE((SELECT convalidated::text FROM pg_constraint WHERE conname = 'tasks_completion_state_check' LIMIT 1), 'missing')")"
            if [[ "$state" == "t" ]]; then
              echo "Unexpectedly current fixture: $file"
            else
              echo "Reality RED: $file produced tasks_completion_state_check=$state"
              red=$((red + 1))
            fi
          done
          test "$red" -eq 3

      - name: Repair explicit migration lists
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const edits = [
            {
              path: 'apps/planning-service/src/postgres-planning-repository.integration.test.ts',
              from: "    '0003_durable_today_sync.sql',\n",
              to: "    '0003_durable_today_sync.sql',\n    '0004_data_rights_erasure_receipts.sql',\n    '0005_task_completion_chronology.sql',\n    '0006_validate_task_completion_chronology.sql',\n",
            },
            {
              path: 'apps/planning-service/tests/postgres-data-rights.integration.test.ts',
              from: "    '0004_data_rights_erasure_receipts.sql',\n",
              to: "    '0004_data_rights_erasure_receipts.sql',\n    '0005_task_completion_chronology.sql',\n    '0006_validate_task_completion_chronology.sql',\n",
            },
            {
              path: 'apps/planning-service/tests/postgres-today-lock-order.integration.test.ts',
              from: "    '0003_durable_today_sync.sql',\n",
              to: "    '0003_durable_today_sync.sql',\n    '0004_data_rights_erasure_receipts.sql',\n    '0005_task_completion_chronology.sql',\n    '0006_validate_task_completion_chronology.sql',\n",
            },
          ];
          for (const edit of edits) {
            const input = fs.readFileSync(edit.path, 'utf8');
            if (!input.includes(edit.from)) throw new Error(`repair anchor missing: ${edit.path}`);
            const output = input.replace(edit.from, edit.to);
            if (output === input) throw new Error(`repair made no change: ${edit.path}`);
            fs.writeFileSync(edit.path, output);
          }
          NODE

      - name: Check formatting and diff hygiene
        run: |
          pnpm exec prettier --write \
            apps/planning-service/src/postgres-planning-repository.integration.test.ts \
            apps/planning-service/tests/postgres-data-rights.integration.test.ts \
            apps/planning-service/tests/postgres-today-lock-order.integration.test.ts
          pnpm exec prettier --check \
            apps/planning-service/src/postgres-planning-repository.integration.test.ts \
            apps/planning-service/tests/postgres-data-rights.integration.test.ts \
            apps/planning-service/tests/postgres-today-lock-order.integration.test.ts
          git diff --check

      - name: Verify current-schema PostgreSQL fixtures
        run: >-
          pnpm --filter @life-os/planning-service exec vitest run
          src/postgres-planning-repository.integration.test.ts
          tests/postgres-data-rights.integration.test.ts
          tests/postgres-today-lock-order.integration.test.ts

      - name: Verify Planning typecheck and build
        run: |
          pnpm --filter @life-os/planning-service typecheck
          pnpm --filter @life-os/planning-service build

      - name: Publish only from the exact input head
        env:
          INPUT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_head" = "$INPUT_SHA"
          rm .github/workflows/repair-planning-test-migration-chain.yml
          git add \
            apps/planning-service/src/postgres-planning-repository.integration.test.ts \
            apps/planning-service/tests/postgres-data-rights.integration.test.ts \
            apps/planning-service/tests/postgres-today-lock-order.integration.test.ts \
            .github/workflows/repair-planning-test-migration-chain.yml
          git diff --cached --check
          git config user.name 'LifeOS Maintainer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(planning): keep PostgreSQL fixtures on current migrations'
          git push origin "HEAD:$BRANCH"
