name: AI quality gate repair

on:
  push:
    branches: [chore/ai-service-quality-gates]

permissions:
  contents: write

concurrency:
  group: ai-quality-gate-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/ai-service-quality-gates
          fetch-depth: 0
          persist-credentials: false

      - name: Apply reviewed manifest and dependency repairs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          pnpm = package.setdefault('pnpm', {})
          overrides = pnpm.setdefault('overrides', {})
          overrides['postcss'] = '8.5.23'
          overrides['sharp'] = '0.35.0'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          capability_path = Path('product/capabilities.json')
          manifest = json.loads(capability_path.read_text(encoding='utf-8'))
          capability = next(
              item
              for item in manifest['capabilities']
              if item['id'] == 'quality.ai-audit-assurance'
          )
          evidence = next(
              item
              for item in capability['evidence']
              if item['path'] == 'apps/ai-service/vitest.config.ts'
              and item['mode'] == 'contains'
          )
          evidence['kind'] = 'implementation'
          capability_path.write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Regenerate reproducible lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit repair for exact-head verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/ai-quality-gate-repair.yml
          git add package.json pnpm-lock.yaml product/capabilities.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No AI quality gate repair was produced.' >&2
            exit 1
          fi
          git commit -m "fix(ai): repair quality gate evidence and dependencies"
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:chore/ai-service-quality-gates
