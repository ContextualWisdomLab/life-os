name: Verify Plugin Delivery Status HTTP

on:
  push:
    branches: [feat/plugin-delivery-attempt-status-http-v1]

permissions:
  contents: read

concurrency:
  group: plugin-delivery-status-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Plugin SDK
        run: pnpm --filter @life-os/plugin-sdk build

      - name: Run status HTTP regression
        run: >-
          pnpm --filter @life-os/integration-service exec vitest run
          src/plugin-delivery-attempt-status-http.integration.test.ts

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --check
          apps/integration-service/src/plugin-delivery-attempt-status-http.integration.test.ts
          .github/workflows/verify-plugin-delivery-status-http.yml

      - name: Typecheck Integration
        run: pnpm --filter @life-os/integration-service typecheck

      - name: Run complete Integration suite
        run: pnpm --filter @life-os/integration-service test
