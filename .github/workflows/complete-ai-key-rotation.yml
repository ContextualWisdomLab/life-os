name: Complete AI Gateway Key Rotation

on:
  push:
    branches:
      - feat/ai-gateway-key-rotation
    paths:
      - '.github/workflows/complete-ai-key-rotation.yml'

permissions:
  contents: write

concurrency:
  group: complete-ai-gateway-key-rotation
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-gateway-key-rotation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@fdbd5b5d6a1c9bb1f77880bc2f733d820f4737e0 # v6.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Wire keyed context through web and test boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # Web transport core: active-only signer and v2 keyed canonical input.
          path = 'apps/web/app/ai-proposal-client-core.ts'
          text = read(path)
          text = replace_once(
              text,
              "const CANONICAL_UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;\n",
              "const CANONICAL_UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/u;\nconst AI_GATEWAY_KEY_ID_PATTERN = /^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$/u;\n",
              'web key-id pattern',
          )
          text = replace_once(
              text,
              "export interface AiSessionPrincipal {\n  readonly workspaceId: string;\n  readonly actorId: string;\n}\n",
              "export interface AiSessionPrincipal {\n  readonly workspaceId: string;\n  readonly actorId: string;\n}\n\n/** Active server-only key used to sign one exact AI service request. */\nexport interface AiGatewaySigningKey {\n  readonly keyId: string;\n  readonly secret: string;\n}\n",
              'web signing key interface',
          )
          marker = """export function requireAiGatewaySecret(value: string | undefined): string {
            if (typeof value !== 'string') {
              throw new Error('AI gateway context secret is invalid');
            }
            const bytes = Buffer.byteLength(value, 'utf8');
            if (
              bytes < MINIMUM_GATEWAY_SECRET_BYTES ||
              bytes > MAXIMUM_GATEWAY_SECRET_BYTES ||
              /[\\r\\n\\u0000]/u.test(value)
            ) {
              throw new Error('AI gateway context secret is invalid');
            }
            return value;
          }
          """.replace('          ', '')
          addition = marker + """
          /** Requires one bounded case-sensitive key identifier. */
          export function requireAiGatewayKeyId(value: string | undefined): string {
            if (typeof value !== 'string' || !AI_GATEWAY_KEY_ID_PATTERN.test(value)) {
              throw new Error('AI gateway context key identifier is invalid');
            }
            return value;
          }

          /** Parses exactly the active web signing pair and exposes no previous key. */
          export function requireAiGatewaySigningKey(
            environment: WebEnvironment,
          ): AiGatewaySigningKey {
            return Object.freeze({
              keyId: requireAiGatewayKeyId(environment.AI_GATEWAY_ACTIVE_KEY_ID),
              secret: requireAiGatewaySecret(
                environment.AI_GATEWAY_ACTIVE_KEY_SECRET,
              ),
            });
          }
          """.replace('          ', '')
          text = replace_once(text, marker, addition, 'web signing parser')

          old_create = """/** Creates an exact short-lived method-and-path-bound AI service context. */
          export function createAiContextHeaders(
            workspaceId: string,
            actorId: string,
            secretValue: string,
            nowSeconds: number,
            methodValue: unknown,
            pathValue: unknown,
          ): Readonly<Record<string, string>> {
            const safeWorkspaceId = requireUuid(
              workspaceId,
              'AI gateway context is invalid',
            );
            const safeActorId = requireUuid(actorId, 'AI gateway context is invalid');
            const secret = requireAiGatewaySecret(secretValue);
            const { method, path } = requireAiTarget(methodValue, pathValue);
            if (!Number.isSafeInteger(nowSeconds) || nowSeconds < 0) {
              throw new Error('AI gateway context is invalid');
            }
            const issuedAt = String(nowSeconds);
            const signature = createHmac('sha256', secret)
              .update(
                `life-os.ai-context.v1\\n${safeWorkspaceId}\\n${safeActorId}\\n${issuedAt}\\n${method}\\n${path}`,
                'utf8',
              )
              .digest('base64url');
            return Object.freeze({
              'x-life-os-workspace-id': safeWorkspaceId,
              'x-life-os-actor-id': safeActorId,
              'x-life-os-context-issued-at': issuedAt,
              'x-life-os-context-signature': signature,
            });
          }
          """.replace('          ', '')
          new_create = """/** Creates an exact short-lived method-and-path-bound AI service context. */
          export function createAiContextHeaders(
            workspaceId: string,
            actorId: string,
            signingKeyValue: AiGatewaySigningKey,
            nowSeconds: number,
            methodValue: unknown,
            pathValue: unknown,
          ): Readonly<Record<string, string>> {
            const safeWorkspaceId = requireUuid(
              workspaceId,
              'AI gateway context is invalid',
            );
            const safeActorId = requireUuid(actorId, 'AI gateway context is invalid');
            const signingKey = Object.freeze({
              keyId: requireAiGatewayKeyId(signingKeyValue?.keyId),
              secret: requireAiGatewaySecret(signingKeyValue?.secret),
            });
            const { method, path } = requireAiTarget(methodValue, pathValue);
            if (!Number.isSafeInteger(nowSeconds) || nowSeconds < 0) {
              throw new Error('AI gateway context is invalid');
            }
            const issuedAt = String(nowSeconds);
            const signature = createHmac('sha256', signingKey.secret)
              .update(
                `life-os.ai-context.v2\\n${signingKey.keyId}\\n${safeWorkspaceId}\\n${safeActorId}\\n${issuedAt}\\n${method}\\n${path}`,
                'utf8',
              )
              .digest('base64url');
            return Object.freeze({
              'x-life-os-context-key-id': signingKey.keyId,
              'x-life-os-workspace-id': safeWorkspaceId,
              'x-life-os-actor-id': safeActorId,
              'x-life-os-context-issued-at': issuedAt,
              'x-life-os-context-signature': signature,
            });
          }
          """.replace('          ', '')
          text = replace_once(text, old_create, new_create, 'web v2 context creator')
          text = replace_once(
              text,
              "    const secret = requireAiGatewaySecret(\n      environment.AI_GATEWAY_CONTEXT_SECRET,\n    );\n",
              "    const signingKey = requireAiGatewaySigningKey(environment);\n",
              'web active signer environment',
          )
          text = replace_once(
              text,
              "      secret,\n      nowSeconds,\n      parsedRequest.method,\n",
              "      signingKey,\n      nowSeconds,\n      parsedRequest.method,\n",
              'web signer call',
          )
          write(path, text)

          # Re-export the keyed signing API.
          path = 'apps/web/app/ai-proposal-client.ts'
          text = read(path)
          text = text.replace(
              "  parseAiSessionPrincipal,\n  requireAiGatewaySecret,\n",
              "  parseAiSessionPrincipal,\n  requireAiGatewayKeyId,\n  requireAiGatewaySecret,\n  requireAiGatewaySigningKey,\n",
          )
          text = text.replace(
              "  type AiProposalRoute,\n  type AiSessionPrincipal,\n",
              "  type AiProposalRoute,\n  type AiGatewaySigningKey,\n  type AiSessionPrincipal,\n",
          )
          text = text.replace(
              "  parseAiSessionPrincipal,\n  requireAiGatewaySecret,\n",
              "  parseAiSessionPrincipal,\n  requireAiGatewayKeyId,\n  requireAiGatewaySecret,\n  requireAiGatewaySigningKey,\n",
              1,
          )
          text = text.replace(
              "export type { AiProposalFetch, AiProposalRoute, AiSessionPrincipal };",
              "export type {\n  AiGatewaySigningKey,\n  AiProposalFetch,\n  AiProposalRoute,\n  AiSessionPrincipal,\n};",
          )
          write(path, text)

          # Web transport evidence.
          path = 'apps/web/app/ai-proposal-client.test.ts'
          text = read(path)
          text = text.replace(
              "  parseAiSessionPrincipal,\n  requireAiGatewaySecret,\n",
              "  parseAiSessionPrincipal,\n  requireAiGatewayKeyId,\n  requireAiGatewaySecret,\n  requireAiGatewaySigningKey,\n",
          )
          text = text.replace(
              "const GATEWAY_SECRET = Buffer.alloc(32, 7).toString('base64url');",
              "const ACTIVE_KEY_ID = 'gateway-2026-08-a';\nconst GATEWAY_SECRET = Buffer.alloc(32, 7).toString('base64url');",
          )
          text = text.replace(
              "  AI_GATEWAY_CONTEXT_SECRET: GATEWAY_SECRET,",
              "  AI_GATEWAY_ACTIVE_KEY_ID: ACTIVE_KEY_ID,\n  AI_GATEWAY_ACTIVE_KEY_SECRET: GATEWAY_SECRET,",
          )
          text = text.replace(
              "`life-os.ai-context.v1\\n${WORKSPACE_ID}\\n${ACTOR_ID}\\n${NOW_SECONDS}\\n${method}\\n${path}`",
              "`life-os.ai-context.v2\\n${ACTIVE_KEY_ID}\\n${WORKSPACE_ID}\\n${ACTOR_ID}\\n${NOW_SECONDS}\\n${method}\\n${path}`",
          )
          text = replace_once(
              text,
              "    assert.equal(aiHeaders.get('x-life-os-workspace-id'), WORKSPACE_ID);\n",
              "    assert.equal(aiHeaders.get('x-life-os-context-key-id'), ACTIVE_KEY_ID);\n    assert.equal(aiHeaders.get('x-life-os-workspace-id'), WORKSPACE_ID);\n",
              'web forwarded key header assertion',
          )
          text = text.replace(
              "environment: { ...environment, AI_GATEWAY_CONTEXT_SECRET: 'short' },",
              "environment: { ...environment, AI_GATEWAY_ACTIVE_KEY_SECRET: 'short' },",
          )
          text = replace_once(
              text,
              "    assert.equal(requireAiGatewaySecret(GATEWAY_SECRET), GATEWAY_SECRET);\n",
              "    assert.equal(requireAiGatewayKeyId(ACTIVE_KEY_ID), ACTIVE_KEY_ID);\n    assert.equal(requireAiGatewaySecret(GATEWAY_SECRET), GATEWAY_SECRET);\n    assert.deepEqual(requireAiGatewaySigningKey(environment), {\n      keyId: ACTIVE_KEY_ID,\n      secret: GATEWAY_SECRET,\n    });\n",
              'web helper key assertions',
          )
          text = text.replace(
              "      GATEWAY_SECRET,\n      NOW_SECONDS,",
              "      { keyId: ACTIVE_KEY_ID, secret: GATEWAY_SECRET },\n      NOW_SECONDS,",
          )
          text = replace_once(
              text,
              "    assert.equal(headers['x-life-os-workspace-id'], WORKSPACE_ID);\n",
              "    assert.equal(headers['x-life-os-context-key-id'], ACTIVE_KEY_ID);\n    assert.equal(headers['x-life-os-workspace-id'], WORKSPACE_ID);\n",
              'web helper key header assertion',
          )
          text = replace_once(
              text,
              "    for (const secret of [\n",
              "    for (const keyId of ['', '-leading', 'white space', 'a'.repeat(65)]) {\n      assert.throws(\n        () => requireAiGatewayKeyId(keyId),\n        new Error('AI gateway context key identifier is invalid'),\n      );\n    }\n    for (const secret of [\n",
              'web invalid key-id helpers',
          )
          write(path, text)

          # Other web tests use active-only server configuration.
          for path in [
              'apps/web/app/ai-proposal-scope-regression.test.ts',
              'apps/web/app/ai-proposal-identity-stream-regression.test.ts',
          ]:
              text = read(path)
              const_name = 'SECRET' if 'scope' in path else 'GATEWAY_SECRET'
              text = text.replace(
                  f"const {const_name} =",
                  "const ACTIVE_KEY_ID = 'gateway-2026-08-a';\n" + f"const {const_name} =",
                  1,
              )
              text = text.replace(
                  f"  AI_GATEWAY_CONTEXT_SECRET: {const_name},",
                  f"  AI_GATEWAY_ACTIVE_KEY_ID: ACTIVE_KEY_ID,\n  AI_GATEWAY_ACTIVE_KEY_SECRET: {const_name},",
              )
              write(path, text)

          # Next.js route integration uses both active environment fields.
          path = 'apps/web/app/api/ai/proposals/routes.test.ts'
          text = read(path)
          text = text.replace(
              "const SECRET = 'trusted-ai-gateway-context-secret-32-bytes';",
              "const ACTIVE_KEY_ID = 'gateway-2026-08-a';\nconst SECRET = 'trusted-ai-gateway-context-secret-32-bytes';",
          )
          text = text.replace(
              "    const originalSecret = process.env.AI_GATEWAY_CONTEXT_SECRET;",
              "    const originalKeyId = process.env.AI_GATEWAY_ACTIVE_KEY_ID;\n    const originalSecret = process.env.AI_GATEWAY_ACTIVE_KEY_SECRET;",
          )
          text = text.replace(
              "    process.env.AI_GATEWAY_CONTEXT_SECRET = SECRET;",
              "    process.env.AI_GATEWAY_ACTIVE_KEY_ID = ACTIVE_KEY_ID;\n    process.env.AI_GATEWAY_ACTIVE_KEY_SECRET = SECRET;",
          )
          text = text.replace(
              "      if (originalSecret === undefined) {\n        delete process.env.AI_GATEWAY_CONTEXT_SECRET;\n      } else {\n        process.env.AI_GATEWAY_CONTEXT_SECRET = originalSecret;\n      }",
              "      if (originalKeyId === undefined) {\n        delete process.env.AI_GATEWAY_ACTIVE_KEY_ID;\n      } else {\n        process.env.AI_GATEWAY_ACTIVE_KEY_ID = originalKeyId;\n      }\n      if (originalSecret === undefined) {\n        delete process.env.AI_GATEWAY_ACTIVE_KEY_SECRET;\n      } else {\n        process.env.AI_GATEWAY_ACTIVE_KEY_SECRET = originalSecret;\n      }",
          )
          write(path, text)

          # AI unit/controller coverage: v2 signatures and five-header calls.
          path = 'apps/ai-service/src/quality-coverage.test.ts'
          text = read(path)
          text = text.replace(
              "const GATEWAY_SECRET = Buffer.alloc(32, 0x51).toString('base64url');",
              "const GATEWAY_KEY_ID = 'gateway-2026-08-a';\nconst GATEWAY_SECRET = Buffer.alloc(32, 0x51).toString('base64url');",
          )
          text = text.replace(
              "interface SignedControllerContext {\n  readonly workspaceId: string;",
              "interface SignedControllerContext {\n  readonly keyId: string;\n  readonly workspaceId: string;",
          )
          text = text.replace(
              "`life-os.ai-context.v1\\n${WORKSPACE_ID}\\n${ACTOR_ID}\\n${issuedAt}\\n${method}\\n${path}`",
              "`life-os.ai-context.v2\\n${GATEWAY_KEY_ID}\\n${WORKSPACE_ID}\\n${ACTOR_ID}\\n${issuedAt}\\n${method}\\n${path}`",
          )
          text = text.replace(
              "  return {\n    workspaceId: WORKSPACE_ID,",
              "  return {\n    keyId: GATEWAY_KEY_ID,\n    workspaceId: WORKSPACE_ID,",
              1,
          )
          text = text.replace(
              "    vi.stubEnv('AI_GATEWAY_CONTEXT_SECRET', GATEWAY_SECRET);",
              "    vi.stubEnv('AI_GATEWAY_ACTIVE_KEY_ID', GATEWAY_KEY_ID);\n    vi.stubEnv('AI_GATEWAY_ACTIVE_KEY_SECRET', GATEWAY_SECRET);",
          )
          for variable in [
              'proposalContext',
              'listContext',
              'detailContext',
              'decisionsReadContext',
              'decisionsWriteContext',
          ]:
              text = text.replace(
                  f"(\n        {variable}.workspaceId,",
                  f"(\n        {variable}.keyId,\n        {variable}.workspaceId,",
              )
              text = text.replace(
                  f"(\n          {variable}.workspaceId,",
                  f"(\n          {variable}.keyId,\n          {variable}.workspaceId,",
              )
              text = text.replace(
                  f"(\n        undefined,\n        {variable}.actorId,",
                  f"(\n        {variable}.keyId,\n        undefined,\n        {variable}.actorId,",
              )
          # Actor-missing decision call still needs a key identifier first.
          text = text.replace(
              "controller.appendDecision(\n        decisionsWriteContext.workspaceId,\n        undefined,",
              "controller.appendDecision(\n        decisionsWriteContext.keyId,\n        decisionsWriteContext.workspaceId,\n        undefined,",
          )
          write(path, text)

          # No-silent-mutation HTTP integration.
          path = 'apps/ai-service/src/no-silent-mutation.integration.test.ts'
          text = read(path)
          text = text.replace(
              "const GATEWAY_SECRET = Buffer.alloc(32, 7).toString('base64url');",
              "const GATEWAY_KEY_ID = 'gateway-2026-08-a';\nconst GATEWAY_SECRET = Buffer.alloc(32, 7).toString('base64url');",
          )
          text = text.replace(
              "`life-os.ai-context.v1\\n${WORKSPACE_ID}\\n${ACTOR_ID}\\n${issuedAt}\\nPOST\\n${path}`",
              "`life-os.ai-context.v2\\n${GATEWAY_KEY_ID}\\n${WORKSPACE_ID}\\n${ACTOR_ID}\\n${issuedAt}\\nPOST\\n${path}`",
          )
          text = text.replace(
              "  return {\n    'x-life-os-workspace-id': WORKSPACE_ID,",
              "  return {\n    'x-life-os-context-key-id': GATEWAY_KEY_ID,\n    'x-life-os-workspace-id': WORKSPACE_ID,",
          )
          text = text.replace(
              "    const originalSecret = process.env.AI_GATEWAY_CONTEXT_SECRET;\n    process.env.AI_GATEWAY_CONTEXT_SECRET = GATEWAY_SECRET;",
              "    const originalKeyId = process.env.AI_GATEWAY_ACTIVE_KEY_ID;\n    const originalSecret = process.env.AI_GATEWAY_ACTIVE_KEY_SECRET;\n    process.env.AI_GATEWAY_ACTIVE_KEY_ID = GATEWAY_KEY_ID;\n    process.env.AI_GATEWAY_ACTIVE_KEY_SECRET = GATEWAY_SECRET;",
          )
          text = text.replace(
              "      if (originalSecret === undefined) {\n        delete process.env.AI_GATEWAY_CONTEXT_SECRET;\n      } else {\n        process.env.AI_GATEWAY_CONTEXT_SECRET = originalSecret;\n      }",
              "      if (originalKeyId === undefined) {\n        delete process.env.AI_GATEWAY_ACTIVE_KEY_ID;\n      } else {\n        process.env.AI_GATEWAY_ACTIVE_KEY_ID = originalKeyId;\n      }\n      if (originalSecret === undefined) {\n        delete process.env.AI_GATEWAY_ACTIVE_KEY_SECRET;\n      } else {\n        process.env.AI_GATEWAY_ACTIVE_KEY_SECRET = originalSecret;\n      }",
          )
          write(path, text)

          # Production PostgreSQL HTTP integration and rotation lifecycle evidence.
          path = 'apps/ai-service/src/proposal-audit-http.integration.test.ts'
          text = read(path)
          text = text.replace(
              "const ORIGINAL_GATEWAY_CONTEXT_SECRET = process.env.AI_GATEWAY_CONTEXT_SECRET;\nconst GATEWAY_CONTEXT_SECRET = 'ai-http-integration-gateway-secret-32-bytes';",
              "const ORIGINAL_ACTIVE_KEY_ID = process.env.AI_GATEWAY_ACTIVE_KEY_ID;\nconst ORIGINAL_ACTIVE_KEY_SECRET = process.env.AI_GATEWAY_ACTIVE_KEY_SECRET;\nconst ORIGINAL_PREVIOUS_KEY_ID = process.env.AI_GATEWAY_PREVIOUS_KEY_ID;\nconst ORIGINAL_PREVIOUS_KEY_SECRET = process.env.AI_GATEWAY_PREVIOUS_KEY_SECRET;\nconst ACTIVE_KEY_ID = 'gateway-2026-08-b';\nconst PREVIOUS_KEY_ID = 'gateway-2026-07-a';\nconst ACTIVE_KEY_SECRET = Buffer.alloc(32, 0x41).toString('base64url');\nconst PREVIOUS_KEY_SECRET = Buffer.alloc(32, 0x42).toString('base64url');",
          )
          text = text.replace(
              "  secret?: string;\n}",
              "  keyId?: string;\n  secret?: string;\n}",
              1,
          )
          text = text.replace(
              "  const signature = createHmac('sha256', input.secret ?? GATEWAY_CONTEXT_SECRET)\n    .update(\n      `life-os.ai-context.v1\\n${workspaceId}\\n${actorId}\\n${issuedAt}\\n${input.method}\\n${input.path}`,
              "  const keyId = input.keyId ?? ACTIVE_KEY_ID;\n  const signature = createHmac('sha256', input.secret ?? ACTIVE_KEY_SECRET)\n    .update(\n      `life-os.ai-context.v2\\n${keyId}\\n${workspaceId}\\n${actorId}\\n${issuedAt}\\n${input.method}\\n${input.path}`,
          )
          text = text.replace(
              "  return {\n    'x-life-os-workspace-id': workspaceId,",
              "  return {\n    'x-life-os-context-key-id': keyId,\n    'x-life-os-workspace-id': workspaceId,",
          )
          text = text.replace(
              "    process.env.AI_GATEWAY_CONTEXT_SECRET = GATEWAY_CONTEXT_SECRET;",
              "    process.env.AI_GATEWAY_ACTIVE_KEY_ID = ACTIVE_KEY_ID;\n    process.env.AI_GATEWAY_ACTIVE_KEY_SECRET = ACTIVE_KEY_SECRET;\n    delete process.env.AI_GATEWAY_PREVIOUS_KEY_ID;\n    delete process.env.AI_GATEWAY_PREVIOUS_KEY_SECRET;",
          )
          old_restore = """      if (ORIGINAL_GATEWAY_CONTEXT_SECRET === undefined) {
                delete process.env.AI_GATEWAY_CONTEXT_SECRET;
              } else {
                process.env.AI_GATEWAY_CONTEXT_SECRET = ORIGINAL_GATEWAY_CONTEXT_SECRET;
              }
          """.replace('          ', '')
          new_restore = """      for (const [name, value] of [
                ['AI_GATEWAY_ACTIVE_KEY_ID', ORIGINAL_ACTIVE_KEY_ID],
                ['AI_GATEWAY_ACTIVE_KEY_SECRET', ORIGINAL_ACTIVE_KEY_SECRET],
                ['AI_GATEWAY_PREVIOUS_KEY_ID', ORIGINAL_PREVIOUS_KEY_ID],
                ['AI_GATEWAY_PREVIOUS_KEY_SECRET', ORIGINAL_PREVIOUS_KEY_SECRET],
              ] as const) {
                if (value === undefined) {
                  delete process.env[name];
                } else {
                  process.env[name] = value;
                }
              }
          """.replace('          ', '')
          text = replace_once(text, old_restore, new_restore, 'AI integration env restore')
          insertion_marker = """  it('persists proposals across restarts and appends replay-safe decisions', async () => {
          """.replace('          ', '')
          rotation_test = """  it('accepts one previous in-flight key during overlap and rejects it after retirement', async () => {
            const workspaceId = randomUUID();
            const actorId = randomUUID();
            const taskId = randomUUID();
            process.env.AI_GATEWAY_ACTIVE_KEY_ID = ACTIVE_KEY_ID;
            process.env.AI_GATEWAY_ACTIVE_KEY_SECRET = ACTIVE_KEY_SECRET;
            process.env.AI_GATEWAY_PREVIOUS_KEY_ID = PREVIOUS_KEY_ID;
            process.env.AI_GATEWAY_PREVIOUS_KEY_SECRET = PREVIOUS_KEY_SECRET;
            const app = await NestFactory.create(AiProductionModule, { logger: false });
            await app.listen(0, '127.0.0.1');
            try {
              const address = app.getHttpServer().address() as AddressInfo;
              const overlap = await requestJson(
                address,
                'POST',
                '/v1/proposals',
                proposalRequest(taskId),
                signedContextHeaders({
                  workspaceId,
                  actorId,
                  method: 'POST',
                  path: '/v1/proposals',
                  keyId: PREVIOUS_KEY_ID,
                  secret: PREVIOUS_KEY_SECRET,
                }),
              );
              expect(overlap.statusCode).toBe(201);

              delete process.env.AI_GATEWAY_PREVIOUS_KEY_ID;
              delete process.env.AI_GATEWAY_PREVIOUS_KEY_SECRET;
              const retired = await requestJson(
                address,
                'POST',
                '/v1/proposals',
                proposalRequest(randomUUID()),
                signedContextHeaders({
                  workspaceId,
                  actorId,
                  method: 'POST',
                  path: '/v1/proposals',
                  keyId: PREVIOUS_KEY_ID,
                  secret: PREVIOUS_KEY_SECRET,
                }),
              );
              expect(retired).toMatchObject({
                statusCode: 401,
                body: { code: 'invalid_gateway_context' },
              });
            } finally {
              await app.close();
              process.env.AI_GATEWAY_ACTIVE_KEY_ID = ACTIVE_KEY_ID;
              process.env.AI_GATEWAY_ACTIVE_KEY_SECRET = ACTIVE_KEY_SECRET;
              delete process.env.AI_GATEWAY_PREVIOUS_KEY_ID;
              delete process.env.AI_GATEWAY_PREVIOUS_KEY_SECRET;
            }
          });

          """.replace('          ', '')
          text = replace_once(text, insertion_marker, rotation_test + insertion_marker, 'AI overlap integration')
          write(path, text)

          # Public example exposes active signer and optional previous verifier only.
          path = '.env.example'
          text = read(path)
          text = replace_once(
              text,
              'AI_GATEWAY_CONTEXT_SECRET=replace-with-at-least-32-random-bytes\n',
              'AI_GATEWAY_ACTIVE_KEY_ID=gateway-2026-08-a\nAI_GATEWAY_ACTIVE_KEY_SECRET=replace-with-at-least-32-random-bytes\nAI_GATEWAY_PREVIOUS_KEY_ID=\nAI_GATEWAY_PREVIOUS_KEY_SECRET=\n',
              'environment example',
          )
          write(path, text)
          PY

      - name: Format modified sources
        run: |
          pnpm exec prettier --single-quote --write \
            apps/web/app/ai-proposal-client-core.ts \
            apps/web/app/ai-proposal-client.ts \
            apps/web/app/ai-proposal-client.test.ts \
            apps/web/app/ai-proposal-scope-regression.test.ts \
            apps/web/app/ai-proposal-identity-stream-regression.test.ts \
            apps/web/app/api/ai/proposals/routes.test.ts \
            apps/ai-service/src/quality-coverage.test.ts \
            apps/ai-service/src/no-silent-mutation.integration.test.ts \
            apps/ai-service/src/proposal-audit-http.integration.test.ts

      - name: Commit the wired slice before verification
        run: |
          set -Eeuo pipefail
          rm -f pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example apps/web apps/ai-service
          git diff --cached --check
          git commit -m 'feat(ai): wire versioned keyed gateway context'
          git push origin HEAD:feat/ai-gateway-key-rotation

      - name: Verify AI and web boundaries
        run: |
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/ai-service test
          pnpm --filter @life-os/web lint
          pnpm --filter @life-os/web test

      - name: Remove one-shot workflow after verified execution
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/complete-ai-key-rotation.yml
          git commit -m 'chore(ai): remove key rotation implementation helper'
          git push origin HEAD:feat/ai-gateway-key-rotation
