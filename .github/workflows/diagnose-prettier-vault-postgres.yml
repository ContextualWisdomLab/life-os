name: Diagnose Vault PostgreSQL acceptance formatting

on:
  push:
    branches:
      - feat/plugin-vault-postgres-driver-v1

permissions:
  contents: read

concurrency:
  group: diagnose-vault-postgres-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Emit canonical Prettier diff
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          target='apps/integration-service/src/plugin-vault-postgres-vault.integration.test.ts'
          pnpm exec prettier --write "$target"
          git diff -- "$target"
          if ! git diff --quiet -- "$target"; then
            echo 'Canonical Prettier output differs from committed source.' >&2
            exit 1
          fi
