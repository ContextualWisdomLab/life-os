name: Verify Habits Workspace Mutation Claim

on:
  push:
    branches:
      - feat/web-habits-workspace-v1
    paths:
      - apps/web/app/habits/habits-client.tsx
      - apps/web/e2e/habits-workspace.spec.ts
      - .github/workflows/verify-habits-workspace-mutation-claim.yml

permissions:
  contents: read

concurrency:
  group: verify-habits-workspace-mutation-claim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact formatter publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          git merge-base --is-ancestor 3373ec55b70aa935483a076e4b0dd6a0a3851c71 "$GITHUB_SHA"
          test ! -e .github/workflows/repair-habits-workspace-formatting.yml

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/app/habits/habits-client.tsx
          apps/web/e2e/habits-workspace.spec.ts

      - name: Install Chromium for Playwright
        run: pnpm --filter @life-os/web exec playwright install --with-deps chromium

      - name: Reproduce mutation-claim regression
        run: >-
          pnpm --filter @life-os/web exec playwright test
          e2e/habits-workspace.spec.ts
          --project=chromium
          --grep "list refresh cannot release an in-flight Habit mutation claim"
