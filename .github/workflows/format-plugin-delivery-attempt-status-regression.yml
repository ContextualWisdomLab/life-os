name: Format plugin delivery attempt status regression

on:
  push:
    branches:
      - feat/plugin-delivery-attempt-status-v1

permissions:
  contents: write

concurrency:
  group: format-plugin-delivery-attempt-status-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting and retire formatter
        shell: bash
        run: |
          set -euo pipefail
          target='apps/integration-service/src/plugin-delivery-attempt-status.test.ts'
          workflow='.github/workflows/format-plugin-delivery-attempt-status-regression.yml'
          pnpm exec prettier --single-quote --write "$target"
          changed="$(git diff --name-only)"
          if [[ "$changed" != "$target" ]]; then
            echo "Unexpected formatting delta: $changed" >&2
            exit 1
          fi
          git diff --check
          git rm "$workflow"
          git add "$target"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(integration): apply canonical status regression formatting'
          git fetch origin refs/heads/feat/plugin-delivery-attempt-status-v1
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_head" != "${GITHUB_SHA}" ]]; then
            echo "Branch advanced from ${GITHUB_SHA} to ${remote_head}; refusing stale publication" >&2
            exit 1
          fi
          git push origin HEAD:refs/heads/feat/plugin-delivery-attempt-status-v1
