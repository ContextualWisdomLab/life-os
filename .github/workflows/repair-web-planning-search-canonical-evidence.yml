name: Repair Web Planning Search Canonical Evidence

on:
  push:
    branches:
      - test/web-planning-search-canonical-evidence-v1
    paths:
      - .github/workflows/repair-web-planning-search-canonical-evidence.yml

permissions:
  contents: write

concurrency:
  group: repair-web-planning-search-canonical-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.sha }}

      - name: Guard retained RED and exact owner head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor b9f8cd315784cfcda4eb145ced2e18105a2fa8a3 "$GITHUB_SHA"
          test -f apps/web/app/planning-search-client.ts
          test -f apps/web/app/planning-search-canonical-evidence.test.ts
          test -f .github/workflows/verify-web-planning-search-canonical-evidence.yml

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Reproduce canonical producer-evidence RED
        shell: bash
        run: |
          set -euo pipefail
          if pnpm --filter @life-os/web exec tsx --test app/planning-search-canonical-evidence.test.ts; then
            echo 'Expected Planning Search canonical-evidence regression to fail before repair.' >&2
            exit 1
          fi

      - name: Apply minimum producer-evidence repair
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('apps/web/app/planning-search-client.ts')
          source = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              if source.count(old) != 1:
                  raise SystemExit(f'{label} anchor changed')
              source = source.replace(old, new, 1)

          pattern = "const UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;\n"
          replace_once(
              pattern,
              pattern + "const CANONICAL_UUID_V4_PATTERN =\n  /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;\n",
              'UUID pattern',
          )

          uuid_helper = """/** Requires one canonical opaque UUIDv4 value. */
          function requireUuid(value: unknown, message: string): string {
            if (typeof value !== 'string' || !UUID_V4_PATTERN.test(value)) {
              throw new Error(message);
            }
            return value.toLowerCase();
          }
          """
          replace_once(
              uuid_helper,
              uuid_helper + """
          /** Requires canonical producer-owned UUIDv4 evidence without rewriting it. */
          function requireProducerUuid(value: unknown, message: string): string {
            if (
              typeof value !== 'string' ||
              !CANONICAL_UUID_V4_PATTERN.test(value)
            ) {
              throw new Error(message);
            }
            return value;
          }
          """,
              'UUID helper',
          )

          timestamp_before = """/** Requires one valid timestamp and returns canonical UTC ISO 8601. */
          function requireTimestamp(value: unknown): string {
            if (typeof value !== 'string' || !RFC_3339_TIMESTAMP_PATTERN.test(value)) {
              throw new Error('Planning search response is invalid');
            }
            const parsed = Date.parse(value);
            if (!Number.isFinite(parsed)) {
              throw new Error('Planning search response is invalid');
            }
            return new Date(parsed).toISOString();
          }
          """
          timestamp_after = """/** Requires canonical producer-owned UTC timestamp evidence without rewriting it. */
          function requireTimestamp(value: unknown): string {
            if (typeof value !== 'string' || !RFC_3339_TIMESTAMP_PATTERN.test(value)) {
              throw new Error('Planning search response is invalid');
            }
            const parsed = Date.parse(value);
            if (!Number.isFinite(parsed) || new Date(parsed).toISOString() !== value) {
              throw new Error('Planning search response is invalid');
            }
            return value;
          }
          """
          replace_once(timestamp_before, timestamp_after, 'timestamp helper')
          replace_once(
              "return requireUuid(value.workspaceId, 'Identity session response is invalid');",
              "return requireProducerUuid(\n    value.workspaceId,\n    'Identity session response is invalid',\n  );",
              'Identity workspace',
          )
          replace_once(
              "id: requireUuid(value.id, 'Planning search response is invalid'),",
              "id: requireProducerUuid(value.id, 'Planning search response is invalid'),",
              'Planning result id',
          )
          replace_once(
              "result.parentId = requireUuid(\n    value.parentId,\n    'Planning search response is invalid',\n  );",
              "result.parentId = requireProducerUuid(\n    value.parentId,\n    'Planning search response is invalid',\n  );",
              'Planning parent id',
          )
          path.write_text(source)
          PY
          pnpm exec prettier --single-quote --write apps/web/app/planning-search-client.ts

      - name: Check repaired source and evidence formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/app/planning-search-client.ts
          apps/web/app/planning-search-canonical-evidence.test.ts
          .github/workflows/verify-web-planning-search-canonical-evidence.yml

      - name: Prove canonical producer-evidence regression GREEN
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/planning-search-canonical-evidence.test.ts

      - name: Typecheck Web after repair
        run: pnpm --filter @life-os/web typecheck

      - name: Run complete Web suite after repair
        run: pnpm --filter @life-os/web test

      - name: Guard bounded source publication
        shell: bash
        run: |
          set -euo pipefail
          git add apps/web/app/planning-search-client.ts
          changed="$(git diff --cached --name-only "$GITHUB_SHA" | LC_ALL=C sort)"
          test "$changed" = 'apps/web/app/planning-search-client.ts'
          git diff --cached --check

      - name: Publish ordinary semantic descendant
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(web): preserve canonical Planning search evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
