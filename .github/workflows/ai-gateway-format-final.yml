name: AI gateway web format repair

on:
  push:
    branches:
      - feat/ai-authenticated-gateway-context

permissions: {}

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/ai-authenticated-gateway-context
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Format and commit web boundary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --no-frozen-lockfile
          pnpm exec prettier --single-quote --write \
            apps/web/app/ai-proposal-client-core.ts \
            apps/web/app/ai-proposal-client.ts \
            apps/web/app/ai-proposal-scope-regression.test.ts \
            apps/web/app/api/ai/proposals/routes.test.ts
          rm -f pnpm-lock.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/app/ai-proposal-client-core.ts \
            apps/web/app/ai-proposal-client.ts \
            apps/web/app/ai-proposal-scope-regression.test.ts \
            apps/web/app/api/ai/proposals/routes.test.ts
          git diff --cached --check
          git commit -m 'style(web): format AI gateway boundary'
          authorization=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $authorization" \
            push origin HEAD:feat/ai-authenticated-gateway-context
