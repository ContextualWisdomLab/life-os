name: Temporary Node24 action ref authority verifier

on:
  push:
    branches:
      - fix/ci-node24-actions-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused action-ref authority contract
        run: pnpm --filter @life-os/commercial-development-agent exec vitest run src/node24-actions-contract.test.mjs --no-file-parallelism
