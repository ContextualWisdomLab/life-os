name: Verify Calendar Google OAuth State Canonicality

on:
  push:
    branches:
      - feat/calendar-google-oauth-state-v1
    paths:
      - apps/integration-calendar-service/src/calendar-google-oauth-authorization.ts
      - apps/integration-calendar-service/src/calendar-google-oauth-state-canonicality.test.ts
      - .github/workflows/verify-calendar-google-oauth-state-canonicality.yml

permissions:
  contents: read

concurrency:
  group: verify-calendar-google-oauth-state-canonicality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Guard exact publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "${remote_head}"
          test "${remote_head}" = "$GITHUB_SHA"
          git merge-base --is-ancestor 9a3b0da1bbe665911a99810b0e41c85784ec674a "$GITHUB_SHA"
          test ! -e .github/workflows/repair-calendar-google-oauth-state-formatting.yml

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/integration-calendar-service/src/calendar-google-oauth-authorization.ts
          apps/integration-calendar-service/src/calendar-google-oauth-state-canonicality.test.ts

      - name: Reproduce callback-state canonicality regression
        run: >-
          pnpm --filter @life-os/integration-calendar-service exec vitest run
          src/calendar-google-oauth-state-canonicality.test.ts

      - name: Typecheck Calendar service
        run: pnpm --filter @life-os/integration-calendar-service typecheck

      - name: Run complete Calendar service suite
        run: pnpm --filter @life-os/integration-calendar-service test
