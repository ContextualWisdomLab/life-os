name: Diagnose commercial development lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/diagnose-commercial-development-lockfile.yml
      - packages/commercial-development-agent/package.json
      - packages/commercial-development-agent/src/contracts.mjs
      - packages/commercial-development-agent/src/contracts.test.mjs
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: diagnose-commercial-development-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/opencode-commercial-development-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Generate canonical lockfile and focused contract evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          test "$(pnpm --version)" = '10.15.0'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --no-ext-diff -- pnpm-lock.yaml > "$RUNNER_TEMP/pnpm-lock.patch"
          test -s "$RUNNER_TEMP/pnpm-lock.patch"
          grep -F 'packages/commercial-development-agent:' pnpm-lock.yaml >/dev/null
          grep -F "specifier: 1.18.9" pnpm-lock.yaml >/dev/null
          mkdir -p "$RUNNER_TEMP/lockfile-evidence"
          cp pnpm-lock.yaml "$RUNNER_TEMP/lockfile-evidence/pnpm-lock.yaml"
          cp "$RUNNER_TEMP/pnpm-lock.patch" "$RUNNER_TEMP/lockfile-evidence/pnpm-lock.patch"

          set +e
          pnpm --filter @life-os/commercial-development-agent exec vitest run \
            src/contracts.test.mjs --no-file-parallelism \
            >"$RUNNER_TEMP/lockfile-evidence/contracts-test.log" 2>&1
          contract_status="$?"
          set -e
          printf '%s\n' "$contract_status" \
            > "$RUNNER_TEMP/lockfile-evidence/contracts-test-status.txt"

      - name: Upload generated diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-development-lockfile-${{ github.run_id }}
          path: ${{ runner.temp }}/lockfile-evidence/
          if-no-files-found: error
          retention-days: 1
