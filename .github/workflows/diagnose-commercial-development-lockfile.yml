name: Diagnose commercial development lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/diagnose-commercial-development-lockfile.yml
      - packages/commercial-development-agent/package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: diagnose-commercial-development-lockfile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Generate lockfile evidence
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Upload generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-development-lockfile-diagnostic
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
