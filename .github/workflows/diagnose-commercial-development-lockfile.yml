name: Repair commercial development lockfile

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - .github/workflows/diagnose-commercial-development-lockfile.yml

permissions:
  contents: write

concurrency:
  group: repair-commercial-development-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/opencode-commercial-development-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Regenerate and push the canonical lockfile only
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -Eeuo pipefail

          readonly expected_old_lock='7bd54fba8af606701cb07a6fe1c2f9d1e32605a6'
          readonly expected_new_lock='e11ac30d4973366f5468bdd7cc2184bbbdbeb76c'
          readonly expected_branch='feat/opencode-commercial-development-loop'

          test "$TARGET_BRANCH" = "$expected_branch"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object pnpm-lock.yaml)" = "$expected_old_lock"

          remote_head="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"

          corepack enable
          test "$(pnpm --version)" = '10.15.0'
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts

          test "$(git hash-object pnpm-lock.yaml)" = "$expected_new_lock"
          grep -F 'packages/commercial-development-agent:' pnpm-lock.yaml >/dev/null
          grep -F "specifier: 1.18.9" pnpm-lock.yaml >/dev/null
          git diff --check -- pnpm-lock.yaml
          test "$(git diff --name-only)" = 'pnpm-lock.yaml'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- pnpm-lock.yaml
          git commit -m 'fix(ci): synchronize commercial agent lockfile'

          remote_head="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git push --dry-run origin "HEAD:refs/heads/$TARGET_BRANCH"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
