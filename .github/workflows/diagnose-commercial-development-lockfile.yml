name: Diagnose commercial development lockfile

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/diagnose-commercial-development-lockfile.yml
      - packages/commercial-development-agent/**
      - product/opencode-commercial-development-policy.json
      - docs/superpowers/specs/2026-08-07-opencode-commercial-development-loop-design.md
      - docs/superpowers/plans/2026-08-07-opencode-commercial-development-loop.md
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: diagnose-commercial-development-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/opencode-commercial-development-loop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Generate canonical read-only verification evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          test "$(pnpm --version)" = '10.15.0'
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
          evidence="$RUNNER_TEMP/commercial-development-evidence"
          mkdir -p "$evidence/formatted"

          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          git diff --no-ext-diff -- pnpm-lock.yaml > "$evidence/pnpm-lock.patch"
          test -s "$evidence/pnpm-lock.patch"
          grep -F 'packages/commercial-development-agent:' pnpm-lock.yaml >/dev/null
          grep -F "specifier: 1.18.9" pnpm-lock.yaml >/dev/null
          cp pnpm-lock.yaml "$evidence/pnpm-lock.yaml"

          set +e
          pnpm --filter @life-os/commercial-development-agent exec vitest run \
            src/contracts.test.mjs --no-file-parallelism \
            >"$evidence/contracts-test.log" 2>&1
          contract_status="$?"
          set -e
          printf '%s\n' "$contract_status" > "$evidence/contracts-test-status.txt"

          pnpm exec prettier --single-quote --write \
            packages/commercial-development-agent/package.json \
            packages/commercial-development-agent/vitest.config.mjs \
            'packages/commercial-development-agent/src/**/*.mjs' \
            product/opencode-commercial-development-policy.json \
            docs/superpowers/specs/2026-08-07-opencode-commercial-development-loop-design.md \
            docs/superpowers/plans/2026-08-07-opencode-commercial-development-loop.md \
            >"$evidence/prettier-write.log" 2>&1

          git diff --name-only -- . ':!pnpm-lock.yaml' > "$evidence/formatted-files.txt"
          while IFS= read -r path; do
            test -n "$path" || continue
            mkdir -p "$evidence/formatted/$(dirname "$path")"
            cp "$path" "$evidence/formatted/$path"
          done < "$evidence/formatted-files.txt"

          set +e
          pnpm --filter @life-os/commercial-development-agent lint >"$evidence/package-lint.log" 2>&1
          lint_status="$?"
          pnpm --filter @life-os/commercial-development-agent test >"$evidence/package-test.log" 2>&1
          test_status="$?"
          pnpm --filter @life-os/commercial-development-agent build >"$evidence/package-build.log" 2>&1
          build_status="$?"
          pnpm --filter @life-os/commercial-development-agent typecheck >"$evidence/package-typecheck.log" 2>&1
          typecheck_status="$?"
          set -e
          printf '%s\n' "$lint_status" > "$evidence/package-lint-status.txt"
          printf '%s\n' "$test_status" > "$evidence/package-test-status.txt"
          printf '%s\n' "$build_status" > "$evidence/package-build-status.txt"
          printf '%s\n' "$typecheck_status" > "$evidence/package-typecheck-status.txt"

      - name: Upload generated diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-development-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/commercial-development-evidence/
          if-no-files-found: error
          retention-days: 1
