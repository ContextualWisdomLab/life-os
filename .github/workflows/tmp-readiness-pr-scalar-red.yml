name: Temporary Readiness PR Scalar RED

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - packages/commercial-readiness/src/github-client-pr-scalar-provenance.test.mjs
      - .github/workflows/tmp-readiness-pr-scalar-red.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify PR scalar provenance fixture
        run: pnpm --filter @life-os/commercial-readiness exec node --test src/github-client-pr-scalar-provenance.test.mjs
