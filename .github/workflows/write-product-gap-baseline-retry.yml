name: Write product gap baseline retry currentness

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: write-product-gap-baseline-retry
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify single-writer branch ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_head="$(git ls-remote origin refs/heads/docs/product-gap-baseline-2026-08-20 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"

      - name: Replace bounded Integration currentness block
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start_marker = '> **Currentness override — 2026-09-08 Integration delivery authority.**'
          end_marker = '## Canonical architecture and evidence rules'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''> **Currentness override — 2026-09-08 Integration delivery authority.** Protected `main` remains `193a87ef54c3fe6dcda4755bce4d6bc81e3a0297`. Integration #252 remains Draft/unshipped exact `9ed7847d3106d9418e1ff6e04e45c1c7d84d0b0d`; its hostile durable-evidence proof head `ec2353a003c15c9f464b5d5d2454d3593427d768` completed run `34213508199` / job `102019765395` GREEN, and CHANGELOG descendant `fe51a79c1e19cc7fb14e5296f04b3f91b41bf535` completed run `34213937828` / job `102021136219` GREEN before the purpose verifier was retired.\n\n> #253 is the direct #252 claim/lease child and remains Draft/unshipped exact `8252575a510254883cb62c44198cb665daa0d0b5`. Its retained lineage owns `life-os.plugin-delivery-attempt-claim.v1`, worker-visible UUIDv4 claim tokens with SHA-256 digest-only persistence, atomic due/pending/retry-budget acquisition and finite 30–3600 second leases. Durable-bound RED `400e88163ca9d878806aaee11ef8ca2917ec33dc` → repair `e25a96d902adc6d6a6422ca4bc114c5bf189f47f`, later hostile-envelope RED/repair lines, and exact GREEN run `34225615055` preserve the claim/lease authority. The current descendant removes only exploratory verifier work after a falsified hypothesis and has no submitted independent approval.\n\n> #254 is the direct #253 retry/backoff child. Focused reality RED at `a588428d105c2fd8f2078bcd807cb4f895e760a5` / run `34232017394` proved terminal `attempt_limit` evidence could be accepted without proving exhaustion of the durable row's configured retry budget. The causal repair carries `max_attempts` through hostile durable evidence and requires pending `attempt_number < max_attempts` and terminal equality. Exact `43bcd6dc73d108b5690b29541ecb91ff074e7d5a` / run `34236816710` / job `102096552714` then passed frozen install, formatting/diff hygiene, Plugin SDK build and focused retry acceptance before failing at the intended real PostgreSQL gate: inherited migrations 0006/0007 admitted admission/active-claim shapes only, while retry must clear the claim and persist scheduled or exhausted lifecycle evidence. Minimum Integration-owned migration 0008 preserves the row retry budget and 30–3600 second lease constraints while admitting only explicit admission, active-claim, scheduled-retry and terminal-exhaustion shapes; real PostgreSQL acceptance covers both scheduled retry and `max_attempts=1` exhaustion. Exact proof head `ca22c71e4f2ec11de6539df79632376d4134f90a`, run `34237354956`, job `102098403313`, completed GREEN on Ubuntu 24.04/PostgreSQL 16 across frozen install, formatting/diff hygiene, Plugin SDK build, focused retry acceptance, real PostgreSQL retry/exhaustion acceptance, Integration typecheck and the complete Integration suite. Current #254 exact `edc79d1291025b8787a9ccf16c39a10df4157023` removes only the purpose-complete verifier and remains Draft/unshipped with no submitted independent approval.\n\n> Durable origin/delivery/claim/retry identity is not outbound-network authority. `ContextualWisdomLab/EgressWeave` has no immutable GitHub release available to this stack, so a later executor remains fail closed rather than consuming mutable sibling source.\n\n'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          git diff --check
          rm .github/workflows/write-product-gap-baseline-retry.yml
          git diff --check

      - name: Publish exact bounded documentation descendant
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Seongho Bae'
          git config user.email 'me@seonghobae.me'
          git add docs/product-technical-gap-baseline.md .github/workflows/write-product-gap-baseline-retry.yml
          git commit -m 'docs(baseline): record plugin retry transition evidence'
          remote_head="$(git ls-remote origin refs/heads/docs/product-gap-baseline-2026-08-20 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/docs/product-gap-baseline-2026-08-20
