name: Finalize OpenCode Maintenance Loop

on:
  push:
    branches:
      - feat/opencode-nim-maintenance-loop
    paths:
      - '.github/workflows/finalize-opencode-maintenance-loop.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/opencode-nim-maintenance-loop
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Apply deterministic implementation and coverage repairs
        run: |
          set -Eeuo pipefail
          sed -i \
            -e 's/contractDigest,/maintenanceContractDigest,/' \
            -e 's/contractDigest(tampered)/maintenanceContractDigest(tampered)/' \
            -e 's/waitContract.target.number/waitContract.target.externalNumber/' \
            .github/scripts/complete-maintenance-coverage.py
          python3 .github/scripts/finalize-opencode-maintenance.py
          python3 .github/scripts/repair-maintenance-cli-entrypoint.py
          python3 .github/scripts/complete-maintenance-coverage.py

      - name: Harden permanent model and reviewer boundaries
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          workflow_path = Path('.github/workflows/opencode-nim-maintenance.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          workflow = workflow.replace(
              '          GITHUB_TOKEN: ${{ github.token }}\n',
              '',
          )
          workflow = workflow.replace(
              "          use_github_token: 'true'",
              "          use_github_token: 'false'",
          )
          checkout_marker = """      - name: Set up Node.js
"""
          verifier_step = """      - name: Verify independent review-agent integrity
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const manifest = JSON.parse(
            readFileSync('product/review-agent-integrity.json', 'utf8'),
          );
          const hash = createHash('sha256');
          hash.update('life-os.review-agent-integrity.v1\\0');
          for (const path of [...manifest.workflowPaths].sort()) {
            hash.update(`workflow\\0${path}\\0`);
            hash.update(readFileSync(path));
            hash.update('\\0');
          }
          for (const secretName of [...manifest.secretNames].sort()) {
            hash.update(`secret\\0${secretName}\\0`);
          }
          if (hash.digest('hex') !== manifest.digest) {
            throw new Error('Independent review-agent integrity check failed');
          }
          NODE

"""
          if verifier_step not in workflow:
              if checkout_marker not in workflow:
                  raise SystemExit('OpenCode workflow setup marker is missing')
              workflow = workflow.replace(
                  checkout_marker,
                  verifier_step + checkout_marker,
                  1,
              )
          workflow_path.write_text(workflow, encoding='utf-8')

          test_path = Path('packages/maintenance-agent/src/workflow-contract.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          if "import { createHash } from 'node:crypto';" not in test:
              test = test.replace(
                  "import assert from 'node:assert/strict';\n",
                  "import assert from 'node:assert/strict';\nimport { createHash } from 'node:crypto';\n",
                  1,
              )
          helper_marker = """function step(name) {
"""
          helper = """function reviewAgentDigest() {
  const hash = createHash('sha256');
  hash.update('life-os.review-agent-integrity.v1\\0');
  const contents = new Map([
    ['.github/workflows/appguardrail.yml', reviewWorkflow],
  ]);
  for (const path of [...fingerprint.workflowPaths].sort()) {
    hash.update(`workflow\\0${path}\\0`);
    hash.update(contents.get(path) ?? '');
    hash.update('\\0');
  }
  for (const secretName of [...fingerprint.secretNames].sort()) {
    hash.update(`secret\\0${secretName}\\0`);
  }
  return hash.digest('hex');
}

"""
          if helper not in test:
              if helper_marker not in test:
                  raise SystemExit('Workflow test helper marker is missing')
              test = test.replace(helper_marker, helper + helper_marker, 1)
          model_assertion = """    assert.match(model, /share: 'false'/u);
"""
          hardened_assertions = model_assertion + """    assert.match(model, /use_github_token: 'false'/u);
    assert.equal(model.includes('GITHUB_TOKEN'), false);
"""
          if "use_github_token: 'false'" not in test:
              if model_assertion not in test:
                  raise SystemExit('OpenCode model assertion marker is missing')
              test = test.replace(model_assertion, hardened_assertions, 1)
          digest_assertion = """    assert.match(fingerprint.digest, /^[0-9a-f]{64}$/u);
"""
          verified_digest_assertion = digest_assertion + """    assert.equal(fingerprint.digest, reviewAgentDigest());
    assert.match(
      step('Verify independent review-agent integrity'),
      /life-os\\.review-agent-integrity\\.v1/u,
    );
"""
          if 'reviewAgentDigest()' not in test.split(digest_assertion, 1)[-1]:
              if digest_assertion not in test:
                  raise SystemExit('Reviewer digest assertion marker is missing')
              test = test.replace(
                  digest_assertion,
                  verified_digest_assertion,
                  1,
              )
          test_path.write_text(test, encoding='utf-8')

          manifest_path = Path('product/review-agent-integrity.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          digest = hashlib.sha256()
          digest.update(b'life-os.review-agent-integrity.v1\0')
          for path in sorted(manifest['workflowPaths']):
              digest.update(b'workflow\0')
              digest.update(path.encode('utf-8'))
              digest.update(b'\0')
              digest.update(Path(path).read_bytes())
              digest.update(b'\0')
          for secret_name in sorted(manifest['secretNames']):
              digest.update(b'secret\0')
              digest.update(secret_name.encode('utf-8'))
              digest.update(b'\0')
          manifest['digest'] = digest.hexdigest()
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Register capability and formatting contracts
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          capability_path = Path('product/capabilities.json')
          document = json.loads(capability_path.read_text(encoding='utf-8'))
          capability_id = 'automation.opencode-maintenance'
          if not any(
              capability['id'] == capability_id
              for capability in document['capabilities']
          ):
              commercial_index = next(
                  index
                  for index, capability in enumerate(document['capabilities'])
                  if capability['id'] == 'automation.commercial-readiness-loop'
              )
              document['capabilities'].insert(
                  commercial_index + 1,
                  {
                      'id': capability_id,
                      'outcome': (
                          'An hourly NVIDIA NIM OpenCode planner diagnoses reviewed '
                          'repository evidence without receiving merge authority.'
                      ),
                      'target_maturity': 'production',
                      'customer_impact': 4,
                      'risk': 5,
                      'acquisition_impact': 5,
                      'effort': 4,
                      'dependencies': [
                          'automation.commercial-readiness-loop',
                          'security.appguardrail-gate',
                      ],
                      'tracking_issue': 119,
                      'evidence': [
                          {
                              'maturity': 'prototype',
                              'kind': 'implementation',
                              'mode': 'exists',
                              'path': 'packages/maintenance-agent/src/contract.mjs',
                          },
                          {
                              'maturity': 'usable',
                              'kind': 'implementation',
                              'mode': 'exists',
                              'path': 'packages/maintenance-agent/src/plan.mjs',
                          },
                          {
                              'maturity': 'usable',
                              'kind': 'workflow',
                              'mode': 'exists',
                              'path': '.github/workflows/opencode-nim-maintenance.yml',
                          },
                          {
                              'maturity': 'production',
                              'kind': 'test',
                              'mode': 'exists',
                              'path': 'packages/maintenance-agent/src/workflow-contract.test.mjs',
                          },
                          {
                              'maturity': 'production',
                              'kind': 'test',
                              'mode': 'exists',
                              'path': 'packages/maintenance-agent/src/fixture.test.mjs',
                          },
                          {
                              'maturity': 'production',
                              'kind': 'documentation',
                              'mode': 'exists',
                              'path': 'docs/adr/0001-governed-opencode-maintenance.md',
                          },
                      ],
                  },
              )
          capability_path.write_text(
              json.dumps(document, indent=2) + '\n',
              encoding='utf-8',
          )

          maintenance_package_path = Path('packages/maintenance-agent/package.json')
          maintenance_package = json.loads(
              maintenance_package_path.read_text(encoding='utf-8'),
          )
          lint = maintenance_package['scripts']['lint']
          for token in [
              'fixtures/*.json',
              '../../docs/adr/0001-governed-opencode-maintenance.md',
          ]:
              if token not in lint:
                  lint += f' {token}'
          maintenance_package['scripts']['lint'] = lint
          maintenance_package_path.write_text(
              json.dumps(maintenance_package, indent=2) + '\n',
              encoding='utf-8',
          )

          root_package_path = Path('package.json')
          root_package = json.loads(root_package_path.read_text(encoding='utf-8'))
          formatter = root_package['scripts']['format:check']
          maintained_paths = [
              '.github/workflows/opencode-nim-maintenance.yml',
              '.opencode/agents/maintenance-planner.md',
              'product/review-agent-integrity.json',
              'packages/maintenance-agent/package.json',
              'packages/maintenance-agent/src/*.mjs',
              'packages/maintenance-agent/fixtures/*.json',
              'docs/adr/0001-governed-opencode-maintenance.md',
              'docs/operations/opencode-nim-maintenance.md',
              'docs/research/2026-08-07-opencode-nim-maintenance-standards.md',
              'docs/superpowers/specs/2026-08-07-opencode-nim-maintenance-loop-design.md',
              'docs/superpowers/plans/2026-08-07-opencode-nim-maintenance-loop.md',
              'AGENTS.md',
              'CLAUDE.md',
              'ARCHITECTURE.md',
              'CHANGELOG.md',
          ]
          for maintained_path in maintained_paths:
              token = f' {maintained_path}'
              if token not in formatter:
                  formatter += token
          root_package['scripts']['format:check'] = formatter
          root_package_path.write_text(
              json.dumps(root_package, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Require the complete product evidence set
        run: |
          set -Eeuo pipefail
          for path in \
            .github/workflows/opencode-nim-maintenance.yml \
            .opencode/agents/maintenance-planner.md \
            product/review-agent-integrity.json \
            packages/maintenance-agent/package.json \
            packages/maintenance-agent/src/contract.mjs \
            packages/maintenance-agent/src/plan.mjs \
            packages/maintenance-agent/src/cli.mjs \
            packages/maintenance-agent/src/bin.mjs \
            packages/maintenance-agent/src/coverage.test.mjs \
            packages/maintenance-agent/src/fixture.test.mjs \
            packages/maintenance-agent/fixtures/realistic-maintenance.json \
            docs/adr/0001-governed-opencode-maintenance.md \
            docs/operations/opencode-nim-maintenance.md \
            docs/research/2026-08-07-opencode-nim-maintenance-standards.md \
            docs/superpowers/specs/2026-08-07-opencode-nim-maintenance-loop-design.md \
            docs/superpowers/plans/2026-08-07-opencode-nim-maintenance-loop.md \
            AGENTS.md \
            CLAUDE.md \
            ARCHITECTURE.md \
            CHANGELOG.md; do
            test -f "$path"
          done

      - name: Format complete maintenance slice
        run: |
          pnpm exec prettier --single-quote --write \
            .github/workflows/opencode-nim-maintenance.yml \
            .opencode/agents/maintenance-planner.md \
            packages/maintenance-agent/package.json \
            packages/maintenance-agent/src/*.mjs \
            packages/maintenance-agent/fixtures/*.json \
            product/review-agent-integrity.json \
            product/capabilities.json \
            docs/adr/0001-governed-opencode-maintenance.md \
            docs/operations/opencode-nim-maintenance.md \
            docs/research/2026-08-07-opencode-nim-maintenance-standards.md \
            docs/superpowers/specs/2026-08-07-opencode-nim-maintenance-loop-design.md \
            docs/superpowers/plans/2026-08-07-opencode-nim-maintenance-loop.md \
            AGENTS.md \
            CLAUDE.md \
            ARCHITECTURE.md \
            CHANGELOG.md \
            package.json

      - name: Verify maintenance package and repository formatting
        run: |
          set -Eeuo pipefail
          pnpm --filter @life-os/maintenance-agent lint
          pnpm --filter @life-os/maintenance-agent typecheck
          pnpm --filter @life-os/maintenance-agent test
          pnpm --filter @life-os/maintenance-agent build
          pnpm format:check

      - name: Remove temporary repair automation
        run: |
          set -Eeuo pipefail
          git rm -f --ignore-unmatch \
            .github/workflows/apply-ai-live-review-fixes.yml \
            .github/workflows/apply-opencode-maintenance-fix.yml \
            .github/workflows/diagnose-maintenance-coverage.yml \
            .github/workflows/repair-opencode-maintenance.yml \
            .github/workflows/finalize-opencode-maintenance-loop.yml \
            .github/scripts/apply-ai-live-review-fixes.py \
            .github/scripts/augment-ai-live-review-fixes.py \
            .github/scripts/complete-maintenance-coverage.py \
            .github/scripts/finalize-opencode-maintenance.py \
            .github/scripts/repair-maintenance-cli-entrypoint.py

      - name: Commit verified product slice
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(automation): add governed NVIDIA NIM OpenCode maintenance loop'
          git push origin HEAD:feat/opencode-nim-maintenance-loop
