name: Format OAuth controller slice

on:
  push:
    branches:
      - feat/oauth-http-controllers

permissions:
  contents: write

concurrency:
  group: format-oauth-controller-slice
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Format governed files
        run: |
          pnpm exec prettier --single-quote --write \
            apps/identity-service/src/main.ts \
            apps/identity-service/src/oauth-http-controller.ts \
            apps/identity-service/src/identity-runtime.ts \
            apps/identity-service/src/identity-runtime.test.ts

      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "LifeOS maintenance automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/identity-service/src/main.ts \
            apps/identity-service/src/oauth-http-controller.ts \
            apps/identity-service/src/identity-runtime.ts \
            apps/identity-service/src/identity-runtime.test.ts
          git diff --cached --check
          git commit -m "style(identity): format OAuth controller slice"
          git push origin HEAD:feat/oauth-http-controllers
