name: Verify PR 279 verifier boundaries

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Configure Git initial branch
        run: git config --global init.defaultBranch main
      - name: Checkout exact verifier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Add hostile top-level job regression
        shell: bash
        run: |
          cat >> packages/commercial-readiness/src/source-verification-workflow.test.mjs <<'EOF'

          test('job extraction ignores job-shaped text outside the top-level jobs mapping', () => {
            const workflow = [
              'name: |',
              '  scan:',
              '    steps:',
              '      - name: Materialize AppGuardrail SARIF PR merge provenance',
              '        run: echo fake-job-authority',
              'jobs:',
              '  scan:',
              '    steps:',
              '      - name: Harmless real step',
              '        run: echo real-job-authority',
            ].join('\n');

            const block = jobBlock(workflow, 'scan');
            assert.ok(block.includes('Harmless real step'));
            assert.equal(block.includes('fake-job-authority'), false);
          });
          EOF
      - name: Verify focused source workflow authority boundary
        run: node --test packages/commercial-readiness/src/source-verification-workflow.test.mjs
      - name: Verify syntax
        run: node --check packages/commercial-readiness/src/source-verification-workflow.test.mjs
