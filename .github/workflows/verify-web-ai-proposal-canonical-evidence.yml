name: Verify Web AI Proposal Canonical Evidence

on:
  push:
    branches:
      - test/web-ai-proposal-canonical-evidence-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require exact published repair authority
        shell: bash
        run: |
          set -euo pipefail
          semantic_head='05d22bbabf42c3b47f6726e4c9f0a752acd297f5'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --refs origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test -n "$remote_head"
          test "$remote_head" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$semantic_head" "$GITHUB_SHA"
          test ! -f .github/workflows/repair-web-ai-proposal-canonical-evidence.yml
          test -f apps/web/app/ai-proposal-client-core.ts
          test -f apps/web/app/ai-proposal-canonical-evidence.test.ts

          changed="$(git diff --name-only "$semantic_head" "$GITHUB_SHA" | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/repair-web-ai-proposal-canonical-evidence.yml' \
            '.github/workflows/verify-web-ai-proposal-canonical-evidence.yml')"
          test "$changed" = "$expected"
          git diff --check "$semantic_head" "$GITHUB_SHA"

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Enable repository pnpm
        run: corepack enable

      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --single-quote --check
          apps/web/app/ai-proposal-client-core.ts
          apps/web/app/ai-proposal-canonical-evidence.test.ts
          .github/workflows/verify-web-ai-proposal-canonical-evidence.yml

      - name: Run canonical producer-evidence regression
        run: >-
          pnpm --filter @life-os/web exec tsx --test
          app/ai-proposal-canonical-evidence.test.ts

      - name: Typecheck Web
        run: pnpm --filter @life-os/web typecheck

      - name: Run complete Web suite
        run: pnpm --filter @life-os/web test
