name: Finalize Purpose-Bound Privacy Service

on:
  push:
    branches:
      - feat/purpose-bound-pii-access
    paths:
      - '.github/workflows/finalize-privacy-service-clean.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PRIVACY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/life_os_privacy_test

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_os_privacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d life_os_privacy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/purpose-bound-pii-access
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Refresh the workspace lockfile
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --no-frozen-lockfile

      - name: Remove temporary write-capable privacy workflows
        run: |
          set -Eeuo pipefail
          rm -f \
            .github/workflows/repair-privacy-service-v2.yml \
            .github/workflows/verify-privacy-service-current.yml

      - name: Format and verify the complete privacy slice
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            apps/privacy-service/package.json \
            apps/privacy-service/tsconfig.json \
            apps/privacy-service/nest-cli.json \
            apps/privacy-service/vitest.config.ts \
            'apps/privacy-service/src/**/*.ts' \
            apps/privacy-service/migrations/*.sql \
            compose.privacy.yaml \
            docs/compliance/purpose-bound-pii-access-control-mapping.md \
            docs/operations/purpose-bound-pii-access.md \
            docs/research/2026-08-07-purpose-bound-pii-access-standards.md \
            docs/superpowers/specs/2026-08-07-purpose-bound-pii-access-design.md \
            docs/superpowers/plans/2026-08-07-purpose-bound-pii-access.md
          pnpm --filter @life-os/privacy-service lint
          pnpm --filter @life-os/privacy-service test
          pnpm --filter @life-os/privacy-service build
          docker compose -f compose.privacy.yaml config > /dev/null

      - name: Commit the exact verified final slice
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/finalize-privacy-service-clean.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(privacy): finalize purpose-bound access service'
          git push origin HEAD:feat/purpose-bound-pii-access
