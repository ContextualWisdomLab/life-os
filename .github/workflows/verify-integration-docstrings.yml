name: Verify Integration docstrings

on:
  push:
    branches: [test/integration-service-quality-gates-v1]

permissions:
  contents: read

concurrency:
  group: verify-integration-docstrings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify diagnostic workflow formatting
        run: pnpm exec prettier --single-quote --check .github/workflows/verify-integration-docstrings.yml

      - name: Run production docstring contract
        id: docstrings
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          pnpm --filter @life-os/integration-service exec vitest run \
            src/production-docstring-contract.test.ts \
            --no-file-parallelism \
            >/dev/null 2>&1
          status=$?
          set -e
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload bounded docstring evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-docstrings-${{ github.run_id }}
          path: .verification/integration-docstrings.json
          if-no-files-found: error
          retention-days: 3
