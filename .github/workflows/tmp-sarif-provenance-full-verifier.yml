name: Temporary SARIF provenance full verifier

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Render canonical candidate diff
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            .github/workflows/appguardrail.yml \
            packages/commercial-readiness/src/source-verification-workflow.test.mjs
          git diff -- \
            .github/workflows/appguardrail.yml \
            packages/commercial-readiness/src/source-verification-workflow.test.mjs
