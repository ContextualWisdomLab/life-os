name: Finalize AI Gateway Key Rotation Evidence

on:
  push:
    branches:
      - feat/ai-gateway-key-rotation
    paths:
      - '.github/workflows/run-ai-key-rotation-codemod.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ai-gateway-key-rotation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Apply final evidence mutations
        run: python3 .github/scripts/finalize-ai-key-rotation.py

      - name: Format and commit final evidence
        run: |
          set -Eeuo pipefail
          pnpm exec prettier --single-quote --write \
            package.json \
            apps/ai-service/package.json \
            apps/ai-service/migrations/README.md \
            CHANGELOG.md \
            product/capabilities.json \
            docs/operations/ai-gateway-key-rotation.md \
            docs/research/2026-08-04-ai-gateway-key-rotation-standards.md \
            docs/superpowers/specs/2026-08-04-ai-gateway-key-rotation-design.md \
            docs/superpowers/plans/2026-08-04-ai-gateway-key-rotation.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            apps/ai-service/package.json \
            apps/ai-service/migrations/README.md \
            CHANGELOG.md \
            product/capabilities.json \
            docs
          git diff --cached --check
          git commit -m 'docs(ai): finalize gateway key rotation evidence'
          git push origin HEAD:feat/ai-gateway-key-rotation

      - name: Verify formatting, AI quality, and capability schema
        run: |
          pnpm format:check
          pnpm --filter @life-os/ai-service lint
          pnpm --filter @life-os/commercial-readiness test
