name: Write Architecture Plugin Claim Lease

on:
  push:
    branches:
      - docs/canonical-product-architecture-mainline

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Publish bounded architecture insertion
        shell: bash
        env:
          PARAGRAPH_B64: 
        run: |
          set -euo pipefail
          branch='docs/canonical-product-architecture-mainline'
          remote_head="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
          test "${remote_head}" = "${GITHUB_SHA}"

          python -c 'import base64,os; from pathlib import Path; p=Path("ARCHITECTURE.md"); t=p.read_text(encoding="utf-8"); m="Issue #130 remains **Partial**."; para=base64.b64decode(os.environ["PARAGRAPH_B64"]).decode("utf-8"); assert "Draft PR #253 is the direct child of #252" not in t; i=t.index(m); p.write_text(t[:i]+para+"\n\n"+t[i:],encoding="utf-8")'

          git diff --check
          rm .github/workflows/write-architecture-plugin-claim-lease.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ARCHITECTURE.md .github/workflows/write-architecture-plugin-claim-lease.yml
          git commit -m 'docs(architecture): record plugin claim lease boundary'

          git fetch origin "${branch}"
          remote_head="$(git rev-parse "origin/${branch}")"
          test "${remote_head}" = "${GITHUB_SHA}"
          git push origin "HEAD:${branch}"
