name: Temporary Readiness Page Limit

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - packages/commercial-readiness/src/github-client.mjs
      - packages/commercial-readiness/src/github-client-page-size.test.mjs
      - .github/workflows/tmp-readiness-page-limit.yml

permissions:
  contents: read

concurrency:
  group: temporary-readiness-page-limit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused formatting
        run: >-
          pnpm exec prettier --check
          packages/commercial-readiness/src/github-client.mjs
          packages/commercial-readiness/src/github-client-page-size.test.mjs

      - name: Verify page-limit boundary
        run: node --test packages/commercial-readiness/src/github-client-page-size.test.mjs

      - name: Verify Commercial Readiness typecheck
        run: pnpm --filter @life-os/commercial-readiness typecheck

      - name: Verify Commercial Readiness build
        run: pnpm --filter @life-os/commercial-readiness build

      - name: Verify complete Commercial Readiness suite
        run: pnpm --filter @life-os/commercial-readiness test
