name: Update product gap baseline for Integration 257

on:
  push:
    branches:
      - docs/product-gap-baseline-2026-08-20

permissions:
  contents: write

concurrency:
  group: update-product-gap-baseline-integration-257
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 2
          ref: ${{ github.ref_name }}

      - name: Replace bounded Integration currentness block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          start_marker = '> **Currentness override — 2026-09-09 Integration delivery authority.**'
          end_marker = '## Canonical architecture and evidence rules'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''> **Currentness override — 2026-09-09 Integration delivery authority.** Protected `main` remains `193a87ef54c3fe6dcda4755bce4d6bc81e3a0297`. Integration #252 remains Draft/unshipped exact `9ed7847d3106d9418e1ff6e04e45c1c7d84d0b0d`; #253 direct child exact `8252575a510254883cb62c44198cb665daa0d0b5` owns deterministic finite 30–3600 second worker claims; #254 direct child exact `edc79d1291025b8787a9ccf16c39a10df4157023` owns claim-bound bounded retry/backoff and terminal retry-budget exhaustion; #255 direct child exact `e201b649cdea7d50ee2b856ac98a01d2b6c1368e` owns the append-only sanitized outcome ledger; #256 direct child exact `0c6221e1fe32bf6594784219a7bd710ad0c1a993` owns durable pause/resume/dead-letter controls with monotonic chronology. All remain active-PR evidence, not shipped authority.

> #257 is the direct #256 child and remains Draft/unshipped current exact `5ac3d2fcdf30e97be006405cf599f3d666cf5946`. It adds the Integration-owned per-attempt pre-execution revocation fence: the exact unexpired worker claim, active delivery-origin grant and active owning installation must all remain valid under the same workspace/user scope immediately before provider execution. Exact `61c179a5886a79e2fa6bbca53b704275bcb3a0ea`, run `34266240410`, job `102196214538`, completed GREEN on Ubuntu 24.04/PostgreSQL 16 across focused real-PostgreSQL acceptance, Integration typecheck and the complete Integration suite.

> Fresh review found that the raw UUIDv4 claim token was case-normalized before SHA-256 hashing, allowing a hex-case alias to acquire the same durable claim digest despite the exact raw-token capability contract. Regression-only `48b823903d14c3ca0c868bf335d023904b2dcf9d` / run `34267014048` / job `102198804685` reached a real Ubuntu 24.04/PostgreSQL runner and failed at the focused execution-fence acceptance after setup, frozen install, formatting and Plugin SDK build succeeded. Minimum repair `a40098db19ea9830367b6cabd1bc552a019a990a` requires the raw token to already be canonical lowercase UUIDv4 text and hashes those exact bytes without normalization. Exact run `34267152261` / job `102199270687` then completed GREEN across focused execution-fence/PostgreSQL acceptance, Integration typecheck and the complete Integration suite. Current #257 removes only the purpose-complete verifier.

> Durable origin/delivery/claim/retry/outcome/control/fence identity is not outbound-network authority. #257 does not materialize provider credentials or authorize DNS/IP/redirect/proxy/connect behavior. A later executor must consume only an immutable released/versioned canonical egress contract and otherwise remain fail closed. Remaining LifeOS-owned delivery work is bounded provider execution/outcome integration, operator-visible status and restart/recovery acceptance.

'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          rm .github/workflows/update-product-gap-baseline-integration-257.yml
          git diff --check

      - name: Publish only if branch head is unchanged
        shell: bash
        run: |
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name "life-os-maintainer"
          git config user.email "actions@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md .github/workflows/update-product-gap-baseline-integration-257.yml
          git commit -m "docs: record Integration execution fence evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
