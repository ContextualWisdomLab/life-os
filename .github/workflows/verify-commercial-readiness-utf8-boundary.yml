name: Verify Commercial Readiness UTF-8 Boundary

on:
  push:
    branches:
      - fix/actions-draft-queue-pressure-v1
    paths:
      - .github/workflows/verify-commercial-readiness-utf8-boundary.yml
      - packages/commercial-readiness/src/github-client.mjs
      - packages/commercial-readiness/src/github-client-stream-boundary.test.mjs
      - packages/commercial-readiness/src/github-client.test.mjs
      - packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Enable repository pnpm
        run: corepack enable
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Guard exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check focused formatting
        run: >-
          pnpm exec prettier --check
          packages/commercial-readiness/src/github-client.mjs
          packages/commercial-readiness/src/github-client-stream-boundary.test.mjs
          packages/commercial-readiness/src/github-client.test.mjs
          packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs
      - name: Prove strict UTF-8 and bounded GitHub evidence
        run: >-
          node --test
          packages/commercial-readiness/src/github-client-stream-boundary.test.mjs
          packages/commercial-readiness/src/github-client.test.mjs
          packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs
      - name: Check diff hygiene
        run: git diff --check
