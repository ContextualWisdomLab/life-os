name: Verify checkout action identity

on:
  push:
    branches:
      - fix/appguardrail-sarif-provenance-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate with case-variant action identity
        uses: Actions/Checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
      - name: Reproduce checkout action identity regression
        run: node --test packages/commercial-readiness/src/workflow-source-checkout-contract.test.mjs
