name: Repair PR211 GitHub review reference

on:
  push:
    branches: [docs/product-gap-baseline-2026-08-20]
    paths:
      - .github/workflows/repair-pr211-github-review-reference.yml

permissions:
  contents: write

concurrency:
  group: repair-pr211-github-review-reference
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Apply bounded APA 7 vendor-reference repair
        env:
          INPUT_SHA: ${{ github.sha }}
        shell: python3 {0}
        run: |
          import os
          import subprocess
          from pathlib import Path

          expected = os.environ['INPUT_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != expected:
              raise SystemExit(f'exact input mismatch: expected {expected}, got {actual}')

          baseline_path = Path('docs/product-technical-gap-baseline.md')
          refs_path = Path('docs/doctoring/REFERENCES.md')
          baseline = baseline_path.read_text(encoding='utf-8')
          refs = refs_path.read_text(encoding='utf-8')

          old = "GitHub's own protected-branch review contract likewise states that pull-request authors cannot approve their own pull requests; this defense preserves that invariant if upstream JSON is malformed or synthetic."
          new = "GitHub's vendor documentation likewise states that pull-request authors cannot approve their own pull requests (GitHub, n.d.); this defense preserves that invariant if upstream JSON is malformed or synthetic."
          if baseline.count(old) != 1:
              raise SystemExit(f'expected one Finding #47 vendor-policy sentence, found {baseline.count(old)}')
          baseline = baseline.replace(old, new, 1)

          heading = '## Standards and security guidance\n\n'
          reference = 'GitHub. (n.d.). *Reviewing proposed changes in a pull request.* Retrieved September 10, 2026, from https://docs.github.com/en/pull-requests/how-tos/review-pull-requests/reviewing-proposed-changes-in-a-pull-request\n\n'
          if refs.count(heading) != 1:
              raise SystemExit('standards reference heading missing or ambiguous')
          if reference in refs:
              raise SystemExit('GitHub vendor reference already present; refusing duplicate')
          refs = refs.replace(heading, heading + reference, 1)

          baseline_path.write_text(baseline, encoding='utf-8')
          refs_path.write_text(refs, encoding='utf-8')

          if '(GitHub, n.d.)' not in baseline_path.read_text(encoding='utf-8'):
              raise SystemExit('APA in-text citation missing')
          if 'Retrieved September 10, 2026' not in refs_path.read_text(encoding='utf-8'):
              raise SystemExit('APA retrieval date missing')
          subprocess.run(['git', 'diff', '--check'], check=True)

      - name: Publish only on unchanged writer branch
        env:
          INPUT_SHA: ${{ github.sha }}
          BRANCH: docs/product-gap-baseline-2026-08-20
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/repair-pr211-github-review-reference.yml'
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          for path in "${changed[@]}"; do
            case "$path" in
              docs/product-technical-gap-baseline.md|docs/doctoring/REFERENCES.md) ;;
              *) echo "unexpected reference-repair delta: $path" >&2; exit 1 ;;
            esac
          done

          rm "$workflow"
          git add docs/product-technical-gap-baseline.md docs/doctoring/REFERENCES.md "$workflow"
          git config user.name 'life-os-maintainer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(doctoring): cite GitHub review policy'

          git fetch origin "$BRANCH"
          remote_head="$(git rev-parse "origin/$BRANCH")"
          test "$remote_head" = "$INPUT_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
