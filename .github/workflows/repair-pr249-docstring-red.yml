name: Repair PR249 docstring RED contract

on:
  push:
    branches: [fix/qs-6-16-0-v1]
    paths:
      - .github/workflows/repair-pr249-docstring-red.yml

permissions:
  contents: write

concurrency:
  group: repair-pr249-docstring-red
  cancel-in-progress: false

jobs:
  establish-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact writer input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install reproducible dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Admit the permanent gate to formatter authority
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'package.json';
          const value = JSON.parse(fs.readFileSync(path, 'utf8'));
          const target = 'packages/commercial-readiness/src/production-docstring-coverage.test.mjs';
          if (!value.scripts?.['format:check']) throw new Error('format:check is missing');
          if (!value.scripts['format:check'].includes(target)) {
            const anchor = 'packages/commercial-readiness/src/github-client-compare-payload-bounds.test.mjs';
            if (!value.scripts['format:check'].includes(anchor)) throw new Error('formatter anchor is missing');
            value.scripts['format:check'] = value.scripts['format:check'].replace(anchor, `${anchor} ${target}`);
          }
          fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          NODE
          pnpm exec prettier --single-quote --write \
            package.json \
            packages/commercial-readiness/src/production-docstring-coverage.test.mjs
          pnpm format:check

      - name: Prove the production-docstring contract is RED
        id: red
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          node --test packages/commercial-readiness/src/production-docstring-coverage.test.mjs > /tmp/docstring-red.log 2>&1
          status=$?
          set -e
          cat /tmp/docstring-red.log
          test "$status" -ne 0
          grep -F 'Commercial Readiness production docstring coverage' /tmp/docstring-red.log
          grep -F 'missing:' /tmp/docstring-red.log

      - name: Publish self-retired RED contract
        shell: bash
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/repair-pr249-docstring-red.yml'
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              package.json|packages/commercial-readiness/src/production-docstring-coverage.test.mjs) ;;
              *) echo "unexpected RED-contract delta: $path" >&2; exit 1 ;;
            esac
          done

          rm "$workflow"
          git add package.json packages/commercial-readiness/src/production-docstring-coverage.test.mjs "$workflow"
          git config user.name 'life-os-maintainer[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(quality): establish Commercial Readiness docstring RED'

          git fetch origin fix/qs-6-16-0-v1
          remote_head="$(git rev-parse origin/fix/qs-6-16-0-v1)"
          test "$remote_head" = "$INPUT_SHA"
          git push origin HEAD:fix/qs-6-16-0-v1
